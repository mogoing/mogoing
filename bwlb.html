<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<!-- 禁止双击放大：iOS Safari 从 iOS 10 起忽略 user-scalable=no，真正生效的是 touch-action:manipulation（上下滚动、双指缩放照常可用） -->
<style>html,body{touch-action:manipulation;-webkit-text-size-adjust:100%}</style>
<title>保卫萝卜 · 原版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0e2a3a;font-family:'PingFang SC','Microsoft YaHei',sans-serif}
#top{position:fixed;top:0;left:0;right:0;height:50px;z-index:100;display:flex;align-items:center;gap:10px;padding:0 10px;
  background:linear-gradient(135deg,rgba(16,60,90,.95),rgba(30,120,80,.95));backdrop-filter:blur(4px)}
#top .btn{height:36px;border:0;border-radius:18px;padding:0 18px;background:rgba(255,255,255,.95);color:#145c8a;
  font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.15)}
#top .btn:active{transform:translateY(1px)}
#top .t{color:#fff;font-size:16px;font-weight:800;text-shadow:0 1px 3px rgba(0,0,0,.4)}
#top .sp{flex:1}
#stage{position:fixed;top:50px;left:0;right:0;bottom:0;background:#0e2a3a;display:flex;align-items:center;justify-content:center}
#stage ruffle-player{width:100%;height:100%}
#loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:radial-gradient(circle at 50% 40%,#3a8fbf 0%,#0e2a3a 70%);z-index:50}
#loading .bird{font-size:64px;animation:flap 1.1s infinite}
@keyframes flap{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-18px) rotate(8deg)}}
#loading .lt{color:#fff;font-size:18px;font-weight:800;letter-spacing:2px}
#loading .ld{color:#cfe8ff;font-size:13px;margin-top:-6px}
#err{position:fixed;inset:0;z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:rgba(10,26,38,.96);text-align:center;padding:30px}
#err .e{font-size:52px}
#err .et{color:#ffd93d;font-size:20px;font-weight:800}
#err .ed{color:#cfe8ff;font-size:14px;line-height:1.8;max-width:340px}
#err .eb{height:44px;border:0;border-radius:22px;padding:0 34px;background:linear-gradient(90deg,#ffd93d,#ff8f3c);color:#5a2d00;
  font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.3)}
</style>
</head>
<body>
<div id="top">
  <button class="btn" id="btnBack">← 主页</button>
  <div class="t">🥕 保卫萝卜 · 原版</div>
  <div class="sp"></div>
  <button class="btn" id="btnFull">⛶ 全屏</button>
</div>

<div id="stage"></div>

<div id="loading">
  <div class="bird">🥕</div>
  <div class="lt">保卫萝卜 · 启动中</div>
  <div class="ld">正在加载游戏资源…首次加载会稍慢，成功后永久缓存、下次秒开</div>
</div>

<div id="err">
  <div class="e">🥕💥</div>
  <div class="et" id="errTitle">加载失败</div>
  <div class="ed" id="errDesc">未知错误，请重试。</div>
  <button class="eb" id="errBtn">重试</button>
</div>

<script>
'use strict';
document.getElementById('btnBack').onclick = ()=>{ location.href='main.html'; };
document.getElementById('errBtn').onclick = ()=>{ location.reload(); };

var stage = document.getElementById('stage');
var loading = document.getElementById('loading');

function showErr(m) {
  var t = document.getElementById('errTitle');
  var d = document.getElementById('errDesc');
  var mm = String(m || '');
  if (/memory|Memory|Out of/i.test(mm)) {
    t.textContent = '设备内存不足';
    d.textContent = 'Flash 模拟器需要约 40MB 运行内存，当前设备内存紧张。建议：关闭其他应用后重试，或换一台手机/电脑。';
  } else if (/fetch|Fetch|network|Network|load|Load|404|401|403/i.test(mm)) {
    t.textContent = '下载中断';
    d.textContent = '游戏资源下载失败（网络不稳定）。点下方「重试」重新下载；成功后即永久缓存、下次秒开。';
  } else if (/mime|MIME|wasm/i.test(mm)) {
    t.textContent = '环境不兼容';
    d.textContent = '浏览器未能正确识别游戏组件。建议：更新浏览器后重试。';
  } else {
    t.textContent = '启动异常';
    d.textContent = (mm ? mm.slice(0, 160) : '未知错误') + '。建议：刷新重试；反复失败请换电脑打开。';
  }
  loading.style.display = 'none';
  document.getElementById('err').style.display = 'flex';
}

/* 加载 Ruffle 模拟器（同目录自托管，0 外链） */
var s = document.createElement('script');
s.src = 'ab/ruffle.js?v=47';
s.onload = function() {
  window.RufflePlayer = window.RufflePlayer || {};
  window.RufflePlayer.config = {
    autoplay: 'on',
    unmuteOverlay: 'hidden',
    letterbox: 'off',
    allowScriptAccess: false
  };
  var ruffle = window.RufflePlayer.newest();
  if (!ruffle) { showErr('Ruffle 初始化失败，请更新浏览器'); return; }
  var player = ruffle.createPlayer();
  player.style.width = '100%';
  player.style.height = '100%';
  stage.appendChild(player);
  player.load('ab/bwlb/removead2.swf?v=1').then(function() {
    loading.style.display = 'none';
  }).catch(function(e) {
    showErr(e);
  });
  document.getElementById('btnFull').onclick = function() {
    try { stage.requestFullscreen && stage.requestFullscreen(); } catch(e){}
  };
};
s.onerror = function() { showErr('模拟器组件下载失败，请检查网络后重试'); };
document.body.appendChild(s);
/* 注册 Service Worker：wasm 走 gz 预压缩，传输量降 65% */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
</body>
</html>
