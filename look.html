<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>追剧</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:linear-gradient(160deg,#0d1322 0%,#0a0e17 60%,#101a30 100%);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#e8ecf4;overflow:hidden}
#top{position:fixed;top:0;left:0;right:0;height:52px;z-index:100;display:flex;align-items:center;gap:10px;padding:0 10px;background:rgba(10,14,23,.9);backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,.08)}
#top .btn{height:34px;border:0;border-radius:17px;padding:0 16px;background:linear-gradient(135deg,#2b6df0,#1e4fd8);color:#fff;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.25);transition:transform .15s,filter .15s}
#top .btn:active{transform:translateY(1px) scale(.96)}
#top .t{flex:1;text-align:center;font-size:16px;font-weight:800;letter-spacing:2px}
#main{position:fixed;top:52px;left:0;right:0;bottom:0;overflow-y:auto;padding:16px 14px 30px;scrollbar-width:none}
#main::-webkit-scrollbar{display:none}
#sec{font-size:13px;color:#7c8db0;letter-spacing:2px;margin:2px 2px 14px;opacity:0;animation:fadeUp .5s .1s forwards}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
@media (max-width:480px){#grid{grid-template-columns:repeat(3,1fr);gap:12px}}
.card{position:relative;border-radius:14px;overflow:hidden;background:#141b2d;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.35);transform:translateY(12px);opacity:0;animation:fadeUp .45s .2s forwards;transition:transform .25s,box-shadow .25s}
.card:active{transform:scale(.96)}
.card:hover{transform:translateY(-4px);box-shadow:0 10px 26px rgba(43,109,240,.25)}
.poster{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#1a2238}
.name{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 9px;background:linear-gradient(transparent,rgba(10,14,23,.92));font-size:14px;font-weight:700;letter-spacing:1px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.epsBadge{position:absolute;top:8px;right:8px;background:rgba(10,14,23,.72);backdrop-filter:blur(4px);color:#8fd3ff;font-size:11px;padding:3px 8px;border-radius:10px;border:1px solid rgba(59,130,246,.4)}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
</style></head><body>
<div id="top"><button class="btn" id="btnHome">← 主页</button><div class="t">追剧</div><button class="btn" id="btnMore" style="opacity:.55">· · ·</button></div>
<div id="main">
  <div id="sec">电视剧</div>
  <div id="grid">
    <div class="card" data-page="jiajinchai.html">
      <img class="poster" src="look/cover4.jpg" alt="嫁金钗" loading="lazy">
      <span class="epsBadge">更新至10集</span>
      <div class="name">嫁金钗</div>
    </div>
    <div class="card" data-page="yudianqiu.html">
      <img class="poster" src="look/cover.jpg" alt="玉簟秋" loading="lazy">
      <span class="epsBadge">更新至10集</span>
      <div class="name">玉簟秋</div>
    </div>
    <div class="card" data-page="wuketidai.html">
      <img class="poster" src="look/cover2.jpg" alt="无可替代" loading="lazy">
      <span class="epsBadge">全20集</span>
      <div class="name">无可替代</div>
    </div>
    <div class="card" data-page="lanxiangrugu.html">
      <img class="poster" src="look/cover3.jpg" alt="兰香如故" loading="lazy">
      <span class="epsBadge">全47集</span>
      <div class="name">兰香如故</div>
    </div>
  </div>
</div>
<script>
document.querySelectorAll('.card').forEach(function(c){
  c.addEventListener('click',function(){location.href=c.dataset.page;});
});
document.getElementById('btnHome').addEventListener('click',function(){location.href='main.html';});
</script></body></html>
