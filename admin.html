<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<!-- 禁止双击放大：iOS Safari 从 iOS 10 起忽略 user-scalable=no，真正生效的是 touch-action:manipulation（上下滚动、双指缩放照常可用） -->
<style>html,body{touch-action:manipulation;-webkit-text-size-adjust:100%}</style>
<title>管理后台 · 莫古游戏</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23FF6B6B'/%3E%3Cstop offset='1' stop-color='%23FFD93D'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='45' font-size='38' font-weight='800' text-anchor='middle' fill='%23fff'%3E%3F%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --coral:#FF6B6B; --sunny:#FFD93D; --mint:#4ECDC4; --grape:#9B5DE5; --pink:#FF9DE2;
    --ink:#4A3F5C; --muted:#9A8FB5;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
    background:linear-gradient(160deg,#FFF6E9,#FFE8D6);
    color:var(--ink);min-height:100vh;padding:16px 14px 48px;
  }
  .blob{position:fixed;border-radius:50%;filter:blur(50px);opacity:.5;z-index:0;animation:float 12s ease-in-out infinite;pointer-events:none}
  .b1{width:36vmax;height:36vmax;background:var(--pink);top:-10vmax;left:-8vmax}
  .b2{width:28vmax;height:28vmax;background:var(--mint);bottom:-8vmax;right:-6vmax;animation-delay:-4s}
  .b3{width:20vmax;height:20vmax;background:var(--sunny);top:40vh;left:-6vmax;opacity:.3;animation-delay:-8s}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(2.5vmax)}}
  .wrap{position:relative;z-index:1;max-width:860px;margin:0 auto}

  /* ===== 顶栏 + 数据看板（同一横排，高度一致） ===== */
  .toprow{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:rgba(255,255,255,.88);backdrop-filter:blur(14px);
    border-radius:18px;padding:12px 14px;margin-bottom:14px;
    box-shadow:0 10px 30px rgba(155,93,229,.13);
    flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:10px}
  .logo{
    width:40px;height:40px;border-radius:12px;flex:none;
    background:linear-gradient(135deg,var(--coral),var(--sunny));
    display:flex;align-items:center;justify-content:center;
    font-size:18px;font-weight:800;color:#fff;box-shadow:0 6px 14px rgba(255,107,107,.4);
  }
  .brand h1{font-size:16px;letter-spacing:1px}
  .brand small{display:block;font-size:11px;color:var(--muted);font-weight:400;letter-spacing:0}
  .stats{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .stat{
    background:linear-gradient(135deg,#FFF, #FFF6E9);
    border:1.5px solid #F3E8FB;border-radius:12px;
    padding:7px 14px;text-align:center;white-space:nowrap;
  }
  .stat b{display:inline-block;font-size:18px;background:linear-gradient(135deg,var(--coral),var(--grape));-webkit-background-clip:text;background-clip:text;color:transparent;margin-right:4px}
  .stat span{font-size:12px;color:var(--muted);font-weight:600}
  .btn{
    border:none;border-radius:11px;padding:9px 16px;cursor:pointer;
    font-size:13px;font-weight:700;color:#fff;flex:none;
    background:linear-gradient(135deg,var(--coral),var(--grape));
    box-shadow:0 5px 14px rgba(255,107,107,.3);
    transition:transform .15s,filter .15s;
  }
  .btn:hover{transform:translateY(-2px);filter:brightness(1.06)}
  .btn:active{transform:translateY(0) scale(.97)}
  .btn.ghost{background:linear-gradient(135deg,var(--mint),#2EB5A9);box-shadow:0 5px 14px rgba(78,205,196,.3)}
  .btn.small{padding:5px 11px;font-size:12px;border-radius:9px}
  .btn.danger{background:linear-gradient(135deg,#FF6B6B,#FF4D6D);box-shadow:0 5px 14px rgba(255,77,109,.3)}

  /* ===== 面板 ===== */
  .panel{
    background:rgba(255,255,255,.92);backdrop-filter:blur(14px);
    border-radius:18px;padding:14px;margin-bottom:14px;
    box-shadow:0 10px 30px rgba(155,93,229,.11);
  }
  .panel h2{font-size:14px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .panel h2::before{content:"";width:7px;height:18px;border-radius:4px;background:linear-gradient(180deg,var(--coral),var(--sunny))}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .row input{
    flex:1;min-width:110px;height:40px;border:2px solid #EEE6F6;border-radius:11px;padding:0 12px;
    font-size:14px;color:var(--ink);background:#fff;outline:none;
    transition:border-color .2s,box-shadow .2s;
  }
  .row input:focus{border-color:var(--grape);box-shadow:0 0 0 4px rgba(155,93,229,.12)}
  .hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.7}

  /* ===== 用户列表（金币 +/- 按钮） ===== */
  .table-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:480px}
  th{font-size:11px;color:var(--muted);text-align:left;padding:7px 8px;border-bottom:2px solid #F0E8F7;font-weight:700}
  td{padding:7px 8px;border-bottom:1px solid #F7F1FB;vertical-align:middle}
  tr:last-child td{border-bottom:none}
  .u-admin{display:inline-block;background:linear-gradient(135deg,var(--coral),var(--grape));color:#fff;font-size:10px;font-weight:700;border-radius:999px;padding:2px 8px}
  .coin-cell{display:flex;align-items:center;gap:6px}
  .coin-num{display:inline-block;background:rgba(255,217,61,.25);color:#B8860B;font-weight:700;border-radius:999px;padding:2px 10px;font-size:12px;min-width:52px;text-align:center}
  .pm-btn{
    width:26px;height:26px;border:none;border-radius:50%;cursor:pointer;flex:none;
    font-size:15px;font-weight:800;color:#fff;line-height:1;
    display:flex;align-items:center;justify-content:center;transition:.15s;
  }
  .pm-btn.plus{background:linear-gradient(135deg,var(--mint),#2EB5A9);box-shadow:0 3px 8px rgba(78,205,196,.35)}
  .pm-btn.minus{background:linear-gradient(135deg,var(--coral),#FF9F6B);box-shadow:0 3px 8px rgba(255,159,107,.35)}
  .pm-btn:hover{transform:scale(1.1)}
  .pm-btn:active{transform:scale(.92)}
  .pm-btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
  .del{background:linear-gradient(135deg,#FF6B6B,#FF4D6D);border:none;border-radius:8px;color:#fff;font-size:11px;font-weight:700;padding:4px 9px;cursor:pointer;transition:.15s}
  .del:hover{filter:brightness(1.1)}
  .del:disabled{opacity:.4;cursor:not-allowed}
  .empty{text-align:center;color:var(--muted);padding:18px;font-size:13px}

  /* ===== 日记：按用户分组 ===== */
  .user-group{border:1px solid #F0E8F7;border-radius:14px;margin-bottom:10px;overflow:hidden}
  .ug-head{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    background:#FBF6FF;padding:9px 12px;cursor:pointer;user-select:none;
  }
  .ug-head b{font-size:13px;color:var(--grape)}
  .ug-head .ug-count{font-size:11px;color:var(--muted);background:#F0E6FA;border-radius:999px;padding:2px 8px}
  .ug-head .ug-arrow{color:var(--muted);font-size:12px;transition:transform .25s}
  .user-group.open .ug-arrow{transform:rotate(180deg)}
  .ug-body{display:none;padding:6px 10px 10px}
  .user-group.open .ug-body{display:block}
  .d-item{
    background:#FFFDF7;border:1px solid #F5EDE3;border-radius:11px;
    padding:9px 11px;margin-top:7px;
  }
  .d-item .d-head{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-bottom:5px;flex-wrap:wrap}
  .d-item .d-head time{color:var(--muted)}
  .d-item .d-ops{display:flex;gap:5px}
  .d-item p{font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-word;color:var(--ink)}
  .d-item .d-content{margin-bottom:6px}
  .edit-box{display:none;flex-direction:column;gap:7px;margin-bottom:6px}
  .edit-box.show{display:flex}
  .edit-box textarea{
    width:100%;min-height:70px;border:2px solid #EEE6F6;border-radius:10px;padding:8px 10px;
    font-size:13px;color:var(--ink);background:#fff;outline:none;resize:vertical;
    font-family:inherit;line-height:1.6;
  }
  .edit-box textarea:focus{border-color:var(--grape);box-shadow:0 0 0 4px rgba(155,93,229,.12)}
  .edit-box input{
    width:100%;height:34px;border:2px solid #EEE6F6;border-radius:9px;padding:0 9px;
    font-size:12px;color:var(--ink);background:#fff;outline:none;
  }
  .edit-box input:focus{border-color:var(--grape)}
  .edit-box .eb-row{display:flex;gap:7px;justify-content:flex-end}
  .diary-list{max-height:520px;overflow-y:auto}

  .msg{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
    background:rgba(74,63,92,.92);color:#fff;padding:10px 20px;border-radius:999px;
    font-size:13px;opacity:0;transition:.3s;z-index:9;pointer-events:none;white-space:nowrap}
  .msg.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:600px){
    .toprow{justify-content:center;text-align:center}
    .stat b{font-size:16px}
    .stat{padding:6px 10px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<!-- 热更新：内容版本变化自动带参重载，绕过缓存（无需重装 APK） -->
<script>
(function(){
  var VER_URL = 'https://mogoing.github.io/mogoing/version.json';
  if (!window.fetch) return;
  fetch(VER_URL, {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(j){
    var ver = String((j && j.v) || 0);
    try {
      var old = localStorage.getItem('mogoing_ver');
      if (old !== ver) {
        localStorage.setItem('mogoing_ver', ver);
        var p = location.pathname;
        var q = location.search || '';
        var sep = q.indexOf('?') >= 0 ? '&' : '?';
        location.replace(p + q + sep + 'v=' + ver);
      }
    } catch(e){}
  }).catch(function(){});
})();
</script>

</head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="wrap">
    <!-- 顶栏 + 数据看板（同一横排） -->
    <div class="toprow">
      <div class="brand">
        <div class="logo">⭐</div>
        <h1>管理后台<small id="who"></small></h1>
      </div>
      <div class="stats">
        <div class="stat"><b id="sUsers">-</b><span>用户总数</span></div>
        <div class="stat"><b id="sCoins">-</b><span>金币总数</span></div>
        <div class="stat"><b id="sDiary">-</b><span>日记条数</span></div>
      </div>
      <button class="btn ghost" onclick="goHome()">返回主页</button>
    </div>

    <!-- 发放金币 -->
    <div class="panel">
      <h2>发放金币</h2>
      <div class="row">
        <input type="text" id="addUser" placeholder="用户名">
        <input type="number" id="addAmount" placeholder="数量" style="max-width:130px">
        <button class="btn" onclick="addCoins()">发放</button>
      </div>
      <div class="hint">正数 = 加金币（充值到账）· 负数 = 扣金币（违规收回）· 也可在下方用户列表点 +/- 逐个调整</div>
    </div>

    <!-- 用户列表 -->
    <div class="panel">
      <h2>用户列表</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>ID</th><th>账号</th><th>金币</th><th>注册时间</th><th>操作</th></tr></thead>
          <tbody id="userRows"></tbody>
        </table>
      </div>
    </div>

    <!-- 发布邮件 -->
    <div class="panel">
      <h2>发布邮件 <span style="font-size:11px;color:var(--muted);font-weight:400">（发送给所有用户 · 可附金币奖励）</span></h2>
      <div class="row" style="margin-bottom:8px">
        <input type="text" id="mailTitle" placeholder="邮件标题">
      </div>
      <div class="row" style="margin-bottom:8px">
        <textarea id="mailBody" style="width:100%;min-height:80px;border:2px solid #EEE6F6;border-radius:11px;padding:10px 12px;font-size:13px;color:var(--ink);background:#fff;outline:none;resize:vertical;font-family:inherit;line-height:1.6" placeholder="邮件正文（前几个字会显示在列表摘要）"></textarea>
      </div>
      <div class="row">
        <input type="number" id="mailReward" placeholder="奖励金币（0=无奖励）" style="max-width:180px" min="0">
        <button class="btn" onclick="publishMail()">📮 发布邮件</button>
      </div>
      <div class="hint">发布后所有用户都可在「邮件中心」看到；带奖励的邮件用户点击「立即领取」金币实时到账</div>
    </div>

    <!-- 全部日记（按用户分组） -->
    <div class="panel">
      <h2>全部日记 <span style="font-size:11px;color:var(--muted);font-weight:400">（按用户分组 · 可编辑/删除/新增）</span></h2>
      <div class="diary-list" id="diaryList"></div>
    </div>
  </div>
  <div class="msg" id="msg"></div>

<script>
  // ===== 后端 API =====
  const API = 'https://api.mogoing.xyz';

  // ===== 登录守卫：仅管理员可进 =====
  const user = localStorage.getItem('blindbox_user');
  const manager = localStorage.getItem('blindbox_manager') === '1';
  if (!user || !manager) { location.replace('index.html'); }
  const pass = localStorage.getItem('blindbox_pass') || '';
  document.getElementById('who').textContent = ' · ' + user;

  // ===== 工具 =====
  const $ = id => document.getElementById(id);
  function toast(t){
    const m = $('msg'); m.textContent = t; m.classList.add('show');
    clearTimeout(m._t); m._t = setTimeout(() => m.classList.remove('show'), 2000);
  }
  function goHome(){ location.href = 'main.html'; }
  function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  // ===== 用户列表 =====
  let USERS = [];
  async function loadUsers(){
    try {
      const r = await fetch(`${API}/api/admin/users?admin_username=${encodeURIComponent(user)}&admin_password=${encodeURIComponent(pass)}`);
      const d = await r.json();
      if (!d.ok) throw new Error(d.error || '加载失败');
      USERS = d.users || [];
      $('sUsers').textContent = USERS.length;
      $('sCoins').textContent = USERS.reduce((a, u) => a + (u.coins || 0), 0);
      const rows = USERS.map(u => `
        <tr>
          <td>${u.id}</td>
          <td>${esc(u.username)} ${u.manager === 1 ? '<span class="u-admin">管理员</span>' : ''}</td>
          <td><span class="coin-cell">
            <button class="pm-btn minus" ${u.manager===1?'disabled':''} onclick="adjustCoin('${esc(u.username)}',-1,this)">−</button>
            <span class="coin-num" id="coin_${u.id}">🪙 ${u.coins}</span>
            <button class="pm-btn plus" ${u.manager===1?'disabled':''} onclick="adjustCoin('${esc(u.username)}',1,this)">＋</button>
          </span></td>
          <td>${(u.created_at || '').slice(0, 10)}</td>
          <td>${u.manager === 1 ? '<span style="color:var(--muted);font-size:11px">不可删</span>' :
            `<button class="del" onclick="delUser('${esc(u.username)}')">删除</button>`}</td>
        </tr>`).join('');
      $('userRows').innerHTML = USERS.length ? rows : '<tr><td colspan="5" class="empty">暂无用户</td></tr>';
    } catch (e) { toast('加载失败：' + e.message); }
  }

  // ===== 金币：单步 +/-（管理员账号不可调） =====
  async function adjustCoin(username, delta, btn){
    btn.disabled = true;
    try {
      const r = await fetch(`${API}/api/admin/addcoins`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ admin_username: user, admin_password: pass, username, amount: delta })
      });
      const d = await r.json();
      if (!d.ok) throw new Error(d.error || '失败');
      // 更新该行显示
      USERS = USERS.map(u => u.username === username ? {...u, coins: d.coins} : u);
      const target = USERS.find(u => u.username === username);
      const el = document.getElementById('coin_' + target.id);
      if (el) el.textContent = '🪙 ' + d.coins;
      $('sCoins').textContent = USERS.reduce((a, u) => a + (u.coins || 0), 0);
    } catch (e) { toast('失败：' + e.message); }
    btn.disabled = false;
  }

  // ===== 发放金币 =====
  async function addCoins(){
    const username = $('addUser').value.trim();
    const amount = parseInt($('addAmount').value, 10);
    if (!username || !amount) return toast('请填写用户名和数量');
    try {
      const r = await fetch(`${API}/api/admin/addcoins`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ admin_username: user, admin_password: pass, username, amount })
      });
      const d = await r.json();
      if (!d.ok) throw new Error(d.error || '失败');
      toast(`✅ ${username} 金币 → ${d.coins}`);
      $('addUser').value = ''; $('addAmount').value = '';
      loadUsers();
    } catch (e) { toast('失败：' + e.message); }
  }

  // ===== 删除用户 =====
  async function delUser(username){
    if (!confirm(`确定删除用户「${username}」吗？\n该用户的日记、留言、金币、分数、存档将全部清除，且不可恢复！`)) return;
    try {
      const r = await fetch(`${API}/api/admin/deleteuser`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ admin_username: user, admin_password: pass, username })
      });
      const d = await r.json();
      if (!d.ok) throw new Error(d.error || '失败');
      toast(`✅ 已删除 ${username}`);
      loadUsers(); loadDiary();
    } catch (e) { toast('失败：' + e.message); }
  }

  // ===== 日记：按用户分组加载 =====
  let DIARY = [];
  async function loadDiary(){
    try {
      const r = await fetch(`${API}/api/diary?username=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}`);
      const d = await r.json();
      if (!d.ok) throw new Error(d.error || '加载失败');
      DIARY = d.diary || [];
      $('sDiary').textContent = DIARY.length;
      renderDiary();
    } catch (e) { $('diaryList').innerHTML = '<div class="empty">加载失败：' + esc(e.message) + '</div>'; }
  }

  function renderDiary(){
    // 按用户名分组
    const groups = {};
    DIARY.forEach(it => {
      const name = it.username || ('用户' + it.user_id);
      if (!groups[name]) groups[name] = [];
      groups[name].push(it);
    });
    const names = Object.keys(groups).sort();
    $('diaryList').innerHTML = names.length ? names.map((name, gi) => `
      <div class="user-group ${gi===0?'open':''}" id="ug_${gi}">
        <div class="ug-head" onclick="document.getElementById('ug_${gi}').classList.toggle('open')">
          <b>${esc(name)}</b>
          <span style="display:flex;align-items:center;gap:7px">
            <span class="ug-count">${groups[name].length} 条</span>
            <button class="btn small ghost" onclick="event.stopPropagation();addDiaryFor('${esc(name)}')">＋ 新增</button>
            <span class="ug-arrow">▼</span>
          </span>
        </div>
        <div class="ug-body">
          ${groups[name].map(it => `
            <div class="d-item" id="dit_${it.id}">
              <div class="d-head">
                <time>${esc(it.created_at || '')}</time>
                <span class="d-ops">
                  <button class="btn small ghost" onclick="editDiary(${it.id})">编辑</button>
                  <button class="btn small danger" onclick="delDiary(${it.id})">删除</button>
                </span>
              </div>
              <p class="d-content">${esc(it.content)}</p>
              <div class="edit-box" id="eb_${it.id}">
                <textarea id="ebt_${it.id}">${esc(it.content)}</textarea>
                <input type="text" id="ebd_${it.id}" placeholder="改时间（可选，留空保持原时间）" value="${esc(it.created_at || '')}">
                <div class="eb-row">
                  <button class="btn small" onclick="saveEdit(${it.id})">保存</button>
                  <button class="btn small ghost" onclick="cancelEdit(${it.id})">取消</button>
                </div>
              </div>
            </div>`).join('')}
        </div>
      </div>`).join('') : '<div class="empty">暂无日记</div>';
  }

  // ===== 日记：新增（管理员为指定用户新增） =====
  function addDiaryFor(username){
    const content = prompt(`为「${username}」新增一条日记，请输入内容：`);
    if (!content || !content.trim()) return;
    postDiaryAdd(username, content.trim());
  }
  async function postDiaryAdd(username, content){
    try {
      const r = await fetch(`${API}/api/diary`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ username: user, password: pass, content, target_username: username })
      });
      const d = await r.json();
      if (!d.ok) throw new Error(d.error || '失败');
      toast(`✅ 已为 ${username} 新增日记`);
      loadDiary();
    } catch (e) { toast('失败：' + e.message); }
  }

  // ===== 日记：编辑（管理员可改内容 + 时间） =====
  function editDiary(id){
    document.getElementById('eb_' + id).classList.add('show');
    document.getElementById('dit_' + id).querySelector('.d-content').style.display = 'none';
  }
  function cancelEdit(id){
    document.getElementById('eb_' + id).classList.remove('show');
    document.getElementById('dit_' + id).querySelector('.d-content').style.display = '';
  }
  async function saveEdit(id){
    const content = document.getElementById('ebt_' + id).value.trim();
    const created_at = document.getElementById('ebd_' + id).value.trim();
    if (!content) return toast('内容不能为空');
    try {
      const body = { username: user, password: pass, id, content };
      // 只有填写了时间才传 created_at（管理员可改时间）；留空则保持原时间不变
      if (created_at) body.created_at = created_at;
      const r = await fetch(`${API}/api/diary/update`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body)
      });
      const d = await r.json();
      if (!d.ok) throw new Error(d.error || '失败');
      toast('✅ 日记已更新');
      loadDiary();
    } catch (e) { toast('失败：' + e.message); }
  }

  // ===== 日记：删除 =====
  async function delDiary(id){
    if (!confirm('确定删除这条日记吗？')) return;
    try {
      const r = await fetch(`${API}/api/diary/delete`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ username: user, password: pass, id })
      });
      const d = await r.json();
      if (!d.ok) throw new Error(d.error || '失败');
      toast('✅ 日记已删除');
      loadDiary();
    } catch (e) { toast('失败：' + e.message); }
  }

  // ===== 发布邮件（写入全局 cfg.mails，所有用户可见） =====
  async function publishMail(){
    const title = $('mailTitle').value.trim();
    const body = $('mailBody').value.trim();
    const reward = Math.max(0, parseInt($('mailReward').value, 10) || 0);
    if (!title || !body) return toast('请填写标题和正文');
    try {
      // 读现有 cfg
      const r0 = await fetch(`${API}/api/cfg`);
      const d0 = await r0.json();
      const cfg = d0.cfg || {};
      const mails = Array.isArray(cfg.mails) ? cfg.mails : [];
      const id = Date.now();
      mails.push({ id, title, body, reward, date: new Date().toISOString() });
      // 写回 cfg
      const r = await fetch(`${API}/api/cfg`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ username: user, password: pass, cfg: { ...cfg, mails } })
      });
      const d = await r.json();
      if (!d.ok) throw new Error(d.error || '失败');
      toast('✅ 邮件已发布给所有用户');
      $('mailTitle').value = ''; $('mailBody').value = ''; $('mailReward').value = '';
    } catch (e) { toast('发布失败：' + e.message); }
  }

  loadUsers();
  loadDiary();
</script>
