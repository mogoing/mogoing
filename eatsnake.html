<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<!-- 禁止双击放大：iOS Safari 从 iOS 10 起忽略 user-scalable=no，真正生效的是 touch-action:manipulation（上下滚动、双指缩放照常可用） -->
<style>html,body{touch-action:manipulation;-webkit-text-size-adjust:100%}</style>
<title>贪吃蛇 · 多巴胺版</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23FF6B6B'/%3E%3Cstop offset='1' stop-color='%23FFD93D'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='45' font-size='38' font-weight='800' text-anchor='middle' fill='%23fff'%3E%3F%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --coral:#FF6B6B; --sunny:#FFD93D; --mint:#4ECDC4; --grape:#9B5DE5; --pink:#FF9DE2;
    --ink:#4A3F5C; --muted:#9A8FB5;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
    min-height:100vh;color:var(--ink);user-select:none;-webkit-user-select:none;
    background:linear-gradient(165deg,#FFF6E9,#FFE8D6);
    display:flex;flex-direction:column;align-items:center;padding:16px 12px 26px;
  }
  .blob{position:fixed;border-radius:50%;filter:blur(56px);opacity:.5;z-index:0;animation:float 14s ease-in-out infinite}
  .b1{width:34vmax;height:34vmax;background:var(--pink);top:-12vmax;left:-10vmax}
  .b2{width:26vmax;height:26vmax;background:var(--mint);bottom:-8vmax;right:-8vmax;animation-delay:-5s}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(2.6vmax)}}
  header{position:relative;z-index:1;width:min(94vw,620px);display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  h1{font-size:22px;letter-spacing:3px;background:linear-gradient(90deg,var(--mint),var(--coral));-webkit-background-clip:text;background-clip:text;color:transparent}
  .stats{display:flex;gap:10px;align-items:center;font-size:14px}
  .stat{background:#fff;border-radius:999px;padding:6px 12px;box-shadow:0 4px 12px rgba(155,93,229,.12)}
  .stat b{color:var(--coral)}
  .pause-btn{
    border:none;cursor:pointer;border-radius:999px;min-height:44px;
    display:inline-flex;align-items:center;justify-content:center;padding:0 16px;
    font-size:14px;font-weight:700;color:#fff;
    background:linear-gradient(135deg,var(--coral),var(--grape));
    box-shadow:0 6px 14px rgba(255,107,107,.3);transition:transform .15s;
  }
  .pause-btn:hover{transform:translateY(-2px)}
  .wrap{position:relative;z-index:1;background:rgba(255,255,255,.74);backdrop-filter:blur(10px);border-radius:20px;padding:10px;box-shadow:0 18px 44px rgba(155,93,229,.16)}
  canvas{display:block;border-radius:12px;background:linear-gradient(160deg,#FFFDF5,#FFF2E2)}
  .dpad{position:relative;z-index:1;display:none;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);gap:8px;margin-top:16px}
  .dpad button{
    border:none;border-radius:16px;font-size:18px;font-weight:800;color:#fff;cursor:pointer;
    background:linear-gradient(135deg,var(--mint),#3DBDB3);
    box-shadow:0 6px 14px rgba(78,205,196,.35);transition:transform .1s;
  }
  .dpad button:active{transform:scale(.9)}
  .dpad .up{grid-column:2;grid-row:1}.dpad .left{grid-column:1;grid-row:2}.dpad .right{grid-column:3;grid-row:2}.dpad .down{grid-column:2;grid-row:3}
  @media (max-width:640px){ .dpad{display:grid} header{flex-wrap:wrap} }
  .mask{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:rgba(74,63,92,.35);backdrop-filter:blur(4px)}
  .mask.show{display:flex}
  .panel{width:min(86vw,320px);background:#fff;border-radius:22px;padding:26px 22px;text-align:center;box-shadow:0 20px 50px rgba(74,63,92,.25);animation:pop .3s cubic-bezier(.2,.8,.3,1.2) both}
  @keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
  .panel h2{font-size:20px;margin-bottom:6px}
  .panel p{font-size:14px;color:var(--muted);margin-bottom:18px}
  .score-big{font-size:40px;font-weight:800;background:linear-gradient(90deg,var(--coral),var(--sunny));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:6px}
  .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .btn{
    border:none;cursor:pointer;border-radius:999px;min-height:44px;
    display:inline-flex;align-items:center;justify-content:center;
    padding:0 20px;font-size:14px;font-weight:700;color:#fff;transition:transform .15s;
  }
  .btn:hover{transform:translateY(-2px)}
  .btn.green{background:linear-gradient(135deg,var(--mint),#3DBDB3)}
  .btn.pink{background:linear-gradient(135deg,var(--coral),var(--grape))}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<!-- 热更新：内容版本变化自动带参重载，绕过缓存（无需重装 APK） -->
<script>
(function(){
  var VER_URL = 'https://mogoing.github.io/mogoing/version.json';
  if (!window.fetch) return;
  fetch(VER_URL, {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(j){
    var ver = String((j && j.v) || 0);
    try {
      var old = localStorage.getItem('mogoing_ver');
      if (old !== ver) {
        localStorage.setItem('mogoing_ver', ver);
        var p = location.pathname;
        var q = location.search || '';
        var sep = q.indexOf('?') >= 0 ? '&' : '?';
        location.replace(p + q + sep + 'v=' + ver);
      }
    } catch(e){}
  }).catch(function(){});
})();
</script>

</head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div>
  <header>
    <h1>贪吃蛇</h1>
    <div class="stats">
      <span class="stat">分数 <b id="score">0</b></span>
      <span class="stat">最高 <b id="high">0</b></span>
    </div>
    <button class="pause-btn" id="pauseBtn">暂停</button>
  </header>
  <div class="wrap"><canvas id="game"></canvas></div>
  <div class="dpad">
    <button class="up" data-d="up">↑</button>
    <button class="left" data-d="left">←</button>
    <button class="right" data-d="right">→</button>
    <button class="down" data-d="down">↓</button>
  </div>

  <div class="mask" id="pauseMask">
    <div class="panel">
      <h2>已暂停</h2>
      <p>休息一下，再战一局</p>
      <div class="btns">
        <button class="btn green" id="resumeBtn">继续游戏</button>
        <button class="btn pink" id="homePause">返回主页</button>
      </div>
    </div>
  </div>
  <div class="mask" id="overMask">
    <div class="panel">
      <h2>游戏结束</h2>
      <div class="score-big" id="finalScore">0</div>
      <p id="coinTip" style="display:none;color:#B8860B;font-weight:700;margin-bottom:14px"></p>
      <p>再接再厉</p>
      <div class="btns">
        <button class="btn green" id="restartBtn">再玩一次</button>
        <button class="btn pink" id="homeOver">返回主页</button>
      </div>
    </div>
  </div>
<script>
  if (!localStorage.getItem('blindbox_user')) location.replace('index.html');

  // ===== 后端得分上报（破纪录/连败辛苦费 +金币）=====
  const API = 'https://api.mogoing.xyz';
  const _user = localStorage.getItem('blindbox_user') || '';
  const _pass = localStorage.getItem('blindbox_pass') || '';
  const _offline = localStorage.getItem('blindbox_offline') === '1';
  function reportScore(game, score) {
    if (_offline || !_user || !_pass) return;
    fetch(API + '/api/score', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ username: _user, password: _pass, game, score }),
      signal: AbortSignal.timeout(8000)
    }).then(r => r.json()).then(d => {
      if (d && d.ok && d.coins_gained > 0) {
        localStorage.setItem('blindbox_coins', String(d.balance || 0));
        const p = document.getElementById('coinTip');
        if (p) {
          p.textContent = d.beat ? '🏅 打破纪录 +1 金币！' : '🍀 连败辛苦费 +1 金币！';
          p.style.display = 'block';
          setTimeout(() => p.style.display = 'none', 4000);
        }
      }
    }).catch(() => {});
  }

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const COLS = 20, ROWS = 20;
  const scoreEl = document.getElementById('score');
  const highEl = document.getElementById('high');
  let cell = 16, snake = [], dir = {x:1,y:0}, nextDir = {x:1,y:0}, food = null;
  let score = 0, timer = null, running = false, paused = false;
  let high = +(localStorage.getItem('snake_high') || 0);
  highEl.textContent = high;

  function resize() {
    const maxW = Math.min(600, window.innerWidth - 36);
    const maxH = window.innerHeight - 236;
    cell = Math.max(8, Math.floor(Math.min(maxW, maxH) / COLS));
    canvas.width = cell * COLS;
    canvas.height = cell * ROWS;
    if (running || snake.length) draw();
  }
  window.addEventListener('resize', resize);

  function rr(x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
    else ctx.rect(x, y, w, h);
    ctx.fill();
  }

  function placeFood() {
    do {
      food = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
    } while (snake.some(s => s.x === food.x && s.y === food.y));
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    // 网格
    ctx.strokeStyle = 'rgba(155,93,229,.08)';
    ctx.lineWidth = 1;
    for (let i = 1; i < COLS; i++) {
      ctx.beginPath(); ctx.moveTo(i * cell, 0); ctx.lineTo(i * cell, canvas.height); ctx.stroke();
    }
    for (let j = 1; j < ROWS; j++) {
      ctx.beginPath(); ctx.moveTo(0, j * cell); ctx.lineTo(canvas.width, j * cell); ctx.stroke();
    }
    // 食物
    const pulse = cell * 0.34 + Math.sin(Date.now() / 300) * 1.4;
    const fx = food.x * cell + cell / 2, fy = food.y * cell + cell / 2;
    const g = ctx.createRadialGradient(fx, fy, 2, fx, fy, cell * 0.55);
    g.addColorStop(0, '#FFD93D'); g.addColorStop(1, '#FF6B6B');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(fx, fy, pulse, 0, Math.PI * 2); ctx.fill();
    // 蛇身
    snake.forEach((s, i) => {
      const pad = 1.5, x = s.x * cell + pad, y = s.y * cell + pad, w = cell - pad * 2;
      ctx.fillStyle = i === 0 ? '#FFB84C' : 'hsl(' + ((140 + i * 4) % 200) + ', 75%, 58%)';
      rr(x, y, w, w, Math.max(3, w * 0.28));
    });
    // 蛇头眼睛
    if (snake.length) {
      const hx = snake[0].x * cell, hy = snake[0].y * cell, e = Math.max(2, cell * 0.15);
      let p1, p2;
      if (dir.x === 1)      { p1 = [hx + cell * 0.62, hy + cell * 0.26]; p2 = [hx + cell * 0.62, hy + cell * 0.74]; }
      else if (dir.x === -1){ p1 = [hx + cell * 0.38 - e, hy + cell * 0.26]; p2 = [hx + cell * 0.38 - e, hy + cell * 0.74]; }
      else if (dir.y === 1) { p1 = [hx + cell * 0.26, hy + cell * 0.62]; p2 = [hx + cell * 0.74, hy + cell * 0.62]; }
      else                  { p1 = [hx + cell * 0.26, hy + cell * 0.38 - e]; p2 = [hx + cell * 0.74, hy + cell * 0.38 - e]; }
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(p1[0] + e / 2, p1[1] + e / 2, e / 2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(p2[0] + e / 2, p2[1] + e / 2, e / 2, 0, Math.PI * 2); ctx.fill();
    }
  }

  function setDir(nx, ny) {
    if (nx === -dir.x && ny === -dir.y) return;
    nextDir = { x: nx, y: ny };
  }

  function step() {
    if (!running || paused) return;
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    const hitWall = head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS;
    const hitSelf = snake.some(s => s.x === head.x && s.y === head.y);
    if (hitWall || hitSelf) return gameOver();
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score++;
      scoreEl.textContent = score;
      if (score > high) { high = score; localStorage.setItem('snake_high', high); highEl.textContent = high; }
      placeFood();
    } else {
      snake.pop();
    }
    draw();
  }

  function start() {
    snake = [{x:5,y:10},{x:4,y:10},{x:3,y:10}];
    dir = { x: 1, y: 0 }; nextDir = { x: 1, y: 0 };
    score = 0; scoreEl.textContent = 0;
    paused = false;
    document.getElementById('pauseMask').classList.remove('show');
    document.getElementById('overMask').classList.remove('show');
    placeFood();
    running = true;
    clearInterval(timer);
    timer = setInterval(step, 130);
    draw();
  }

  function togglePause(force) {
    if (!running) return;
    paused = typeof force === 'boolean' ? force : !paused;
    document.getElementById('pauseMask').classList.toggle('show', paused);
  }

  function gameOver() {
    running = false;
    clearInterval(timer);
    document.getElementById('finalScore').textContent = score;
    document.getElementById('pauseMask').classList.remove('show');
    document.getElementById('overMask').classList.add('show');
    reportScore('snake', score);
  }

  // 键盘控制
  window.addEventListener('keydown', (e) => {
    const k = e.key;
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k)) e.preventDefault();
    if (k === 'ArrowUp' || k === 'w' || k === 'W') setDir(0, -1);
    else if (k === 'ArrowDown' || k === 's' || k === 'S') setDir(0, 1);
    else if (k === 'ArrowLeft' || k === 'a' || k === 'A') setDir(-1, 0);
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') setDir(1, 0);
    else if (k === ' ' || k === 'p' || k === 'P') togglePause();
  });

  // 触屏滑动控制
  let tx = 0, ty = 0;
  canvas.addEventListener('touchstart', (e) => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  canvas.addEventListener('touchend', (e) => {
    const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
    else setDir(0, dy > 0 ? 1 : -1);
  }, { passive: true });

  // 方向按钮
  document.querySelectorAll('.dpad button').forEach(b => b.addEventListener('click', () => {
    const d = b.dataset.d;
    if (d === 'up') setDir(0, -1);
    else if (d === 'down') setDir(0, 1);
    else if (d === 'left') setDir(-1, 0);
    else setDir(1, 0);
  }));

  document.getElementById('pauseBtn').addEventListener('click', () => togglePause(true));
  document.getElementById('resumeBtn').addEventListener('click', () => togglePause(false));
  document.getElementById('restartBtn').addEventListener('click', start);
  document.getElementById('homePause').addEventListener('click', () => location.href = 'main.html');
  document.getElementById('homeOver').addEventListener('click', () => location.href = 'main.html');

  resize();
  start();
</script>
<script>
// ===== 安卓返回键：本页按返回 = 回主界面 =====
window.addEventListener('androidback', function(){ location.href = 'main.html'; });
</script>
</body>
</html>
