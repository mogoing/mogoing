<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<!-- 禁止双击放大：iOS Safari 从 iOS 10 起忽略 user-scalable=no，真正生效的是 touch-action:manipulation -->
<style>html,body{touch-action:manipulation;-webkit-text-size-adjust:100%}</style>
<title>音乐 · 丰稔季</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FFE8D6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="烩菜">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23FF6B6B'/%3E%3Cstop offset='1' stop-color='%23FFD93D'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='45' font-size='38' font-weight='800' text-anchor='middle' fill='%23fff'%3E%E2%99%AA%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --coral:#FF6B6B; --sunny:#FFD93D; --mint:#4ECDC4; --grape:#9B5DE5; --pink:#FF9DE2;
    --ink:#4A3F5C; --muted:#9A8FB5;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
    min-height:100vh;color:var(--ink);
    background:linear-gradient(165deg,#FFF6E9,#FFE8D6);
    display:flex;flex-direction:column;align-items:center;
    padding:calc(16px + env(safe-area-inset-top)) clamp(12px,3vw,32px) calc(230px + env(safe-area-inset-bottom));
    overflow-x:hidden;
  }
  /* ===== 背景装饰：与主页一致的多巴胺光斑 ===== */
  .blob{position:fixed;border-radius:50%;filter:blur(56px);opacity:.5;z-index:0;animation:float 14s ease-in-out infinite;pointer-events:none}
  .blob-a{width:36vmax;height:36vmax;background:var(--pink);top:-12vmax;left:-10vmax}
  .blob-b{width:28vmax;height:28vmax;background:var(--mint);bottom:-8vmax;right:-8vmax;animation-delay:-5s}
  .blob-c{width:20vmax;height:20vmax;background:var(--sunny);top:32%;right:4vmax;opacity:.32;animation-delay:-9s}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(2.6vmax)}}
  .deco{position:fixed;z-index:0;pointer-events:none;opacity:.4}
  .deco-ring{
    width:34vmin;height:34vmin;right:-6vmin;top:12%;
    border:2.5px dashed rgba(155,93,229,.45);border-radius:50%;
    animation:spin 46s linear infinite;
  }
  .deco-ring::after{
    content:"";position:absolute;inset:14%;border:1.5px solid rgba(255,107,107,.35);border-radius:50%;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .deco-dots{
    width:17vmin;height:11vmin;left:6%;bottom:34%;
    background-image:radial-gradient(circle,rgba(255,107,107,.5) 3px,transparent 3.5px);
    background-size:26px 26px;
  }

  /* ===== 顶栏 ===== */
  .mu-head{
    position:relative;z-index:1;width:100%;max-width:720px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    margin-bottom:12px;
  }
  .mu-back{
    flex:none;width:44px;height:44px;border:none;border-radius:14px;cursor:pointer;
    background:rgba(255,255,255,.85);backdrop-filter:blur(8px);
    box-shadow:0 6px 16px rgba(155,93,229,.14);
    font-size:20px;font-weight:900;color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    transition:transform .15s;
  }
  .mu-back:active{transform:scale(.9)}
  .mu-title{font-size:21px;font-weight:900;color:var(--ink);letter-spacing:1px;text-align:center;flex:1}
  .mu-headspace{flex:none;width:44px}

  /* ===== 主卡（同主页 stage-shell） ===== */
  .mu-shell{
    position:relative;z-index:1;width:min(100%,720px);
    border-radius:28px;
    box-shadow:0 18px 44px rgba(155,93,229,.16);
    background:rgba(255,255,255,.45);
    padding:clamp(14px,2.4vw,24px);
  }

  /* ===== 搜索栏 ===== */
  .mu-search{display:flex;gap:10px;margin-bottom:12px}
  .mu-search input{
    flex:1;min-width:0;height:46px;border:none;outline:none;border-radius:999px;
    padding:0 18px;font-size:15px;font-weight:700;color:var(--ink);
    background:rgba(255,255,255,.92);
    box-shadow:inset 0 0 0 2px rgba(155,93,229,.12);
    transition:box-shadow .2s;
  }
  .mu-search input::placeholder{color:var(--muted);font-weight:600}
  .mu-search input:focus{box-shadow:inset 0 0 0 2px rgba(155,93,229,.42)}
  .mu-search button{
    flex:none;height:46px;padding:0 22px;border:none;border-radius:999px;cursor:pointer;
    font-size:15px;font-weight:800;color:#fff;
    background:linear-gradient(135deg,var(--sunny),#FF9F6B);
    box-shadow:0 4px 12px rgba(255,159,107,.4);
    transition:transform .15s,opacity .2s;
  }
  .mu-search button:active{transform:scale(.95)}
  .mu-search button:disabled{opacity:.6;pointer-events:none}

  /* ===== 音质选择 ===== */
  .mu-opts{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
/* ===== 搜索抽屉：折叠/展开 ===== */
  .mu-drawer-head{display:flex;align-items:center;gap:8px}
  .mu-toggle{
    flex:none;width:30px;height:30px;border:none;border-radius:50%;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.9);box-shadow:0 2px 8px rgba(155,93,229,.14);
    color:var(--grape);font-size:14px;font-weight:900;
    transition:transform .25s,background .2s;
    margin-bottom:12px;
  }
  .mu-toggle:active{transform:scale(.9)}
  .mu-toggle.open svg{transform:rotate(180deg)}
  .mu-toggle svg{transition:transform .25s}
  .mu-collapse{
    overflow:hidden;max-height:600px;opacity:1;
    transition:max-height .32s cubic-bezier(.3,.9,.3,1),opacity .25s,margin .3s;
  }
  .mu-collapse.folded{max-height:0;opacity:0;margin-bottom:0!important}

  /* ===== 搜索提示词（可点）===== */
  #qHint{
    margin:8px 2px 0;display:none;flex-wrap:wrap;gap:8px;
  }
  #qHint.on{display:flex}
  .hint-chip{
    display:inline-flex;align-items:baseline;gap:5px;
    padding:7px 13px;border:none;border-radius:999px;cursor:pointer;
    background:rgba(255,255,255,.95);
    box-shadow:0 3px 10px rgba(155,93,229,.12);
    transition:transform .15s,box-shadow .2s;
    max-width:100%;
  }
  .hint-chip:active{transform:scale(.95)}
  .hint-chip .hc-song{font-size:13.5px;font-weight:800;color:var(--ink)}
  .hint-chip .hc-artist{font-size:11px;font-weight:600;color:var(--muted)}
  .hint-chip:hover{box-shadow:0 5px 14px rgba(155,93,229,.2)}

  /* ===== 我的收藏卡片（高对比度） ===== */
  .mu-favcard{
    margin-top:14px;
    border-radius:22px;
    background:linear-gradient(160deg,#FFFFFF,#FFF4E4);
    box-shadow:0 8px 24px rgba(155,93,229,.2),inset 0 0 0 2px rgba(255,255,255,.9);
    overflow:hidden;
  }
  .mu-favhead{
    display:flex;align-items:center;gap:8px;padding:13px 15px;cursor:pointer;
    transition:background .2s;
  }
  .mu-favhead:active{background:rgba(255,255,255,.9)}
  .mu-favhead .fh-ic{font-size:17px}
  .mu-favhead b{font-size:14.5px;font-weight:900;color:var(--ink)}
  .mu-favhead em{font-style:normal;font-size:11.5px;font-weight:700;color:var(--muted)}
  .fh-play{
    flex:none;width:34px;height:34px;margin-left:auto;margin-right:4px;
    border:none;cursor:pointer;color:#fff;
    display:flex;align-items:center;justify-content:center;
    border-radius:50% 46% 52% 44% / 46% 50% 44% 52%;
    background:linear-gradient(145deg,var(--coral),var(--grape));
    box-shadow:0 4px 11px rgba(255,107,107,.34);
    transition:transform .15s;
  }
  .fh-play:active{transform:scale(.86) rotate(-8deg)}
  .mu-favhead .fh-arrow{color:var(--muted);font-size:12px;transition:transform .25s}
  .mu-favcard.open .fh-arrow{transform:rotate(180deg)}
  .mu-favbody{max-height:0;overflow:hidden;transition:max-height .3s cubic-bezier(.3,.9,.3,1)}
  .mu-favcard.open .mu-favbody{max-height:420px;overflow-y:auto}
  .mu-favbody .mu-list{padding:0 10px 12px}
  .fav-empty{padding:22px 14px;text-align:center;font-size:12.5px;font-weight:700;color:var(--muted)}

  /* ===== 列表行：爱心 / 播放 / 加号 ===== */
  .row-btns{flex:none;display:flex;align-items:center;gap:3px}
  .ico-btn{
    flex:none;width:34px;height:34px;border:none;border-radius:50%;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    background:transparent;color:var(--muted);
    transition:transform .15s,color .2s;
  }
  .ico-btn:active{transform:scale(.85)}
  .ico-btn.fav-on{color:var(--coral)}
  .ico-btn.fav-on svg{fill:var(--coral)}
  /* Q版播放按钮：圆润、不对称 */
  .q-play{
    flex:none;width:36px;height:36px;border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;color:#fff;
    border-radius:50% 46% 52% 44% / 46% 50% 44% 52%;
    background:linear-gradient(145deg,var(--coral),var(--grape));
    box-shadow:0 4px 11px rgba(255,107,107,.34);
    transition:transform .15s,box-shadow .2s;
  }
  .q-play:active{transform:scale(.88) rotate(-6deg)}
  /* Q版加号（下一首播放）：薄荷绿、圆润 */
  .q-add{
    flex:none;width:32px;height:32px;border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;color:#fff;
    border-radius:52% 46% 54% 48% / 46% 54% 48% 52%;
    background:linear-gradient(145deg,#4ECDC4,#2FBFB5);
    box-shadow:0 3px 9px rgba(47,191,181,.32);
    transition:transform .15s;
  }
  .q-add:active{transform:scale(.85) rotate(8deg)}
  .q-add.bump{animation:addBump .32s cubic-bezier(.2,.9,.3,1.4)}
  @keyframes addBump{0%{transform:scale(1)}55%{transform:scale(1.24)}100%{transform:scale(1)}}
  /* 播放器圆形按钮更圆润 */
  #btnPlay{border-radius:52% 48% 50% 46% / 48% 52% 46% 50%}

  /* ===== 列表 ===== */
.mu-list{display:flex;flex-direction:column;gap:8px}
  .mu-row{
    display:flex;align-items:center;gap:12px;padding:9px 10px;
    border-radius:18px;background:rgba(255,255,255,.82);
    box-shadow:0 3px 10px rgba(155,93,229,.08);
    cursor:pointer;transition:transform .15s,box-shadow .2s;
    animation:rowIn .32s cubic-bezier(.2,.9,.3,1.15) both;
  }
  @keyframes rowIn{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
  .mu-row:active{transform:scale(.98)}
  .mu-row.now{background:#fff;box-shadow:0 6px 18px rgba(155,93,229,.26)}
  .mu-row.now .mu-txt b{color:var(--grape)}
  .mu-row.dead{opacity:.45}
  .mu-tile{
    flex:none;width:46px;height:46px;border-radius:14px;position:relative;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:900;font-size:18px;text-shadow:0 1px 2px rgba(0,0,0,.14);
  }
  .mu-tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s}
  .mu-tile img.ld{opacity:1}
  .t1{background:linear-gradient(160deg,#FFB199,#FFE0B2)}
  .t2{background:linear-gradient(160deg,#BFF0E8,#E4FAF6)}
  .t3{background:linear-gradient(160deg,#E9C9FF,#F9E3FF)}
  .t4{background:linear-gradient(160deg,#FFF3C4,#FFF8E1)}
  .t5{background:linear-gradient(160deg,#FFD3EE,#FFEAF7)}
  .t6{background:linear-gradient(160deg,#D4F5F0,#ECFBF8)}
  .mu-txt{flex:1;min-width:0}
  .mu-txt b{display:block;font-size:14.5px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mu-txt em{display:block;font-style:normal;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .mu-playic{
    flex:none;width:34px;height:34px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;color:#fff;
    background:linear-gradient(135deg,var(--coral),var(--grape));
    box-shadow:0 3px 8px rgba(255,107,107,.3);
  }
  /* 正在播放的行：跳动音柱 */
  .eq{flex:none;display:flex;align-items:flex-end;gap:2.5px;height:18px;padding-right:4px}
  .eq i{width:3.5px;height:18px;border-radius:2px;background:var(--grape);animation:eqB 1s ease-in-out infinite}
  .eq i:nth-child(2){background:var(--coral);animation-delay:.22s}
  .eq i:nth-child(3){background:var(--mint);animation-delay:.44s}
  .eq.off i{animation-play-state:paused;height:6px}
  @keyframes eqB{0%,100%{height:5px}50%{height:18px}}
  .mu-empty{padding:36px 10px;text-align:center;color:var(--muted);font-weight:700;font-size:13.5px;line-height:2}
/* ===== 底部播放器 ===== */
  .mu-player{
    position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(10px + env(safe-area-inset-bottom));z-index:20;
    width:min(100vw - 20px,560px);
    background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
    border-radius:24px;box-shadow:0 14px 36px rgba(155,93,229,.28);
    padding:14px 16px;display:flex;flex-direction:column;gap:8px;
  }
  .mu-prow{display:flex;align-items:center;gap:12px;min-width:0}
  .mu-cover{
    flex:none;width:58px;height:58px;border-radius:16px;position:relative;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:22px;
    background:linear-gradient(135deg,var(--grape),var(--pink));
    box-shadow:0 4px 12px rgba(155,93,229,.3);
  }
  .mu-cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s}
  .mu-cover img.ld{opacity:1}
  .mu-meta{flex:1;min-width:0}
  .mu-meta b{display:block;font-size:15px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mu-meta em{display:block;font-style:normal;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .mu-badge{
    flex:none;font-size:10.5px;font-weight:900;color:#fff;cursor:pointer;
    padding:5px 10px;border:none;border-radius:999px;
    background:linear-gradient(135deg,var(--mint),#2FBFB5);
    box-shadow:0 3px 8px rgba(47,191,181,.35);
    transition:transform .15s,background .2s;
  }
  .mu-badge:active{transform:scale(.92)}
  .mu-badge.loss{background:linear-gradient(135deg,var(--coral),var(--grape));box-shadow:0 3px 8px rgba(255,107,107,.35)}
  .mu-bar{
    position:relative;height:8px;border-radius:4px;background:#F1E8D8;
    cursor:pointer;touch-action:none;margin-top:2px;
  }
  .mu-bar i{
    position:absolute;left:0;top:0;bottom:0;width:0;border-radius:4px;
    background:linear-gradient(90deg,var(--coral),var(--sunny),var(--mint));
  }
  .mu-bar u{
    position:absolute;top:50%;left:0;width:16px;height:16px;border-radius:50%;
    background:#fff;box-shadow:0 2px 6px rgba(74,63,92,.35);
    transform:translate(-50%,-50%);pointer-events:none;
  }
  .mu-times{display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:var(--muted)}
  .mu-ctrls{display:flex;align-items:center;justify-content:center;gap:22px}
  .mu-ctrls button{
    border:none;cursor:pointer;background:transparent;color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    transition:transform .15s,color .2s;
  }
  .mu-ctrls button:active{transform:scale(.88)}
  #btnPrev,#btnNext{width:42px;height:42px}
  #btnLoop,#btnQueue{width:38px;height:38px;color:var(--muted)}
  #btnLoop.on{color:var(--grape)}
  #btnQueue.on{color:var(--grape)}
  #btnPlay{
    width:56px;height:56px;color:#fff;
    border-radius:52% 48% 50% 46% / 48% 52% 46% 50%;
    background:linear-gradient(135deg,var(--coral),var(--grape));
    box-shadow:0 8px 20px rgba(255,107,107,.4);
  }
  #btnPlay.loading svg{animation:eqB 1s ease-in-out infinite}

  /* ===== 单曲结果卡（只展示原唱） ===== */
  .mu-resultcard{
    margin-bottom:14px;padding:14px 16px 12px;
    border-radius:22px;
    background:linear-gradient(150deg,rgba(255,255,255,.96),rgba(255,246,235,.9));
    box-shadow:0 8px 24px rgba(155,93,229,.18),inset 0 0 0 2px rgba(255,255,255,.7);
    animation:rowIn .3s cubic-bezier(.2,.9,.3,1.15) both;
  }
  .mu-rc-top{display:flex;align-items:center;gap:13px}
  .mu-tile.big{width:58px;height:58px;border-radius:18px;font-size:22px}
  .mu-rc-meta{flex:1;min-width:0}
  .mu-rc-meta b{display:block;font-size:17px;font-weight:900;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mu-rc-meta em{display:block;font-style:normal;font-size:12.5px;font-weight:700;color:var(--grape);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
  .mu-rc-btns{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:12px}
  .q-icon{
    flex:none;width:44px;height:44px;border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    color:var(--muted);background:rgba(255,255,255,.9);
    border-radius:50% 46% 52% 44% / 46% 50% 44% 52%;
    box-shadow:0 3px 10px rgba(155,93,229,.14);
    transition:transform .15s,color .2s,background .2s,box-shadow .2s;
  }
  .q-icon:active{transform:scale(.88) rotate(-5deg)}
  .q-icon.fav-on{color:var(--coral);background:#fff}
  .q-icon.fav-on svg{fill:var(--coral)}
  .q-icon.play-main{
    width:52px;height:52px;color:#fff;
    background:linear-gradient(145deg,var(--coral),var(--grape));
    box-shadow:0 6px 16px rgba(255,107,107,.4);
  }
  .q-icon.add-main{
    color:#fff;
    background:linear-gradient(145deg,#4ECDC4,#2FBFB5);
    box-shadow:0 5px 14px rgba(47,191,181,.34);
  }
  .q-icon.add-main.bump{animation:addBump .32s cubic-bezier(.2,.9,.3,1.4)}
  .mu-rc-more{
    width:100%;margin-top:10px;height:34px;
    border:none;border-radius:999px;cursor:pointer;
    font-size:12px;font-weight:800;color:var(--muted);
    background:rgba(255,255,255,.85);
    box-shadow:0 2px 8px rgba(155,93,229,.1);
    transition:transform .15s;
  }
  .mu-rc-more:active{transform:scale(.96)}
  .mu-rc-altlist{margin-top:10px;display:flex;flex-direction:column;gap:7px}

  /* ===== 播放队列抽屉 ===== */
  .mu-queue-mask{
    position:fixed;inset:0;z-index:28;background:rgba(74,63,92,.4);
    backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s;
  }
  .mu-queue-mask.show{opacity:1;pointer-events:auto}
  .mu-queue-panel{
    position:fixed;left:50%;transform:translateX(-50%) translateY(105%);
    bottom:0;z-index:30;
    width:min(100vw - 16px,560px);
    max-height:64vh;
    background:linear-gradient(170deg,#FFFDF8,#FFF1E2);
    border-radius:26px 26px 0 0;
    box-shadow:0 -10px 34px rgba(155,93,229,.28);
    padding:14px 12px calc(18px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;
    transition:transform .32s cubic-bezier(.3,.9,.3,1);
  }
  .mu-queue-panel.show{transform:translateX(-50%) translateY(0)}
  .mu-queue-head{display:flex;align-items:center;gap:8px;padding:0 6px 10px;flex:none}
  .mu-queue-head b{font-size:15px;font-weight:900;color:var(--ink)}
  .mu-queue-head em{font-style:normal;font-size:11.5px;font-weight:700;color:var(--muted)}
  #queueClose{margin-left:auto;width:30px;height:30px;border:none;border-radius:50%;cursor:pointer;background:rgba(255,255,255,.9);color:var(--ink);font-size:14px;font-weight:900;box-shadow:0 2px 8px rgba(155,93,229,.14)}

<script>
  // ===== 音乐数据源（多引擎聚合，前端不暴露来源） =====
  const GD   = 'https://music-api.gdstudio.xyz/api.php';
  const METING = 'https://api.qijieya.cn/meting/';
  const VKEYS  = 'https://api.vkeys.cn/v2/music/netease';
  const VKEYS_QQ = 'https://api.vkeys.cn/v2/music/tencent';
  // 若在 api.mogoing.xyz 挂转发端点，把地址赋给 window.MOMUSIC_PROXY 即可优先启用
  const PROXY = (typeof window !== 'undefined' && window.MOMUSIC_PROXY) ? String(window.MOMUSIC_PROXY).replace(/\/$/, '') : '';

  // ===== 存储键：momusic_state_v1 与主页音乐胶囊共享 =====
  const KEY_STATE = 'momusic_state_v1';
  const KEY_QUEUE = 'momusic_queue';
  const KEY_QI    = 'momusic_qi';
  const KEY_Q     = 'momusic_q';
  const PID = 'mu-' + Math.random().toString(36).slice(2, 9);

  let quality = localStorage.getItem(KEY_Q) || 'std';
  if (quality !== 'std' && quality !== 'loss') quality = 'std';

  let queue = [];
  try { const q = JSON.parse(localStorage.getItem(KEY_QUEUE) || '[]'); if (Array.isArray(q)) queue = q; } catch (e) {}
  let qi = Math.max(0, parseInt(localStorage.getItem(KEY_QI) || '0', 10) || 0);
  if (qi >= queue.length) qi = 0;

  let S = null;
  try { S = JSON.parse(localStorage.getItem(KEY_STATE) || 'null'); } catch (e) { S = null; }

  let cur = null;                 // 当前曲目
  let lastKw = '';                // 最近搜索词
  let page = 1;                   // 搜索页码
  let searching = false;
  const urlCache = new Map();     // uid|br -> url
  const picCache = new Map();     // pic_id|size -> url
  const bus = ('BroadcastChannel' in window) ? new BroadcastChannel('momusic') : null;
  let audio = null, silent = false, dragging = false, lastPosSave = 0, lastSearchToken = 0;

  // ===== 工具 =====
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  function fmt(sec) {
    if (!isFinite(sec) || sec < 0) sec = 0;
    const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
  }
  let toastTimer = null;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
  }

  // ===== 状态同步（主页胶囊 ↔ 本页） =====
  function saveState(patch) {
    if (!S) S = {};
    Object.assign(S, patch || {}, { ts: Date.now(), from: PID });
    try { localStorage.setItem(KEY_STATE, JSON.stringify(S)); } catch (e) {}
    if (bus) { try { bus.postMessage({ type: 'state', state: S, from: PID }); } catch (e) {} }
  }
  function saveQueue() {
    try {
      localStorage.setItem(KEY_QUEUE, JSON.stringify(queue.slice(0, 200)));
      localStorage.setItem(KEY_QI, String(qi));
    } catch (e) {}
  }
  function syncStateToTrack(st) {
    // 只同步播放/暂停，不打断本页自己的曲目选择
    if (!audio) return;
    if (st.playing && !audio.paused) return;
    if (!st.playing && !audio.paused) { silent = true; audio.pause(); silent = false; return; }
    if (st.playing && audio.paused && audio.src) { audio.play().catch(() => {}); }
  }
  function adopt(st) {
    if (!st || st.from === PID) return;
    S = st;
    syncStateToTrack(st);
    if (st.id && (!cur || String(cur.id) !== String(st.id))) {
      let t = queue.find(x => String(x.id) === String(st.id));
      if (!t) {
        t = { id: String(st.id), uid: String(st.uid || st.id), name: st.name || '未知歌曲',
              artist: st.artist || '', album: st.album || '', pic: st.pic || '',
              cover: st.cover || '', source: st.source || '',
              kgHashes: st.kgHashes || null, qqMid: st.qqMid || null };
        queue.splice(Math.min(qi, queue.length), 0, t);
      }
      cur = t;
      qi = Math.max(0, queue.indexOf(t));
      saveQueue();
      renderPlayerInfo();
      renderList();
    }
    renderPlayBtn();
    renderRowsState();
  }
  if (bus) bus.onmessage = (ev) => { const m = ev.data || {}; if (m.type === 'state' && m.state) adopt(m.state); };
  window.addEventListener('storage', (e) => {
    if (e.key !== KEY_STATE || !e.newValue) return;
    try { adopt(JSON.parse(e.newValue)); } catch (err) {}
  });

  // ===== 音频 =====
  const SVG_PLAY  = '<svg viewBox="0 0 24 24" width="26" height="26"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>';
  const SVG_PAUSE = '<svg viewBox="0 0 24 24" width="26" height="26"><path d="M6 5h4v14H6zM14 5h4v14h-4z" fill="currentColor"/></svg>';
  function ensureAudio() {
    if (audio) return audio;
    audio = new Audio();
    audio.preload = 'auto';
    audio.setAttribute('playsinline', '');
    audio.addEventListener('play', () => {
      renderPlayBtn();
      if (cur) saveState({ playing: true, pos: audio.currentTime || 0 });
      renderRowsState();
    });
    audio.addEventListener('pause', () => {
      renderPlayBtn();
      if (silent) return;
      if (cur) saveState({ playing: false, pos: audio.currentTime || 0 });
      renderRowsState();
    });
    audio.addEventListener('timeupdate', () => {
      if (!dragging) setBar(audio.currentTime, audio.duration);
      if (audio.paused || !cur) return;
      const now = Date.now();
      if (now - lastPosSave < 3000) return;
      lastPosSave = now;
      saveState({ pos: audio.currentTime || 0, dur: audio.duration || 0 });
    });
    audio.addEventListener('ended', () => {
      setBar(0, 0);
      // 按播放模式处理
      if (playMode === 'one') {
        try { audio.currentTime = 0; audio.play().catch(() => {}); } catch (e) {}
        return;
      }
      if (playMode === 'shuffle' && queue.length > 1) {
        let r = Math.floor(Math.random() * queue.length);
        if (qi === r) r = (r + 1) % queue.length;
        qi = r; cur = queue[qi]; saveQueue();
        playCurrent(0, true);
        return;
      }
      if (queue.length > 1) next();
      else saveState({ playing: false, pos: 0 });
    });
    audio.addEventListener('error', () => {
      if (!audio.src) return;
      toast('播放出错了，试试别的音质或歌曲');
      saveState({ playing: false });
      renderPlayBtn();
    });
    return audio;
  }
  function renderPlayBtn() {
    const playing = audio && !audio.paused && !audio.ended;
    $('btnPlay').innerHTML = playing ? SVG_PAUSE : SVG_PLAY;
  }

  // ===== JSONP 工具：绕过 CORS（用 <script> 标签加载，酷狗/QQ 老接口都支持） =====
  let jsonpSeq = 0;
  function jsonp(url, timeoutMs) {
    return new Promise((resolve) => {
      const cb = '__mmj' + (++jsonpSeq) + '_' + Math.random().toString(36).slice(2, 7);
      const script = document.createElement('script');
      let done = false;
      const finish = (data) => {
        if (done) return;
        done = true;
        try { script.remove(); } catch (e) {}
        try { delete window[cb]; } catch (e) { window[cb] = undefined; }
        resolve(data);
      };
      window[cb] = (data) => finish(data);
      script.onerror = () => finish(null);
      script.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'callback=' + cb;
      script.async = true;
      document.head.appendChild(script);
      setTimeout(() => finish(null), timeoutMs || 12000);
    });
  }

  // ===== 解析播放直链（多通道回退，前端不区分来源） =====
  function fixScheme(u) { return /^http:/i.test(u) ? u.replace(/^http:/i, 'https:') : u; }
  async function gdUrl(uid, br, source) {
    for (let tryN = 0; tryN < 2; tryN++) {
      try {
        const r = await fetch(GD + '?types=url&source=' + encodeURIComponent(source || 'netease') +
          '&id=' + encodeURIComponent(uid) + '&br=' + br + '&_=' + Date.now());
        if (!r.ok) { if (tryN === 0) await new Promise(res => setTimeout(res, 350)); continue; }
        const j = await r.json();
        if (!j || !j.url) { if (tryN === 0) await new Promise(res => setTimeout(res, 350)); continue; }
        return { url: fixScheme(j.url), br: Number(j.br) || br };
      } catch (e) { if (tryN === 0) await new Promise(res => setTimeout(res, 350)); }
    }
    return null;
  }
  async function vkeysUrl(uid, q) {
    try {
      const r = await fetch(VKEYS + '?id=' + encodeURIComponent(uid) + '&quality=' + q + '&_=' + Date.now());
      if (!r.ok) return null;
      const j = await r.json();
      const d = j && j.data;
      if (!d || !d.url) return null;
      return { url: fixScheme(d.url), br: parseInt(String(d.kbps || ''), 10) || (q === 4 ? 320 : 128) };
    } catch (e) { return null; }
  }
  // 酷狗：FileHash → meting 端点（直接返回音频流）；多 hash 变体逐个试
  async function kugouUrl(t, brParam) {
    if (!t || !t.kgHashes || !t.kgHashes.length) return null;
    for (const h of t.kgHashes) {
      const u = METING + '?server=kugou&type=url&id=' + encodeURIComponent(h) + (brParam ? '&br=' + brParam : '');
      try {
        const r = await fetch(u, { headers: { Range: 'bytes=0-15' }, signal: AbortSignal.timeout(15000) });
        const ct = r.headers.get('content-type') || '';
        if (r.ok && /audio|mpeg|octet-stream/i.test(ct)) {
          return { url: u, br: /br=999/.test(u) ? 999 : (parseInt(brParam, 10) || 320), hashTried: h };
        }
      } catch (e) {}
    }
    return null;
  }
  // QQ：songmid → vkeys（有 CORS）；只接受完整版，拒绝试听
  async function qqUrl(t, q) {
    if (!t || !t.qqMid) return null;
    try {
      const r = await fetch(VKEYS_QQ + '?mid=' + encodeURIComponent(t.qqMid) + '&quality=' + q + '&_=' + Date.now());
      if (!r.ok) return null;
      const j = await r.json();
      const d = j && j.data;
      if (!d || !d.url) return null;
      const br = parseInt(String(d.kbps || ''), 10) || 0;
      if (/试听/i.test(d.quality || '')) return null;   // 试听片段不要
      return { url: fixScheme(d.url), br };
    } catch (e) { return null; }
  }
  async function proxyUrl(uid, br) {
    if (!PROXY) return null;
    try {
      const r = await fetch(PROXY + '?id=' + encodeURIComponent(uid) + '&br=' + br + '&_=' + Date.now());
      if (!r.ok) return null;
      const j = await r.json();
      const d = j && (Array.isArray(j.data) ? j.data[0] : j.data);
      const u = (d && d.url) || (j && j.url);
      if (!u) return null;
      return { url: fixScheme(u), br: Number((d && d.br) || j.br) || br };
    } catch (e) { return null; }
  }
  const URL_TTL = 20 * 60 * 1000;   // 直链约 1~2 小时过期，缓存 20 分钟
  async function resolveUrl(t) {
    const key = (t.uid || t.id || (t.kgHashes || [])[0] || t.qqMid) + '|' + quality;
    const hit = urlCache.get(key);
    if (hit && Date.now() - hit.at < URL_TTL) return hit;
    const uid = t.uid || t.id;
    const chain = [];
    // 酷狗轨：FileHash 多变体 → meting
    if (t.kgHashes && t.kgHashes.length) {
      if (quality === 'loss') chain.push(() => kugouUrl(t, '999'));
      chain.push(() => kugouUrl(t, '320'), () => kugouUrl(t, '128'), () => kugouUrl(t, ''));
    }
    // QQ 轨：songmid → vkeys（只收完整版）
    if (t.qqMid) {
      if (quality === 'loss') chain.push(() => qqUrl(t, 6), () => qqUrl(t, 5));
      chain.push(() => qqUrl(t, 5), () => qqUrl(t, 4), () => qqUrl(t, 3));
    }
    // 网易云轨：GD 无损 → GD 320 → vkeys（保持原有逻辑不变）
    if (uid) {
      if (quality === 'loss') chain.push(() => gdUrl(uid, 999, t.source || 'netease'), () => gdUrl(uid, 740, t.source || 'netease'));
      chain.push(() => gdUrl(uid, 320, t.source || 'netease'));
      if (PROXY) chain.push(() => proxyUrl(uid, quality === 'loss' ? 999000 : 320000));
      if (quality === 'loss') chain.push(() => vkeysUrl(uid, 5));
      chain.push(() => vkeysUrl(uid, 4), () => gdUrl(uid, 128, t.source || 'netease'), () => vkeysUrl(uid, 2));
    }
    for (let i = 0; i < chain.length; i++) {
      const res = await chain[i]();
      if (res && res.url) { res.at = Date.now(); urlCache.set(key, res); return res; }
    }
    return null;
  }
  async function fetchPic(t, size) {
    if (!t) return '';
    if (t.cover) return fixScheme(t.cover);
    if (!t.pic) return '';
    const key = t.pic + '|' + (size || 300);
    if (picCache.has(key)) return picCache.get(key);
    try {
      const r = await fetch(GD + '?types=pic&source=' + encodeURIComponent(t.source || 'netease') +
        '&id=' + encodeURIComponent(t.pic) + '&size=' + (size || 300) + '&_=' + Date.now());
      if (!r.ok) return '';
      const j = await r.json();
      const u = (j && j.url) || '';
      if (u) picCache.set(key, u);
      return u;
    } catch (e) { return ''; }
  }

  // ===== 播放控制 =====
  async function playCurrent(pos, autoplay) {
    if (!cur) return;
    const a = ensureAudio();
    renderPlayerInfo();
    renderRowsState();
    loadCover();
    setBadge('');
    let res = await resolveUrl(cur);
    // 解析失败时，自动在同名候选中换一个版本再试（避免"晴天播放不了"）
    if (!res) {
      const alt = queue.filter(x => x !== cur && !x._dead &&
        (plain(x.name).includes(plain(cur.name)) || plain(cur.name).includes(plain(x.name))));
      for (const cand of alt) {
        res = await resolveUrl(cand);
        if (res) { cur = cand; qi = Math.max(0, queue.indexOf(cand)); renderPlayerInfo(); loadCover(); break; }
      }
    }
    if (!res) {
      toast('这首歌暂时解析不到，换一首试试');
      cur._dead = true;
      renderList();
      saveState({ playing: false });
      renderPlayBtn();
      return;
    }
    const actualBr = Number(res.br) || 0;
    if (quality === 'loss' && actualBr && actualBr < 740) toast('这首暂无无损，已用 ' + actualBr + 'K 播放');
    setBadge(actualBr >= 740 ? '无损' : (actualBr ? actualBr + 'K' : ''));
    // 把曲目解析信息一起存给主页胶囊，保证回到主页也能续播
    saveState({
      id: cur.id, uid: cur.uid || cur.id, name: cur.name, artist: cur.artist,
      album: cur.album || '', pic: cur.pic || '', cover: cur.cover || '', source: cur.source || '',
      kgHashes: cur.kgHashes || null, qqMid: cur.qqMid || null,
      playing: true, pos: Math.max(0, Number(pos) || 0)
    });
    a.src = res.url;
    // 先等元数据就绪再 seek；进度超出时长则从头播（避免 seek 越界导致听不到声音）
    let seekTo = Math.max(0, Number(pos) || 0);
    if (seekTo > 0) {
      const ok = await new Promise((resolve) => {
        let settled = false;
        const done = (v) => { if (settled) return; settled = true; a.removeEventListener('loadedmetadata', onMeta); resolve(v); };
        const onMeta = () => done(true);
        a.addEventListener('loadedmetadata', onMeta, { once: true });
        setTimeout(() => done(false), 5000);
      });
      if (ok && isFinite(a.duration) && a.duration > 0) {
        if (seekTo >= a.duration - 1) seekTo = 0;
        try { a.currentTime = seekTo; } catch (e) {}
      }
    }
    if (autoplay !== false) {
      try { await a.play(); } catch (e) {
        saveState({ playing: false });
        toast('浏览器拦了自动播放，点一下播放键');
      }
    }
    renderPlayBtn();
    renderRowsState();
    setBar(Math.max(0, Number(pos) || 0), a.duration);
    mediaSession();
  }
  function togglePlay() {
    if (!cur) { toast('先搜索并点一首歌吧'); return; }
    const a = ensureAudio();

      const same = !!(S && String(S.id) === String(cur.id));
      const pos = same ? Math.max(0, Number(S.pos) || 0) : 0;
      playCurrent(pos, true);
      return;
    }
    if (a.paused) { a.play().catch(() => toast('播放被拦截，再点一次')); }

  }

  async function mediaSession() {
    if (!('mediaSession' in navigator) || !cur) return;

      navigator.mediaSession.metadata = new MediaMetadata({
        title: cur.name || '', artist: cur.artist || '', album: cur.album || '丰稔季音乐',
        artwork: art ? [{ src: art, sizes: '300x300', type: 'image/jpeg' }] : []
      });
      navigator.mediaSession.setActionHandler('play', () => { if (audio && audio.paused) togglePlay(); });
      navigator.mediaSession.setActionHandler('pause', () => { if (audio && !audio.paused) audio.pause(); });
      navigator.mediaSession.setActionHandler('previoustrack', prev);
      navigator.mediaSession.setActionHandler('nexttrack', next);
      navigator.mediaSession.setActionHandler('seekto', (d) => {

      });
    } catch (e) {}
  }

  // ===== 搜索：多引擎聚合（前端不暴露来源，原唱优先、翻唱限流） =====
  function plain(s) { return String(s || '').replace(/[（(【\[].*?[）)】\]]/g, '').replace(/\s/g, '').toLowerCase(); }
  function trackKey(t) {
    return plain(t.name) + '|' + plain(t.artist).replace(/[\/、,&]/g, '');
  }
  // 判断是否为"原唱"：歌名不含翻唱标记，且歌手不是纯翻唱号
  const COVER_RE = /翻唱|cover|翻自|原唱|钢琴版|钢琴曲|吉他版|女声版|女生版|男声版|DJ版|伴奏|纯音乐|remix|live|现场|改编|对唱|清唱|消音|和声版|加速版|慢速版|烟嗓|3D|环绕|史诗版|史詩版|epic|古风版|说唱版|戏腔|情感版|治愈版|深情版|温柔版|氛围版|伤感版|萨克斯|串烧|合辑|片段|试听|铃声|彩铃|故事的小黄花|remake|ver\.?|版本/i;
  function isCover(t) { return COVER_RE.test(String(t.name || '')); }
  // 判断是否像"翻唱号/工作室"（非知名歌手）
  const FAKE_ARTIST_RE = /epx\s*music|prodreversed|studio|工作室|音乐台|电台|合辑|歌单|翻唱|cover|dj|remix|伴奏|纯音乐|网络歌手|佚名|群星/i;
  // 判断艺人是否为知名原唱歌手（白名单 + 常见特征）
  const FAMOUS_RE = /周杰伦|周杰倫|jay|陈奕迅|陳奕迅|eason|林俊杰|林俊傑|jj|薛之谦|薛之謙|邓紫棋|鄧紫棋|gem|李荣浩|李榮浩|毛不易|华晨宇|華晨宇|张杰|張傑|王菲|那英|孙燕姿|孫燕姿|梁静茹|梁靜茹|五月天|陈绮贞|陳綺貞|田馥甄|hebe|张惠妹|張惠妹|a-mei|蔡依林|jolin|王力宏|陶喆|陶吉吉|汪苏泷|汪蘇瀧|许嵩|許嵩|周深|张学友|張學友|刘德华|劉德華|beyond|beyond|信乐团|苏打绿|蘇打綠|朴树|樸樹|赵雷|趙雷|g.e.m|杨千嬅|楊千嬅|容祖儿|容祖兒|twins|she|s\.h\.e/i;

  // 引擎1：GD（曲库大、网易云轨，可无损）
  async function searchGD(kw, pg) {
    try {
      const r = await fetch(GD + '?types=search&source=netease&name=' + encodeURIComponent(kw) +
        '&count=30&pages=' + pg + '&_=' + Date.now());
      if (!r.ok) return [];
      const arr = await r.json();
      if (!Array.isArray(arr)) return [];
      return arr.map(t => ({
        id: String(t.id), uid: String(t.url_id || t.id),
        name: String(t.name || '未知歌曲'),
        artist: Array.isArray(t.artist) ? t.artist.join('/') : String(t.artist || '未知歌手'),
        album: String(t.album || ''), pic: String(t.pic_id || ''), source: 'netease'
      }));
    } catch (e) { return []; }
  }
  // 引擎2：同歌手其他歌曲（用歌手名再搜一次，只收确实是该歌手的）
  async function searchArtistMore(artist, kw) {
    if (!artist) return [];
    try {
      const r = await fetch(GD + '?types=search&source=netease&name=' + encodeURIComponent(artist) +
        '&count=24&pages=1&_=' + Date.now());
      if (!r.ok) return [];
      const arr = await r.json();
      if (!Array.isArray(arr)) return [];
      const want = plain(artist);
      return arr.filter(t => {
        const ar = Array.isArray(t.artist) ? t.artist.join('/') : String(t.artist || '');
        if (!plain(ar).includes(want)) return false;   // 必须是这位歌手的
        if (isCover(t)) return false;                  // 不要翻唱
        return true;
      }).map(t => ({
        id: String(t.id), uid: String(t.url_id || t.id),
        name: String(t.name || '未知歌曲'),
        artist: Array.isArray(t.artist) ? t.artist.join('/') : String(t.artist || '未知歌手'),
        album: String(t.album || ''), pic: String(t.pic_id || ''), source: 'netease', more: true
      }));
    } catch (e) { return []; }
  }
  // 引擎2：酷狗（JSONP 搜索绕过 CORS，收集多档 FileHash → meting 出真音频）
  async function searchKugou(kw) {
    try {
      const j = await jsonp('https://songsearch.kugou.com/song_search_v2?keyword=' + encodeURIComponent(kw) +
        '&page=1&pagesize=20&platform=WebFilter&userid=0&clienttime=0&mid=1');
      const lists = (j && j.data && j.data.lists) || [];
      return lists.map(t => {
        // 收集所有可用档位的 hash（去重、去空）
        const hs = [t.SQFileHash, t.HQFileHash, t.FileHash, t.ResFileHash]
          .map(h => String(h || '').toUpperCase())
          .filter((h, i, arr) => h && arr.indexOf(h) === i);
        const name = String(t.SongName || t.OriSongName || '').replace(/<\/?[^>]+>/g, '');
        const artist = String(t.SingerName || '').replace(/<\/?[^>]+>/g, '');
        const dur = Number(t.Duration || t.SQDuration || t.HQDuration || 0);
        return {
          id: 'kg_' + (hs[0] || Math.random().toString(36).slice(2)),
          name: name || '未知歌曲',
          artist: artist || '未知歌手',
          album: String(t.AlbumName || '').replace(/<\/?[^>]+>/g, ''),
          cover: t.Image ? String(t.Image).replace(/{size}/g, '400') : '',
          source: 'kugou',
          kgHashes: hs,
          dur: dur
        };
      }).filter(x => x.kgHashes.length > 0);
    } catch (e) { return []; }
  }
  // 引擎3：QQ（JSONP 搜索绕过 CORS，拿 songmid → vkeys 出完整版）
  async function searchQQ(kw) {
    try {
      const j = await jsonp('https://c.y.qq.com/soso/fcgi-bin/client_search_cp?w=' + encodeURIComponent(kw) +
        '&format=jsonp&n=20&p=1&cr=1&t=0');
      const list = (j && j.data && j.data.song && j.data.song.list) || [];
      return list.map(t => {
        const singer = (t.singer || []).map(s => s.name).join('/') || '未知歌手';
        return {
          id: 'qq_' + t.songmid,
          name: String(t.songname || '').replace(/<\/?[^>]+>/g, ''),
          artist: singer,
          album: String(t.albumname || '').replace(/<\/?[^>]+>/g, ''),
          cover: t.albummid ? 'https://y.gtimg.cn/music/photo_new/T002R300x300M000' + t.albummid + '.jpg' : '',
          source: 'qq',
          qqMid: String(t.songmid || ''),
          dur: Number(t.interval || 0)
        };
      }).filter(x => x.qqMid);
    } catch (e) { return []; }
  }
  async function doSearch(kw) {
    kw = (kw || '').trim();
    if (!kw) { toast('输入歌名或歌手再搜吧'); return; }
    lastKw = kw; page = 1;
    await loadPage(true);
  }
  async function loadPage(replace) {
    if (searching || !lastKw) return;
    searching = true;
    const token = ++lastSearchToken;
    const go = $('qGo');
    go.disabled = true; go.textContent = '搜索中…';
    try {
      const a = await searchGD(lastKw, page);
      if (token !== lastSearchToken) return;
      let all = a.slice();
      if (!all.length && page === 1) {
        const [b, c] = await Promise.all([searchKugou(lastKw), searchQQ(lastKw)]);
        if (token !== lastSearchToken) return;
        all = b.concat(c);
      }
      if (!all.length) {
        toast('没找到「' + lastKw + '」，换个关键词试试');
        return;
      }

      const kwParts = lastKw.trim().split(/\s+/);
      const songKw = plain(kwParts[0]);
      const artistHint = kwParts.length > 1 ? plain(kwParts.slice(1).join('')) : '';

      const seen = new Set();
      const exactMatch = [], looseMatch = [];
      for (const t of all) {
        const k = trackKey(t);
        if (seen.has(k)) continue;
        const pn = plain(t.name);
        if (!pn.includes(songKw)) continue;
        if (isCover(t)) continue;
        seen.add(k);
        if (pn === songKw) exactMatch.push(t);
        else looseMatch.push(t);
      }
      const SUSPECT_ARTIST_RE = /^(jay|jj|gem|eason|jolin|hebe|a-mei|jay\s*chou)$/i;
      const scoreOf = (t) => {
        let s = 0;
        const ar = String(t.artist || '');
        const pArt = plain(ar);
        if (artistHint && pArt.includes(artistHint)) s += 120;
        if (artistHint && SUSPECT_ARTIST_RE.test(ar.trim()) && !pArt.includes(artistHint)) s -= 60;
        if (FAMOUS_RE.test(ar)) s += 50;
        if (FAKE_ARTIST_RE.test(ar)) s -= 40;
        if (plain(t.name) === songKw) s += 20;
        const d = (t.dur && t.dur > 0 ? t.dur : 0);
        if (d && d < 120) s -= 35;
        return s;
      };
      const ranked = exactMatch.concat(looseMatch).sort((x, y) => scoreOf(y) - scoreOf(x));
      const hero = ranked[0] || null;      // 只展示这一首（原唱）
      const alts = ranked.slice(1, 6);      // 其余收进"展开更多版本"

      // 队列：主曲 + 该歌手其他歌（后续播放用）
      if (replace) {
        queue = hero ? [hero] : [];
        qi = 0;
        cur = hero;
      } else if (hero) {
        queue = queue.concat([hero]);
      }
      saveQueue();
      renderHero(hero, alts);
      renderList();

      // 异步补充该歌手其他歌曲 → 只进队列（不展示）
      const mainArtist = (hero && hero.artist) || '';
      if (mainArtist) {
        searchArtistMore(mainArtist.split('/')[0], lastKw).then((m) => {
          if (token !== lastSearchToken) return;
          const seenX = new Set(queue.map(x => trackKey(x)));
          const extra = m.filter(t => { const k = trackKey(t); if (seenX.has(k)) return false; seenX.add(k); return true; }).slice(0, 12);
          if (!extra.length) return;
          queue = queue.concat(extra);
          saveQueue();
        }).catch(() => {});
      }
    } catch (e) {
      if (token !== lastSearchToken) return;
      toast('搜索失败，稍后再试');
    }
    searching = false;
    go.disabled = false; go.textContent = '搜索';
  }

  // 收起搜索

  // ===== 列表渲染 =====
  const io = ('IntersectionObserver' in window)

  async function loadRowCover(img) {

  function eqHTML() {
    const playing = audio && !audio.paused && !audio.ended;
    return '<span class="eq' + (playing ? '' : ' off') + '"><i></i><i></i><i></i></span>';
  }
  function renderRowsState() {
    const rows = $('queueList').querySelectorAll('.mu-row');
    rows.forEach((r) => {
      const i = parseInt(r.dataset.i, 10);
      const isNow = cur && queue[i] && String(queue[i].id) === String(cur.id);
      r.classList.toggle('now', !!isNow);
    });
  }
  // 播放队列抽屉渲染
  function renderList() {
    const list = $('queueList');
    $('queueCount').textContent = queue.length ? queue.length + ' 首' : '';
    if (!queue.length) {
      list.innerHTML = '<div class="mu-empty">队列还是空的<br>搜一首歌就播吧 ♪</div>';
      return;
    }
    list.innerHTML = queue.map((t, i) => {
      const isNow = cur && String(t.id) === String(cur.id);
      return '<div class="mu-row' + (t._dead ? ' dead' : '') + (isNow ? ' now' : '') + '" data-i="' + i + '">' +
        '<div class="mu-tile t' + (i % 6 + 1) + '"><span>' + esc((t.name || '♪').trim().charAt(0) || '♪') + '</span></div>' +
        '<div class="mu-txt"><b>' + esc(t.name) + '</b><em>' + esc(t.artist) + (t.album ? ' · ' + esc(t.album) : '') + '</em></div>' +
        (isNow ? eqHTML() : '<span class="mu-playic"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M8 5v14l11-7z" fill="currentColor"/></svg></span>') +
        '</div>';
    }).join('');
  }
  // 队列点击 = 直接播放队列里的这首
  $('queueList').addEventListener('click', (e) => {
    const row = e.target.closest('.mu-row');
    if (!row) return;
    const i = parseInt(row.dataset.i, 10);
    const t = queue[i];
    if (!t) return;
    if (t._dead) { toast('这首解析不到'); return; }
    if (cur && String(t.id) === String(cur.id)) { togglePlay(); return; }
    cur = t; qi = i;
    saveQueue();
    playCurrent(0, true);
  });
  // 队列抽屉开关
  function openQueue() {
    $('queuePanel').classList.add('show');
    $('queueMask').classList.add('show');
    $('btnQueue').classList.add('on');
    renderList();
  }
  function closeQueue() {
    $('queuePanel').classList.remove('show');
    $('queueMask').classList.remove('show');
    $('btnQueue').classList.remove('on');
  }
  $('btnQueue').addEventListener('click', () => {
    if ($('queuePanel').classList.contains('show')) closeQueue(); else openQueue();
  });
  $('queueClose').addEventListener('click', closeQueue);
  $('queueMask').addEventListener('click', closeQueue);
  const BACKEND = 'https://api.mogoing.xyz';
  const FAV_GAME = 'music_love';
  const KEY_FAV_LOCAL = 'momusic_fav_local';
  let favItems = [];
  let favLoaded = false;

  function favUser() {
    try { return localStorage.getItem('blindbox_user') || ''; } catch (e) { return ''; }
  }
  function favPass() {
    try { return localStorage.getItem('blindbox_pass') || ''; } catch (e) { return ''; }
  }
  // 本地缓存（后端不可用时也能用）
  function loadFavLocal() {
    try { const a = JSON.parse(localStorage.getItem(KEY_FAV_LOCAL) || '[]'); if (Array.isArray(a)) favItems = a; } catch (e) {}
  }
  function saveFavLocal() {
    try { localStorage.setItem(KEY_FAV_LOCAL, JSON.stringify(favItems.slice(0, 200))); } catch (e) {}
  }
  async function loadFavorites() {
    loadFavLocal();
    renderFavList();
    const u = favUser(), p = favPass();
    if (!u || !p) { favLoaded = true; return; }
    try {
      const r = await fetch(BACKEND + '/api/save?username=' + encodeURIComponent(u) +
        '&password=' + encodeURIComponent(p) + '&game=' + FAV_GAME, { signal: AbortSignal.timeout(12000) });
      if (!r.ok) { favLoaded = true; return; }
      const j = await r.json();
      let data = j && j.save;
      if (typeof data === 'string') { try { data = JSON.parse(data); } catch (e) { data = null; } }
      if (data && Array.isArray(data.items) && data.items.length) {
        favItems = data.items;
        saveFavLocal();
        renderFavList();
      }
    } catch (e) {}
    favLoaded = true;
  }
  async function pushFavorites() {
    saveFavLocal();
    const u = favUser(), p = favPass();
    if (!u || !p) return false;
    try {
      const r = await fetch(BACKEND + '/api/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, password: p, game: FAV_GAME, data: { items: favItems.slice(0, 200) } }),
        signal: AbortSignal.timeout(12000)
      });
      const j = await r.json().catch(() => null);
      return !!(j && j.ok);
    } catch (e) { return false; }
  }
  function isFav(t) {
    if (!t) return false;
    const id = String(t.id || '');
    return favItems.some(x => String(x.id) === id);
  }
  function toFavObj(t) {
    return {
      id: String(t.id || ''), uid: String(t.uid || t.id || ''), name: String(t.name || ''),
      artist: String(t.artist || ''), album: String(t.album || ''), pic: String(t.pic || ''),
      cover: String(t.cover || ''), source: String(t.source || ''),
      kgHashes: t.kgHashes || null, qqMid: t.qqMid || null, ts: Date.now()
    };
  }
  async function toggleFav(t) {
    if (!t) return;
    const id = String(t.id || '');
    const i = favItems.findIndex(x => String(x.id) === id);
    if (i >= 0) {
      favItems.splice(i, 1);
      toast('已取消收藏');
    } else {
      favItems.unshift(toFavObj(t));
      toast('❤️ 已收藏');
    }
    renderFavList();
    renderList();
    const ok = await pushFavorites();
    if (!ok && favUser() && favPass()) toast('收藏已存本地（云端同步失败）');
  }
  function renderFavList() {
    const box = $('favList');
    if (!box) return;
    $('favCount').textContent = favItems.length ? favItems.length + ' 首' : '';
    if (!favItems.length) {
      box.innerHTML = '<div class="fav-empty">还没有收藏 · 点歌曲右边的 ♡ 就能收进来</div>';
      return;
    }
    box.innerHTML = favItems.map((t, i) => {
      const isNow = cur && String(t.id) === String(cur.id);
      return '<div class="mu-row' + (isNow ? ' now' : '') + '" data-fav="' + i + '">' +
        '<div class="mu-tile t' + (i % 6 + 1) + '"><span>' + esc((t.name || '♪').trim().charAt(0) || '♪') + '</span></div>' +
        '<div class="mu-txt"><b>' + esc(t.name) + '</b><em>' + esc(t.artist) + (t.album ? ' · ' + esc(t.album) : '') + '</em></div>' +
        '<div class="row-btns">' +
          '<button class="ico-btn fav-on" data-unfav="' + i + '" title="取消收藏">' + heartSVG(true, 18) + '</button>' +
          '<button class="q-play" data-favplay="' + i + '">' +
            '<svg viewBox="0 0 24 24" width="16" height="16"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>' +
          '</button>' +
        '</div></div>';
    }).join('');
  }
  $('favList').addEventListener('click', (e) => {
    const unf = e.target.closest('[data-unfav]');
    if (unf) {
      e.stopPropagation();
      const i = parseInt(unf.dataset.unfav, 10);
      const t = favItems[i];
      if (t) toggleFav(t);
      return;
    }
    const pl = e.target.closest('[data-favplay]');
    if (pl) {
      e.stopPropagation();
      const i = parseInt(pl.dataset.favplay, 10);
      const t = favItems[i];
      if (!t) return;
      // 收藏里的歌加入队列并播放
      if (!queue.some(x => String(x.id) === String(t.id))) queue.unshift(t);
      cur = t; qi = 0;
      saveQueue();
      playCurrent(0, true);
      return;
    }
    const row = e.target.closest('.mu-row');
    if (row && row.dataset.fav != null) {
      const i = parseInt(row.dataset.fav, 10);
      const t = favItems[i];
      if (!t) return;
      if (cur && String(t.id) === String(cur.id)) { togglePlay(); return; }
      if (!queue.some(x => String(x.id) === String(t.id))) queue.unshift(t);
      cur = t; qi = 0;
      saveQueue();
      playCurrent(0, true);
    }
  });
  // 收藏卡片展开/收起
  $('favHead').addEventListener('click', () => {
    const card = $('favCard');
    const willOpen = !card.classList.contains('open');
    card.classList.toggle('open');
    if (willOpen) {
      // 展开后滚动到能看见的位置，避免被底部播放器挡住
      setTimeout(() => {
        const pl = $('player');
        const pr = pl.getBoundingClientRect();
        const cr = card.getBoundingClientRect();
        const need = cr.bottom - (pr.top - 12);
        if (need > 0) window.scrollBy({ top: need + 16, behavior: 'smooth' });
      }, 360);
    }
  });

  // ============================================================
  // ===== 搜索抽屉折叠 =====
  // ============================================================
  $('muToggle').addEventListener('click', () => {
    const wrap = $('muSearchWrap');
    const folded = wrap.classList.toggle('folded');
    $('muToggle').classList.toggle('open', !folded);
  });

  // ============================================================
  // ===== 搜索提示词（自带歌手，字体小灰） =====
  // ============================================================
  // 常见歌曲 → 原唱歌手映射（离线秒出，也能点）
  const SONG_ARTIST_HINTS = {
    '晴天': '周杰伦', '稻香': '周杰伦', '七里香': '周杰伦', '告白气球': '周杰伦',
    '青花瓷': '周杰伦', '夜曲': '周杰伦', '简单爱': '周杰伦', '半岛铁盒': '周杰伦',
    '演员': '薛之谦', '丑八怪': '薛之谦', '认真的雪': '薛之谦', '起风了': '买辣椒也用券',
    '成都': '赵雷', '南方姑娘': '赵雷', '平凡之路': '朴树', '生如夏花': '朴树',
    '海阔天空': 'Beyond', '光辉岁月': 'Beyond', '真的爱你': 'Beyond',
    '红豆': '王菲', '匆匆那年': '王菲', '传奇': '王菲',
    '十年': '陈奕迅', '浮夸': '陈奕迅', '爱情转移': '陈奕迅', '孤勇者': '陈奕迅',
    '江南': '林俊杰', '曹操': '林俊杰', '小酒窝': '林俊杰', '修炼爱情': '林俊杰',
    '光年之外': '邓紫棋', '泡沫': '邓紫棋', '来自天堂的魔鬼': '邓紫棋',
    '模特': '李荣浩', '李白': '李荣浩', '年少有为': '李荣浩',
    '消愁': '毛不易', '像我这样的人': '毛不易', '平凡的一天': '毛不易',
    '夜空中最亮的星': '逃跑计划', '春天里': '汪峰', '怒放的生命': '汪峰',
    '小幸运': '田馥甄', '魔鬼中的天使': '田馥甄', '后来': '刘若英',
    '听海': '张惠妹', '记得': '张惠妹', '至少还有你': '林忆莲',
    '爱情三十六计': '蔡依林', '倒带': '蔡依林', '舞娘': '蔡依林',
    '勇气': '梁静茹', '可惜不是你': '梁静茹', '暖暖': '梁静茹',
    '洋葱': '杨宗纬', '其实都没有': '杨宗纬',
    '你是我的眼': '萧煌奇', '童话': '光良', '第一次': '光良',
    '朋友': '周华健', '花心': '周华健', '水手': '郑智化',
    '我的未来不是梦': '张雨生', '大海': '张雨生',
    '月亮代表我的心': '邓丽君', '甜蜜蜜': '邓丽君',
    '吻别': '张学友', '一千个伤心的理由': '张学友', '祝福': '张学友',
    '忘情水': '刘德华', '中国人': '刘德华', '冰雨': '刘德华',
    '练习': '刘若英', '为爱痴狂': '刘若英',
    '给自己': '张杰', '这,就是爱': '张杰', '逆战': '张杰',
    '穿越时空的思念': '张杰'
  };
  // 模糊：输入的部分文字能匹配到提示
  function findHints(kw) {
    const k = String(kw || '').trim();
    if (!k) return [];
    const out = [];
    const kk = plain(k);
    for (const song in SONG_ARTIST_HINTS) {
      const ps = plain(song);
      if (ps === kk) out.unshift({ song, artist: SONG_ARTIST_HINTS[song], exact: true });
      else if (ps.indexOf(kk) === 0 || ps.indexOf(kk) >= 0) out.push({ song, artist: SONG_ARTIST_HINTS[song], exact: false });
    }
    // 去重 + 最多 4 条，且优先完全匹配
    const seen = new Set();
    const res = [];
    for (const h of out) {
      const key = h.song;
      if (seen.has(key)) continue;
      seen.add(key);
      res.push(h);
      if (res.length >= 4) break;
    }
    return res;
    }
  function renderHints(kw) {
    const box = $('qHint');
    const hs = findHints(kw);
    if (!hs.length || plain(kw).length < 1) { box.classList.remove('on'); box.innerHTML = ''; return; }
    box.innerHTML = hs.map(h =>
      '<button class="hint-chip" data-song="' + esc(h.song) + '" data-artist="' + esc(h.artist) + '">' +
        '<span class="hc-song">' + esc(h.song) + '</span>' +
        '<span class="hc-artist">' + esc(h.artist) + '</span>' +
      '</button>'
    ).join('');
    box.classList.add('on');
  }
  $('qHint').addEventListener('click', (ev) => {
    const c = ev.target.closest('.hint-chip');
    if (!c) return;
    const song = c.dataset.song, artist = c.dataset.artist;
    $('q').value = song + ' ' + artist;
    $('qHint').classList.remove('on');
    doSearch(song + ' ' + artist);
  });
  let hintTimer = null;
  $('q').addEventListener('input', () => {
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => renderHints($('q').value), 260);
  });
  $('q').addEventListener('focus', () => renderHints($('q').value));

  // ============================================================
  // ===== 下一首播放（Q版加号） =====
  // ============================================================
  function insertNext(t) {
    if (!t) return;
    const id = String(t.id || '');
    if (queue.some(x => String(x.id) === id && x !== t)) {
      // 已在队列 → 挪到下一首
      const idx = queue.findIndex(x => String(x.id) === id);
      const [item] = queue.splice(idx, 1);
      const target = Math.max(0, cur ? queue.indexOf(cur) + 1 : 0);
      queue.splice(target, 0, item);
    } else {
      const copy = Object.assign({}, t);
      const target = Math.max(0, cur ? queue.indexOf(cur) + 1 : queue.length);
      queue.splice(target, 0, copy);
    }
    saveQueue();
    renderList();
    toast('已加入下一首播放');
  }


  // ===== 播放收藏全部 =====
  $('favPlayAll').addEventListener('click', (e) => {
    e.stopPropagation();
    if (!favItems.length) { toast('还没有收藏的歌'); return; }
    queue = favItems.slice();
    cur = queue[0]; qi = 0;
    saveQueue();
    renderList();
    playCurrent(0, true);
    toast('播放收藏 · ' + queue.length + ' 首');
  });

  // ===== 音质切换（点 320K 徽标） =====
  function renderBadge() {
    const b = $('pBadge');
    b.textContent = quality === 'loss' ? '无损' : '320K';
    b.classList.toggle('loss', quality === 'loss');
  }
  $('pBadge').addEventListener('click', async () => {
    quality = quality === 'loss' ? 'std' : 'loss';
    localStorage.setItem(KEY_Q, quality);
    renderBadge();
    if (cur && audio && audio.src) {
      const pos = audio.currentTime || 0;
      const wasPlaying = !audio.paused;
      await playCurrent(pos, wasPlaying);
      toast(quality === 'loss' ? '已切换无损音质' : '已切换标准音质');
    } else {
      toast(quality === 'loss' ? '无损音质已就绪' : '标准音质已就绪');
    }
  });

  // ===== 播放模式：顺序 / 单曲循环 / 随机 =====
  let playMode = localStorage.getItem('momusic_mode') || 'order';
  if (['order', 'one', 'shuffle'].indexOf(playMode) < 0) playMode = 'order';
  const MODE_ICONS = {
    order: '<svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 8h13M4 8l3-3M4 8l3 3" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M20 16H7M20 16l-3-3M20 16l-3 3" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>',
    one: '<svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 8h13M4 8l3-3M4 8l3 3" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M20 16H7M20 16l-3-3M20 16l-3 3" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/><text x="12" y="14.6" font-size="8" font-weight="900" text-anchor="middle" fill="currentColor">1</text></svg>',
    shuffle: '<svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 7h4l9 10h3M4 17h4l2.4-2.7M16 7h4M20 7l-2.4-2.4M20 7l-2.4 2.4M20 17l-2.4 2.4M20 17l-2.4-2.4" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>'
  };
  const MODE_NAME = { order: '顺序播放', one: '单曲循环', shuffle: '随机播放' };
  function renderMode() {
    $('btnLoop').innerHTML = MODE_ICONS[playMode];
    $('btnLoop').classList.toggle('on', playMode !== 'order');
    $('btnLoop').title = MODE_NAME[playMode];
  }
  $('btnLoop').addEventListener('click', () => {
    const arr = ['order', 'one', 'shuffle'];
    playMode = arr[(arr.indexOf(playMode) + 1) % 3];
    localStorage.setItem('momusic_mode', playMode);
    renderMode();
    toast(MODE_NAME[playMode]);
  });

  // ===== 启动：恢复上次状态 =====
  renderMode();
  renderBadge();
  renderPlayBtn();
  if (S && S.id && queue.length) {
    const idx = queue.findIndex((x) => String(x.id) === String(S.id));
    if (idx >= 0) { qi = idx; cur = queue[qi]; }
    else { cur = queue[qi]; }
  } else if (queue.length) {
    cur = queue[qi];
  }
  if (cur) {
    renderPlayerInfo();
    loadCover();
    setBar(Math.max(0, Number(S && S.pos) || 0), Number(S && S.dur) || 0);
    if (S && S.playing) playCurrent(Math.max(0, Number(S.pos) || 0), true);
  }
  renderList();
  renderFavList();
  loadFavorites();
  // 收藏卡片默认展开，方便一眼看到
  $('favCard').classList.add('open');
</script>
</body>
