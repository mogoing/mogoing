<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2EBDC">
<title>烩菜听歌每天好心情~</title>
<link rel="stylesheet" href="momusic/theme.css?v=43">
<script>
  // 旧地址兼容：momusic.html → momusic/momusic_index.html
  // 保留 query（含热更新 v= 参数），避免反复刷新
  (function(){
    var q = location.search || '';
    var to = 'momusic/momusic_index.html' + (q ? q : '');
    location.replace(to);
  })();
</script>
<style>
  /* 与新设计系统一致：纸底 + 直角 + 硬投影 */
  body{
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;text-align:center;padding:24px;
    background:var(--paper);
  }
  .box{
    position:relative;z-index:1;
    padding:26px 24px;
    border:var(--edge) solid var(--ink);
    background:var(--yellow);
    box-shadow:var(--sh-lg);
  }
  .box b{display:block;font-family:var(--serif);font-size:17px;font-weight:900;color:var(--ink)}
  .box em{display:block;font-style:normal;font-size:12.5px;font-weight:700;color:var(--ink-2);margin-top:8px;line-height:1.8}
  .box a{
    display:inline-block;margin-top:16px;padding:10px 22px;
    border:var(--edge) solid var(--ink);
    font-family:var(--serif);font-size:13.5px;font-weight:900;letter-spacing:1px;text-decoration:none;
    background:var(--ink);color:var(--paper);
    box-shadow:3px 3px 0 var(--paper);
  }
</style>
</head>
<body>
<div class="box">
  <b>🎵 正在前往新音乐页…</b>
  <em>音乐页面已升级到 <code>momusic/</code></em>
  <a href="momusic/momusic_index.html">手动进入</a>
</div>
</body>
</html>
