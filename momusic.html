<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF3E6">
<title>烩菜听歌每天好心情~</title>
<link rel="stylesheet" href="momusic/theme.css">
<script>
  // 旧地址兼容：momusic.html → momusic/momusic_index.html
  // 保留 query（含热更新 v= 参数），避免反复刷新
  (function(){
    var q = location.search || '';
    var to = 'momusic/momusic_index.html' + (q ? q : '');
    location.replace(to);
  })();
</script>
<style>
  body{
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;text-align:center;padding:24px;
  }
  .box{
    position:relative;z-index:1;
    padding:30px 26px;border-radius:26px;
    background:rgba(255,255,255,.85);
    box-shadow:0 18px 46px rgba(155,93,229,.22);
  }
  .box b{display:block;font-size:17px;font-weight:900;color:var(--ink)}
  .box em{display:block;font-style:normal;font-size:12.5px;font-weight:600;color:var(--muted);margin-top:8px;line-height:1.8}
  .box a{
    display:inline-block;margin-top:16px;padding:11px 24px;border-radius:999px;
    font-size:13.5px;font-weight:800;color:#fff;text-decoration:none;
    background:linear-gradient(135deg,var(--coral),var(--grape));
    box-shadow:0 6px 16px rgba(255,107,107,.34);
  }
</style>
</head>
<body>
<div class="mm-blobs"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>
<div class="box">
  <b>🎵 正在前往新音乐页…</b>
  <em>音乐页面已升级到 <code>momusic/</code></em>
  <a href="momusic/momusic_index.html">手动进入</a>
</div>
</body>
</html>
