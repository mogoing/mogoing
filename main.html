<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<!-- 禁止双击放大：iOS Safari 从 iOS 10 起忽略 user-scalable=no，真正生效的是 touch-action:manipulation（上下滚动、双指缩放照常可用） -->
<style>html,body{touch-action:manipulation;-webkit-text-size-adjust:100%}</style>
<title>立冬季 · 盲盒</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FFF9EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="烩菜">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23FFF9EE'/%3E%3Crect x='4' y='4' width='56' height='56' rx='16' fill='none' stroke='%235A4632' stroke-width='3' stroke-dasharray='1 0'/%3E%3Ctext x='32' y='45' font-size='36' font-weight='800' text-anchor='middle' fill='%23F2A65A'%3E%3F%3C/text%3E%3C/svg%3E">
<style>
  /* ============ 可爱手绘风：蜡笔 + 牛皮纸 + 歪歪扭扭 ============ */
  :root{
    --paper:#FAF1DE; --paper2:#F3E5C8;
    --ink:#5A4632; --ink2:#8A6F52;
    --pink:#FFB3C7; --yellow:#FFE08A; --mint:#A8E6CF; --blue:#A5D8FF; --purple:#D0BFFF; --orange:#FFC09E;
    --crayon-p:#F2789F; --crayon-y:#F2A65A; --crayon-m:#5FBF9A; --crayon-b:#5B9BD5; --crayon-v:#9B7BD8;
    --gap:clamp(14px,2vw,22px);
    /* 手绘不规整圆角：四组歪扭配方，浏览器会自动按比例收敛 */
    --wob-a:255px 15px 225px 15px / 15px 225px 15px 255px;
    --wob-b:15px 225px 15px 255px / 225px 15px 255px 15px;
    --wob-c:225px 15px 255px 15px / 15px 255px 15px 225px;
    --wob-d:15px 255px 15px 225px / 255px 15px 15px 225px;
    --hand:"Comic Sans MS","Chalkboard SE","Yuanti SC","YouYuan","幼圆","Microsoft YaHei",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    font-family:var(--hand);
    min-height:100vh;color:var(--ink);
    background-color:var(--paper);
    background-image:
      radial-gradient(rgba(90,70,50,.075) 1px, transparent 1.4px),
      radial-gradient(120% 60% at 50% -10%, rgba(255,214,120,.42), transparent 60%);
    background-size:22px 22px, 100% 100%;
    display:flex;flex-direction:column;align-items:center;
    padding:calc(18px + env(safe-area-inset-top)) clamp(14px,4vw,48px) 104px;overflow-x:hidden;
  }

  /* ===== 纸面涂鸦层：漂浮的小 doodle ===== */
  .doodles{position:fixed;inset:0;z-index:0;pointer-events:none}
  .doodles span{position:absolute;font-size:30px;line-height:1;opacity:.5;animation:dooFloat 9s ease-in-out infinite alternate}
  .doodles span:nth-child(1){left:4%;top:9%;color:var(--crayon-b);transform:rotate(-14deg)}
  .doodles span:nth-child(2){right:6%;top:16%;color:var(--crayon-p);font-size:24px;transform:rotate(12deg);animation-delay:-2s}
  .doodles span:nth-child(3){left:8%;top:38%;color:var(--crayon-y);font-size:26px;transform:rotate(8deg);animation-delay:-4s}
  .doodles span:nth-child(4){right:4%;top:46%;color:var(--crayon-m);font-size:34px;transform:rotate(-10deg);animation-delay:-6s}
  .doodles span:nth-child(5){left:5%;bottom:22%;color:var(--crayon-v);font-size:26px;transform:rotate(16deg);animation-delay:-3s}
  .doodles span:nth-child(6){right:8%;bottom:12%;color:var(--crayon-b);font-size:28px;transform:rotate(-8deg);animation-delay:-7s}
  .doodles span:nth-child(7){left:14%;top:22%;color:var(--crayon-p);font-size:22px;transform:rotate(-18deg);animation-delay:-1s}
  .doodles span:nth-child(8){right:14%;top:30%;color:var(--crayon-v);font-size:24px;transform:rotate(10deg);animation-delay:-5s}
  .doodles span:nth-child(9){left:10%;top:58%;color:var(--crayon-b);font-size:26px;transform:rotate(-6deg);animation-delay:-8s}
  .doodles span:nth-child(10){right:10%;top:64%;color:var(--crayon-y);font-size:22px;transform:rotate(14deg);animation-delay:-2.5s}
  .doodles span:nth-child(11){left:16%;bottom:8%;color:var(--crayon-m);font-size:24px;transform:rotate(-12deg);animation-delay:-6.5s}
  .doodles span:nth-child(12){right:18%;bottom:30%;color:var(--crayon-p);font-size:20px;transform:rotate(8deg);animation-delay:-4.5s}
  @keyframes dooFloat{from{margin-top:0}to{margin-top:-14px}}

  /* ===== 手绘抖动线条：SVG 湍流位移滤镜作用在"只画边框"的伪元素上 =====
     边框本体保持直线布局，视觉上的线由 ::after 画出并被滤镜扭成手描线 */
  .wob{position:relative}
  .wob > *{position:relative;z-index:1}
  .wob::after{
    content:"";position:absolute;inset:-1px;z-index:0;pointer-events:none;
    border:2.5px solid var(--ink);border-radius:inherit;
    filter:url(#wobA);
  }
  .wob-b::after{filter:url(#wobB)}
  .wob-c::after{filter:url(#wobC)}
  /* 细线档：小卡 / 图标底座 */
  .wob-thin::after{border-width:2px;inset:0}
  /* 需要内容浮在抖线之上的容器，显式声明 z-index */

  header{
    position:relative;z-index:3;width:100%;
    display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;
    flex-wrap:wrap;
  }
  .brand{display:flex;flex-direction:column;align-items:center;gap:5px;position:relative}
  /* logo 两角贴胶带（避开字面） */
  .brand::before,.brand::after{
    content:"";position:absolute;top:-11px;width:44px;height:15px;z-index:2;opacity:.75;
    background:rgba(255,224,138,.85);box-shadow:0 1px 3px rgba(90,70,50,.15);
  }
  .brand::before{left:-7%;transform:rotate(-10deg)}
  .brand::after{right:-7%;transform:rotate(9deg);background:rgba(255,179,199,.8)}
  .brand-logo{
    height:76px;width:auto;display:block;margin:0 auto;cursor:pointer;
    filter:saturate(1.15);
    transform:rotate(-1.2deg);
    transition:transform .2s;
  }
  .brand-logo:active{transform:rotate(-1.2deg) scale(.96)}
  .user{font-size:14px;font-weight:700;color:var(--ink2)}
  .top-right{display:flex;align-items:center;gap:10px;align-self:flex-start;flex:none}
  .top-icon{
    flex:none;width:60px;height:60px;padding:6px;cursor:pointer;
    background:#fff;border:none;border-radius:var(--wob-b);
    box-shadow:3px 4px 0 rgba(90,70,50,.18);
    transition:transform .15s,box-shadow .15s;
    display:flex;align-items:center;justify-content:center;position:relative;
    transform:rotate(2.4deg);
  }
  .top-icon + .top-icon{transform:rotate(-2.8deg)}
  .top-icon img{width:100%;height:100%;object-fit:contain;pointer-events:none}
  .top-icon:hover{transform:rotate(0) translateY(-2px)}
  .top-icon:active{transform:scale(.92);box-shadow:1px 2px 0 rgba(90,70,50,.18)}

  /* ===== 金币行 ===== */
  .wallet-row{
    position:relative;z-index:3;width:100%;
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    margin:0 0 6px;
  }
  .wallet{
    position:relative;z-index:1;display:flex;align-items:center;gap:9px;
    background:#fff;border-radius:var(--wob-a);padding:6px 10px 6px 7px;
    border:none;
    box-shadow:3px 4px 0 rgba(90,70,50,.18);
    margin:0 auto 0 0;
    transform:rotate(-1deg);
  }
  .wallet img{width:32px;height:32px;border-radius:50%;object-fit:cover;border:2px solid var(--crayon-y)}
  .wallet b{font-size:17px;color:var(--ink);min-width:28px;text-align:center}
  .wallet .recharge{
    flex:none;min-height:30px;padding:0 14px;cursor:pointer;
    font-family:var(--hand);font-size:13px;font-weight:900;color:#fff;
    background:var(--crayon-y);border:none;border-radius:var(--wob-c);
    box-shadow:2px 3px 0 rgba(90,70,50,.25);transition:transform .15s,box-shadow .15s;
  }
  .wallet .recharge:active{transform:translate(1px,2px);box-shadow:0 0 0 rgba(0,0,0,0)}

  /* ===== 音乐胶囊 ===== */
  .music-pill{
    flex:none;display:flex;align-items:center;gap:8px;width:158px;
    min-height:42px;padding:5px 6px 5px 13px;cursor:pointer;
    border:none;border-radius:var(--wob-d);
    background:#fff;
    box-shadow:3px 4px 0 rgba(90,70,50,.18);
    transition:transform .15s,box-shadow .15s;
    transform:rotate(1.1deg);
  }
  .music-pill:hover{transform:rotate(0) translateY(-2px)}
  .music-pill:active{transform:scale(.95);box-shadow:1px 2px 0 rgba(90,70,50,.18)}
  .mp-note{flex:none;font-size:17px;color:var(--crayon-v);transform:rotate(-8deg)}
  .music-pill.playing .mp-note{animation:noteBop .7s ease-in-out infinite}
  @keyframes noteBop{0%,100%{transform:rotate(-8deg) translateY(0)}50%{transform:rotate(6deg) translateY(-3px)}}
  .mp-name{
    flex:1;min-width:0;overflow:hidden;white-space:nowrap;
    font-size:13px;font-weight:900;color:var(--ink);
    user-select:none;-webkit-user-select:none;
  }
  .mp-in{display:inline-block;white-space:nowrap}
  .music-pill.scrolling .mp-in{animation:mpScroll var(--mp-dur,9s) linear infinite}
  @keyframes mpScroll{
    0%,10%{transform:translateX(0)}
    45%,55%{transform:translateX(calc(-1 * var(--mp-over,0px)))}
    90%,100%{transform:translateX(0)}
  }
  .mp-play{
    flex:none;width:30px;height:30px;border-radius:50%;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    color:#fff;background:var(--crayon-p);border:none;
    box-shadow:1.5px 2px 0 rgba(90,70,50,.3);
    transition:transform .15s;
  }
  .mp-play:active{transform:scale(.9)}
  .music-pill.busy .mp-play{animation:mpPulse 1s ease-in-out infinite}
  @keyframes mpPulse{50%{opacity:.45;transform:scale(.86)}}

  .hint{position:relative;z-index:3;font-size:14px;font-weight:700;color:var(--ink2);margin-bottom:18px}

  /* ===== 主容器：一张大纸 ===== */
  .stage-shell{
    position:relative;z-index:3;width:min(100%,1060px);
    margin-top:14px;
    border-radius:var(--wob-a);
    border:none;
    box-shadow:5px 6px 0 rgba(90,70,50,.14);
    background:rgba(255,255,255,.66);
    padding:clamp(14px,2.4vw,26px);
    transform:rotate(-.4deg);
  }
  .bottom-bar{
    width:auto;min-width:132px;align-self:center;
    margin-top:16px;
    padding:6px 20px;
    display:inline-flex;align-items:center;justify-content:center;
    border-radius:var(--wob-c);
    border:none;
    background:var(--paper2);
    box-shadow:3px 4px 0 rgba(90,70,50,.16);
    cursor:pointer;
    transform:rotate(1.2deg);
    transition:transform .15s,box-shadow .15s;
  }
  .bottom-bar:active{transform:translate(1px,2px);box-shadow:0 0 0 rgba(0,0,0,0)}
  .update-log{
    font-size:11px;font-weight:900;line-height:1.2;letter-spacing:2px;
    color:var(--ink2);
    user-select:none;white-space:nowrap;
  }
  .bottom-bar:hover .update-log{color:var(--crayon-p)}
  .stage{width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:calc(var(--gap) + 4px) var(--gap)}

  .toast{
    position:fixed;left:50%;top:14%;transform:translateX(-50%) translateY(-8px);
    background:#fff;color:var(--ink);font-size:14px;font-weight:900;
    border:none;border-radius:var(--wob-b);
    padding:10px 20px;z-index:40;opacity:0;transition:.3s;pointer-events:none;
    box-shadow:3px 4px 0 rgba(90,70,50,.2);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ===== 未读角标：红色蜡笔圆点 ===== */
  .badge{
    position:absolute;top:-8px;right:-7px;min-width:21px;height:21px;padding:0 5px;
    border-radius:50% 45% 55% 48%;background:var(--crayon-p);
    border:2px solid var(--ink);
    color:#fff;font-size:11px;font-weight:900;line-height:1;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--hand);pointer-events:none;
    transform:rotate(8deg);
  }

  /* ===== 底部手绘 Dock ===== */
  .dock{
    position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%) rotate(-.8deg);
    z-index:60;display:flex;gap:6px;padding:8px 12px;
    background:#fff;border:none;border-radius:var(--wob-a);
    box-shadow:4px 5px 0 rgba(90,70,50,.2);
  }
  .dock-btn{
    position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;
    min-width:56px;padding:6px 8px;border:0;border-radius:var(--wob-c);background:transparent;
    color:var(--ink);font-family:var(--hand);font-size:19px;line-height:1;cursor:pointer;transition:.15s;
  }
  .dock-btn span{font-size:10.5px;font-weight:900;letter-spacing:1px}
  .dock-btn:active{transform:scale(.9)}
  .dock-btn:hover{background:var(--paper2)}
  .dock-btn .badge{top:0;right:2px;min-width:17px;height:17px;font-size:10px}

  @media (max-width:560px){
    header{justify-content:space-between;gap:8px}
    .brand-logo{height:62px}
    .top-right{gap:8px}
    .top-icon{width:54px;height:54px}
    .wallet-row{gap:8px}
    .music-pill{width:146px}
    .stage-shell{padding:12px}
  }
  @media (max-width:360px){
    .music-pill{width:138px}
    .dock-btn{min-width:50px}
  }
  @media (min-width:761px){
    .music-pill{width:210px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* ===== 截图模式（?shot=1） ===== */
  html.shot .doodles{position:absolute}
  html.shot body{padding-bottom:28px}
  html.shot .dock{position:static;transform:rotate(-.5deg);margin:16px auto 4px;width:max-content}

  /* ===== APK 彩蛋 v2：螺丝帽 + 掉落螺丝/烟雾 + 物理重力（仅 APK，网页不生效） ===== */
  .screw{
    position:fixed;right:14px;bottom:86px;z-index:31;
    width:34px;height:34px;display:none;align-items:center;justify-content:center;
    cursor:pointer;user-select:none;-webkit-user-select:none;
    transition:transform .7s cubic-bezier(.25,1.3,.5,1),filter .2s;
    filter:drop-shadow(1px 2px 0 rgba(90,70,50,.3));
  }
  .screw img{width:30px;height:30px;object-fit:contain}
  .screw.show{display:flex}
  .screw:active{filter:brightness(.82)}
  .fall-screw{
    position:fixed;top:-46px;width:26px;height:26px;object-fit:contain;
    z-index:32;pointer-events:none;
    animation:fallDrop 1.1s cubic-bezier(.3,1.35,.45,1) forwards;
  }
  @keyframes fallDrop{
    0%{transform:translateY(0) rotate(0)}
    70%{transform:translateY(calc(100vh - 26px)) rotate(-300deg)}
    100%{transform:translateY(calc(100vh - 30px)) rotate(-300deg)}
  }
  .smoke{
    position:fixed;top:-40px;width:76px;height:76px;border-radius:50%;
    background:radial-gradient(circle, rgba(180,160,140,.5), rgba(180,160,140,.14) 60%, transparent 78%);
    filter:blur(5px);z-index:33;pointer-events:none;
    animation:smokeFall 2.3s ease-out forwards;
  }
  @keyframes smokeFall{
    0%{transform:translateY(0) scale(.55);opacity:0}
    22%{opacity:.85}
    100%{transform:translateY(calc(100vh - 46px)) scale(1.7);opacity:0}
  }

  /* ===== 资源预下载中心 ===== */
  #goDl{background:var(--crayon-m);box-shadow:2px 3px 0 rgba(90,70,50,.25);color:#fff}
  #goDl.done{background:var(--mint);color:var(--ink)}
  #dlMask{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;background:rgba(90,70,50,.35)}
  #dlMask.show{display:flex}
  #dlPanel{width:min(92vw,420px);max-height:82vh;background:var(--paper);border:none;border-radius:var(--wob-a);padding:18px 16px;box-shadow:6px 7px 0 rgba(90,70,50,.25);display:flex;flex-direction:column;gap:12px;overflow:hidden}
  #dlPanel h3{font-size:17px;color:var(--ink);display:flex;justify-content:space-between;align-items:center;flex:none}
  #dlPanel h3 button{border:2px solid var(--ink);background:var(--pink);color:var(--ink);font-size:15px;font-weight:800;width:30px;height:30px;border-radius:50% 45% 55% 48%;cursor:pointer}
  #dlTotal{height:14px;border-radius:8px;background:#EFE3CC;border:2px solid var(--ink);overflow:hidden;position:relative;flex:none}
  #dlTotal i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,var(--crayon-y) 0 8px,var(--pink) 8px 16px);transition:width .3s}
  #dlTotalT{font-size:12.5px;color:var(--ink2);text-align:right;margin-top:2px;flex:none}
  #dlRows{overflow-y:auto;display:flex;flex-direction:column;gap:8px;flex:1;padding-right:2px}
  .dlgroupcard{background:#fff;border:none;border-radius:var(--wob-c);padding:12px 13px;display:flex;flex-direction:column;gap:8px;box-shadow:2px 3px 0 rgba(90,70,50,.12)}
  .dlg-top{display:flex;align-items:center;gap:8px}
  .dlg-icon{font-size:17px;line-height:1;flex:none}
  .dlg-name{flex:1;min-width:0;font-size:13.5px;font-weight:900;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dlg-btn{flex:none;border:2px solid var(--ink);border-radius:var(--wob-b);padding:8px 18px;font-size:12.5px;font-weight:900;color:#fff;cursor:pointer;background:var(--crayon-m);box-shadow:2px 3px 0 rgba(90,70,50,.2);white-space:nowrap;font-family:var(--hand)}
  .dlg-btn:disabled{opacity:.65;pointer-events:none}
  .dlg-bar{height:8px;border-radius:5px;background:#EFE3CC;border:1.5px solid var(--ink);overflow:hidden}
  .dlg-bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,var(--crayon-y) 0 8px,var(--orange) 8px 16px);transition:width .3s}
  .dlg-meta{display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;color:var(--ink2)}

  /* ===== 左上角 Logo 抽屉菜单 ===== */
  #app{width:100%;display:flex;flex-direction:column;align-items:center;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
  body.menu-open #app{transform:translateX(66.66vw)}
  #menu{position:fixed;left:0;top:0;width:66.66vw;height:100vh;z-index:400;transform:translateX(-100%);
    transition:transform .35s cubic-bezier(.2,.8,.2,1);
    background:var(--paper2);
    border-right:2.5px solid var(--ink);
    display:flex;flex-direction:column;gap:12px;padding:26px 18px;
    box-shadow:8px 0 30px rgba(90,70,50,.25);overflow-y:auto}
  body.menu-open #menu{transform:translateX(0)}
  #menuMask{position:fixed;left:66.66vw;top:0;right:0;bottom:0;z-index:399;display:none}
  body.menu-open #menuMask{display:block}
  .menu-head{font-size:19px;font-weight:900;color:var(--ink);margin-bottom:4px;display:flex;align-items:center;gap:8px}
  .menu-head small{font-size:12px;color:var(--ink2);font-weight:700;margin-left:auto}
  .menu-logo{width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid var(--ink)}
  .menu-user{font-size:14px;color:var(--ink2);margin:-2px 0 10px 50px;font-weight:700}
  .menu-btn{display:flex;align-items:center;gap:10px;width:100%;height:52px;border:none;
    font-family:var(--hand);font-size:16px;font-weight:900;color:#fff;cursor:pointer;padding:0 16px;
    box-shadow:3px 4px 0 rgba(90,70,50,.2);transition:transform .15s,box-shadow .15s}
  .menu-btn:nth-child(odd){border-radius:var(--wob-a);transform:rotate(-.5deg)}
  .menu-btn:nth-child(even){border-radius:var(--wob-b);transform:rotate(.5deg)}
  .menu-btn:active{transform:translate(1px,2px);box-shadow:0 0 0 rgba(0,0,0,0)}
  .menu-btn.mint{background:var(--crayon-b)}
  .menu-btn.grape{background:var(--crayon-v)}
  .menu-btn.green{background:var(--crayon-m)}
  .menu-btn.coral{background:var(--crayon-y)}
  .menu-btn.red{background:var(--crayon-p)}

<script>
(function(){
  var VER_URL = 'https://mogoing.github.io/mogoing/version.json';
  if (!window.fetch) return;
  fetch(VER_URL, {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(j){
    var ver = String((j && j.v) || 0);
    try {
      var old = localStorage.getItem('mogoing_ver');
      if (old !== ver) {
        localStorage.setItem('mogoing_ver', ver);
        var p = location.pathname;
        var q = location.search || '';
        var sep = q.indexOf('?') >= 0 ? '&' : '?';
        location.replace(p + q + sep + 'v=' + ver);
      }
    } catch(e){}
  }).catch(function(){});
})();
</script>

  // ===== 留言板未读角标：有未读留言显示红圈条数，全部已读后消失 =====
  const boardBadge = document.getElementById('boardBadge');
  async function loadBoardBadge(){
    if (!boardBadge) return;
    try {
      const r1 = await fetch(API + '/api/messages', { signal: AbortSignal.timeout(8000) });
      const d1 = await r1.json();
      if (!d1 || !d1.ok) throw new Error();
      const all = d1.messages || [];

      let readIds = [];
      if (!offline && user && pass) {
        try {
          const r2 = await fetch(API + '/api/save?username=' + encodeURIComponent(user) + '&password=' + encodeURIComponent(pass) + '&game=board_read', { signal: AbortSignal.timeout(8000) });
          const d2 = await r2.json();
          if (d2 && d2.ok && d2.save && Array.isArray(d2.save.read)) readIds = d2.save.read;
        } catch(e2){}
      }
      const unread = all.filter(m => m.id != null && readIds.indexOf(m.id) === -1).length;
      if (unread > 0) { boardBadge.textContent = unread > 99 ? '99+' : unread; boardBadge.style.display = 'flex'; }

  // ===== 渲染游戏墙（v4：觉醒射手座 · 食梦紫罗 · 安琪拉试验机） =====

    // ---- 食梦紫罗：中间 3 个，横向 4:3 ----
    const treasureSec = document.createElement('div');

    midRow.className = 'mid-row';

      const g = GAMES.filter(x => x.name === name)[0];

      el.innerHTML =
        '<div class="m-in">' +
          '<span class="mi-ic">' + (ICONS[g.icon] || '') + '</span>' +
          '<span class="mi-main"><span class="mi-name">' + g.name + '</span>' +
          '<span class="mi-desc">' + (g.desc || '') + '</span></span>' +
        '</div>';
      el.addEventListener('click', () => location.href = g.target);
      midRow.appendChild(el);

    const midFrame = document.createElement('div');
    midFrame.className = 'sec-frame';
    midFrame.appendChild(midRow);

    // ---- 安琪拉试验机：其余游戏小卡 ----
    const rest = GAMES.filter(g => FEATURED.indexOf(g.name) < 0 && TREASURE.indexOf(g.name) < 0);

      });
      moreGrid.appendChild(el);

    const moreFrame = document.createElement('div');

  document.getElementById('logout').addEventListener('click', () => {
    localStorage.removeItem('blindbox_user');
    localStorage.removeItem('blindbox_pass');
    localStorage.removeItem('blindbox_manager');
    localStorage.removeItem('blindbox_coins');
    localStorage.removeItem('blindbox_offline');
    localStorage.setItem('blindbox_logout', '1');   /* 刚退出：登录页这次不要自动登录，避免被带回主页 */
    location.href = 'index.html';
  });

  // 功能入口
  document.getElementById('goRecharge').addEventListener('click', () => location.href = 'recharge.html');
  document.getElementById('goBoard').addEventListener('click', () => location.href = 'board.html#messages');
  document.getElementById('goDiary').addEventListener('click', () => location.href = 'board.html#diary');

  document.getElementById('goNews').addEventListener('click', () => location.href = 'news.html');
  document.getElementById('goEmails').addEventListener('click', () => location.href = 'email.html');
  // 底部更新日志
  document.getElementById('goChangelog').addEventListener('click', () => location.href = 'changelog.html');
  // 管理员专属：显示管理后台入口，隐藏"我的日记"（管理员界面不要我的日记）
  if (manager) {
    const adminBtn = document.getElementById('goAdmin');
    if (adminBtn) {
      adminBtn.style.display = '';
      adminBtn.addEventListener('click', () => location.href = 'admin.html');

    const diaryBtn = document.getElementById('goDiary');

  let toastTimer = null;
  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>t.classList.remove('show'), 1600);
  }

  // ===== 音乐胶囊：右上角迷你播放器（与 momusic.html 通过 localStorage + BroadcastChannel 同步） =====
  const MC_KEY = 'momusic_state_v1';
  const MC_PID = 'main-' + Math.random().toString(36).slice(2, 9);
  const MC_API = 'https://music-api.gdstudio.xyz/api.php';
  const MC_VKEYS = 'https://api.vkeys.cn/v2/music/netease';
  const MC_VKEYS_QQ = 'https://api.vkeys.cn/v2/music/tencent';
  const MC_METING = 'https://api.qijieya.cn/meting/';
  const musicPill = document.getElementById('musicPill');
  const mpName = document.getElementById('mpName');
  const mpIn = document.getElementById('mpIn');
  const mpPlay = document.getElementById('mpPlay');
  const MC_SVG_PLAY  = '<svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>';
  const MC_SVG_PAUSE = '<svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z" fill="currentColor"/></svg>';
  let mcState = null;
  try { mcState = JSON.parse(localStorage.getItem(MC_KEY) || 'null'); } catch (e) { mcState = null; }
  let mcAudio = null, mcSilent = false, mcBusy = false;
  const mcBus = ('BroadcastChannel' in window) ? new BroadcastChannel('momusic') : null;

  function mcSave(patch) {
    if (!mcState) mcState = {};
    Object.assign(mcState, patch || {}, { ts: Date.now(), from: MC_PID });
    try { localStorage.setItem(MC_KEY, JSON.stringify(mcState)); } catch (e) {}
    if (mcBus) { try { mcBus.postMessage({ type: 'state', state: mcState, from: MC_PID }); } catch (e) {} }
  }
  function mcRender() {
    const st = mcState || {};
    mpIn.textContent = st.name || '音乐';
    mpPlay.innerHTML = st.playing ? MC_SVG_PAUSE : MC_SVG_PLAY;
    musicPill.classList.remove('scrolling');
    requestAnimationFrame(() => requestAnimationFrame(() => {
      const over = mpIn.scrollWidth - mpName.clientWidth;
      if (over > 4) {
        mpIn.style.setProperty('--mp-over', (over + 10) + 'px');
        mpIn.style.setProperty('--mp-dur', Math.max(6, Math.min(18, Math.round(mpIn.scrollWidth / 20))) + 's');
        musicPill.classList.add('scrolling');
      }
    }));
  }
  function mcAdopt(st) {
    if (!st || st.from === MC_PID) return;
    mcState = st;
    // 别的页面接管了播放：本地正在播的话静音停下，交给它播
    if (mcAudio && !mcAudio.ended && !mcAudio.paused) {
      mcSilent = true; mcAudio.pause(); mcSilent = false;
    }
    mcRender();
  }
  if (mcBus) mcBus.onmessage = (ev) => { const m = ev.data || {}; if (m.type === 'state' && m.state) mcAdopt(m.state); };
  window.addEventListener('storage', (e) => {
    if (e.key !== MC_KEY || !e.newValue) return;
    try { mcAdopt(JSON.parse(e.newValue)); } catch (err) {}
  });
  // 通知原生壳（APK）：播放时才拉起通知栏服务，带上当前歌名
  function mcNativeMedia(on) {
    try {
      if (typeof AndroidBridge === 'undefined' || !AndroidBridge) return;
      if (on) {
        if (AndroidBridge.mediaStart) {
          AndroidBridge.mediaStart((mcState && mcState.name) || '烩菜听歌',
                                   (mcState && mcState.artist) || '');
        }
      } else {
        if (AndroidBridge.mediaStop) AndroidBridge.mediaStop();
      }
    } catch (e) {}
  }
  // 供 APK 通知栏按钮回调（主页只有迷你播放器，无队列）
  window.mmTogglePlay = function () { try { mcToggle(); } catch (e) {} };
  window.mmPause = function () { try { if (mcAudio && !mcAudio.paused) mcAudio.pause(); } catch (e) {} };
  window.mmPlay  = function () { try { if (mcAudio && mcAudio.paused) mcAudio.play().catch(function(){}); } catch (e) {} };
  // 主页没有队列：下一首/上一首 去音乐页处理
  window.mmNext = function () { try { location.href = 'momusic/momusic_index.html'; } catch (e) {} };
  window.mmPrev = function () { try { location.href = 'momusic/momusic_index.html'; } catch (e) {} };
  function mcEnsureAudio() {
    if (mcAudio) return mcAudio;
    mcAudio = new Audio();
    mcAudio.preload = 'auto';
    mcAudio.addEventListener('play', () => { mcNativeMedia(true); mcSave({ playing: true }); mpPlay.innerHTML = MC_SVG_PAUSE; });
    mcAudio.addEventListener('pause', () => {
      mcNativeMedia(false);
      if (mcSilent) return;
      mcSave({ playing: false, pos: mcAudio.currentTime || 0 });
      mpPlay.innerHTML = MC_SVG_PLAY;
    });
    mcAudio.addEventListener('timeupdate', () => {
      if (mcAudio.paused) return;
      const now = Date.now();
      if (!mcState || now - (mcState._st || 0) < 3000) return;
      mcState._st = now;
      mcSave({ pos: mcAudio.currentTime || 0 });
    });
    mcAudio.addEventListener('ended', () => { mcSave({ playing: false, pos: 0 }); });
    mcAudio.addEventListener('error', () => { musicPill.classList.remove('busy'); });
    return mcAudio;
  }
  async function mcResolveUrl(st) {
    // 酷狗轨：多 hash 变体 → meting 端点
    if (st.kgHashes && st.kgHashes.length) {
      for (let i = 0; i < st.kgHashes.length; i++) {
        try {
          const u = MC_METING + '?server=kugou&type=url&id=' + encodeURIComponent(st.kgHashes[i]);
          const r = await fetch(u, { headers: { Range: 'bytes=0-15' } });
          const ct = r.headers.get('content-type') || '';
          if (r.ok && /audio|mpeg|octet-stream/i.test(ct)) return u;
        } catch (e) {}
      }
    }
    // QQ 轨：songmid → vkeys（拒绝试听）
    if (st.qqMid) {
      const qs = st.quality === 'loss' ? [6, 5, 4] : [5, 4, 3];
      for (let i = 0; i < qs.length; i++) {
        try {
          const r = await fetch(MC_VKEYS_QQ + '?mid=' + encodeURIComponent(st.qqMid) + '&quality=' + qs[i] + '&_=' + Date.now());
          if (!r.ok) continue;
          const j = await r.json();
          const d = j && j.data;
          if (!d || !d.url) continue;
          if (/试听/i.test(d.quality || '')) continue;
          return String(d.url).replace(/^http:/i, 'https:');
        } catch (e) {}
      }
    }
    // 网易云轨：GD → vkeys
    const uid = st.uid || st.id;
    if (!uid) return '';
    const brs = st.quality === 'loss' ? [999, 740, 320, 128] : [320, 192, 128];
    for (let i = 0; i < brs.length; i++) {
      for (let tryN = 0; tryN < 2; tryN++) {
        try {
          const r = await fetch(MC_API + '?types=url&source=' + encodeURIComponent(st.source || 'netease') +
            '&id=' + encodeURIComponent(uid) + '&br=' + brs[i] + '&_=' + Date.now());
          if (!r.ok) continue;
          const j = await r.json();
          if (j && j.url) return j.url.replace(/^http:/i, 'https:');
        } catch (e) {}
      }
    }
    // vkeys 兜底（有 CORS 的第三方解析，320k）
    try {
      const r = await fetch(MC_VKEYS + '?id=' + encodeURIComponent(uid) + '&quality=4&_=' + Date.now());
      if (r.ok) {
        const j = await r.json();
        const u = j && j.data && j.data.url;
        if (u) return String(u).replace(/^http:/i, 'https:');
      }
    } catch (e) {}
    return '';
  }
  // 从本地收藏里取第一首（主页直接点播放时用）
  function mcFirstFav() {
    try {
      const fav = JSON.parse(localStorage.getItem('momusic_fav_local') || '[]');
      if (Array.isArray(fav) && fav.length) return fav[0];
    } catch (e) {}
    return null;
  }
  async function mcStart() {
    let st = mcState;
    // 没有正在播的歌 → 直接播收藏里的第一首
    if (!st || !st.id || !st.name) {
      const fav = mcFirstFav();
      if (fav && fav.id) {
        st = {
          id: fav.id, uid: fav.uid || fav.id, name: fav.name, artist: fav.artist,
          album: fav.album || '', pic: fav.pic || '', cover: fav.cover || '', source: fav.source || '',
          kgHashes: fav.kgHashes || null, qqMid: fav.qqMid || null,
          playing: true, pos: 0
        };
        mcState = st;
      } else {
        toast('还没有收藏的歌，去音乐页搜一首吧');
        location.href = 'momusic/momusic_index.html';
        return;
      }
    }
    if (mcBusy) return;
    mcBusy = true;
    const a = mcEnsureAudio();
    musicPill.classList.add('busy');
    try {
      const url = await mcResolveUrl(st);
      if (!url) { toast('这首歌暂时解析不到，去音乐页换一首吧'); mcSave({ playing: false }); mcRender(); return; }
      a.src = url;
      // 先等元数据就绪再 seek，否则 seek 会被丢弃
      const seekTo = Math.max(0, Number(st.pos) || 0);
      if (seekTo > 0) {
        const ready = await new Promise((resolve) => {
          let settled = false;
          const done = (v) => { if (settled) return; settled = true; resolve(v); };
          a.addEventListener('loadedmetadata', () => done(true), { once: true });
          setTimeout(() => done(false), 4000);
        });
        if (ready) { try { a.currentTime = seekTo; } catch (e) {} }
      }
      try { await a.play(); } catch (e) { mcSave({ playing: false }); }
      mcRender();
    } finally {
      mcBusy = false;
      musicPill.classList.remove('busy');
    }
  }

  const IS_APK = (typeof AndroidBridge !== 'undefined' && AndroidBridge.getGravityX) || new URLSearchParams(location.search).get('easter') === '1'; // ?easter=1 调试彩蛋

    // 掉落特效：7 个螺丝 + 烟雾从顶部掉下
    function fallFX(){

    // 物理重力 v3：盲盒快照克隆脱离（整盒视觉带走），按钮直接脱离；碰撞不重叠，四边空气墙
            function startPhysics(){
      const vw = innerWidth, vh = innerHeight;
      const items = [];
      // 1) 顶部按钮：全部脱离（数量少，不占地方）
      [...document.querySelectorAll('.wallet, .logout, .fun-btn')].forEach(el => {
        const r = el.getBoundingClientRect();
        el.style.transition = 'none';
        el.style.position = 'fixed';
        el.style.left = r.left + 'px';
        el.style.top = r.top + 'px';
        el.style.width = r.width + 'px';
        el.style.height = r.height + 'px';
        el.style.margin = '0';
        el.style.zIndex = '20';
        items.push({ el, x: r.left, y: r.top, w: r.width, h: r.height, vx: 0, vy: 0 });
      });
      // 2) 盲盒：只随机挑 5~7 个快照克隆脱离，其余留在架上
      const boxes = [...document.querySelectorAll('.box')];
      const n = 5 + Math.floor(Math.random() * 3);   // 5~7 个
      const chosen = [];
      while (chosen.length < n && boxes.length) {
        const idx = Math.floor(Math.random() * boxes.length);
        chosen.push(boxes.splice(idx, 1)[0]);
      }
      chosen.forEach(box => {
        const r = box.getBoundingClientRect();
        const clone = document.createElement('div');
        clone.className = box.className;      // 保留 box b1~b6 open 等类 → 内部视觉全部继承
        clone.innerHTML = box.innerHTML;      // lid/body/ribbon/reveal 整体带走
        clone.style.position = 'fixed';
        clone.style.left = r.left + 'px';
        clone.style.top = r.top + 'px';
        clone.style.width = r.width + 'px';
        clone.style.height = r.height + 'px';
        clone.style.margin = '0';
        clone.style.zIndex = '20';
        clone.style.animation = 'none';       // 停掉入场动画，不依赖它
        clone.style.transition = 'none';
        clone.style.opacity = '1';            // 强制可见（修复消失 bug）
        clone.style.transform = 'none';
        clone.style.visibility = 'visible';
        // 点击功能跟随：先同步打开视觉，再触发原盒子的逻辑（开盒/跳转）
        clone.addEventListener('click', () => {
          if (!box.classList.contains('open')) clone.classList.add('open');
          box.click();
        });
        document.body.appendChild(clone);
        // 原件：固定到原位并隐藏（不再占布局）
        box.style.animation = 'none';
        box.style.transition = 'none';
        box.style.position = 'fixed';
        box.style.left = r.left + 'px';
        box.style.top = r.top + 'px';
        box.style.width = r.width + 'px';
        box.style.height = r.height + 'px';
        box.style.margin = '0';
        box.style.opacity = '0';
        box.style.pointerEvents = 'none';
        items.push({ el: clone, x: r.left, y: r.top, w: r.width, h: r.height, vx: 0, vy: 0 });
      });
      if (!items.length) return;
      // 物理循环：真实重力方向 + 空气墙 + 碰撞回弹 + 摇一摇冲量
      let stop = false, last = performance.now(), lastShake = 0;
      function loop(now){
        if (stop) return;
        const dt = Math.min(0.05, (now - last) / 1000);
        last = now;
        let gx = 0, gy = 0, gz = 0;
        try { gx = AndroidBridge.getGravityX(); gy = AndroidBridge.getGravityY(); gz = AndroidBridge.getGravityZ(); } catch (e) {}
        if (!isFinite(gx)) gx = 0;
        if (!isFinite(gy)) gy = 0;
        if (!isFinite(gz)) gz = 0;
        // 真实重力：手机正放(gy≈+9.8)→下沉；头朝下(gy≈-9.8)→上浮；左倾(gx≈+9.8)→向左
        const ax = -Math.max(-1, Math.min(1, gx / 9.8)) * 0.6;
        const ay =  Math.max(-1, Math.min(1, gy / 9.8)) * 0.6;
        // 摇一摇检测：总加速度明显大于 1g → 随机冲量碰撞回弹
        const mag = Math.sqrt(gx * gx + gy * gy + gz * gz);
        if (mag > 13.5 && now - lastShake > 400) {
          lastShake = now;
          for (const it of items) {
            it.vx += (Math.random() - 0.5) * 7;
            it.vy += (Math.random() - 0.5) * 7;
          }
        }
        // 更新位置（带阻尼）
        for (const it of items) {
          it.vx = (it.vx + ax * dt * 60) * 0.90;
          it.vy = (it.vy + ay * dt * 60) * 0.90;
          it.x += it.vx * dt * 60;
          it.y += it.vy * dt * 60;
          // 空气墙：屏幕四边挡住，不滑出
          if (it.x < 0) { it.x = 0; it.vx = 0; }
          if (it.x + it.w > vw) { it.x = vw - it.w; it.vx = 0; }
          if (it.y < 0) { it.y = 0; it.vy = 0; }
          if (it.y + it.h > vh) { it.y = vh - it.h; it.vy = 0; }
          it.el.style.left = it.x + 'px';
          it.el.style.top = it.y + 'px';
        }
        // 碰撞解算：两轮迭代推开 + 速度回弹（摇一摇时互相弹开）
        for (let iter = 0; iter < 2; iter++) {
          for (let i = 0; i < items.length; i++) {
            for (let j = i + 1; j < items.length; j++) {
              const a = items[i], b = items[j];
              const dx = (b.x + b.w / 2) - (a.x + a.w / 2);
              const dy = (b.y + b.h / 2) - (a.y + a.h / 2);
              const ox = (a.w + b.w) / 2 - Math.abs(dx);
              const oy = (a.h + b.h) / 2 - Math.abs(dy);
              if (ox > 0 && oy > 0) {
                if (ox < oy) {
                  const dir = dx >= 0 ? 1 : -1;
                  a.x -= dir * ox / 2; b.x += dir * ox / 2;
                  a.vx = -a.vx * 0.55; b.vx = -b.vx * 0.55;   // 水平回弹
                } else {
                  const dir = dy >= 0 ? 1 : -1;
                  a.y -= dir * oy / 2; b.y += dir * oy / 2;
                  a.vy = -a.vy * 0.55; b.vy = -b.vy * 0.55;   // 垂直回弹
                }
                a.el.style.left = a.x + 'px'; a.el.style.top = a.y + 'px';
                b.el.style.left = b.x + 'px'; b.el.style.top = b.y + 'px';
              }
            }
          }
        }
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    }
  }

/* 三组，每组打包成一行，手动点「下载」 */
var DL_GROUP_NAMES = { flash:'Flash 游戏（愤怒的小鸟 / 保卫萝卜）', ctr2:'割绳子', wmw:'小鳄鱼爱洗澡', kart:'纸卡丁车' };
var DL_GROUP_ICON = { flash:'🐦', ctr2:'🍬', wmw:'🐊', kart:'🏎️' };
function dlGroupOf(x){
  var pth = x[0], nm = x[2];
  if (/^kagit-kart\//.test(pth)) return 'kart';
  if (/^ab\/wmw\//.test(pth) || nm.indexOf('小鳄鱼') === 0) return 'wmw';
  if (/^ab\/ctr2\//.test(pth) || nm.indexOf('割绳子') === 0) return 'ctr2';
  return 'flash';
}
var dlGroups = {};
DL_LIST.forEach(function(x){
  var gid = dlGroupOf(x);
  var g = dlGroups[gid] || (dlGroups[gid] = { id:gid, name:DL_GROUP_NAMES[gid], icon:DL_GROUP_ICON[gid] || '📦', items:[], total:0, got:0, busy:false });
  g.items.push({ url:x[0], size:x[1] });
  g.total += x[1];
});

Object.keys(dlGroups).forEach(function(gid){
  var g = dlGroups[gid];
  var row = document.createElement('div');
  row.className = 'dlgroupcard';
  row.innerHTML =
    '<div class="dlg-top">' +
      '<span class="dlg-icon">' + g.icon + '</span>' +
      '<span class="dlg-name">' + g.name + '</span>' +
      '<button class="dlg-btn">下载</button>' +
    '</div>' +
    '<div class="dlg-bar"><i></i></div>' +
    '<div class="dlg-meta"><span class="dlg-size">0MB / ' + fmtMB(g.total) + '</span><span class="dlg-pct">0%</span></div>';
  dlRows.appendChild(row);
  g.row = row;
  g.btn = row.querySelector('.dlg-btn');
  g.bar = row.querySelector('.dlg-bar i');
  g.st = row.querySelector('.dlg-size');
  g.pct = row.querySelector('.dlg-pct');
  g.btn.addEventListener('click', function(){ dlStartGroup(g); });
  dlRefreshGroup(g);
});

function dlRefreshGroup(g){
  g.got = 0;
  g.items.forEach(function(it){ if (dlDoneMap[it.url] === it.size) g.got += it.size; });
  var pct = g.total ? Math.round(g.got / g.total * 100) : 100;
  if (g.st) g.st.textContent = fmtMB(g.got) + ' / ' + fmtMB(g.total);
  if (g.pct) g.pct.textContent = pct + '%';
  if (g.bar) g.bar.style.width = pct + '%';
  if (g.btn){
    if (g.total && g.got >= g.total){
      g.btn.textContent = '✅ 已下载'; g.btn.disabled = true;      /* 全下完：灰掉不可点 */
    } else if (g.paused){
      g.btn.textContent = '继续'; g.btn.disabled = false;          /* 暂停中：点它继续 */
    } else if (g.busy){
      g.btn.textContent = '暂停'; g.btn.disabled = false;          /* 下载中：点它暂停 */
    } else {
      g.btn.textContent = g.got ? '继续下载' : '下载'; g.btn.disabled = false;
    }
  }
  dlRefreshTotal();
}
var dlStartTs = 0, dlStartGot = 0;
function dlRefreshTotal(){
  var tot = 0, got = 0;
  Object.keys(dlGroups).forEach(function(gid){ tot += dlGroups[gid].total; got += dlGroups[gid].got; });
  var pct = tot ? Math.round(got / tot * 100) : 100;
  dlTotalBar.style.width = pct + '%';
  var sp = '';
  if (dlStartTs && got > dlStartGot){
    var kb = (got - dlStartGot) / 1024 / Math.max((Date.now() - dlStartTs) / 1000, 0.5);
    sp = ' · ' + Math.round(kb) + ' KB/s';
  }
  dlTotalT.textContent = fmtMB(got) + ' / ' + fmtMB(tot) + ' · ' + pct + '%' + sp;
  if (tot && got >= tot){ goDl.textContent = '✅ 已就绪'; goDl.classList.add('done'); }
  else { goDl.textContent = '⬇️ 下载中心'; goDl.classList.remove('done'); }
}

     1) 10 秒「无响应超时」：连上后只要还在持续收到数据就继续等；连续 10 秒没收到数据
        （这个源卡住了）才断开换源，不会误杀正在慢慢下的大文件。
     2) 组级中断：用户点「暂停」时，立刻断掉所有正在下载的请求。 */
  var ctl = new AbortController();
  var timer = 0;
  function arm(){ clearTimeout(timer); timer = setTimeout(function(){ try { ctl.abort(); } catch(e){} }, 10000); }
  function dis(){ clearTimeout(timer); }
  function kill(){ try { ctl.abort(); } catch(e){} }
  if (groupCtl){
    if (groupCtl.signal.aborted) kill();
    else groupCtl.signal.addEventListener('abort', kill, { once: true });
  }
  arm();
  return fetch(url, { cache: 'no-store', signal: ctl.signal }).then(function(r){
    if (!r.ok){ dis(); throw new Error('HTTP ' + r.status); }
    if (!r.body || !r.body.getReader){
      return r.arrayBuffer().then(function(b){
        dis();
        if (!b.byteLength) throw new Error('empty');
        return b.byteLength;
      }, function(e){ dis(); throw e; });
    }
    var reader = r.body.getReader(), total = 0;
    function pump(){
      return reader.read().then(function(res){
        if (res.done){
          dis();
          if (!total) throw new Error('empty');
          return total;
        }
        arm();                    /* 收到数据 → 重新计时 */
        total += res.value.length;
        return pump();
      }, function(e){ dis(); throw e; });
    }
    return pump();
  }, function(e){ dis(); throw e; });
}
function dlRace(urls, size, groupCtl){
  return new Promise(function(resolve){
    var done = false, fails = 0;
    urls.forEach(function(u){
      dlFetchUrl(u, size, groupCtl).then(function(n){
        if (!done){ done = true; resolve(n); }
      }, function(){
        fails++;
        if (!done && fails === urls.length){ done = true; resolve(0); }
      });
    });
  });
}
async function dlFetchOne(it, groupCtl){
  function aborted(){ return !!(groupCtl && groupCtl.signal.aborted); }
  if (aborted()) return -1;                           /* 已暂停：放弃，不算完成也不算失败 */
  if (dlDoneMap[it.url] === it.size) return it.size;  /* 已下载 */
  try {
    if (window.caches && caches.match){
      var hit = await caches.match(it.url);
      if (hit){
        var hb = await hit.arrayBuffer();
        if (hb.byteLength === it.size) return it.size;  /* 缓存命中且大小一致 */
      }
    }
  } catch(err){}
  if (aborted()) return -1;
  var urls = DL_SOURCES.map(function(f){ return f(it.url); });
  /* 1) 最快的两个源同时竞速 */
  var n = await dlRace(urls.slice(0, 2), it.size, groupCtl);
  if (n) return n;
  if (aborted()) return -1;
  /* 2) 剩下的依次尝试 */
  for (var i = 2; i < urls.length; i++){
    if (aborted()) return -1;
    try { var m = await dlFetchUrl(urls[i], it.size, groupCtl); if (m) return m; } catch(err){}
  }
  return aborted() ? -1 : 0;   /* -1 = 暂停中断，0 = 失败 */
}
async function dlStartGroup(g){
  /* 正在下载时点这个按钮 = 暂停：立即中断在途请求；点「继续」会重新下没下完的那个文件 */
  if (g.busy){
    g.paused = true;
    if (g.ctl){ try { g.ctl.abort(); } catch(e){} }   /* 立刻断掉正在下的请求，不等它超时 */
    g.busy = false;                                   /* 立刻可以点「继续」 */
    dlStartTs = 0; dlStartGot = 0;                    /* 速度归零 */
    dlRefreshGroup(g);
    toast('「' + g.name + '」已暂停');
    return;
  }
  var pend = g.items.filter(function(it){ return dlDoneMap[it.url] !== it.size; });
  if (!pend.length){ g.paused = false; dlRefreshGroup(g); return; }
  g.busy = true; g.paused = false; g.ctl = new AbortController();
  var myRun = g.runId = (g.runId || 0) + 1;   /* 本轮令牌：暂停/重启后旧循环自动作废 */
  dlStartTs = Date.now(); dlStartGot = g.got;
  var CONC = 8, idx = 0, okN = 0, failN = 0;
  async function worker(){
    while (idx < pend.length){
      if (g.paused || g.runId !== myRun) return;    /* 暂停或已被新一轮接管：退出 */
      var it = pend[idx++];
      var n = await dlFetchOne(it, g.ctl);
      if (n === -1) return;                         /* 被暂停中断：不记完成也不记失败，下次继续会重下 */
      if (n){
        if (n !== it.size){          /* 仓库里文件更新过：按实际大小更新记录，避免永远卡在某个百分比 */
          it.size = n;
          g.total = g.items.reduce(function(a, x){ return a + x.size; }, 0);
        }
        dlDoneMap[it.url] = it.size; okN++;
      } else failN++;
      dlRefreshGroup(g);                              /* 每个文件都刷新进度 */
      if ((okN + failN) % 20 === 0) dlSaveDone();     /* 每 20 个存一次盘 */
    }
  }
  var wk = [];
  for (var w = 0; w < Math.min(CONC, pend.length); w++) wk.push(worker());
  await Promise.all(wk);
  if (g.runId !== myRun) return;                      /* 已被新一轮接管，不要动状态 */
  dlSaveDone();
  g.busy = false;
  dlStartTs = 0; dlStartGot = 0;                      /* 停止/结束：速度归零，不再显示残留网速 */
  dlRefreshGroup(g);
  if (g.paused) return;                               /* 暂停的提示在暂停那一刻已经给过 */
  dlRefreshTotal();
  if (failN) toast('「' + g.name + '」有 ' + failN + ' 个文件失败，再点一次下载会重试');
  else toast('「' + g.name + '」下载完成 ✅');
}

<!-- 底部手绘 Dock：常用功能常驻（放在 #app 外，不受抽屉位移影响） -->
<nav class="dock wob">
  <button class="dock-btn" id="dockBoard">💬<span>留言</span><b class="badge" id="dockBadge" style="display:none">0</b></button>
  <button class="dock-btn" id="dockDiary">📖<span>日记</span></button>
  <button class="dock-btn" id="dockDl">⬇️<span id="dockDlLabel">下载</span></button>
  <button class="dock-btn" id="dockMenu">☰<span>菜单</span></button>
</nav>

<script>
/* ===== 手绘扩展层：Dock 接线 / 区块贴纸装饰（不改动任何原有逻辑） ===== */
(function(){
  /* ---- 截图模式 ---- */
  if (new URLSearchParams(location.search).get('shot') === '1') document.documentElement.classList.add('shot');

  /* ---- Dock 接线 ---- */
  function on(id, fn){ var el = document.getElementById(id); if (el) el.addEventListener('click', fn); }
  on('dockBoard', function(){ location.href = 'board.html#messages'; });
  on('dockDiary', function(){ location.href = 'board.html#diary'; });
  on('dockDl',    function(){ var m = document.getElementById('dlMask'); if (m) m.classList.add('show'); });
  on('dockMenu',  function(){ document.body.classList.toggle('menu-open'); });
  /* 管理员：隐藏日记（与抽屉菜单一致） */
  if (localStorage.getItem('blindbox_manager') === '1') {
    var dd = document.getElementById('dockDiary'); if (dd) dd.style.display = 'none';
  }
  /* 角标同步：抽屉未读数 → Dock */
  var bb = document.getElementById('boardBadge'), db = document.getElementById('dockBadge');
  function syncBadge(){
    if (!bb || !db) return;
    var shown = bb.style.display !== 'none';
    db.style.display = shown ? 'flex' : 'none';
    if (shown) db.textContent = bb.textContent;
  }
  if (bb && window.MutationObserver) new MutationObserver(syncBadge).observe(bb, {attributes:true, childList:true, characterData:true, subtree:true});
  syncBadge();
  /* 下载状态同步：goDl 文案 → Dock 标签 */
  var gd = document.getElementById('goDl'), dl = document.getElementById('dockDlLabel');
  function syncDl(){ if (gd && dl) dl.textContent = gd.classList.contains('done') ? '就绪' : '下载'; }
  if (gd && window.MutationObserver) new MutationObserver(syncDl).observe(gd, {attributes:true, childList:true, characterData:true, subtree:true});
  syncDl();

  /* ---- 音乐胶囊：播放中点亮音符 ---- */
  var pill = document.getElementById('musicPill'), mpPlay = document.getElementById('mpPlay');
  function syncPlay(){
    if (!pill || !mpPlay) return;
    pill.classList.toggle('playing', mpPlay.innerHTML.indexOf('M6 5h4') >= 0);  /* 暂停图标 = 正在播 */
  }
  if (mpPlay && window.MutationObserver) new MutationObserver(syncPlay).observe(mpPlay, {childList:true, characterData:true, subtree:true});
  syncPlay();

  /* ---- 游戏墙贴纸装饰：区块标签 / 主推编号 / 序号（render 后自动补，幂等） ---- */
  var TAGS = {
    '觉醒射手宫': '★ 本周主推',
    '食梦紫罗':   '♥ 珍藏小馆',
    '安琪拉试验机': '✎ 全部游戏'
  };
  function pad2(n){ return (n < 10 ? '0' : '') + n; }
  function decorate(){
    var stage = document.getElementById('stage');
    if (!stage) return;
    var secs = stage.querySelectorAll('.sec');
    for (var s = 0; s < secs.length; s++) {
      var head = secs[s].querySelector('.sec-head b');
      if (head && !secs[s].querySelector('.sec-tag')) {
        var tag = document.createElement('span');
        tag.className = 'sec-tag';
        tag.textContent = TAGS[head.textContent] || '✎ ' + pad2(s + 1);
        secs[s].querySelector('.sec-head').appendChild(tag);
      }
    }
    var heroes = stage.querySelectorAll('.hero-card');
    var WOBH = ['wob', 'wob wob-b', 'wob wob-c'];
    for (var h = 0; h < heroes.length; h++) {
      if (!heroes[h].classList.contains('wob')) heroes[h].className += ' ' + WOBH[h % 3];
      var hin = heroes[h].querySelector('.h-in');
      if (!hin || hin.querySelector('.h-tag')) continue;
      hin.insertAdjacentHTML('afterbegin', '<span class="h-tag">★ No.' + (h + 1) + '</span>');
      var hic = hin.querySelector('.h-ic');
      if (hic && !hic.classList.contains('wob')) hic.className += ' wob wob-b wob-thin';
    }
    var frames = stage.querySelectorAll('.sec-frame');
    for (var f = 0; f < frames.length; f++) {
      if (!frames[f].classList.contains('wob')) frames[f].className += ' wob ' + ['wob-b','','wob-c'][f % 3];
    }
    var mids = stage.querySelectorAll('.mid-card');
    for (var m = 0; m < mids.length; m++) {
      if (!mids[m].classList.contains('wob')) mids[m].className += ' wob ' + ['','wob-c','wob-b'][m % 3];
    }
    var minis = stage.querySelectorAll('.mini-card');
    for (var n = 0; n < minis.length; n++) {
      if (!minis[n].classList.contains('wob')) minis[n].className += ' wob wob-thin ' + ['wob-b','wob-c',''][n % 3];
      var mnin = minis[n].querySelector('.mn-in');
      if (mnin && !mnin.querySelector('.mn-no')) mnin.insertAdjacentHTML('afterbegin', '<span class="mn-no">' + pad2(n + 1) + '</span>');
    }
  }
  decorate();
  var st = document.getElementById('stage');
  if (st && window.MutationObserver) new MutationObserver(function(){ decorate(); }).observe(st, {childList:true, subtree:true});
})();
</script>
