<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>多巴胺惊喜屋 · 盲盒</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23FF6B6B'/%3E%3Cstop offset='1' stop-color='%23FFD93D'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='45' font-size='38' font-weight='800' text-anchor='middle' fill='%23fff'%3E%3F%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --coral:#FF6B6B; --sunny:#FFD93D; --mint:#4ECDC4; --grape:#9B5DE5; --pink:#FF9DE2;
    --ink:#4A3F5C; --muted:#9A8FB5;
    /* 盲盒尺寸：桌面端随窗口变大（19vw，上限330px），手机端 27vw */
    --box:clamp(150px,19vw,330px);
    --row-gap:calc(var(--box) / 2);   /* 竖排间距恒为盒子高度的一半 */
    /* 无缝分页：列间空隙 = --gap，页左右各留半列间隙，
       两页相邻边合起来正好 = 一个列间隙 → 悬停中间时看不出是两页 */
    --gap:calc(var(--box) / 6);
    --page-w:calc(3 * var(--box) + 3 * var(--gap)); /* 桌面 3 列：盒子+间隙刚好装满 */
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
    min-height:100vh;color:var(--ink);
    background:linear-gradient(165deg,#FFF6E9,#FFE8D6);
    display:flex;flex-direction:column;align-items:center;
    padding:20px 16px 44px;overflow-x:hidden;
  }
  .blob{position:fixed;border-radius:50%;filter:blur(56px);opacity:.5;z-index:0;animation:float 14s ease-in-out infinite}
  .blob-a{width:36vmax;height:36vmax;background:var(--pink);top:-12vmax;left:-10vmax}
  .blob-b{width:28vmax;height:28vmax;background:var(--mint);bottom:-8vmax;right:-8vmax;animation-delay:-5s}
  .blob-c{width:20vmax;height:20vmax;background:var(--sunny);top:32%;right:4vmax;opacity:.32;animation-delay:-9s}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(2.6vmax)}}

  /* ===== 画布装饰：线条、圆环、椭圆、点阵（淡淡色） ===== */
  .deco{position:fixed;z-index:0;pointer-events:none;opacity:.4}
  .deco-ring{
    width:34vmin;height:34vmin;right:-6vmin;top:16%;
    border:2.5px dashed rgba(155,93,229,.45);border-radius:50%;
    animation:spin 46s linear infinite;
  }
  .deco-ring::after{
    content:"";position:absolute;inset:14%;border:1.5px solid rgba(255,107,107,.35);border-radius:50%;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .deco-ellipse{
    width:26vmin;height:9vmin;left:-7vmin;bottom:14%;border-radius:50%;
    background:linear-gradient(90deg,rgba(78,205,196,.4),rgba(155,93,229,.22));
    transform:rotate(-18deg);
  }
  .deco-line{
    width:60vmin;height:16vmin;left:8%;top:6%;
    border-bottom:3px solid rgba(255,180,120,.5);border-radius:50%;
    transform:rotate(4deg);
  }
  .deco-line2{
    width:40vmin;height:12vmin;right:-4vmin;bottom:4%;
    border-bottom:3px solid rgba(255,157,226,.45);border-radius:50%;
    transform:rotate(-6deg);
  }
  .deco-dots{
    width:17vmin;height:11vmin;left:14%;bottom:26%;
    background-image:radial-gradient(circle,rgba(255,107,107,.5) 3px,transparent 3.5px);
    background-size:26px 26px;
  }
  .deco-dots2{
    width:13vmin;height:9vmin;right:10%;top:36%;
    background-image:radial-gradient(circle,rgba(78,205,196,.55) 3px,transparent 3.5px);
    background-size:24px 24px;
  }
  .deco-star{
    width:16px;height:16px;right:22%;top:12%;
    background:linear-gradient(135deg,var(--sunny),#FFB84C);
    clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
    opacity:.65;
  }
  .deco-star2{
    width:12px;height:12px;left:6%;top:40%;
    background:linear-gradient(135deg,var(--coral),var(--pink));
    clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
    opacity:.55;
  }
  header{
    position:relative;z-index:1;width:min(94vw,760px);
    display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px;
    flex-wrap:wrap;
  }
  .brand-logo{
    height:78px;width:auto;display:block;margin:0 auto;
    filter:drop-shadow(0 6px 12px rgba(255,107,107,.25));
  }
  .brand{display:flex;flex-direction:column;align-items:center;gap:4px}
  .user{font-size:14px;color:var(--muted)}
  .top-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;align-self:flex-start}
  .top-icon{
    flex:none;width:69px;height:69px;padding:2px;border:none;border-radius:18px;cursor:pointer;
    background:rgba(255,255,255,.85);backdrop-filter:blur(8px);
    box-shadow:0 6px 16px rgba(155,93,229,.14);transition:transform .15s,filter .15s;
    display:flex;align-items:center;justify-content:center;position:relative;
  }
  .top-icon img{width:100%;height:100%;object-fit:contain;pointer-events:none}
  .top-icon:hover{transform:translateY(-2px)}
  .top-icon:active{transform:scale(.92)}
  /* 留言板未读红色角标：有未读留言时显示在「留言板」按钮右上角，全部已读后消失 */
  .badge{
    position:absolute;top:-8px;right:-6px;min-width:21px;height:21px;padding:0 5px;
    border-radius:999px;background:linear-gradient(135deg,#ff4757,#ff6b81);
    color:#fff;font-size:12px;font-weight:800;line-height:1;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(255,71,87,.55),0 0 0 2px #fff;
    font-family:Arial,sans-serif;pointer-events:none;
  }
  .logout{
    flex:none;min-height:44px;display:flex;align-items:center;
    padding:0 16px;border:none;border-radius:999px;cursor:pointer;
    font-size:14px;font-weight:700;color:#fff;
    background:linear-gradient(135deg,var(--coral),var(--grape));
    box-shadow:0 6px 16px rgba(255,107,107,.3);transition:transform .15s;
  }
  .logout:hover{transform:translateY(-2px)}
  .logout:active{transform:scale(.96)}

  /* ===== 钱包区（logo 正下方 · 靠左） ===== */
  .wallet{
    position:relative;z-index:1;display:flex;align-items:center;gap:10px;
    background:rgba(255,255,255,.82);border-radius:999px;padding:5px 8px 5px 6px;
    box-shadow:0 6px 18px rgba(155,93,229,.12);
    margin:0 auto 0 0; /* 靠左 */
  }
  .wallet img{width:34px;height:34px;border-radius:50%;object-fit:cover;box-shadow:0 3px 8px rgba(255,180,60,.45)}
  .wallet b{font-size:16px;color:var(--ink);min-width:28px;text-align:center}
  .wallet .recharge{
    flex:none;min-height:32px;padding:0 12px;border:none;border-radius:999px;cursor:pointer;
    font-size:13px;font-weight:800;color:#fff;
    background:linear-gradient(135deg,var(--sunny),#FF9F6B);
    box-shadow:0 4px 12px rgba(255,159,107,.4);transition:transform .15s;
  }
  .wallet .recharge:active{transform:scale(.94)}

  /* ===== 功能区按钮（留言 / 日记） ===== */
  .fun-row{
    position:relative;z-index:1;display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;justify-content:center;
  }
  .fun-btn{
    flex:none;min-height:44px;display:flex;align-items:center;gap:7px;
    padding:0 18px;border:none;border-radius:999px;cursor:pointer;
    font-size:14px;font-weight:800;color:#fff;
    box-shadow:0 8px 20px rgba(139,92,246,.22);transition:transform .15s;
    position:relative;
  }
  .fun-btn:active{transform:scale(.95)}
  .fun-btn.mint{background:linear-gradient(135deg,#4ECDC4,#2FBFB5);box-shadow:0 8px 20px rgba(47,191,181,.28)}
  .fun-btn.grape{background:linear-gradient(135deg,#9B5DE5,#7C3AED);box-shadow:0 8px 20px rgba(124,58,237,.28)}
.fun-btn.coral{background:linear-gradient(135deg,#FF6B6B,#FF4D6D);box-shadow:0 8px 20px rgba(255,77,109,.28)}

  .hint{position:relative;z-index:1;font-size:14px;color:var(--muted);margin-bottom:24px}

  /* ===== 游戏墙：魔方滑动翻页（自由滚动·无极悬停，不强制吸附） ===== */
  .stage-shell{
    position:relative;z-index:1;width:min(96vw, calc(var(--page-w) + 44px));
    margin-top:18px;
    /* 圆角裁切，避免滚动时两侧溢出 */
    border-radius:24px;
    box-shadow:0 18px 44px rgba(155,93,229,.16);
    background:rgba(255,255,255,.45);
    padding:14px 6px 16px;
  }
  .stage{
    width:100%;display:flex;flex-direction:row;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch; /* 惯性滚动：松手停在任意位置 */
    scrollbar-width:none;
  }
  .stage::-webkit-scrollbar{display:none}
  .page{
    flex:none;width:var(--page-w);
    display:flex;flex-wrap:wrap;justify-content:space-between; /* 盒子均匀排布，间距=--gap */
    column-gap:var(--gap);row-gap:var(--row-gap);
    padding:0 calc(var(--gap) / 2) 6px; /* 左右各半列间隙：页间=页内=--gap，无缝衔接 */
    box-sizing:border-box;
  }
  .box{position:relative;width:var(--box);height:var(--box);cursor:pointer}
  .box.enter{animation:boxIn .4s cubic-bezier(.2,.9,.3,1.25) both}
  @keyframes boxIn{from{opacity:0;transform:translateY(16px) scale(.92)}to{opacity:1;transform:none}}
  .lid{
    position:absolute;top:0;left:4%;width:92%;height:34%;z-index:3;border-radius:14px 14px 6px 6px;
    display:flex;align-items:center;justify-content:center;
    font-size:20px;font-weight:800;color:#fff;
    box-shadow:0 6px 14px rgba(0,0,0,.14);
    transform-origin:top center;
    transition:transform .35s cubic-bezier(.2,.8,.3,1.1);
  }
  .box.b1 .lid{background:linear-gradient(135deg,var(--coral),#FF9F6B)}
  .box.b2 .lid{background:linear-gradient(135deg,var(--mint),#7BDBCB)}
  .box.b3 .lid{background:linear-gradient(135deg,var(--grape),var(--pink))}
  .box.b4 .lid{background:linear-gradient(135deg,var(--sunny),#FFB84C)}
  .box.b5 .lid{background:linear-gradient(135deg,var(--pink),#FF9F6B)}
  .box.b6 .lid{background:linear-gradient(135deg,#7BDBCB,var(--mint))}
  .body{
    position:absolute;bottom:0;left:0;width:100%;height:70%;z-index:1;border-radius:10px 10px 18px 18px;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    box-shadow:inset 0 -10px 18px rgba(0,0,0,.07);
    transition:box-shadow .3s;
  }
  .box.b1 .body{background:linear-gradient(160deg,#FFB199,#FFE0B2)}
  .box.b2 .body{background:linear-gradient(160deg,#BFF0E8,#E4FAF6)}
  .box.b3 .body{background:linear-gradient(160deg,#E9C9FF,#F9E3FF)}
  .box.b4 .body{background:linear-gradient(160deg,#FFF3C4,#FFF8E1)}
  .box.b5 .body{background:linear-gradient(160deg,#FFD3EE,#FFEAF7)}
  .box.b6 .body{background:linear-gradient(160deg,#D4F5F0,#ECFBF8)}
  .ribbon{
    position:absolute;top:9px;left:50%;transform:translateX(-50%);
    width:26%;height:24px;z-index:2;opacity:.95;
    background:linear-gradient(90deg,rgba(255,255,255,.95),rgba(255,255,255,.55));
    clip-path:polygon(0 0,100% 0,100% 100%,50% 72%,0 100%);
  }
  .reveal{
    position:relative;z-index:4;display:flex;flex-direction:column;align-items:center;gap:7px;
    opacity:0;transform:scale(.6);
    transition:opacity .3s,transform .35s cubic-bezier(.2,.8,.3,1.3);
  }
  .box:hover .lid,.box.open .lid{transform:translateY(-16px) rotate(-5deg)}
  .box:hover .reveal,.box.open .reveal{opacity:1;transform:scale(1)}
  .box:hover .body,.box.open .body{box-shadow:0 14px 26px rgba(0,0,0,.1)}
  .r-name{font-size:14px;font-weight:700}
  .r-go{
    font-size:14px;font-weight:700;color:#fff;
    background:linear-gradient(135deg,var(--coral),var(--grape));
    padding:4px 12px;border-radius:999px;box-shadow:0 4px 10px rgba(255,107,107,.3);
  }
  /* CSS 小蛇 */
  .mini-snake{display:flex;align-items:center}
  .mini-snake i{width:13px;height:13px;border-radius:4px;margin-left:-4px;background:linear-gradient(135deg,var(--mint),#2FBFB5);box-shadow:0 2px 4px rgba(0,0,0,.15)}
  .mini-snake i:first-child{
    margin-left:0;width:17px;height:17px;border-radius:6px;position:relative;
    background:linear-gradient(135deg,var(--sunny),#FFB84C);
  }
  .mini-snake i:first-child::before,.mini-snake i:first-child::after{
    content:"";position:absolute;top:4px;width:4px;height:4px;border-radius:50%;background:var(--ink);
  }
  .mini-snake i:first-child::before{left:3px}
  .mini-snake i:first-child::after{right:3px}
  /* 连连看图标：一方一圆 + 连线 */
  .i-lian{display:flex;align-items:center;gap:3px}
  .i-lian b{width:14px;height:14px;border-radius:5px;background:linear-gradient(135deg,var(--coral),#FF9F6B);box-shadow:0 2px 4px rgba(0,0,0,.15)}
  .i-lian i{width:12px;height:2.5px;border-radius:2px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.15)}
  .i-lian u{width:14px;height:14px;background:linear-gradient(135deg,var(--mint),#2FBFB5);box-shadow:0 2px 4px rgba(0,0,0,.15)}
  /* 消消乐图标：三颗水果 */
  .i-xiao{display:flex;gap:3px}
  .i-xiao i{
    width:17px;height:17px;border-radius:5px;background:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-style:normal;line-height:1;box-shadow:0 2px 5px rgba(0,0,0,.14);
  }
  /* 植物大战僵尸图标：小太阳 + 绿芽 */
  .i-pvz{position:relative;width:26px;height:26px}
  .i-pvz i{
    position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(circle at 35% 32%,#FFF3B0,#FFC93C 62%,#FFA726);
    box-shadow:0 2px 6px rgba(255,169,38,.5);
  }
  .i-pvz i::before{
    content:"";position:absolute;inset:-6px;border-radius:50%;
    background:repeating-conic-gradient(rgba(255,201,60,.9) 0 12deg,transparent 12deg 30deg);
    -webkit-mask:radial-gradient(circle,#000 30%,transparent 55%);
            mask:radial-gradient(circle,#000 30%,transparent 55%);
  }
  .i-pvz b{
    position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);
    width:6px;height:9px;border-radius:3px 3px 2px 2px;
    background:linear-gradient(180deg,#57C785,#3BA66E);
  }
  .i-pvz b::before,.i-pvz b::after{
    content:"";position:absolute;top:1px;width:6px;height:3.5px;border-radius:4px;
    background:#57C785;
  }
  .i-pvz b::before{left:-5px;transform:rotate(28deg)}
  .i-pvz b::after{right:-5px;transform:rotate(-28deg)}
  /* 天天酷跑图标：奔跑小人 */
  .i-hcr{position:relative;width:52px;height:46px}
  .i-hcr .hill{position:absolute;left:2px;bottom:2px;width:48px;height:20px;background:linear-gradient(135deg,#8fd46a,#4a9e3a);border-radius:60% 60% 0 0/80% 80% 0 0}
  .i-hcr .hill2{position:absolute;right:0;bottom:4px;width:20px;height:12px;background:linear-gradient(135deg,#a8e08a,#6cbe52);border-radius:60% 60% 0 0/80% 80% 0 0}
  .i-hcr .car{position:absolute;left:8px;bottom:16px;width:32px;height:14px;background:linear-gradient(90deg,#e8452c,#ff8a5a);border-radius:5px 9px 4px 4px;box-shadow:inset 0 3px 0 rgba(255,255,255,.25)}
  .i-hcr .car::before{content:'';position:absolute;left:-4px;top:10px;width:8px;height:8px;background:#2a2a3a;border-radius:50%;box-shadow:inset 2px 2px 0 #555}
  .i-hcr .car::after{content:'';position:absolute;right:-4px;top:10px;width:8px;height:8px;background:#2a2a3a;border-radius:50%;box-shadow:inset 2px 2px 0 #555}
  .i-hcr .head{position:absolute;left:16px;bottom:28px;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd0e8,#ff7ab0)}
  .i-hcr .flag{position:absolute;left:44px;top:0;width:2px;height:16px;background:#c98a3a}
  .i-hcr .flag::after{content:'';position:absolute;top:0;left:2px;width:8px;height:6px;background:linear-gradient(90deg,#ffd93d,#ff8f3c);clip-path:polygon(0 0,100% 50%,0 100%)}
  .i-run{position:relative;width:28px;height:26px}
  .i-run .head{position:absolute;top:0;right:1px;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE0BD,#F5A96F)}
  .i-run .body{position:absolute;top:8px;right:6px;width:8px;height:12px;border-radius:4px;background:linear-gradient(135deg,var(--coral),var(--grape));transform:rotate(-18deg)}
  .i-run .arm{position:absolute;top:9px;width:3px;height:8px;border-radius:2px;background:#F5A96F}
  .i-run .arm.l{right:12px;transform:rotate(-40deg)}
  .i-run .arm.r{right:2px;transform:rotate(35deg)}
  .i-run .leg{position:absolute;bottom:0;width:3.5px;height:11px;border-radius:2px;background:var(--ink)}
  .i-run .leg.l{right:11px;transform:rotate(35deg)}
  .i-run .leg.r{right:2px;transform:rotate(-25deg)}
  /* 免费看剧图标：小荧幕 + 播放键 */
  .i-tv{position:relative;width:30px;height:24px}
  .i-tv .screen{
    position:absolute;inset:0 0 4px 0;border-radius:5px;
    background:linear-gradient(135deg,var(--grape),var(--pink));
    box-shadow:0 2px 6px rgba(155,93,229,.4);
  }
  .i-tv .screen::before{
    content:"";position:absolute;top:4px;left:9px;
    border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:9px solid #fff;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.2));
  }
  .i-tv .leg{
    position:absolute;bottom:0;left:50%;transform:translateX(-50%);
    width:12px;height:4px;border-radius:2px;background:var(--ink);opacity:.65;
  }
  .i-tv .star{
    position:absolute;top:-4px;right:-3px;width:10px;height:10px;
    background:linear-gradient(135deg,var(--sunny),#FFB84C);
    clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
    animation:twinkle 1.6s ease-in-out infinite;
  }
  @keyframes twinkle{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.72);opacity:.7}}
  /* 种豆图标：小土包 + 嫩苗 + 星光 */
  .i-bean{position:relative;width:30px;height:28px;display:inline-block}
  .i-bean .soil{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:24px;height:10px;border-radius:7px;background:linear-gradient(180deg,#A97445,#7A4E28);box-shadow:0 2px 4px rgba(0,0,0,.25)}
  .i-bean .leaf{position:absolute;bottom:9px;left:50%;transform:translateX(-80%);width:9px;height:14px;border-radius:50% 50% 50% 6%;background:linear-gradient(135deg,#8FE06A,#4C9E34);box-shadow:0 2px 3px rgba(0,0,0,.15)}
  .i-bean .leaf2{position:absolute;bottom:9px;left:50%;transform:translateX(-20%);width:9px;height:14px;border-radius:50% 50% 6% 50%;background:linear-gradient(135deg,#ABF08C,#62C84A);box-shadow:0 2px 3px rgba(0,0,0,.15)}
  .i-bean .spark{position:absolute;top:0;right:2px;width:8px;height:8px;background:linear-gradient(135deg,var(--sunny),#FFB84C);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);animation:twinkle 1.6s ease-in-out infinite}
  /* 敬请期待 */
  .soon{font-size:14px;font-weight:700;color:var(--muted)}
  .lock{width:20px;height:15px;border:3px solid var(--muted);border-top:none;border-radius:0 0 6px 6px;position:relative;margin-bottom:10px}
  .lock::before{
    content:"";position:absolute;top:-12px;left:50%;transform:translateX(-50%);

  /* ===== APK 彩蛋 v2：螺丝帽 + 掉落螺丝/烟雾 + 物理重力（仅 APK，网页不生效） ===== */

  @keyframes fallDrop{

  /* 烟雾：从顶部飘落、扩散、消散 */

  /* ===== 资源预下载中心 ===== */

<script>
(function(){
  var VER_URL = 'https://mogoing.github.io/mogoing/version.json';
  if (!window.fetch) return;
  fetch(VER_URL, {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(j){
    var ver = String((j && j.v) || 0);
    try {
      var old = localStorage.getItem('mogoing_ver');
      if (old !== ver) {
        localStorage.setItem('mogoing_ver', ver);
        var p = location.pathname;
        var q = location.search || '';
        var sep = q.indexOf('?') >= 0 ? '&' : '?';
        location.replace(p + q + sep + 'v=' + ver);
      }
    } catch(e){}
  }).catch(function(){});
})();
</script>

<body>
  <!-- 左上角 Logo 抽屉菜单：界面右移 2/3 露出 -->

<script>
  // ===== 后端 API =====
  const API = 'https://api.mogoing.xyz';

  // ===== 登录守卫 =====
  const user = localStorage.getItem('blindbox_user');
  if (!user) location.replace('index.html');
  const pass = localStorage.getItem('blindbox_pass') || '';
  const manager = localStorage.getItem('blindbox_manager') === '1';
  const offline = localStorage.getItem('blindbox_offline') === '1';
  document.getElementById('hello').textContent = offline ? '你好，' + user + '（离线）' : '你好，' + user;

  // ===== 游戏列表：要加新游戏就往下面数组加一行即可（name=名字 desc=一句话 icon=图标 target=页面）=====
  const GAMES = [
    { name:'贪吃蛇',   desc:'经典街机', icon:'snake', target:'eatsnake.html' },
    { name:'连连看',   desc:'爱心连线', icon:'lian',  target:'lian.html' },
    { name:'开心消消乐', desc:'三消闯关', icon:'xiao',  target:'xiao.html' },
    { name:'植物大战僵尸', desc:'在线版', icon:'pvz', target:'pvz.html' },
    { name:'天天酷跑', desc:'极速冲刺', icon:'run', target:'coolrun.html' },
    { name:'跑酷HD', desc:'四季跑酷', icon:'run', target:'coolrun_hd/coolrun_hd_wrap.html' },
    { name:'免费看剧', desc:'全网聚合', icon:'tv', target:'https://libretv-5m5.pages.dev' },
    { name:'追剧',     desc:'电视剧海报', icon:'tv', target:'look.html' },
    { name:'种豆',     desc:'洛克农场', icon:'bean', target:'bean.html?v=20260929' },
    { name:'沙威玛',   desc:'摆摊传奇', icon:'shaw', target:'shawarma.html' },
    { name:'登山赛车', desc:'翻山越岭', icon:'hcr', target:'hcr.html?v=39' },
    { name:'割绳子1',  desc:'糖果物理', icon:'ctr', target:'ab/ctr2.html?v=60' },
    { name:'小鳄鱼爱洗澡', desc:'引导水流', icon:'wmw', target:'ab/wmw.html?v=1' },
    { name:'愤怒的小鸟', desc:'原版弹弓', icon:'ab', target:'ab.html' },
    { name:'保卫萝卜', desc:'经典塔防', icon:'bwlb', target:'bwlb.html?v=1' },
    { name:'弹钢琴', desc:'音律漫游', icon:'piano', target:'piano.html' },
    { name:'纸卡丁车', desc:'纸片竞速', icon:'kart', target:'kagit-kart.html' },
  ];
  const PER_PAGE = 6;   // 一页六个（两排三个）
  const ICONS = {
    snake: '<span class="mini-snake"><i></i><i></i><i></i><i></i><i></i></span>',
    lian:  '<span class="i-lian"><b></b><i></i><u></u></span>',
    xiao:  '<span class="i-xiao"><i>🍑</i><i>🫐</i><i>🍈</i></span>',
    pvz:   '<span class="i-pvz"><i></i><b></b></span>',
    run:   '<span class="i-run"><span class="head"></span><span class="body"></span><span class="arm l"></span><span class="arm r"></span><span class="leg l"></span><span class="leg r"></span></span>',
    tv:    '<span class="i-tv"><span class="screen"></span><span class="leg"></span><span class="star"></span></span>',
    bean:  '<span class="i-bean"><i class="soil"></i><i class="leaf"></i><i class="leaf2"></i><i class="spark"></i></span>',
    soon:  '<span class="lock"></span>',
    shaw:  '<span style="font-size:38px;line-height:1">🌯</span>',
    ab:    '<span style="font-size:38px;line-height:1">🐦</span>',
    hcr:   '<span class="i-hcr"><i class="hill"></i><i class="hill2"></i><i class="car"></i><i class="head"></i><i class="flag"></i></span>',
    ctr:   '<span style="font-size:38px;line-height:1">🍬</span>',
    wmw:   '<span style="font-size:38px;line-height:1">🐊</span>',
    bwlb:  '<span style="font-size:38px;line-height:1">🥕</span>',
    piano: '<span style="font-size:38px;line-height:1">🎹</span>',
    kart:  '<span style="font-size:38px;line-height:1">🏎️</span>',
  };

  // ===== 金币拉取 =====
  const coinNum = document.getElementById('coinNum');
  function setCoin(n) {
    coinNum.textContent = n;
    localStorage.setItem('blindbox_coins', String(n));
  }
  setCoin(localStorage.getItem('blindbox_coins') || 0);

  if (!offline && user && pass) {
    fetch(API + '/api/user?username=' + encodeURIComponent(user) + '&password=' + encodeURIComponent(pass), { signal: AbortSignal.timeout(8000) })
      .then(r => r.json())
      .then(d => {
        if (d && d.ok && d.user) {
          setCoin(d.user.coins);
          localStorage.setItem('blindbox_manager', d.user.manager ? '1' : '0');
        }
      })
      .catch(() => {});
  }

  // ===== 留言板未读角标：有未读留言显示红圈条数，全部已读后消失 =====
  const boardBadge = document.getElementById('boardBadge');
  async function loadBoardBadge(){
    if (!boardBadge) return;
    try {
      const r1 = await fetch(API + '/api/messages', { signal: AbortSignal.timeout(8000) });
      const d1 = await r1.json();
      if (!d1 || !d1.ok) throw new Error();
      const all = d1.messages || [];
      if (!all.length) { boardBadge.style.display = 'none'; return; }
      let readIds = [];
      if (!offline && user && pass) {
        try {
          const r2 = await fetch(API + '/api/save?username=' + encodeURIComponent(user) + '&password=' + encodeURIComponent(pass) + '&game=board_read', { signal: AbortSignal.timeout(8000) });
          const d2 = await r2.json();
          if (d2 && d2.ok && d2.save && Array.isArray(d2.save.read)) readIds = d2.save.read;
        } catch(e2){}
      }
      const unread = all.filter(m => m.id != null && readIds.indexOf(m.id) === -1).length;
      if (unread > 0) { boardBadge.textContent = unread > 99 ? '99+' : unread; boardBadge.style.display = 'flex'; }
      else boardBadge.style.display = 'none';
    } catch(e){ boardBadge.style.display = 'none'; }
  }
  loadBoardBadge();

  // ===== 渲染游戏墙（滑动翻页） =====
  const stage = document.getElementById('stage');
  const dotsWrap = document.getElementById('dots');
  const pages = Math.ceil(GAMES.length / PER_PAGE);

  function render(){
    stage.innerHTML = '';
    dotsWrap.innerHTML = '';
    for (let pi = 0; pi < pages; pi++){
      const page = document.createElement('div');
      page.className = 'page';
      const start = pi * PER_PAGE;
      GAMES.slice(start, start + PER_PAGE).forEach((g, idx) => {
        const slot = (start + idx) % 6 + 1;
        const box = document.createElement('div');
        box.className = 'box b' + slot + ' enter';
        box.style.animationDelay = (idx*0.07) + 's';
        box.innerHTML =
          '<div class="lid">?</div>' +
          '<div class="body">' +
            '<span class="ribbon"></span>' +
            '<div class="reveal">' +
              ICONS[g.icon] +
              '<span class="r-name">' + g.name + '</span>' +
              (g.target ? '<span class="r-go">进入</span>' : '<span class="soon">敬请期待</span>') +
            '</div>' +
          '</div>';
        box.addEventListener('click', () => {
          if (box.classList.contains('open')) {
            if (g.target) location.href = g.target;
            else toast('敬请期待 · 即将上线');
          } else {
            box.classList.add('open');
          }
        });
        page.appendChild(box);
      });
      stage.appendChild(page);
      // 指示点
      const dot = document.createElement('button');
      dot.className = 'dot' + (pi === 0 ? ' active' : '');
      dot.setAttribute('aria-label', '第' + (pi+1) + '页');
      dot.addEventListener('click', () => {
        stage.scrollTo({ left: pi * stage.clientWidth, behavior: 'smooth' });
      });
      dotsWrap.appendChild(dot);
    }

    // 自由滚动（无极悬停）：松手停在任意位置，不做任何吸附
    // 指示点仅用于"当前位置在哪一页"的视觉提示，随滚动联动
    let ticking = false;
    stage.addEventListener('scroll', () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => {
        ticking = false;
        const w = stage.clientWidth || 1;
        const cur = Math.round(stage.scrollLeft / w);
        [...dotsWrap.children].forEach((d, i) => d.classList.toggle('active', i === cur));
      });
    });
  }

  document.getElementById('logout').addEventListener('click', () => {
    localStorage.removeItem('blindbox_user');
    localStorage.removeItem('blindbox_pass');
    localStorage.removeItem('blindbox_manager');
    localStorage.removeItem('blindbox_coins');
    localStorage.removeItem('blindbox_offline');
    location.href = 'index.html';
  });

  // 功能入口
  document.getElementById('goRecharge').addEventListener('click', () => location.href = 'recharge.html');
  document.getElementById('goBoard').addEventListener('click', () => location.href = 'board.html#messages');
  document.getElementById('goDiary').addEventListener('click', () => location.href = 'board.html#diary');
  // 活动 / 邮件
  document.getElementById('goNews').addEventListener('click', () => location.href = 'news.html');
  document.getElementById('goEmails').addEventListener('click', () => location.href = 'email.html');
  // 管理员专属：显示管理后台入口，隐藏"我的日记"（管理员界面不要我的日记）
  if (manager) {
    const adminBtn = document.getElementById('goAdmin');
    if (adminBtn) {
      adminBtn.style.display = '';
      adminBtn.addEventListener('click', () => location.href = 'admin.html');
    }
    const diaryBtn = document.getElementById('goDiary');
    if (diaryBtn) diaryBtn.style.display = 'none';
  }

  let toastTimer = null;
  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);

  const IS_APK = (typeof AndroidBridge !== 'undefined' && AndroidBridge.getGravityX) || new URLSearchParams(location.search).get('easter') === '1'; // ?easter=1 调试彩蛋

    // 掉落特效：7 个螺丝 + 烟雾从顶部掉下
    function fallFX(){

    // 物理重力 v3：盲盒快照克隆脱离（整盒视觉带走），按钮直接脱离；碰撞不重叠，四边空气墙
            function startPhysics(){
      const vw = innerWidth, vh = innerHeight;
      const items = [];
      // 1) 顶部按钮：全部脱离（数量少，不占地方）
      [...document.querySelectorAll('.wallet, .logout, .fun-btn')].forEach(el => {
        const r = el.getBoundingClientRect();
        el.style.transition = 'none';
        el.style.position = 'fixed';
        el.style.left = r.left + 'px';
        el.style.top = r.top + 'px';
        el.style.width = r.width + 'px';
        el.style.height = r.height + 'px';
        el.style.margin = '0';
        el.style.zIndex = '20';
        items.push({ el, x: r.left, y: r.top, w: r.width, h: r.height, vx: 0, vy: 0 });
      });
      // 2) 盲盒：只随机挑 5~7 个快照克隆脱离，其余留在架上
      const boxes = [...document.querySelectorAll('.box')];
      const n = 5 + Math.floor(Math.random() * 3);   // 5~7 个
      const chosen = [];
      while (chosen.length < n && boxes.length) {
        const idx = Math.floor(Math.random() * boxes.length);
        chosen.push(boxes.splice(idx, 1)[0]);
      }
      chosen.forEach(box => {
        const r = box.getBoundingClientRect();
        const clone = document.createElement('div');
        clone.className = box.className;      // 保留 box b1~b6 open 等类 → 内部视觉全部继承
        clone.innerHTML = box.innerHTML;      // lid/body/ribbon/reveal 整体带走
        clone.style.position = 'fixed';
        clone.style.left = r.left + 'px';
        clone.style.top = r.top + 'px';
        clone.style.width = r.width + 'px';
        clone.style.height = r.height + 'px';
        clone.style.margin = '0';
        clone.style.zIndex = '20';
        clone.style.animation = 'none';       // 停掉入场动画，不依赖它
        clone.style.transition = 'none';
        clone.style.opacity = '1';            // 强制可见（修复消失 bug）
        clone.style.transform = 'none';
        clone.style.visibility = 'visible';
        // 点击功能跟随：先同步打开视觉，再触发原盒子的逻辑（开盒/跳转）
        clone.addEventListener('click', () => {
          if (!box.classList.contains('open')) clone.classList.add('open');
          box.click();
        });
        document.body.appendChild(clone);
        // 原件：固定到原位并隐藏（不再占布局）
        box.style.animation = 'none';
        box.style.transition = 'none';
        box.style.position = 'fixed';
        box.style.left = r.left + 'px';
        box.style.top = r.top + 'px';
        box.style.width = r.width + 'px';
        box.style.height = r.height + 'px';
        box.style.margin = '0';
        box.style.opacity = '0';
        box.style.pointerEvents = 'none';
        items.push({ el: clone, x: r.left, y: r.top, w: r.width, h: r.height, vx: 0, vy: 0 });
      });
      if (!items.length) return;
      // 物理循环：真实重力方向 + 空气墙 + 碰撞回弹 + 摇一摇冲量
      let stop = false, last = performance.now(), lastShake = 0;
      function loop(now){
        if (stop) return;
        const dt = Math.min(0.05, (now - last) / 1000);
        last = now;
        let gx = 0, gy = 0, gz = 0;
        try { gx = AndroidBridge.getGravityX(); gy = AndroidBridge.getGravityY(); gz = AndroidBridge.getGravityZ(); } catch (e) {}
        if (!isFinite(gx)) gx = 0;
        if (!isFinite(gy)) gy = 0;
        if (!isFinite(gz)) gz = 0;
        // 真实重力：手机正放(gy≈+9.8)→下沉；头朝下(gy≈-9.8)→上浮；左倾(gx≈+9.8)→向左
        const ax = -Math.max(-1, Math.min(1, gx / 9.8)) * 0.6;
        const ay =  Math.max(-1, Math.min(1, gy / 9.8)) * 0.6;
        // 摇一摇检测：总加速度明显大于 1g → 随机冲量碰撞回弹
        const mag = Math.sqrt(gx * gx + gy * gy + gz * gz);
        if (mag > 13.5 && now - lastShake > 400) {
          lastShake = now;
          for (const it of items) {
            it.vx += (Math.random() - 0.5) * 7;
            it.vy += (Math.random() - 0.5) * 7;
          }
        }
        // 更新位置（带阻尼）
        for (const it of items) {
          it.vx = (it.vx + ax * dt * 60) * 0.90;
          it.vy = (it.vy + ay * dt * 60) * 0.90;
          it.x += it.vx * dt * 60;
          it.y += it.vy * dt * 60;
          // 空气墙：屏幕四边挡住，不滑出
          if (it.x < 0) { it.x = 0; it.vx = 0; }
          if (it.x + it.w > vw) { it.x = vw - it.w; it.vx = 0; }
          if (it.y < 0) { it.y = 0; it.vy = 0; }
          if (it.y + it.h > vh) { it.y = vh - it.h; it.vy = 0; }
          it.el.style.left = it.x + 'px';
          it.el.style.top = it.y + 'px';
        }
        // 碰撞解算：两轮迭代推开 + 速度回弹（摇一摇时互相弹开）
        for (let iter = 0; iter < 2; iter++) {
          for (let i = 0; i < items.length; i++) {
            for (let j = i + 1; j < items.length; j++) {
              const a = items[i], b = items[j];
              const dx = (b.x + b.w / 2) - (a.x + a.w / 2);
              const dy = (b.y + b.h / 2) - (a.y + a.h / 2);
              const ox = (a.w + b.w) / 2 - Math.abs(dx);
              const oy = (a.h + b.h) / 2 - Math.abs(dy);
              if (ox > 0 && oy > 0) {
                if (ox < oy) {
                  const dir = dx >= 0 ? 1 : -1;
                  a.x -= dir * ox / 2; b.x += dir * ox / 2;
                  a.vx = -a.vx * 0.55; b.vx = -b.vx * 0.55;   // 水平回弹
                } else {
                  const dir = dy >= 0 ? 1 : -1;
                  a.y -= dir * oy / 2; b.y += dir * oy / 2;
                  a.vy = -a.vy * 0.55; b.vy = -b.vy * 0.55;   // 垂直回弹
                }
                a.el.style.left = a.x + 'px'; a.el.style.top = a.y + 'px';
                b.el.style.left = b.x + 'px'; b.el.style.top = b.y + 'px';
              }
            }
          }
        }
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    }

var dlTotalBytes = 0, dlGotBytes = 0, dlFailed = 0, dlBusy = false, dlAllDone = false;
DL_LIST.forEach(function(x){ dlTotalBytes += x[1]; });
var goDl = document.getElementById('goDl');
var dlMask = document.getElementById('dlMask');
var dlRows = document.getElementById('dlRows');
var dlTotalBar = document.querySelector('#dlTotal i');
var dlTotalT = document.getElementById('dlTotalT');
function fmtMB(n){ return (n/1048576).toFixed(1) + 'MB'; }
function makeDlRow(name, size){
  var r = document.createElement('div');
  r.className = 'dlrow';
  r.innerHTML = '<span class="dn">' + name + '</span><span class="dbar"><i></i></span><span class="ds">' + fmtMB(size) + '</span>';
  return { el: r, bar: r.querySelector('.dbar i'), st: r.querySelector('.ds') };
}
var dlItems = [], dlGroups = {};
DL_LIST.forEach(function(x){
  var isCtr = x[2].indexOf('割绳子') === 0;
  var isWmw = x[2].indexOf('小鳄鱼') === 0;
  var isGrp = isCtr || isWmw;
  var row = makeDlRow(isGrp ? x[2].replace(/^(割绳子|小鳄鱼) /, '') : x[2], x[1]);
  dlRows.appendChild(row.el);
  var it = { name: x[2], url: x[0], size: x[1], el: row.el, bar: row.bar, st: row.st, done: false };
  if (isGrp) {
    it.el.classList.add('dlsub');
    it.el.style.display = 'none';
    var gname = isCtr ? '割绳子' : '小鳄鱼';
    var g = dlGroups[gname] || (dlGroups[gname] = { name: gname, total: 0, done: 0, subs: [] });
    it.g = g;
    g.subs.push(it);
    g.total++;
  } else {
    dlItems.push(it);
  }
});
/* 割绳子合并成一项：生成组行（显示 已下载/总数），点击展开/收起子项 */
Object.keys(dlGroups).forEach(function(gname){
  var g = dlGroups[gname];
  var gr = makeDlRow(gname, 0);
  gr.el.classList.add('dlgroup');
  g.row = gr;
  gr.st.textContent = '0/' + g.total;
  var first = g.subs[0].el;
  dlRows.insertBefore(gr.el, first);
  gr.el.addEventListener('click', function(){
    var open = gr.el.classList.toggle('open');
    g.subs.forEach(function(s){ s.el.style.display = open ? '' : 'none'; });
  });
});
function dlRefreshGroup(g){
  if (!g || !g.row) return;
  g.row.st.textContent = g.done + '/' + g.total;
  g.row.bar.style.width = (g.total ? Math.round(g.done / g.total * 100) : 0) + '%';
  g.row.el.title = g.name + ' ' + g.done + '/' + g.total;
}
function dlRefresh(){
  var pct = dlTotalBytes ? Math.round(dlGotBytes / dlTotalBytes * 100) : 0;
  dlTotalBar.style.width = pct + '%';
  dlTotalT.textContent = fmtMB(dlGotBytes) + ' / ' + fmtMB(dlTotalBytes) + ' · ' + pct + '%';
  if (dlBusy) { goDl.textContent = '⬇️ ' + pct + '%'; }
  else if (dlAllDone && dlFailed === 0) { goDl.textContent = '✅ 已就绪'; goDl.classList.add('done'); }
  else if (dlAllDone) { goDl.textContent = '⚠️ ' + dlFailed + '个失败'; }
}
async function dlOne(it){
  it.el.className = 'dlrow loading';
  it.st.textContent = '下载中';
  var got = null;
  var cdn = 'https://cdn.jsdelivr.net/gh/mogoing/mogoing@main/';
  for (var t = 0; t < 3 && got === null; t++){
    var urls = [it.url, cdn + it.url];
    for (var ui = 0; ui < urls.length && got === null; ui++){
      try {
        var r = await fetch(urls[ui], t > 0 ? { cache: 'reload' } : {});
        if (!r.ok) continue;
        var b = await r.arrayBuffer();
        if (b.byteLength === it.size) got = b;
      } catch(e){}
    }
  }
  if (got) {
    dlGotBytes += it.size;
    it.done = true;
    it.el.className = 'dlrow ok';
    it.st.textContent = '✅ 完整';
    it.bar.style.width = '100%';
    it.el.title = '已下载完整 ' + fmtMB(it.size);
  } else {
    dlFailed++;
    it.el.className = 'dlrow fail';
    it.st.textContent = '失败';
  }
  if (it.g) dlRefreshGroup(it.g);
  dlRefresh();
}
async function dlStart(){
  if (dlBusy) return;
  /* 本版本已下载完整过：直接标记就绪，不再重新下载 */
  if (dlFailed === 0 && localStorage.getItem('dl_done') === DL_VER) {
    dlGotBytes = dlTotalBytes;
    dlAllDone = true;
    dlItems.forEach(function(it){
      it.done = true;
      it.el.className = 'dlrow ok';
      it.st.textContent = '✅ 完整';
      it.bar.style.width = '100%';
    });
    Object.keys(dlGroups).forEach(function(gname){
      var g = dlGroups[gname];
      g.done = g.total;
      g.subs.forEach(function(s){
        s.done = true;
        s.el.className = 'dlrow dlsub ok';
        s.st.textContent = '✅ 完整';
        s.bar.style.width = '100%';
      });
      dlRefreshGroup(g);
    });
    dlRefresh();
    return;
  }
  dlBusy = true;
  goDl.textContent = '⬇️ 开始…';
  var allItems = dlItems.slice();
  Object.keys(dlGroups).forEach(function(gname){ allItems = allItems.concat(dlGroups[gname].subs); });
  var pend = allItems.filter(function(it){ return !it.done; });
  var CONC = 12, idx = 0;   /* 12 路并发下载，互不阻塞 */
  function dlWorker(){
    while (idx < pend.length) {
      var it = pend[idx++];
      if (it.done) continue;
      return dlOne(it).then(dlWorker);
    }
    return Promise.resolve();
  }
  var wkers = [];
  for (var w = 0; w < Math.min(CONC, pend.length); w++) wkers.push(dlWorker());
  await Promise.all(wkers);
  dlBusy = false;
  dlAllDone = true;
  if (dlFailed === 0) { try { localStorage.setItem('dl_done', DL_VER); } catch(e){} }
  dlRefresh();
}
goDl.addEventListener('click', function(){
  dlMask.classList.add('show');
  if (!dlBusy && !dlAllDone) dlStart();
});
document.getElementById('dlClose').addEventListener('click', function(){ dlMask.classList.remove('show'); });
dlMask.addEventListener('click', function(e){ if (e.target === dlMask) dlMask.classList.remove('show'); });
dlRefresh();
/* 进页面自动开始预下载 */
setTimeout(dlStart, 600);
