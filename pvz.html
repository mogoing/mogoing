<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<!-- 禁止双击放大：iOS Safari 从 iOS 10 起忽略 user-scalable=no，真正生效的是 touch-action:manipulation（上下滚动、双指缩放照常可用） -->
<style>html,body{touch-action:manipulation;-webkit-text-size-adjust:100%}</style>
<title>植物大战僵尸 · 在线版</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{
    display:flex;flex-direction:column;
    background:linear-gradient(160deg,#FFF6E8 0%,#FFE9F1 45%,#EAF4FF 100%);
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    color:#6B4E9E;user-select:none;-webkit-user-select:none;
  }
  /* ===== 顶栏 ===== */
  header{
    height:60px;flex:0 0 60px;display:flex;align-items:center;justify-content:space-between;
    padding:0 14px;gap:10px;transition:opacity .3s;
  }
  header h1{
    font-size:clamp(15px,4vw,20px);font-weight:900;letter-spacing:1px;white-space:nowrap;
    background:linear-gradient(90deg,#FF8FB1,#8B5CF6,#38BDF8);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .h-btn{
    flex:0 0 auto;border:none;border-radius:999px;cursor:pointer;
    padding:9px 14px;font-size:14px;font-weight:800;color:#fff;
    background:linear-gradient(135deg,#FFB3C1,#FF8FB1);
    box-shadow:0 6px 16px rgba(255,143,177,.4);transition:transform .15s;
  }
  .h-btn:active{transform:scale(.94)}
  .h-btn.grape{background:linear-gradient(135deg,#A78BFA,#8B5CF6);box-shadow:0 6px 16px rgba(139,92,246,.4)}
  /* ===== 画布 ===== */
  .wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:6px 10px 2px;min-height:0;transition:padding .3s}
  .canvas{
    position:relative;overflow:hidden;border-radius:18px;
    box-shadow:0 20px 46px rgba(139,92,246,.28),0 0 0 4px rgba(255,255,255,.8);
    background:linear-gradient(160deg,#FFF6E8 0%,#FFE9F1 45%,#EAF4FF 100%);
  }
  .canvas::after{
    content:"";position:absolute;inset:0;border-radius:18px;z-index:3;pointer-events:none;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.25);
  }
  /* 舞台 960×640，整体等比缩放进画布 */
  .stage{
    position:absolute;top:50%;left:50%;
    width:960px;height:640px;overflow:hidden;
    transform:translate(-50%,-50%) scale(1);transform-origin:center center;
  }
  iframe{position:absolute;top:0;left:0;width:960px;height:640px;border:0;display:block}
  .tip{
    position:absolute;left:12px;right:12px;bottom:10px;z-index:4;
    text-align:center;font-size:12px;color:#fff;opacity:.85;
    background:rgba(20,10,40,.55);border-radius:999px;padding:6px 10px;
    transition:opacity .6s;pointer-events:none;
  }
  /* ===== 竖屏下区信息卡（补上下留白） ===== */
  .info-zone{
    flex:0 0 auto;padding:2px 12px 12px;display:grid;
    grid-template-columns:repeat(3,1fr);gap:10px;max-width:960px;width:100%;margin:0 auto;
    transition:opacity .3s;
  }
  .info-card{
    border-radius:14px;padding:10px 12px;min-height:74px;
    background:rgba(255,255,255,.72);box-shadow:0 8px 22px rgba(139,92,246,.14);
    border:1.5px solid rgba(255,255,255,.9);
  }
  .info-card b{display:block;font-size:12.5px;color:#7C3AED;margin-bottom:5px;letter-spacing:.5px}
  .info-card p{font-size:11px;line-height:1.55;color:#8A7FA8}
  .info-card p i{font-style:normal;color:#FF8FB1;font-weight:700}
  /* ===== 全屏横屏模式 ===== */
  body.fs{background:#000}
  body.fs header{opacity:0;pointer-events:none}
  body.fs .wrap{padding:0}
  body.fs .canvas{border-radius:0;box-shadow:none;background:linear-gradient(160deg,#FFF6E8 0%,#FFE9F1 45%,#EAF4FF 100%)}
  body.fs .canvas::after{display:none}
  body.fs .info-zone{opacity:0;pointer-events:none}
  body.fs .tip{display:none}
  /* 全屏悬浮条（不挡游戏） */
  .fs-bar{
    position:fixed;top:14px;right:14px;z-index:20;display:none;gap:8px;
    opacity:.9;transition:opacity .3s;
  }
  body.fs .fs-bar{display:flex}
  .fs-btn{
    width:44px;height:44px;border:none;border-radius:50%;cursor:pointer;
    font-size:17px;font-weight:900;color:#fff;line-height:1;
    background:rgba(30,16,50,.6);box-shadow:0 4px 14px rgba(0,0,0,.4);
    backdrop-filter:blur(3px);
  }
  .fs-btn:active{transform:scale(.9)}
  /* ===== 暂停菜单 ===== */
  .menu{
    position:fixed;inset:0;z-index:10;display:none;
    align-items:center;justify-content:center;
    background:rgba(40,20,70,.42);backdrop-filter:blur(4px);
  }
  .menu.show{display:flex}
  .menu-card{
    width:min(84vw,320px);padding:26px 22px;border-radius:22px;text-align:center;
    background:linear-gradient(160deg,#FFF7FB,#F3EDFF);
    box-shadow:0 24px 60px rgba(90,40,140,.35);
  }
  .menu-card h2{font-size:22px;font-weight:900;color:#7C3AED;margin-bottom:6px}
  .menu-card p{font-size:13px;color:#8A7FA8;line-height:1.6;margin-bottom:14px}
  .size-row{
    display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:14px;
    padding:12px 0;border-top:1.5px dashed rgba(139,92,246,.25);border-bottom:1.5px dashed rgba(139,92,246,.25);
  }
  .size-row span{font-size:13px;font-weight:800;color:#7C3AED;min-width:80px}
  .s-btn{
    width:42px;height:42px;border:none;border-radius:50%;cursor:pointer;
    font-size:20px;font-weight:900;color:#fff;
    background:linear-gradient(135deg,#34D399,#22B8A5);
    box-shadow:0 6px 16px rgba(52,211,153,.4);
  }
  .s-btn:active{transform:scale(.9)}
  .m-btn{
    display:block;width:100%;border:none;border-radius:999px;cursor:pointer;
    padding:13px;margin-top:10px;font-size:16px;font-weight:800;color:#fff;
    background:linear-gradient(135deg,#FF8FB1,#8B5CF6);
    box-shadow:0 8px 20px rgba(139,92,246,.35);
  }
  .m-btn:active{transform:scale(.97)}
  .m-btn.ghost{background:linear-gradient(135deg,#9A8FB5,#7B6FA0);box-shadow:0 8px 20px rgba(122,111,160,.28)}
  .save-row{
    display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:10px;
    padding:10px 0;border-top:1.5px dashed rgba(139,92,246,.25);border-bottom:1.5px dashed rgba(139,92,246,.25);
  }
  .save-row input{
    width:110px;height:40px;border:2px solid #E6DDF5;border-radius:999px;padding:0 14px;
    font-size:15px;text-align:center;color:#6B4E9E;outline:none;background:#fff;
  }
  .save-row input:focus{border-color:#7C3AED}
  .m-btn.small{padding:10px 16px;font-size:14px;margin-top:0;min-height:40px;width:auto;flex:none}
  .save-info{font-size:12.5px;color:#7C3AED;min-height:16px;margin-bottom:10px;font-weight:700}
</style>
<!-- 热更新：内容版本变化自动带参重载，绕过缓存（无需重装 APK） -->
<script>
(function(){
  var VER_URL = 'https://mogoing.github.io/mogoing/version.json';
  if (!window.fetch) return;
  fetch(VER_URL, {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(j){
    var ver = String((j && j.v) || 0);
    try {
      var old = localStorage.getItem('mogoing_ver');
      if (old !== ver) {
        localStorage.setItem('mogoing_ver', ver);
        var p = location.pathname;
        var q = location.search || '';
        var sep = q.indexOf('?') >= 0 ? '&' : '?';
        location.replace(p + q + sep + 'v=' + ver);
      }
    } catch(e){}
  }).catch(function(){});
})();
</script>

</head>
<body>
  <header>
    <button class="h-btn" id="back">‹ 返回主页</button>
    <h1>植物大战僵尸</h1>
    <span style="display:flex;gap:8px">
      <button class="h-btn grape" id="fsBtn">⛶ 全屏</button>
      <button class="h-btn grape" id="pause">⏸ 暂停</button>
    </span>
  </header>

  <div class="wrap">
    <div class="canvas" id="canvas">
      <div class="stage" id="stage">
        <iframe id="game" src="https://mogoing.github.io/mogoing/2025年9月25日pvz/plantsvszombies.htm" scrolling="no" allowfullscreen></iframe>
      </div>
      <div class="tip" id="tip">加载中…经典中文完整版（冒险+小游戏+益智+生存，全量素材本地化），加载完自动消失</div>
    </div>
  </div>

  <div class="info-zone">
    <div class="info-card">
      <b>🎮 内容更全</b>
      <p>冒险模式 · 迷你游戏 · 益智模式 · <i>生存模式</i> · 图鉴/商店全开，全量素材本地备份</p>
    </div>
    <div class="info-card">
      <b>👆 玩法</b>
      <p>收集<i>阳光</i> → 选植物 → 种进草坪 → 守住房门；手机上直接点触屏幕即可</p>
    </div>
    <div class="info-card">
      <b>💾 云端存档</b>
      <p>点<i>暂停</i> → 输入当前关卡 → 存档/读档，进度跟着账号走</p>
    </div>
  </div>

  <!-- 全屏悬浮条 -->
  <div class="fs-bar">
    <button class="fs-btn" id="fsExit" title="退出全屏">✕</button>
    <button class="fs-btn" id="fsPause" title="暂停">⏸</button>
  </div>

  <div class="menu" id="menu">
    <div class="menu-card">
      <h2>⏸ 已暂停</h2>
      <p>画面只是被遮住，游戏仍在后台运行。</p>
      <div class="size-row">
        <button class="s-btn" id="minus">−</button>
        <span id="sizeLabel">画面 100%</span>
        <button class="s-btn" id="plus">＋</button>
      </div>
      <div class="save-row">
        <input type="number" id="saveLevel" min="1" max="999" placeholder="当前关卡">
        <button class="m-btn small" id="saveBtn">存档</button>
        <button class="m-btn small ghost" id="loadBtn">读档</button>
      </div>
      <p class="save-info" id="saveInfo"></p>
      <button class="m-btn" id="resume">继续游戏</button>
      <button class="m-btn ghost" id="home">返回主页</button>
    </div>
  </div>

<script>
  // ===== 登录守卫（与全站一致）=====
  if (!localStorage.getItem('blindbox_user')) location.replace('index.html');

  (function(){
    function $(id){ return document.getElementById(id); }
    var cv = $('canvas'), stage = $('stage'), game = $('game'), tip = $('tip');
    var zoom = 1;

    // 竖屏：画布贴满顶栏与信息区之间的全部空间（无下方白条）；
    // 全屏：画布铺满整个屏幕（APK 原生全屏时用其传入的实际尺寸）。
    function fit(){
      var fs = document.body.classList.contains('fs');
      var headerEl = document.querySelector('header'), infoEl = document.querySelector('.info-zone');
      if (fs){
        var W = window.__fsW || innerWidth, H = window.__fsH || innerHeight;
        cv.style.width = W + 'px';
        cv.style.height = H + 'px';
        var s = Math.min(W / 960, H / 640) * zoom;   // contain：完整显示、不裁切
        stage.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
      } else {
        var availW = Math.max(220, innerWidth - 12);
        var availH = Math.max(160, innerHeight - headerEl.offsetHeight - infoEl.offsetHeight - 8);
        cv.style.width = availW + 'px';
        cv.style.height = availH + 'px';
        var s = Math.min(availW / 960, availH / 640) * zoom;
        stage.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
      }
      $('sizeLabel').textContent = '画面 ' + Math.round(zoom * 100) + '%';
    }

    // APK 原生全屏信号（WebView 里 fullscreenchange 不触发，由 App 层派发）
    window.addEventListener('apkfs', function(e){
      var d = (e && e.detail) || {};
      window.__fsW = d.w || innerWidth;
      window.__fsH = d.h || innerHeight;
      document.body.classList.add('fs');
      fit();
      setTimeout(fit, 150);
    });
    window.addEventListener('apkfsx', function(){
      document.body.classList.remove('fs');
      window.__fsW = window.__fsH = 0;
      fit();
      setTimeout(fit, 150);
    });

    game.addEventListener('load', function(){ tip.style.opacity = '0'; });
    setTimeout(function(){ tip.style.opacity = '0'; }, 9000);

    // ===== 全屏 / 横屏 =====
    function enterFS(){
      if (document.fullscreenElement){ document.exitFullscreen(); return; }
      var el = document.documentElement;
      if (el.requestFullscreen){
        el.requestFullscreen().then(function(){
          try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape'); } catch(e){}
        }).catch(function(){});
      }
    }
    $('fsBtn').addEventListener('click', enterFS);
    $('fsExit').addEventListener('click', enterFS);
    $('fsPause').addEventListener('click', function(){ $('menu').classList.add('show'); });
    document.addEventListener('fullscreenchange', function(){
      document.body.classList.toggle('fs', !!document.fullscreenElement);
      setTimeout(fit, 120);
    });
    document.addEventListener('webkitfullscreenchange', function(){
      document.body.classList.toggle('fs', !!document.webkitFullscreenElement);
      setTimeout(fit, 120);
    });

    $('plus').addEventListener('click', function(){ zoom = Math.min(1.6, +(zoom + 0.1).toFixed(1)); fit(); });
    $('minus').addEventListener('click', function(){ zoom = Math.max(0.7, +(zoom - 0.1).toFixed(1)); fit(); });
    $('pause').addEventListener('click', function(){ $('menu').classList.add('show'); });
    $('resume').addEventListener('click', function(){ $('menu').classList.remove('show'); });
    $('home').addEventListener('click', function(){ location.href = 'main.html'; });
    $('back').addEventListener('click', function(){ location.href = 'main.html'; });

    // ===== 安卓返回键：方案一（游戏 → 主界面）；全屏时先退出全屏 =====
    window.addEventListener('androidback', function(){
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        return;
      }
      location.href = 'main.html';
    });

    // ===== 关卡存档 / 读档（Cloudflare D1）=====
    var API = 'https://api.mogoing.xyz';
    var _u = localStorage.getItem('blindbox_user') || '';
    var _p = localStorage.getItem('blindbox_pass') || '';
    var _off = localStorage.getItem('blindbox_offline') === '1';
    function saveInfo(msg){
      var el = $('saveInfo');
      el.textContent = msg;
      clearTimeout(el._t);
      el._t = setTimeout(function(){ el.textContent = ''; }, 4000);
    }
    $('saveBtn').addEventListener('click', function(){
      var lv = parseInt($('saveLevel').value, 10);
      if (!lv || lv < 1){ saveInfo('先在上方输入当前关卡数（如 3）'); return; }
      if (_off || !_u || !_p){ saveInfo('离线模式，无法保存到云端'); return; }
      fetch(API + '/api/save', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ username: _u, password: _p, game: 'pvz', data: JSON.stringify({ level: lv }) }),
        signal: AbortSignal.timeout(8000)
      }).then(function(r){ return r.json(); }).then(function(d){
        saveInfo(d && d.ok ? '已保存：第 ' + lv + ' 关' : '保存失败，请稍后重试');
      }).catch(function(){ saveInfo('保存失败（网络不通，可稍后再试）'); });
    });
    $('loadBtn').addEventListener('click', function(){
      if (_off || !_u || !_p){ saveInfo('离线模式，无法读取云端存档'); return; }
      fetch(API + '/api/save?game=pvz&username=' + encodeURIComponent(_u) + '&password=' + encodeURIComponent(_p), {
        signal: AbortSignal.timeout(8000)
      }).then(function(r){ return r.json(); }).then(function(d){
        if (d && d.ok && d.save){
          var lv = d.save.level ? parseInt(d.save.level, 10) : 0;
          if (lv){ $('saveLevel').value = lv; saveInfo('已读到存档：第 ' + lv + ' 关'); }
          else { $('saveLevel').value = ''; saveInfo('云端暂无关卡存档'); }
        } else { saveInfo('没有找到存档'); }
      }).catch(function(){ saveInfo('读取失败（网络不通，可稍后再试）'); });
    });

    window.addEventListener('resize', fit);
    window.addEventListener('orientationchange', fit);
    fit();
  })();

  // ===== PvZ 离线缓存：首次进入把整个游戏缓存到本地，之后秒开不用重新下载 =====
  // 版本戳（localStorage.mogoing_ver）变化 → 页面带参重载 → 注册 sw.js?v=N → 自动清旧缓存重新缓存
  if ('serviceWorker' in navigator) {
    var _swVer = localStorage.getItem('mogoing_ver') || '';
    navigator.serviceWorker.register('sw.js?v=' + _swVer).catch(function(){});
  }
</script>
</body>
</html>
