<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<!-- 禁止双击放大：iOS Safari 从 iOS 10 起忽略 user-scalable=no，真正生效的是 touch-action:manipulation（上下滚动、双指缩放照常可用） -->
<style>html,body{touch-action:manipulation;-webkit-text-size-adjust:100%}</style>
<title>充值 · 金币中心</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23FFD93D'/%3E%3Cstop offset='1' stop-color='%23FF9F6B'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='45' font-size='38' font-weight='800' text-anchor='middle' fill='%23fff'%3E%24%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --coral:#FF6B6B; --sunny:#FFD93D; --mint:#4ECDC4; --grape:#9B5DE5; --pink:#FF9DE2;
    --ink:#4A3F5C; --muted:#9A8FB5;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
    min-height:100vh;color:var(--ink);
    background:linear-gradient(165deg,#FFF9EC,#FFE8D6);
    display:flex;flex-direction:column;align-items:center;
    padding:20px 16px 44px;overflow-x:hidden;
  }
  .blob{position:fixed;border-radius:50%;filter:blur(56px);opacity:.5;z-index:0;animation:float 14s ease-in-out infinite}
  .blob-a{width:36vmax;height:36vmax;background:var(--sunny);top:-12vmax;left:-10vmax;opacity:.4}
  .blob-b{width:28vmax;height:28vmax;background:var(--pink);bottom:-8vmax;right:-8vmax;animation-delay:-5s;opacity:.4}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(2.6vmax)}}
  header{
    position:relative;z-index:1;width:min(94vw,520px);
    display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;
  }
  h1{
    font-size:24px;letter-spacing:2px;
    background:linear-gradient(90deg,#FF9F6B,var(--coral),#FFD93D);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .back{
    flex:none;min-height:44px;display:flex;align-items:center;
    padding:0 16px;border:none;border-radius:999px;cursor:pointer;
    font-size:14px;font-weight:700;color:#fff;
    background:linear-gradient(135deg,var(--mint),#2FBFB5);
    box-shadow:0 6px 16px rgba(47,191,181,.3);transition:transform .15s;
  }
  .back:active{transform:scale(.96)}
  .card{
    position:relative;z-index:1;width:min(94vw,520px);
    background:rgba(255,255,255,.9);backdrop-filter:blur(12px);
    border-radius:24px;padding:26px 22px;text-align:center;
    box-shadow:0 20px 60px rgba(255,159,107,.16);margin-bottom:18px;
  }
  .bal-label{font-size:14px;color:var(--muted)}
  .bal{
    display:flex;align-items:center;justify-content:center;gap:10px;margin:10px 0 4px;
  }
  .bal img{width:44px;height:44px;border-radius:50%;object-fit:cover;box-shadow:0 4px 12px rgba(255,180,60,.45)}
  .bal b{font-size:34px;font-weight:900;background:linear-gradient(90deg,#FF9F6B,var(--coral));-webkit-background-clip:text;background-clip:text;color:transparent}
  .bal small{font-size:14px;color:var(--muted);font-weight:600}
  .rule{
    margin-top:12px;font-size:12.5px;color:var(--muted);line-height:1.9;text-align:left;
    background:rgba(255,243,196,.5);border-radius:14px;padding:10px 14px;
  }
  .rule b{color:#B8860B}
  .pay-title{
    position:relative;z-index:1;font-size:16px;font-weight:800;color:var(--ink);
    margin:6px 0 14px;text-align:center;
  }
  .pay-grid{
    position:relative;z-index:1;display:flex;gap:16px;justify-content:center;flex-wrap:wrap;
    width:min(94vw,520px);
  }
  .pay-card{
    flex:1 1 220px;max-width:250px;
    background:rgba(255,255,255,.92);border-radius:20px;padding:18px 16px 16px;text-align:center;
    box-shadow:0 14px 36px rgba(155,93,229,.12);
  }
  .pay-card h3{font-size:15px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:6px}
  .pay-card.wechat h3{color:#07C160}
  .pay-card.alipay h3{color:#1677FF}
  .qr{
    width:170px;height:170px;margin:0 auto;border-radius:14px;
    background:repeating-conic-gradient(#EEE6F6 0 25%,#F7F2FC 0 50%) 0 0/20px 20px;
    border:2px dashed #D8CCE8;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;color:var(--muted);font-weight:600;text-align:center;line-height:1.7;
    padding:10px;
  }
  .pay-card .tip{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.7}
  .offline-tip{
    position:relative;z-index:1;margin-top:16px;font-size:12.5px;color:#B8860B;
    background:rgba(255,217,61,.16);border:1px dashed rgba(255,180,60,.55);
    border-radius:999px;padding:7px 16px;display:none;
  }
  .offline-tip.show{display:block}
  @media (max-width:480px){
    .pay-grid{flex-direction:column;align-items:center}
    .pay-card{max-width:100%;width:100%}
  }
</style>
<!-- 热更新：内容版本变化自动带参重载，绕过缓存（无需重装 APK） -->
<script>
(function(){
  var VER_URL = 'https://mogoing.github.io/mogoing/version.json';
  if (!window.fetch) return;
  fetch(VER_URL, {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(j){
    var ver = String((j && j.v) || 0);
    try {
      var old = localStorage.getItem('mogoing_ver');
      if (old !== ver) {
        localStorage.setItem('mogoing_ver', ver);
        var p = location.pathname;
        var q = location.search || '';
        var sep = q.indexOf('?') >= 0 ? '&' : '?';
        location.replace(p + q + sep + 'v=' + ver);
      }
    } catch(e){}
  }).catch(function(){});
})();
</script>

</head>
<body>
  <div class="blob blob-a"></div><div class="blob blob-b"></div>
  <header>
    <h1>💰 金币中心</h1>
    <button class="back" id="back">‹ 返回主页</button>
  </header>
  <div class="card">
    <p class="bal-label">当前金币余额</p>
    <div class="bal">
      <img src="assets/coin.png" alt="金币">
      <b id="coinNum">0</b>
      <small>枚</small>
    </div>
    <div class="rule">
      <b>金币怎么赚？</b><br>
      ① 打破某款游戏的个人最高分：+1 金币<br>
      ② 连续 5 把都没赢过最高分（辛苦费）：+1 金币<br>
      ③ 充值：<b>1 金币 = 1 元</b>，扫码付款后找管理员到账
    </div>
  </div>
  <p class="pay-title">扫码充值 · 付款后联系管理员加币</p>
  <div class="pay-grid">
    <div class="pay-card wechat">
      <h3>💚 微信支付</h3>
      <div class="qr"><img src="assets/wechat_qr.png" alt="微信收款码" style="width:100%;height:100%;object-fit:contain;border-radius:10px"></div>
      <p class="tip">微信扫码付款<br>备注：你的账号名</p>
    </div>
    <div class="pay-card alipay">
      <h3>💙 支付宝</h3>
      <div class="qr"><img src="assets/alipay_qr.png" alt="支付宝收款码" style="width:100%;height:100%;object-fit:contain;border-radius:10px"></div>
      <p class="tip">支付宝扫码付款<br>备注：你的账号名</p>
    </div>
  </div>
  <div class="offline-tip" id="offlineTip">当前为离线模式，余额可能不是最新，请在网络正常时登录查看</div>

<script>
  const API = 'https://api.mogoing.xyz';
  const user = localStorage.getItem('blindbox_user');
  if (!user) location.replace('index.html');
  const pass = localStorage.getItem('blindbox_pass') || '';
  const offline = localStorage.getItem('blindbox_offline') === '1';

  document.getElementById('back').addEventListener('click', () => location.href = 'main.html');

  const coinNum = document.getElementById('coinNum');
  function setCoin(n) { coinNum.textContent = n; localStorage.setItem('blindbox_coins', String(n)); }
  setCoin(localStorage.getItem('blindbox_coins') || 0);

  if (offline) {
    document.getElementById('offlineTip').classList.add('show');
  } else if (user && pass) {
    fetch(API + '/api/user?username=' + encodeURIComponent(user) + '&password=' + encodeURIComponent(pass), { signal: AbortSignal.timeout(8000) })
      .then(r => r.json())
      .then(d => { if (d && d.ok && d.user) setCoin(d.user.coins); })
      .catch(() => {});
  }
</script>
<script>
// ===== 安卓返回键：本页按返回 = 回主界面 =====
window.addEventListener('androidback', function(){ location.href = 'main.html'; });
</script>
</body>
</html>
