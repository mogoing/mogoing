<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<!-- 禁止双击放大：iOS Safari 从 iOS 10 起忽略 user-scalable=no，真正生效的是 touch-action:manipulation（上下滚动、双指缩放照常可用） -->
<style>html,body{touch-action:manipulation;-webkit-text-size-adjust:100%}</style>
<title>连连看 · 随机关卡</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23FF6B6B'/%3E%3Cstop offset='1' stop-color='%23FFD93D'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle'%3E%F0%9F%8D%92%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --coral:#FF6B6B; --sunny:#FFD93D; --mint:#4ECDC4; --grape:#9B5DE5; --pink:#FF9DE2;
    --ink:#4A3F5C; --muted:#9A8FB5;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
    color:var(--ink);overflow:hidden;
    background:linear-gradient(165deg,#FFF6E9,#FFE8D6);
    display:flex;flex-direction:column;align-items:center;
  }

  .top{
    position:relative;z-index:2;width:min(94vw,520px);
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:14px 0 10px;
  }
  .icon-btn{
    flex:none;width:44px;height:44px;border:none;border-radius:14px;cursor:pointer;
    background:rgba(255,255,255,.9);color:var(--ink);font-size:20px;font-weight:800;
    box-shadow:0 4px 14px rgba(155,93,229,.14);display:flex;align-items:center;justify-content:center;
    transition:transform .15s;
  }
  .icon-btn:active{transform:scale(.92)}
  h1{
    font-size:20px;letter-spacing:2px;
    background:linear-gradient(90deg,var(--grape),var(--coral),var(--sunny));
    -webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800;
  }
  .hud{
    position:relative;z-index:2;width:min(94vw,520px);
    display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
    margin-bottom:12px;
  }
  .chip{
    background:rgba(255,255,255,.85);
    border-radius:999px;padding:7px 14px;font-size:14px;font-weight:700;
    box-shadow:0 3px 10px rgba(155,93,229,.12);display:flex;align-items:center;gap:6px;
  }
  .chip b{color:var(--coral);font-size:15px}
  .chip .shape{color:var(--grape)}
  .chip .bar{width:90px;height:8px;border-radius:99px;background:#F0E6FA;overflow:hidden}
  .chip .bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--coral),var(--sunny));transition:width .35s}
  .btn{
    border:none;cursor:pointer;border-radius:999px;padding:8px 16px;min-height:44px;
    font-size:14px;font-weight:700;color:#fff;
    background:linear-gradient(135deg,var(--coral),var(--grape));
    box-shadow:0 5px 14px rgba(255,107,107,.3);transition:transform .15s;
  }
  .btn:active{transform:scale(.95)}
  .btn.ghost{background:rgba(255,255,255,.9);color:var(--ink);box-shadow:0 3px 10px rgba(74,63,92,.14)}

  .board-wrap{
    position:relative;z-index:1;width:min(94vw,520px);
    padding:14px;border-radius:26px;
    background:rgba(255,255,255,.66);
    box-shadow:0 18px 50px rgba(155,93,229,.16), inset 0 0 0 1px rgba(255,255,255,.7);
  }
  .board{
    position:relative;width:100%;aspect-ratio:1;
  }
  .tile{
    position:absolute;
    left:calc(var(--col) * var(--cell));
    top:calc(var(--row) * var(--cell));
    width:var(--cell);height:var(--cell);
    cursor:pointer;
    background:linear-gradient(145deg,var(--c1),var(--c2));  /* 方形底板（不圆角） */
    box-shadow:0 4px 10px rgba(0,0,0,.14);
  }
  .tile::before{  /* 圆角白卡 */
    content:"";position:absolute;inset:14%;border-radius:12px;
    background:rgba(255,255,255,.94);box-shadow:0 2px 8px rgba(0,0,0,.1);
  }
  .tile .face{
    position:absolute;inset:12%;z-index:1;
    display:flex;align-items:center;justify-content:center;
    font-size:calc(var(--cell) * .44);line-height:1;
  }
  .tile.sel{transform:translateY(-4px) scale(1.08);z-index:3;box-shadow:0 0 0 3px #fff,0 0 0 6px var(--grape),0 14px 24px rgba(155,93,229,.35)}
  .tile.pop{animation:pop .38s cubic-bezier(.3,1.4,.5,1) forwards}
  @keyframes pop{
    0%{transform:scale(1);opacity:1}
    40%{transform:scale(1.3) rotate(6deg);opacity:1}
    100%{transform:scale(0) rotate(-12deg);opacity:0}
  }
  .tile.bad{animation:bad .34s}
  @keyframes bad{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .tile.enter{animation:enter .32s cubic-bezier(.2,.8,.3,1.3) both}
  @keyframes enter{from{transform:scale(0) rotate(8deg);opacity:0}to{transform:scale(1);opacity:1}}
  .board .pv{position:absolute;border-radius:50%;pointer-events:none;z-index:6;animation:pvfly .5s ease-out forwards}
  @keyframes pvfly{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
  .board .flash{position:absolute;width:calc(var(--cell) * 1.15);height:calc(var(--cell) * 1.15);margin-left:calc(var(--cell) * -.575);margin-top:calc(var(--cell) * -.575);border-radius:18px;pointer-events:none;z-index:6;background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,217,61,.6) 55%,transparent 78%);animation:flash .5s ease-out forwards}
  @keyframes flash{from{opacity:0;transform:scale(.35)}35%{opacity:1}to{opacity:0;transform:scale(1.45)}}
  #cv{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}

  .toast{
    position:fixed;left:50%;top:18%;transform:translateX(-50%) translateY(-8px);
    background:rgba(74,63,92,.92);color:#fff;font-size:14px;font-weight:700;
    padding:10px 18px;border-radius:999px;z-index:40;opacity:0;transition:.3s;pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .mask{
    display:none;position:fixed;inset:0;z-index:30;background:rgba(74,63,92,.45);
    align-items:center;justify-content:center;
  }
  .mask.show{display:flex;animation:fadeIn .22s}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .panel{
    width:min(84vw,330px);background:linear-gradient(165deg,#FFF6E9,#FFE8D6);
    border-radius:26px;padding:26px 22px;text-align:center;
    box-shadow:0 24px 60px rgba(74,63,92,.35);
  }
  .mask.show .panel{animation:panelIn .3s cubic-bezier(.2,1.3,.4,1)}
  @keyframes panelIn{from{transform:scale(.85) translateY(12px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
  .panel h2{font-size:22px;margin-bottom:6px;background:linear-gradient(90deg,var(--grape),var(--coral));-webkit-background-clip:text;background-clip:text;color:transparent}
  .panel p{color:var(--muted);font-size:14px;margin-bottom:18px}
  .row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
</style>
<!-- 热更新：内容版本变化自动带参重载，绕过缓存（无需重装 APK） -->
<script>
(function(){
  var VER_URL = 'https://mogoing.github.io/mogoing/version.json';
  if (!window.fetch) return;
  fetch(VER_URL, {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(j){
    var ver = String((j && j.v) || 0);
    try {
      var old = localStorage.getItem('mogoing_ver');
      if (old !== ver) {
        localStorage.setItem('mogoing_ver', ver);
        var p = location.pathname;
        var q = location.search || '';
        var sep = q.indexOf('?') >= 0 ? '&' : '?';
        location.replace(p + q + sep + 'v=' + ver);
      }
    } catch(e){}
  }).catch(function(){});
})();
</script>

</head>
<body>

  <div class="top">
    <button class="icon-btn" id="back" aria-label="返回">‹</button>
    <h1>连连看</h1>
    <button class="icon-btn" id="pause" aria-label="暂停">‖</button>
  </div>

  <div class="hud">
    <div class="chip">关卡 <b id="level">1</b></div>
    <div class="chip">形状 <span class="shape" id="shapeName">—</span></div>
    <div class="chip">已消 <b id="cleared">0</b>/<span id="total">0</span></div>
    <div class="chip"><span class="bar"><i id="pbar"></i></span></div>
    <button class="btn ghost" id="reshuffle">洗牌</button>
  </div>

  <div class="board-wrap">
    <div class="board" id="board">
      <canvas id="cv"></canvas>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="mask" id="pauseMask">
    <div class="panel">
      <h2>已暂停</h2>
      <p>休息一下再战</p>
      <div class="row">
        <button class="btn" id="resume">继续</button>
        <button class="btn ghost" id="restart">重新开始</button>
        <button class="btn ghost" id="quitHome">返回主页</button>
      </div>
    </div>
  </div>

  <div class="mask" id="winMask">
    <div class="panel">
      <h2>过关啦！</h2>
      <p id="winText">清完啦！下一关随机新形状。</p>
      <p id="winCoinTip" style="display:none;color:#B8860B;font-weight:700;margin-bottom:14px"></p>
      <div class="row">
        <button class="btn" id="nextLevel">下一关</button>
        <button class="btn ghost" id="winHome">返回主页</button>
      </div>
    </div>
  </div>

<script>
(function(){
  'use strict';
  /* ===== 后端得分上报（过关即上报关卡数）===== */
  const API = 'https://api.mogoing.xyz';
  const _u = localStorage.getItem('blindbox_user') || '';
  const _p = localStorage.getItem('blindbox_pass') || '';
  const _off = localStorage.getItem('blindbox_offline') === '1';
  function reportScore(game, score){
    if (_off || !_u || !_p) return;
    fetch(API + '/api/score', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ username: _u, password: _p, game, score }),
      signal: AbortSignal.timeout(8000)
    }).then(r => r.json()).then(d => {
      if (d && d.ok && d.coins_gained > 0) {
        localStorage.setItem('blindbox_coins', String(d.balance || 0));
        const t = $('winCoinTip');
        if (t) {
          t.textContent = d.beat ? '🏅 打破纪录 +1 金币！' : '🍀 连败辛苦费 +1 金币！';
          t.style.display = 'block';
          setTimeout(() => t.style.display = 'none', 4000);
        }
      }
    }).catch(() => {});
  }
  /* ===== 配置 ===== */
  const N = 8;
  const EMOJIS = ['🦀','🐟','🐰','🍎','🍐','🥭','🍋','🍇','🥦','🍉','🥒','🍔','🍒'];
  const COLORS = [
    ['#FF8A8A','#FF6B6B'],['#6FE3DA','#4ECDC4'],['#F2A0E0','#FF9DE2'],
    ['#FF9F6B','#FF8A50'],['#FFE066','#FFD93D'],['#A8E6CF','#7BDBCB'],
    ['#C9B6FF','#9B5DE5'],['#FFB7D9','#FF8FC0'],['#8FE388','#6BCB5A'],
    ['#7FD8F7','#4FB8E8'],['#E3E06B','#C9C83F'],['#FFA24E','#F58B3A'],
    ['#F7A8A8','#EF7A7A'],
  ];
  const SHAPES = [
    { name:'爱心', mask:['00000000','00111100','01111110','11111111','11111111','01111110','00111100','00000000'] },
    { name:'U 型', mask:['10000001','10000001','10000001','10000001','10000001','11111111','11111111','11111111'] },
    { name:'X 型', mask:['11000011','11100111','01111110','00111100','00111100','01111110','11100111','11000011'] },
    { name:'圆形', mask:['00000000','01111110','11111111','11111111','11111111','11111111','01111110','00000000'] },
    { name:'环形', mask:['00111100','01111110','11000011','11000011','11000011','11000011','01111110','00111100'] },
    { name:'方框', mask:['11111111','10000001','10000001','10000001','10000001','10000001','10000001','11111111'] },
    { name:'菱形', mask:['00011000','00111100','01111110','11111111','11111111','01111110','00111100','00011000'] },
    { name:'十字', mask:['00011000','00011000','00011000','11111111','11111111','00011000','00011000','00011000'] },
    { name:'闪电', mask:['11111100','01111100','00111000','00111000','00011000','00011000','00001100','00001100'] },
    { name:'箭头', mask:['00000011','00000111','00001111','11111111','11111111','00001111','00000111','00000011'] },
    { name:'H 型', mask:['10000001','10000001','10000001','11111111','11111111','10000001','10000001','10000001'] },
    { name:'M 型', mask:['10000001','11000011','11100111','11111111','10111101','10011001','10000001','10000001'] },
    { name:'数字8', mask:['01111110','10000001','10000001','01111110','01111110','10000001','10000001','01111110'] },
    { name:'数字0', mask:['00111100','01111110','11000011','11000011','11000011','11000011','01111110','00111100'] },
    { name:'日',    mask:['11111111','10000001','10000001','10000001','11111111','10000001','10000001','11111111'] },
    { name:'田',    mask:['11111111','10011001','10011001','10011001','11111111','10011001','10011001','11111111'] },
    { name:'井',    mask:['00011000','00011000','11111111','11111111','11111111','11111111','00011000','00011000'] },
    { name:'C 型',  mask:['00111111','01111111','01110000','01110000','01110000','01110000','01111111','00111111'] },
    { name:'V 型',  mask:['11000011','11000011','11000011','01100110','01100110','00111100','00011000','00011000'] },
    { name:'T 型',  mask:['11111111','11111111','00111100','00111100','00111100','00111100','00111100','00111100'] },
    { name:'沙漏',  mask:['11111111','01111110','00111100','00011000','00011000','00111100','01111110','11111111'] },
    { name:'W 型',  mask:['10000001','10000001','10011001','10111101','11100111','11000011','11000011','10000001'] },
    { name:'N 型',  mask:['10000001','11000001','11100001','10110001','10011001','10001101','10000111','10000011'] },
    { name:'房子',  mask:['00011000','00111100','01111110','11111111','11111111','10000001','10000001','10000001'] },
    { name:'蝴蝶',  mask:['10000001','11000011','11100111','01111110','01100110','01100110','01111110','00111100'] },
    { name:'星星',  mask:['00011000','00111100','01111110','11111111','01111110','01100110','01111110','00100100'] },
  ];

  /* ===== DOM ===== */
  const boardEl = document.getElementById('board');
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);

  /* ===== 状态 ===== */
  let grid = [];            // grid[r][c] = {type, el} | undefined
  let sel = null;           // {r,c,type}
  let busy = false;
  let level = 1, cleared = 0, total = 0, cell = 0;
  let shape = SHAPES[0];
  let toastTimer = null;

  /* ===== 工具 ===== */
  function buildTypes(n){
    const arr = [];
    for (let i=0;i<n/2;i++){
      const t = i % EMOJIS.length;
      arr.push(t, t);
    }
    for (let i=arr.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  }
  function canPass(r,c){
    if (r < -1 || r > N || c < -1 || c > N) return false; // 先挡掉超出外圈的越界（防索引越界死循环）
    if (r < 0 || r >= N || c < 0 || c >= N) return true;  // 外圈一圈可通行
    return grid[r][c] == null; // undefined 与 null（已消除）均可通行
  }
  function toPx(r,c){
    const rect = boardEl.getBoundingClientRect();
    return { x: (c+0.5)*rect.width/N, y: (r+0.5)*rect.height/N };
  }

  /* ===== 路径：BFS 数组化（无对象分配，转弯≤2，允许外圈） ===== */
  function findPath(a, b){
    if (a.type !== b.type) return null;
    const dr = [-1,1,0,0], dc = [0,0,-1,1];
    const W = N + 2;                 // 索引 i = (r+1)*W + (c+1)，r/c ∈ -1..8
    const S = W*W*4;
    const prev = new Int32Array(S).fill(-1);
    const turns = new Uint8Array(S).fill(99);
    const q = new Int32Array(S * 4); // 同一状态因转弯代价松弛最多入队多次，队列必须放大
    let qh = 0, qt = 0;
    for (let d=0;d<4;d++){
      const nr = a.r+dr[d], nc = a.c+dc[d];
      if (nr===b.r && nc===b.c) return [{r:a.r,c:a.c},{r:nr,c:nc}];
      if (!canPass(nr,nc)) continue;
      const st = ((nr+1)*W + (nc+1))*4 + d;
      prev[st] = -2; turns[st] = 0; q[qt++] = st;
    }
    while (qh < qt){
      const st = q[qh++];
      const d0 = st & 3;
      const i = (st - d0) >> 2;
      const r = ((i / W) | 0) - 1, c = (i % W) - 1;
      const t0 = turns[st];
      for (let d=0;d<4;d++){
        const nr = r+dr[d], nc = c+dc[d];
        if (nr===b.r && nc===b.c){
          if (t0 + (d!==d0 ? 1 : 0) > 2) continue; // 到终点还会拐弯则非法
          const path = [{r:nr,c:nc}];
          let cur = st;
          while (cur !== -2){
            const dd = cur & 3;
            const ii = (cur - dd) >> 2;
            path.push({ r: ((ii / W) | 0) - 1, c: (ii % W) - 1 });
            cur = prev[cur];
          }
          path.push({r:a.r,c:a.c});
          return path.reverse();
        }
        if (!canPass(nr,nc)) continue;
        const nt = t0 + (d!==d0 ? 1 : 0);
        if (nt > 2) continue;
        const st2 = ((nr+1)*W + (nc+1))*4 + d;
        if (nt >= turns[st2]) continue;
        turns[st2] = nt; prev[st2] = st; q[qt++] = st2;
      }
    }
    return null;
  }
  function anyPair(){
    const groups = new Map();
    for (let r=0;r<N;r++) for (let c=0;c<N;c++){
      const g = grid[r][c];
      if (!g) continue;
      const arr = groups.get(g.type) || [];
      if (arr.length === 0) groups.set(g.type, arr);
      arr.push({r, c, type: g.type});
    }
    for (const arr of groups.values()){
      for (let i=0;i<arr.length;i++) for (let j=i+1;j<arr.length;j++){
        if (findPath(arr[i], arr[j])) return true;
      }
    }
    return false;
  }

  /* ===== 建盘 / 渲染 ===== */
  function initGrid(s){
    grid = [];
    const cells = [];
    for (let r=0;r<N;r++) for (let c=0;c<N;c++) if (s.mask[r][c] === '1') cells.push([r,c]);
    const types = buildTypes(cells.length);
    cells.forEach((p,i) => {
      if (!grid[p[0]]) grid[p[0]] = [];
      grid[p[0]][p[1]] = { type: types[i], el: null };
    });
    for (let r=0;r<N;r++) if (!grid[r]) grid[r] = []; // 补全无格子的行，避免 render/canPass 崩溃
    total = cells.length;
    cleared = 0;
    $('total').textContent = total;
    $('shapeName').textContent = s.name;
    updateHud();
    render();
  }
  function render(){
    boardEl.querySelectorAll('.tile').forEach(n => n.remove());
    const frag = document.createDocumentFragment();
    for (let r=0;r<N;r++) for (let c=0;c<N;c++){
      const g = grid[r][c];
      if (!g) continue;
      const el = document.createElement('div');
      el.className = 'tile enter';
      el.style.setProperty('--row', r);
      el.style.setProperty('--col', c);
      el.style.setProperty('--c1', COLORS[g.type][0]);
      el.style.setProperty('--c2', COLORS[g.type][1]);
      el.innerHTML = '<span class="face">' + EMOJIS[g.type] + '</span>';
      el.addEventListener('click', () => tap(r, c));
      frag.appendChild(el);
      g.el = el;
    }
    boardEl.appendChild(frag);
  }

  /* ===== 连线特效：setTimeout 推进（不依赖 rAF）→ 停留 → done ===== */
  function drawPath(path, done){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = boardEl.getBoundingClientRect();
    cv.width = Math.max(1, Math.round(rect.width*dpr));
    cv.height = Math.max(1, Math.round(rect.height*dpr));
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,rect.width,rect.height);
    const pts = path.map(p => toPx(p.r, p.c));
    let totalLen = 0;
    for (let i=1;i<pts.length;i++) totalLen += Math.hypot(pts[i].x-pts[i-1].x, pts[i].y-pts[i-1].y);
    const FRAMES = 18, STEP = 16; // ≈288ms 推进
    let f = 0;
    const tick = setInterval(() => {
      f++;
      const t = Math.min(1, f/FRAMES);
      const eased = t < .5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
      ctx.clearRect(0,0,rect.width,rect.height);
      ctx.save();
      ctx.strokeStyle = 'rgba(74,63,92,.5)';
      ctx.lineWidth = 15; ctx.lineCap='round'; ctx.lineJoin='round';
      ctx.setLineDash([totalLen]); ctx.lineDashOffset = totalLen*(1-eased);
      ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
      for (let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y);
      ctx.stroke();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 8;
      ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
      for (let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y);
      ctx.stroke();
      ctx.restore();
      const dist = totalLen*eased;
      let acc = 0, curX = pts[0].x, curY = pts[0].y;
      for (let i=1;i<pts.length;i++){
        const seg = Math.hypot(pts[i].x-pts[i-1].x, pts[i].y-pts[i-1].y);
        if (acc+seg >= dist){
          const tt = seg>0 ? Math.min(1,(dist-acc)/seg) : 0;
          curX = pts[i-1].x+(pts[i].x-pts[i-1].x)*tt;
          curY = pts[i-1].y+(pts[i].y-pts[i-1].y)*tt;
          break;
        }
        acc += seg;
      }
      ctx.beginPath(); ctx.arc(curX, curY, 7, 0, 7);
      ctx.fillStyle = '#FFD93D'; ctx.shadowColor='rgba(255,217,61,.9)'; ctx.shadowBlur=14; ctx.fill();
      ctx.beginPath(); ctx.arc(pts[0].x, pts[0].y, 7, 0, 7); ctx.fillStyle='#fff'; ctx.shadowColor='rgba(255,107,107,.8)'; ctx.shadowBlur=10; ctx.fill();
      ctx.beginPath(); ctx.arc(pts[pts.length-1].x, pts[pts.length-1].y, 7, 0, 7); ctx.fillStyle='#fff'; ctx.shadowColor='rgba(255,107,107,.8)'; ctx.shadowBlur=10; ctx.fill();
      if (f >= FRAMES){
        clearInterval(tick);
        setTimeout(() => { ctx.clearRect(0,0,rect.width,rect.height); done(); }, 360); // 停留
      }
    }, STEP);
  }
  function burst(x, y, c1){
    for (let i=0;i<6;i++){
      const p = document.createElement('i');
      p.className = 'pv';
      const a = Math.random()*Math.PI*2, d = cell*(0.4+Math.random()*0.5);
      p.style.cssText = 'left:'+x+'px;top:'+y+'px;width:'+Math.round(cell*.14)+'px;height:'+Math.round(cell*.14)+'px;background:'+(c1||'#FFD93D')+';--dx:'+(Math.cos(a)*d)+'px;--dy:'+(Math.sin(a)*d - cell*.3)+'px';
      boardEl.appendChild(p);
      setTimeout(() => p.remove(), 520);
    }
  }
  function flashAt(x, y){
    const f = document.createElement('i');
    f.className = 'flash';
    f.style.left = x + 'px';
    f.style.top = y + 'px';
    boardEl.appendChild(f);
    setTimeout(() => f.remove(), 500);
  }

  /* ===== 交互 ===== */
  function tap(r, c){
    if (busy) return;
    const g = grid[r][c];
    if (!g) return;
    if (sel){
      if (sel.r===r && sel.c===c){ deselect(); return; }
      const a = sel, b = {r, c, type: g.type};
      deselect();
      tryPair(a, b);
    } else {
      sel = {r, c, type: g.type};
      g.el.classList.add('sel');
    }
  }
  function deselect(){
    if (sel){ grid[sel.r][sel.c].el.classList.remove('sel'); sel = null; }
  }
  function tryPair(a, b){
    const path = findPath(a, b);
    if (!path){
      const ea = grid[a.r][a.c].el, eb = grid[b.r][b.c].el;
      ea.classList.add('bad'); eb.classList.add('bad');
      setTimeout(() => { ea.classList.remove('bad'); eb.classList.remove('bad'); }, 340);
      return;
    }
    busy = true;
    let doneFlag = false;
    const finish = () => {
      if (doneFlag) return;
      doneFlag = true;
      const ea = grid[a.r][a.c].el, eb = grid[b.r][b.c].el;
      if (!ea || !eb){ busy = false; return; }
      const pa = toPx(a.r,a.c), pb = toPx(b.r,b.c);
      ea.classList.add('pop'); eb.classList.add('pop');
      burst(pa.x, pa.y, COLORS[grid[a.r][a.c].type][0]);
      burst(pb.x, pb.y, COLORS[grid[b.r][b.c].type][0]);
      flashAt(pa.x, pa.y);
      grid[a.r][a.c] = null; grid[b.r][b.c] = null;
      cleared += 2;
      updateHud();
      setTimeout(() => { ea.remove(); eb.remove(); busy = false; afterRemove(); }, 400);
    };
    drawPath(path, finish);
    setTimeout(() => { if (busy && !doneFlag) busy = false; }, 1500); // 兜底解锁
  }
  function afterRemove(){
    if (cleared >= total){ showWin(); return; }
    if (!anyPair()){
      toast('没有可消除的组合，自动洗牌');
      setTimeout(shuffleTiles, 500);
    }
  }
  function shuffleTiles(){
    busy = true;
    const items = [];
    for (let r=0;r<N;r++) for (let c=0;c<N;c++) if (grid[r][c]) items.push(grid[r][c]);
    const types = buildTypes(items.length);
    let k = 0;
    items.forEach(g => {
      g.type = types[k++];
      g.el.style.setProperty('--c1', COLORS[g.type][0]);
      g.el.style.setProperty('--c2', COLORS[g.type][1]);
      g.el.querySelector('.face').textContent = EMOJIS[g.type];
    });
    setTimeout(() => { busy = false; }, 380);
  }

  /* ===== HUD / 弹层 ===== */
  function updateHud(){
    $('cleared').textContent = cleared;
    $('pbar').style.width = total ? (cleared/total*100) + '%' : '0%';
  }
  function toast(msg){
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
  }
  function showWin(){
    $('winText').textContent = '「' + shape.name + '」清完啦！下一关随机新形状。';
    $('winMask').classList.add('show');
    reportScore('lian', level);
  }
  function newGame(lv){
    level = lv;
    $('level').textContent = level;
    $('winMask').classList.remove('show');
    let s;
    do { s = SHAPES[Math.floor(Math.random()*SHAPES.length)]; } while (SHAPES.length>1 && s===shape);
    shape = s;
    initGrid(s);
  }
  function checkScreen(){
    const rect = boardEl.getBoundingClientRect();
    cell = rect.width / N;
    boardEl.style.setProperty('--cell', cell + 'px');
  }

  /* ===== 事件 ===== */
  $('back').addEventListener('click', () => location.href='main.html');
  $('pause').addEventListener('click', () => $('pauseMask').classList.add('show'));
  $('resume').addEventListener('click', () => $('pauseMask').classList.remove('show'));
  $('quitHome').addEventListener('click', () => location.href='main.html');
  $('restart').addEventListener('click', () => { $('pauseMask').classList.remove('show'); newGame(1); });
  $('reshuffle').addEventListener('click', () => { if (!busy) shuffleTiles(); });
  $('nextLevel').addEventListener('click', () => newGame(level+1));
  $('winHome').addEventListener('click', () => location.href='main.html');
  window.addEventListener('resize', checkScreen);

  /* 登录守卫 */
  if (!localStorage.getItem('blindbox_user')) location.replace('index.html');

  checkScreen();
  newGame(1);
})();
</script>
<script>
// ===== 安卓返回键：本页按返回 = 回主界面 =====
window.addEventListener('androidback', function(){ location.href = 'main.html'; });
</script>
