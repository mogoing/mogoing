<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>纸卡丁车</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#efe6cf;font-family:system-ui,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}

  /* 顶部工具栏 */
  .toolbar{
    position:fixed;top:0;left:0;right:0;z-index:10;
    height:52px;display:flex;align-items:center;justify-content:space-between;
    padding:0 14px;gap:10px;
    background:rgba(255,255,255,.88);backdrop-filter:blur(10px);
    box-shadow:0 2px 12px rgba(0,0,0,.08);
    transition:transform .3s ease,opacity .3s ease;
  }
  .toolbar.hide{transform:translateY(-100%);opacity:0;pointer-events:none}

  .tb-btn{
    flex:none;width:40px;height:40px;border:none;border-radius:12px;cursor:pointer;
    background:rgba(124,58,237,.08);display:flex;align-items:center;justify-content:center;
    transition:transform .15s,background .15s;
  }
  .tb-btn:hover{background:rgba(124,58,237,.16);transform:translateY(-1px)}
  .tb-btn:active{transform:scale(.92)}
  .tb-btn svg{width:22px;height:22px;stroke:#7c3aed;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

  .tb-title{
    flex:1;text-align:center;font-size:16px;font-weight:800;color:#2d2a32;
    letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }

  /* 游戏画布容器 */
  .game-wrap{
    position:fixed;top:52px;left:0;right:0;bottom:0;
    transition:top .3s ease;
  }
  .game-wrap.full{top:0}
  .game-wrap iframe{
    width:100%;height:100%;border:none;display:block;
    background:#efe6cf;
  }

  /* 全屏时隐藏工具栏 */
  :fullscreen .toolbar{display:none}
  :fullscreen .game-wrap{top:0}
</style>
</head>
<body>
  <div class="toolbar" id="toolbar">
    <button class="tb-btn" id="backBtn" title="返回盲盒">
      <svg viewBox="0 0 24 24"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
    </button>
    <div class="tb-title">纸卡丁车</div>
    <button class="tb-btn" id="fsBtn" title="全屏">
      <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
    </button>
  </div>
  <div class="game-wrap" id="gameWrap">
    <iframe src="kagit-kart/" id="gameFrame" allow="fullscreen; autoplay; gamepad" title="纸卡丁车"></iframe>
  </div>

<script>
  const backBtn = document.getElementById('backBtn');
  const fsBtn = document.getElementById('fsBtn');
  const toolbar = document.getElementById('toolbar');
  const gameWrap = document.getElementById('gameWrap');

  // 返回盲盒
  backBtn.addEventListener('click', () => {
    location.href = 'main.html';
  });

  // 全屏切换
  function toggleFullscreen(){
    if (!document.fullscreenElement){
      document.documentElement.requestFullscreen().catch(()=>{});
    } else {
      document.exitFullscreen();
    }
  }
  fsBtn.addEventListener('click', toggleFullscreen);

  // 全屏状态切换图标
  document.addEventListener('fullscreenchange', () => {
    const fs = !!document.fullscreenElement;
    fsBtn.innerHTML = fs
      ? '<svg viewBox="0 0 24 24"><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/></svg>'
      : '<svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>';
    fsBtn.title = fs ? '退出全屏' : '全屏';
  });

  // 双击游戏区域切换全屏
  gameWrap.addEventListener('dblclick', toggleFullscreen);
</script>
</body>
</html>
