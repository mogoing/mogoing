<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>播放</title>
</head>
<body>

<style>
  /* 播放页：整页铺满，歌词居中，底部无播放条（由外壳隐藏） */
  #viewHost{padding:0}
  #viewHost > *{width:100%;margin-left:0;margin-right:0}
  .np-page{
    width:100%;min-height:100%;display:flex;flex-direction:column;
    padding:0 10px 8px;
  }

  /* ===== 顶部曲目条：封面 + 名称 + 我喜欢的按钮 + 来源 ===== */
  .npstrip{
    flex:none;display:flex;align-items:center;gap:9px;
    padding:9px 12px;border-radius:16px;background:#fff;
    box-shadow:0 3px 14px rgba(90,70,150,.08);
  }
  .npstrip .cv{
    flex:none;width:40px;height:40px;border-radius:12px;position:relative;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:900;color:#fff;background:linear-gradient(150deg,#C7B2FA,#FFB7D8);
  }
  .npstrip .cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
  .npstrip .cv img.ld{opacity:1}
  .npstrip .tx2{flex:1;min-width:0}
  .npstrip b{
    display:block;font-size:13.5px;font-weight:900;color:var(--ink);line-height:1.3;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .npstrip em{
    display:block;font-style:normal;font-size:10px;font-weight:600;color:var(--muted);margin-top:1px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  /* 我喜欢的按钮（在来源左边） */
  #nLike{
    flex:none;width:30px;height:30px;border:none;border-radius:50%;cursor:pointer;
    background:#FFF0F4;color:#F0457D;display:flex;align-items:center;justify-content:center;
    transition:transform .16s,background .2s;
  }
  #nLike:active{transform:scale(.86)}
  #nLike.on{background:#FFE3EB}
  #nSrc{
    flex:none;display:none;align-items:center;gap:4px;
    height:19px;padding:0 7px;border-radius:6px;
    background:#F5F3FA;font-size:9px;font-weight:900;color:#8B82A8;
    white-space:nowrap;
  }
  #nSrc s{width:4.5px;height:4.5px;border-radius:50%;text-decoration:none;display:block}
  #nSrc.ne s{background:#D93B3B}
  #nSrc.qq s{background:#18A05A}
  #nSrc.kg s{background:#2F81D9}
  #nSrc.bi s{background:#F4517A}

  /* ===== 圆形唱片 ===== */
  .artwrap{
    flex:none;display:flex;flex-direction:column;align-items:center;
    padding:16px 0 0;
  }
  .disc{
    position:relative;width:108px;height:108px;border-radius:50%;flex:none;
    background:linear-gradient(150deg,#C7B2FA,#FFB7D8);
    box-shadow:0 12px 26px rgba(139,92,246,.24),0 0 0 5px rgba(255,255,255,.72),0 0 0 6.5px rgba(139,92,246,.12);
  }
  .disc .groove{
    position:absolute;inset:0;border-radius:50%;
    background:repeating-radial-gradient(circle,rgba(255,255,255,.20) 0 1.5px,transparent 1.5px 4.5px);
  }
  .disc .glint{position:absolute;inset:0;border-radius:50%;overflow:hidden}
  .disc .glint::after{
    content:"";position:absolute;left:50%;top:0;width:48px;height:100%;margin-left:-24px;
    background:linear-gradient(100deg,transparent 38%,rgba(255,255,255,.30) 50%,transparent 62%);
  }
  .disc .face{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:64px;height:64px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:24px;font-weight:900;color:var(--grape-d);background:rgba(255,255,255,.94);
    box-shadow:0 3px 10px rgba(90,60,140,.16),inset 0 0 0 2px rgba(139,92,246,.14);
    z-index:3;
  }
  .disc .face img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%;opacity:0;transition:opacity .4s}
  .disc .face img.ld{opacity:1}
  .disc .hub{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:8px;height:8px;border-radius:50%;
    background:rgba(139,92,246,.34);box-shadow:0 0 0 3px rgba(255,255,255,.7);z-index:4;
  }
  /* 只转纹理和反光，文字/封面不动 */
  .disc.spin .groove,.disc.spin .glint{animation:discSpin 16s linear infinite}
  @keyframes discSpin{to{transform:rotate(360deg)}}

  .nname{
    margin-top:9px;font-size:16px;font-weight:900;color:var(--ink);
    max-width:88%;text-align:center;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .nart{
    margin-top:1px;font-size:10px;font-weight:600;color:var(--muted);
    max-width:88%;text-align:center;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }

  /* ===== 歌词（居中高亮、跟随滚动） ===== */
  .lyrarea{
    flex:1;min-height:0;overflow:hidden;position:relative;
    margin:10px 0 0;border-radius:16px;background:#fff;
    box-shadow:0 3px 14px rgba(90,70,150,.08);
  }
  #lyrBox{position:absolute;inset:0;overflow:hidden}
  #lyrScroll{
    position:absolute;left:0;right:0;top:0;
    display:flex;flex-direction:column;
    transition:transform .42s cubic-bezier(.22,.9,.3,1);
    will-change:transform;
  }
  .lrow{
    padding:0 16px;text-align:center;font-size:13.5px;font-weight:600;
    color:#C6BFD6;line-height:1.35;cursor:pointer;
    transition:color .3s,font-size .3s,font-weight .3s;
  }
  .lrow + .lrow{margin-top:20px}
  .lrow.near{color:#A9A0C2}
  .lrow.cur{font-size:17px;font-weight:900;color:var(--grape-d)}
  .lrow .tr{
    display:block;font-size:10.5px;font-weight:600;color:#BDB5D0;margin-top:3px;
  }
  .lrow.cur .tr{color:#A695D6}

  .lyr-empty,.lyr-loading{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:5px;
    font-size:12px;font-weight:700;color:var(--muted);line-height:1.9;text-align:center;
  }
  .lyr-skel{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:15px;padding:0 20px;
  }
  .lyr-skel i{
    display:block;height:11px;border-radius:6px;background:rgba(120,100,180,.10);
    position:relative;overflow:hidden;
  }
  .lyr-skel i::after{
    content:"";position:absolute;inset:0;transform:translateX(-100%);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);
    animation:skShine 1.5s infinite;
  }
  @keyframes skShine{to{transform:translateX(100%)}}

  /* 跟随开关：贴在歌词区右上角 */
  #nFollow{
    position:absolute;right:8px;top:8px;z-index:6;
    height:22px;padding:0 8px;border:none;border-radius:7px;cursor:pointer;
    font-family:inherit;font-size:9.5px;font-weight:800;color:var(--muted);
    background:rgba(245,242,251,.94);
    transition:color .2s,background .2s;
  }
  #nFollow.on{color:var(--grape);background:rgba(139,92,246,.10)}

  /* ===== 进度条（可拖动，上下留白） ===== */
  .progwrap{flex:none;padding:16px 30px 0}
  .prog{position:relative;height:6px;border-radius:3px;background:#EFEAF8;cursor:pointer;touch-action:none}
  .prog i{
    position:absolute;left:0;top:0;bottom:0;width:0;border-radius:3px;
    background:linear-gradient(90deg,var(--coral),var(--sunny),var(--mint));
  }
  .prog u{
    position:absolute;top:50%;left:0;transform:translate(-50%,-50%);
    width:16px;height:16px;border-radius:50%;background:#fff;
    box-shadow:0 2px 7px rgba(90,70,150,.28);
  }
  .ptime2{
    display:flex;justify-content:space-between;
    margin-top:6px;font-size:10px;font-weight:700;color:var(--muted);
    font-variant-numeric:tabular-nums;
  }

  /* ===== 控件行：顺序 上一首 播放暂停 下一首 列表 ===== */
  .ctrls{
    flex:none;display:flex;align-items:center;justify-content:space-between;
    padding:10px 34px 18px;
  }
  .cb{
    width:44px;height:44px;border:none;background:none;cursor:pointer;
    color:#8A81A6;display:flex;align-items:center;justify-content:center;
    transition:transform .16s,color .2s;
  }
  .cb:active{transform:scale(.84)}
  .cb.on{color:var(--grape)}
  #cPlay{color:var(--coral)}
</style>

<div class="np-page" id="npPage">

  <!-- 顶部曲目条 -->
  <div class="npstrip">
    <div class="cv" id="sCv"><span id="sChar">♪</span><img id="sCvImg" alt=""></div>
    <div class="tx2">
      <b id="sName">还没有播放</b>
      <em id="sArtist">搜一首歌，点一下就播 ♪</em>
    </div>
    <button id="nLike" title="收藏">
      <svg viewBox="0 0 24 24" width="15" height="15"><path d="M12 20.4s-6.8-4.2-8.5-8.1C2.1 8.7 4 5.5 7.1 5.5c1.8 0 3.1 1 3.8 1.9.7-.9 2-1.9 3.8-1.9 3.1 0 5 3.2 3.6 6.8-1.7 3.9-8.5 8.1-8.5 8.1z" stroke="currentColor" stroke-width="2" fill="none"/></svg>
    </button>
    <span id="nSrc" style="display:none"><s></s><span id="nSrcText"></span></span>
  </div>

  <!-- 圆形唱片 -->
  <div class="artwrap">
    <div class="disc" id="nDisc">
      <i class="groove"></i><i class="glint"></i>
      <span class="face" id="nFace"><span id="nFaceChar">♪</span><img id="nFaceImg" alt=""></span>
      <i class="hub"></i>
    </div>
    <div class="nname" id="nName">还没有播放</div>
    <div class="nart" id="nArtist">搜一首歌，点一下就播 ♪</div>
  </div>

  <!-- 歌词 -->
  <div class="lyrarea">
    <button id="nFollow" class="on" title="跟随播放">跟随中</button>
    <div id="lyrBox">
      <div class="lyr-skel" id="lyrSkel"><i style="width:58%"></i><i style="width:74%"></i><i style="width:46%"></i><i style="width:66%"></i><i style="width:52%"></i></div>
      <div id="lyrScroll"></div>
    </div>
  </div>

  <!-- 进度条 -->
  <div class="progwrap">
    <div class="prog" id="prog"><i id="progFill"></i><u id="progKnob"></u></div>
    <div class="ptime2"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
  </div>

  <!-- 控件行 -->
  <div class="ctrls">
    <button class="cb" id="cMode" title="播放模式">
      <svg viewBox="0 0 24 24" width="26" height="26"><path d="M4 9a5 5 0 0 1 5-5h9" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M20 15a5 5 0 0 1-5 5H6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M17 1.8l3.1 2.4-3.1 2.4M7 17.4L3.9 19.8l3.1 2.4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    </button>
    <button class="cb" id="cPrev" title="上一首">
      <svg viewBox="0 0 24 24" width="27" height="27"><path d="M7 6h2.4v12H7zM20 6v12l-9.5-6z" fill="currentColor"/></svg>
    </button>
    <button class="cb" id="cPlay" title="播放/暂停"></button>
    <button class="cb" id="cNext" title="下一首">
      <svg viewBox="0 0 24 24" width="27" height="27"><path d="M14.6 6H17v12h-2.4zM4 6v12l9.5-6z" fill="currentColor"/></svg>
    </button>
    <button class="cb" id="cList" title="播放列表">
      <svg viewBox="0 0 24 24" width="26" height="26"><path d="M4 7h11M4 12h11M4 17h7" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M18 13.5v5.2a1.7 1.7 0 1 0 1.7 1.7V13h2" stroke="currentColor" stroke-width="1.9" fill="none" stroke-linecap="round"/></svg>
    </button>
  </div>

</div>

<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var M = window.M, PL = window.PL, P = PL.P;

  var SVG_PLAY  = '<svg viewBox="0 0 24 24" width="26" height="26"><path d="M8.6 5.2v13.6L19 12z" fill="currentColor"/></svg>';
  var SVG_PAUSE = '<svg viewBox="0 0 24 24" width="26" height="26"><path d="M7 5h3.6v14H7zM13.4 5H17v14h-3.6z" fill="currentColor"/></svg>';
  var MODE_ICON = {
    order: '<svg viewBox="0 0 24 24" width="26" height="26"><path d="M4 9a5 5 0 0 1 5-5h9" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M20 15a5 5 0 0 1-5 5H6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M17 1.8l3.1 2.4-3.1 2.4M7 17.4L3.9 19.8l3.1 2.4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>',
    one: '<svg viewBox="0 0 24 24" width="26" height="26"><path d="M4 9a5 5 0 0 1 5-5h9" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M20 15a5 5 0 0 1-5 5H6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M17 1.8l3.1 2.4-3.1 2.4M7 17.4L3.9 19.8l3.1 2.4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><text x="12" y="14.6" font-size="8.5" font-weight="900" text-anchor="middle" fill="currentColor">1</text></svg>',
    shuffle: '<svg viewBox="0 0 24 24" width="26" height="26"><path d="M4 7h3l9 10h4M4 17h3l2.3-2.6M16 7h4M20 7l-2.3-2.3M20 7l-2.3 2.3M20 17l-2.3 2.3M20 17l-2.3-2.3" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>'
  };
  var SOURCE_NAME = { netease:'网易云', qq:'QQ音乐', kugou:'酷狗', bilibili:'B站' };
  var SOURCE_CLS  = { netease:'ne', qq:'qq', kugou:'kg', bilibili:'bi' };

  var lyr = null, lyrSeq = 0, lineIdx = -1, follow = true, dragging = false;

  function heartSVG(filled, size){
    var s = size || 15;
    return '<svg viewBox="0 0 24 24" width="' + s + '" height="' + s + '"><path d="M12 21s-7.5-4.7-9.3-9C1.4 8.6 3.4 5 6.9 5c2 0 3.4 1.1 4.1 2.1C11.7 6.1 13.1 5 15.1 5c3.5 0 5.5 3.6 4.2 7-1.8 4.3-9.3 9-9.3 9z" fill="' + (filled ? 'currentColor' : 'none') + '" stroke="currentColor" stroke-width="1.8"/></svg>';
  }

  /* ---------- 曲目信息 ---------- */
  function renderInfo(){
    var t = P.cur;
    var scroll = $('lyrScroll');

    if (!t) {
      $('sName').textContent = '还没有播放';
      $('sArtist').textContent = '搜一首歌，点一下就播 ♪';
      $('nName').textContent = '还没有播放';
      $('nArtist').textContent = '搜一首歌，点一下就播 ♪';
      $('sChar').textContent = '♪';
      $('nFaceChar').textContent = '♪';
      $('sCvImg').classList.remove('ld');
      $('nFaceImg').classList.remove('ld');
      $('nSrc').style.display = 'none';
      renderFav();
      renderSpin();
      return;
    }

    $('sName').textContent = t.name || '未知歌曲';
    $('sArtist').textContent = t.artist || '未知歌手';
    $('nName').textContent = t.name || '未知歌曲';
    $('nArtist').textContent = t.artist || '未知歌手';
    $('sChar').textContent = (t.name || '♪').trim().charAt(0) || '♪';
    $('nFaceChar').textContent = (t.name || '♪').trim().charAt(0) || '♪';

    // 来源
    var src = $('nSrc');
    var nm = SOURCE_NAME[t.source] || '';
    if (nm) {
      src.style.display = 'flex';
      src.className = SOURCE_CLS[t.source] || '';
      $('nSrcText').textContent = nm;
    } else {
      src.style.display = 'none';
    }

    // 封面：小条和唱片中间都补
    var img1 = $('sCvImg'), img2 = $('nFaceImg');
    img1.classList.remove('ld'); img2.classList.remove('ld');
    M.fetchPic(t, 300).then(function(u){
      if (!u) return;
      img1.onload = function(){ img1.classList.add('ld'); $('sChar').textContent = ''; };
      img1.onerror = function(){};
      img1.src = u;
      img2.onload = function(){ img2.classList.add('ld'); $('nFaceChar').textContent = ''; };
      img2.onerror = function(){};
      img2.src = u;
    });

    renderFav();
    renderSpin();
    loadLyric(t);
  }

  function renderFav(){
    var b = $('nLike');
    if (!b) return;
    var on = P.cur && PL.isFav(P.cur);
    b.innerHTML = heartSVG(on, 15);
    b.classList.toggle('on', !!on);
    b.title = on ? '取消收藏' : '收藏';
  }
  function renderSpin(){
    var playing = P.audio && !P.audio.paused && !P.audio.ended;
    $('nDisc').classList.toggle('spin', !!playing);
  }
  function renderPlay(){
    var playing = P.audio && !P.audio.paused && !P.audio.ended;
    $('cPlay').innerHTML = playing ? SVG_PAUSE : SVG_PLAY;
    $('cPlay').title = playing ? '暂停' : '播放';
    renderSpin();
  }
  function renderMode(){
    $('cMode').innerHTML = MODE_ICON[P.mode] || MODE_ICON.order;
    $('cMode').classList.toggle('on', P.mode !== 'order');
    $('cMode').title = PL.MODE_NAME[P.mode] || '顺序播放';
  }
  function renderTime(c, d){
    var pct = (isFinite(d) && d > 0) ? Math.min(100, c / d * 100) : 0;
    $('progFill').style.width = pct + '%';
    $('progKnob').style.left = pct + '%';
    $('tCur').textContent = M.fmtTime(c);
    $('tDur').textContent = M.fmtTime(d);
  }

  /* ---------- 歌词 ---------- */
  async function loadLyric(t){
    var seq = ++lyrSeq;
    lyr = null; lineIdx = -1;
    $('lyrSkel').style.display = '';
    $('lyrScroll').innerHTML = '';
    $('lyrScroll').style.transform = 'translateY(0)';

    var got = await M.lyric(t);
    if (seq !== lyrSeq || window.__view !== 'lyric') return;

    $('lyrSkel').style.display = 'none';

    if (!got || !got.lines.length) {
      lyr = null;
      $('lyrScroll').innerHTML = '<div class="lyr-empty">这首歌暂时没有歌词<br>换一首也许就有 ♪</div>';
      $('lyrScroll').style.transform = 'none';
      $('lyrScroll').style.position = 'static';
      return;
    }
    $('lyrScroll').style.position = 'absolute';

    lyr = got;
    $('lyrScroll').innerHTML = got.lines.map(function(l, i){
      return '<div class="lrow" data-li="' + i + '">' + M.esc(l.text) +
        (l.tr ? '<span class="tr">' + M.esc(l.tr) + '</span>' : '') + '</div>';
    }).join('');

    var pad = Math.round($('lyrBox').clientHeight / 2);
    $('lyrScroll').style.padding = pad + 'px 0';
    updateLine(P.audio ? (P.audio.currentTime || 0) : 0, true);
  }

  function findLine(time){
    if (!lyr) return -1;
    var lines = lyr.lines;
    if (time < lines[0].t) return -1;
    var lo = 0, hi = lines.length - 1, res = 0;
    while (lo <= hi) {
      var mid = (lo + hi) >> 1;
      if (lines[mid].t <= time) { res = mid; lo = mid + 1; }
      else hi = mid - 1;
    }
    return res;
  }

  function updateLine(time, force){
    if (!lyr || !follow) return;
    var idx = findLine(time);
    if (idx < 0) idx = 0;
    if (!force && idx === lineIdx) return;
    lineIdx = idx;

    var rows = $('lyrScroll').children;
    for (var i = 0; i < rows.length; i++) {
      rows[i].classList.remove('cur');
      rows[i].classList.remove('near');
      if (Math.abs(i - idx) <= 1 && i !== idx) rows[i].classList.add('near');
    }
    var row = rows[idx];
    if (!row) return;
    row.classList.add('cur');

    var boxH = $('lyrBox').clientHeight;
    if (!boxH) return;
    var pad = Math.round(boxH / 2);
    var scroller = $('lyrScroll');
    if (Math.abs((parseFloat(scroller.style.paddingTop) || 0) - pad) > 1) {
      scroller.style.padding = pad + 'px 0';
    }
    var rowH = row.offsetHeight;
    var rowCenter = row.offsetTop + rowH / 2;
    var target = rowCenter - boxH / 2;
    scroller.style.transform = 'translateY(' + (-target) + 'px)';
  }

  $('lyrScroll').addEventListener('click', function(e){
    var row = e.target.closest('.lrow');
    if (!row || !lyr) return;
    var i = parseInt(row.dataset.li, 10);
    var l = lyr.lines[i];
    if (!l) return;
    follow = true;
    $('nFollow').textContent = '跟随中';
    $('nFollow').classList.add('on');
    PL.seek(l.t + 0.12);
    updateLine(l.t, true);
  });

  $('nFollow').addEventListener('click', function(){
    follow = !follow;
    $('nFollow').textContent = follow ? '跟随中' : '已暂停';
    $('nFollow').classList.toggle('on', follow);
    if (follow) {
      lineIdx = -1;
      updateLine(P.audio ? P.audio.currentTime : 0, true);
    }
  });

  /* ---------- 进度拖拽 ---------- */
  var prog = $('prog');
  function ratio(e){
    var r = prog.getBoundingClientRect();
    return Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
  }
  prog.addEventListener('pointerdown', function(e){
    if (!P.audio || !isFinite(P.audio.duration) || P.audio.duration <= 0) return;
    dragging = true;
    try { prog.setPointerCapture(e.pointerId); } catch(err){}
    renderTime(ratio(e) * P.audio.duration, P.audio.duration);
  });
  prog.addEventListener('pointermove', function(e){
    if (!dragging || !P.audio) return;
    renderTime(ratio(e) * P.audio.duration, P.audio.duration);
  });
  prog.addEventListener('pointerup', function(e){
    if (!dragging) return;
    dragging = false;
    if (P.audio && isFinite(P.audio.duration)) PL.seek(ratio(e) * P.audio.duration);
  });
  prog.addEventListener('pointercancel', function(){ dragging = false; });

  /* ---------- 控件 ---------- */
  $('cPlay').addEventListener('click', function(){ PL.toggle(); });
  $('cPrev').addEventListener('click', function(){ PL.prev(); });
  $('cNext').addEventListener('click', function(){ PL.next(); });
  $('cMode').addEventListener('click', function(){ PL.cycleMode(); });
  $('cList').addEventListener('click', function(){
    if (typeof window.mmOpenQueue === 'function') window.mmOpenQueue();
    else window.toast('播放列表暂时打不开');
  });
  $('nLike').addEventListener('click', async function(){
    if (!P.cur) { window.toast('还没有播放歌曲'); return; }
    await PL.toggleFav(P.cur);
    renderFav();
  });

  /* ---------- 事件 ---------- */
  window.VON('track', function(){ renderInfo(); renderPlay(); });
  window.VON('play',  renderPlay);
  window.VON('pause', renderPlay);
  window.VON('state', renderPlay);
  window.VON('fav',   renderFav);
  window.VON('mode-state', renderMode);
  window.VON('time', function(c, d){
    if (!dragging) renderTime(c, d);
    updateLine(c);
  });

  window.mmOnShow = function(){
    renderInfo();
    renderMode();
    renderPlay();
    renderTime(P.audio ? P.audio.currentTime : 0, P.audio ? P.audio.duration : 0);
    if (P.cur && (!lyr || lyr.name !== P.cur.name)) loadLyric(P.cur);
  };

  /* ---------- 首屏 ---------- */
  renderMode();
  renderPlay();
  renderTime(P.audio ? (P.audio.currentTime || 0) : 0, P.audio ? (P.audio.duration || 0) : 0);
  if (P.cur) {
    renderInfo();
  } else {
    $('lyrSkel').style.display = 'none';
    $('lyrScroll').innerHTML = '<div class="lyr-empty">还没有播放歌曲<br>先去挑一首吧 ♪</div>';
  }
})();
</script>
</body>
</html>
