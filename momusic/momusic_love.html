<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>我的收藏</title>
</head>
<body>

<style>
  #viewHost > * + *{margin-top:9px}

  /* ===== 收藏页头卡：高对比渐变 ===== */
  .hero2{
    position:relative;width:100%;overflow:hidden;
    border-radius:18px;padding:13px;color:#fff;
    background:linear-gradient(135deg,#FF7A6E 0%,#F4517B 46%,#8B5CF6 100%);
    box-shadow:0 9px 22px rgba(200,80,140,.22);
  }
  .hero2::after{
    content:"";position:absolute;width:150px;height:150px;border-radius:50%;
    right:-58px;top:-76px;background:rgba(255,255,255,.13);
  }
  .h2r{position:relative;z-index:2;display:flex;align-items:center;gap:7px}
  .h2r .hi{
    flex:none;width:26px;height:26px;border-radius:8px;
    background:rgba(255,255,255,.22);
    display:flex;align-items:center;justify-content:center;color:#fff;
  }
  .h2r b{font-size:12px;font-weight:900;letter-spacing:1px}
  .h2r .sync{
    margin-left:auto;display:flex;align-items:center;gap:4px;
    font-size:9px;font-weight:800;color:rgba(255,255,255,.82);
  }
  .h2r .sync s{width:4.5px;height:4.5px;border-radius:50%;background:#7CFFD9;text-decoration:none;display:block}
  .hnum{position:relative;z-index:2;margin-top:7px;font-size:32px;font-weight:900;line-height:1;letter-spacing:-.6px}
  .hnum i{font-style:normal;font-size:10px;font-weight:800;margin-left:3px;opacity:.86}
  .hsub{position:relative;z-index:2;margin-top:6px;font-size:10.5px;font-weight:600;color:rgba(255,255,255,.84)}
  .h2btns{position:relative;z-index:2;display:flex;gap:6px;margin-top:10px}
  .h2play{
    flex:1;height:34px;border:none;border-radius:11px;cursor:pointer;
    font-family:inherit;font-size:12.5px;font-weight:900;color:#E8457B;
    background:#fff;display:flex;align-items:center;justify-content:center;gap:5px;
    box-shadow:0 4px 11px rgba(120,40,120,.16);
    transition:transform .16s,opacity .2s;
  }
  .h2play:active{transform:scale(.96)}
  .h2play:disabled{opacity:.5;pointer-events:none}
  .h2ghost{
    flex:none;height:34px;padding:0 12px;border:none;border-radius:11px;cursor:pointer;
    font-family:inherit;font-size:11px;font-weight:800;color:#fff;
    background:rgba(255,255,255,.20);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.26);
    transition:transform .16s;
  }
  .h2ghost:active{transform:scale(.95)}

  /* ===== 收藏列表 ===== */
  .flist{padding-top:9px}

  .frow{
    position:relative;display:flex;align-items:center;gap:8px;
    padding:7px 1px;cursor:pointer;transition:transform .15s,opacity .2s;
  }
  .frow + .frow::before{
    content:"";position:absolute;left:1px;right:1px;top:0;height:1px;background:var(--line);
  }
  .frow:active{transform:scale(.985)}
  .frow.now .fname{color:var(--grape-d)}

  .fcv{
    flex:none;width:34px;height:34px;border-radius:10px;position:relative;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:900;color:#fff;
    background:linear-gradient(150deg,#C7B2FA,#FFB7D8);
  }
  .fcv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
  .fcv img.ld{opacity:1}

  .ftx{flex:1;min-width:0}
  .fname{
    display:block;font-size:12.5px;font-weight:800;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3;
  }
  .fart{
    display:block;font-style:normal;font-size:10px;font-weight:600;color:var(--muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;
  }

  .fbtns{flex:none;display:flex;align-items:center;gap:4px}
  .fbtns button{
    width:28px;height:28px;border:none;border-radius:50%;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:transform .16s;
  }
  .fbtns button:active{transform:scale(.86)}
  .fplay{background:linear-gradient(135deg,#FF7A6E,#FF4D6A);color:#fff;box-shadow:0 3px 7px rgba(255,94,108,.24)}
  .funfav{background:#FFF0F5;color:#F0457D}

  .feq{display:flex;align-items:flex-end;gap:2px;height:13px;padding-right:2px}
  .feq i{width:2.5px;border-radius:2px;background:var(--grape);animation:mmEq 1s ease-in-out infinite}
  .feq i:nth-child(2){background:var(--coral);animation-delay:.22s}
  .feq i:nth-child(3){background:var(--mint);animation-delay:.44s}
  .feq.off i{animation-play-state:paused;height:4px}

  /* 空态 */
  .fempty{padding:38px 16px;text-align:center}
  .fempty .ic{margin-bottom:8px;opacity:.4;display:flex;justify-content:center}
  .fempty b{display:block;font-size:13px;font-weight:900;color:var(--ink-2);margin-bottom:5px}
  .fempty em{
    display:block;font-style:normal;font-size:11.5px;font-weight:600;
    color:var(--muted);line-height:1.85;
  }

  /* 同步状态条 */
  .fstate{
    width:100%;display:flex;align-items:center;justify-content:center;gap:6px;
    padding:8px;border-radius:999px;
    font-size:10.5px;font-weight:700;color:var(--muted);
    background:rgba(255,255,255,.7);box-shadow:0 2px 9px rgba(90,70,150,.06);
  }
  .fstate.ok{color:var(--mint-d)}
  .fstate .dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.75}

  /* ===== 最近播放 ===== */
  .sechd{display:flex;align-items:center;gap:6px;padding:0 1px 8px}
  .sechd .ic{flex:none;width:24px;height:24px;border-radius:8px;display:flex;align-items:center;justify-content:center}
  .sechd b{font-size:14px;font-weight:900;color:var(--ink)}
  .sechd em{font-style:normal;font-size:9.5px;font-weight:700;color:var(--muted)}
  .sechd .clr{
    margin-left:auto;border:none;background:none;cursor:pointer;
    color:var(--muted);font-family:inherit;font-size:10.5px;font-weight:800;
    padding:3px 7px;border-radius:999px;
  }
  .sechd .clr:active{opacity:.6}
</style>

<!-- 收藏头卡 -->
<div class="hero2" id="fCard">
  <div class="h2r">
    <span class="hi">
      <svg viewBox="0 0 24 24" width="14" height="14"><path d="M12 20.4s-6.8-4.2-8.5-8.1C2.1 8.7 4 5.5 7.1 5.5c1.8 0 3.1 1 3.8 1.9.7-.9 2-1.9 3.8-1.9 3.1 0 5 3.2 3.6 6.8-1.7 3.9-8.5 8.1-8.5 8.1z" fill="currentColor" stroke="currentColor" stroke-width="1.6"/></svg>
    </span>
    <b>我的收藏</b>
    <span class="sync"><s></s><span id="fSync">已同步</span></span>
  </div>
  <div class="hnum"><span id="fCount">0</span><i>首</i></div>
  <div class="hsub">你收藏的歌都在这里~</div>
  <div class="h2btns">
    <button class="h2play" id="fPlayAll" disabled>
      <svg viewBox="0 0 24 24" width="12" height="12"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
      播放全部
    </button>
    <button class="h2ghost" id="fShuffle">随机</button>
  </div>
</div>

<!-- 收藏列表 -->
<div class="mm-card">
  <div id="fList" class="flist"></div>
</div>

<div class="fstate" id="fState"><span class="dot"></span><span>本地收藏</span></div>

<!-- 最近播放 -->
<div class="mm-card" id="rCard" style="display:none">
  <div class="sechd">
    <span class="ic" style="background:linear-gradient(145deg,#D7F2FF,#C9E9FF);box-shadow:0 3px 8px rgba(91,167,230,.20);color:#3A86C8">
      <svg viewBox="0 0 24 24" width="12" height="12"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="2" fill="none"/><path d="M12 7.5v5l3.4 2" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    </span>
    <b>最近播放</b>
    <em id="rCount"></em>
    <button class="clr" id="rClear">清空</button>
  </div>
  <div id="rList"></div>
</div>

<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var M = window.M, PL = window.PL, P = PL.P;

  function heartSVG(filled, size){
    var s = size || 14;
    return '<svg viewBox="0 0 24 24" width="' + s + '" height="' + s + '"><path d="M12 21s-7.5-4.7-9.3-9C1.4 8.6 3.4 5 6.9 5c2 0 3.4 1.1 4.1 2.1C11.7 6.1 13.1 5 15.1 5c3.5 0 5.5 3.6 4.2 7-1.8 4.3-9.3 9-9.3 9z" fill="' + (filled ? 'currentColor' : 'none') + '" stroke="currentColor" stroke-width="1.8"/></svg>';
  }
  function eqHTML(){
    var playing = P.audio && !P.audio.paused && !P.audio.ended;
    return '<span class="feq' + (playing ? '' : ' off') + '"><i></i><i></i><i></i></span>';
  }

  /* ---------- 收藏 ---------- */
  function renderFav(){
    var fav = PL.getFav() || [];
    var list = $('fList');
    if (!list) return;

    $('fCount').textContent = fav.length;
    $('fPlayAll').disabled = !fav.length;

    if (!fav.length) {
      list.innerHTML =
        '<div class="fempty">' +
          '<span class="ic">' +
            '<svg viewBox="0 0 24 24" width="34" height="34" style="color:#C7BFDB"><path d="M12 20.4s-6.8-4.2-8.5-8.1C2.1 8.7 4 5.5 7.1 5.5c1.8 0 3.1 1 3.8 1.9.7-.9 2-1.9 3.8-1.9 3.1 0 5 3.2 3.6 6.8-1.7 3.9-8.5 8.1-8.5 8.1z" stroke="currentColor" stroke-width="1.8" fill="none"/></svg>' +
          '</span>' +
          '<b>还没有收藏</b>' +
          '<em>听到喜欢的歌，点一下收藏<br>下次就能在这里找到~</em>' +
        '</div>';
      return;
    }

    list.innerHTML = fav.map(function(t, i){
      var isNow = P.cur && String(t.id) === String(P.cur.id);
      return '<div class="frow' + (isNow ? ' now' : '') + '" data-i="' + i + '">' +
        '<div class="fcv c' + (i % 6 + 1) + '"><span>' + M.esc((t.name || '♪').trim().charAt(0) || '♪') + '</span>' +
          '<img data-cv="' + i + '" alt=""></div>' +
        '<div class="ftx">' +
          '<span class="fname">' + M.esc(t.name || '未知歌曲') + '</span>' +
          '<em class="fart">' + M.esc(t.artist || '未知歌手') + '</em>' +
        '</div>' +
        '<div class="fbtns">' +
          (isNow ? eqHTML() :
            '<button class="fplay" data-play="' + i + '" title="播放">' +
              '<svg viewBox="0 0 24 24" width="12" height="12"><path d="M8 5v14l11-7z" fill="currentColor"/></svg></button>') +
          '<button class="funfav" data-unfav="' + i + '" title="取消收藏">' + heartSVG(true, 14) + '</button>' +
        '</div>' +
        '</div>';
    }).join('');

    loadCovers(fav);
  }

  function loadCovers(fav){
    Array.prototype.forEach.call($('fList').querySelectorAll('img[data-cv]'), function(img){
      var t = fav[parseInt(img.dataset.cv, 10)];
      if (!t) return;
      M.fetchPic(t, 120).then(function(u){
        if (!u) return;
        img.onload = function(){ img.classList.add('ld'); var sp = img.parentNode.querySelector('span'); if (sp) sp.textContent = ''; };
        img.onerror = function(){};
        img.src = u;
      }).catch(function(){});
    });
  }

  $('fList').addEventListener('click', function(e){
    var unf = e.target.closest('[data-unfav]');
    if (unf) {
      e.stopPropagation();
      var t = PL.getFav()[parseInt(unf.dataset.unfav, 10)];
      if (t) PL.toggleFav(t);
      return;
    }
    var pl = e.target.closest('[data-play]');
    if (pl) {
      e.stopPropagation();
      var t2 = PL.getFav()[parseInt(pl.dataset.play, 10)];
      if (t2) PL.playTrack(t2);
      return;
    }
    var row = e.target.closest('.frow');
    if (row && row.dataset.i != null) {
      var t3 = PL.getFav()[parseInt(row.dataset.i, 10)];
      if (!t3) return;
      if (P.cur && String(t3.id) === String(P.cur.id)) { PL.toggle(); return; }
      PL.playTrack(t3);
    }
  });

  $('fPlayAll').addEventListener('click', function(){
    var fav = PL.getFav();
    if (!fav.length) { window.toast('还没有收藏的歌'); return; }
    PL.setQueue(fav.slice(), 0);
    PL.setMode('order');
    PL.play(0, true);
    window.toast('播放 ' + fav.length + ' 首');
  });

  $('fShuffle').addEventListener('click', function(){
    var fav = PL.getFav();
    if (!fav.length) { window.toast('还没有收藏的歌'); return; }
    var arr = fav.slice();
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    PL.setQueue(arr, 0);
    PL.setMode('shuffle');
    PL.play(0, true);
    window.toast('随机播放 ' + arr.length + ' 首');
  });

  /* ---------- 同步状态 ---------- */
  function renderState(){
    var box = $('fState');
    if (!box) return;
    var u = '', p = '';
    try { u = localStorage.getItem('blindbox_user') || ''; p = localStorage.getItem('blindbox_pass') || ''; } catch(e){}
    if (!u || !p) {
      box.className = 'fstate';
      box.innerHTML = '<span class="dot"></span><span>仅存本机</span>';
      $('fSync').textContent = '本地';
    } else {
      box.className = 'fstate ok';
      box.innerHTML = '<span class="dot"></span><span>已登录 · 云端同步已开启</span>';
      $('fSync').textContent = '已同步';
    }
  }

  /* ---------- 最近播放 ---------- */
  function renderRecent(){
    var list = PL.getRecent() || [];
    var card = $('rCard');
    if (!card) return;
    if (!list.length) { card.style.display = 'none'; return; }
    card.style.display = '';
    $('rCount').textContent = list.length + ' 首';
    var items = list.slice(0, 12);

    $('rList').innerHTML = items.map(function(t, i){
      var isNow = P.cur && String(t.id) === String(P.cur.id);
      return '<div class="frow' + (isNow ? ' now' : '') + '" data-ri="' + i + '">' +
        '<div class="fcv c' + (i % 6 + 1) + '"><span>' + M.esc((t.name || '♪').trim().charAt(0) || '♪') + '</span>' +
          '<img data-rv="' + i + '" alt=""></div>' +
        '<div class="ftx">' +
          '<span class="fname">' + M.esc(t.name || '未知歌曲') + '</span>' +
          '<em class="fart">' + M.esc(t.artist || '未知歌手') + '</em>' +
        '</div>' +
        '<div class="fbtns">' +
          (isNow ? eqHTML() :
            '<button class="fplay" data-rplay="' + i + '" title="播放">' +
              '<svg viewBox="0 0 24 24" width="12" height="12"><path d="M8 5v14l11-7z" fill="currentColor"/></svg></button>') +
        '</div>' +
        '</div>';
    }).join('');

    Array.prototype.forEach.call($('rList').querySelectorAll('img[data-rv]'), function(img){
      var t = items[parseInt(img.dataset.rv, 10)];
      if (!t) return;
      M.fetchPic(t, 100).then(function(u){
        if (!u) return;
        img.onload = function(){ img.classList.add('ld'); var sp = img.parentNode.querySelector('span'); if (sp) sp.textContent = ''; };
        img.onerror = function(){};
        img.src = u;
      }).catch(function(){});
    });
  }

  $('rList').addEventListener('click', function(e){
    var pl = e.target.closest('[data-rplay]');
    if (pl) {
      e.stopPropagation();
      var t0 = PL.getRecent()[parseInt(pl.dataset.rplay, 10)];
      if (t0) PL.playTrack(t0);
      return;
    }
    var row = e.target.closest('[data-ri]');
    if (!row) return;
    var t = PL.getRecent()[parseInt(row.dataset.ri, 10)];
    if (!t) return;
    if (P.cur && String(t.id) === String(P.cur.id)) { PL.toggle(); return; }
    PL.playTrack(t);
  });

  $('rClear').addEventListener('click', function(){
    try { localStorage.setItem('momusic_recent_v1', '[]'); } catch(e){}
    renderRecent();
    window.toast('最近播放已清空');
  });

  /* ---------- 事件 ---------- */
  window.VON('fav', renderFav);
  window.VON('track', function(){ renderFav(); renderRecent(); });
  window.VON('state', function(){ renderFav(); renderRecent(); });
  window.VON('play', renderFav);
  window.VON('pause', renderFav);
  window.VON('recent', renderRecent);

  window.mmOnShow = function(){
    renderFav();
    renderRecent();
    renderState();
  };

  /* ---------- 首屏 ---------- */
  renderFav();
  renderRecent();
  renderState();
  PL.loadFavorites().then(function(){
    if (window.__view !== 'love') return;
    renderFav();
    renderState();
  });
})();
</script>
</body>
</html>
