<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>我的收藏</title>
</head>
<body>

<style>
  /* ==========================================================
     烩菜听歌 · 收藏目录页 ——「Risograph 印刷厂」
     · 方内容用方角，圆内容用圆（此处没有圆形内容）
     · 投影一律实心硬偏移，不用模糊
     · 专色只有 墨黑 / 橙 / 蓝 / 黄，其余靠网点和叠印
     · 本页在 Pjax 里跑，外壳会把页面里的 body 规则改写成 #viewHost，
       所以这里不依赖 body 选择器
     ========================================================== */

  /* ============ 收藏标签卡（黄色便利贴 / 印刷标签） ============ */
  .fv-head{
    position:relative;
    margin:12px 0 16px;
    border:var(--edge) solid var(--ink);
    background:var(--yellow);
    box-shadow:var(--sh-lg);
    padding:13px 14px 14px;
  }
  .fv-head > *{position:relative;z-index:4}
  .fv-head.riso-ht::after{opacity:.26}

  .fv-kickrow{display:flex;align-items:center;gap:10px}
  .fv-kickrow .rm-kick{flex:1;min-width:0;color:rgba(20,17,13,.74)}
  .fv-sync{
    flex:none;display:flex;align-items:center;gap:6px;
    font-family:var(--sans);font-size:10px;font-weight:800;color:var(--ink-2);
    white-space:nowrap;
  }
  .fv-sync .dot{flex:none;width:6px;height:6px;background:var(--ink);display:block}

  .fv-numrow{display:flex;align-items:baseline;gap:9px;margin-top:11px}
  .fv-numrow b{
    font-family:var(--serif);font-size:40px;font-weight:900;
    letter-spacing:-2px;line-height:1;color:var(--ink);
    text-shadow:2px 2px 0 var(--blue);
  }
  .fv-numrow em{
    font-style:normal;font-family:var(--serif);font-size:13px;
    font-weight:700;color:rgba(20,17,13,.66);
  }

  .fv-acts{display:flex;gap:9px;margin-top:14px}
  .fv-acts .rm-btn{height:38px}
  .fv-acts .rm-btn:first-child{flex:1}
  .rm-btn.ghost{background:var(--paper);color:var(--ink)}
  /* 暂不可用：纸底 + 墨字 + 虚线描边，不做半透明弱化（半透明在黄底上会发脏） */
  .rm-btn:disabled{
    background:var(--paper);color:var(--ink-2);
    border-style:dashed;box-shadow:none;
    pointer-events:none;
  }

  /* ============ 索引目录（收藏列表 / 最近播放共用） ============ */
  #fList{margin:0 0 14px}
  .frow{
    position:relative;display:flex;align-items:center;gap:10px;
    padding:10px 11px;cursor:pointer;
  }
  .frow + .frow{border-top:var(--edge2) solid var(--ink)}
  /* 正在播放：左侧橙色标记条 + 底色加深 */
  .frow.now{background:var(--paper-3)}
  .frow.now::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--orange);
  }
  .frow.now .fname{color:var(--orange-d)}
  .frow:active{background:var(--paper-2)}

  .frow .no{
    flex:none;width:22px;text-align:center;
    font-family:var(--serif);font-size:16px;font-weight:900;color:var(--ink-3);
    font-variant-numeric:tabular-nums;
  }

  /* 封面小方块：直角 + 描边 + 四色轮转 */
  .fcv{
    flex:none;width:42px;height:42px;position:relative;overflow:hidden;
    border:var(--edge) solid var(--ink);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--serif);font-size:17px;font-weight:900;color:var(--paper);
  }
  .fcv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
  .fcv img.ld{opacity:1}
  .c1{background:var(--orange);color:var(--paper)}
  .c2{background:var(--blue);color:var(--paper)}
  .c3{background:var(--yellow);color:var(--ink)}
  /* 浅色块用网点底 + 墨字，保证对比度 */
  .c4{background:var(--paper-3);color:var(--ink);
    background-image:radial-gradient(rgba(20,17,13,.35) 38%,transparent 40%);
    background-size:4px 4px}
  .c5{background:var(--ink);color:var(--paper)}
  .c6{background:var(--paper-2);color:var(--ink);
    background-image:radial-gradient(rgba(27,63,216,.32) 38%,transparent 40%);
    background-size:4px 4px}

  .ftx{flex:1;min-width:0}
  .fname{
    display:block;font-family:var(--serif);font-size:14px;font-weight:900;
    color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3;
  }
  .fart{
    display:block;font-style:normal;font-size:10.5px;font-weight:700;color:var(--ink-2);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;
  }

  .fbtns{flex:none;display:flex;align-items:center;gap:6px}
  .fbtns button{
    flex:none;width:30px;height:30px;border:var(--edge2) solid var(--ink);
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:transform .12s,background .15s,color .15s;
  }
  .fbtns button:active{transform:translate(1px,1px)}
  .fplay{background:var(--yellow);color:var(--ink)}
  .fplay:active{background:var(--orange);color:var(--paper)}
  .funfav{background:var(--orange);color:var(--paper)}
  .funfav:active{background:var(--ink);color:var(--paper)}

  .feq{
    flex:none;width:30px;height:16px;
    display:flex;align-items:flex-end;justify-content:center;gap:2px;
  }
  .feq i{width:2.5px;background:var(--ink);animation:mmEq 1s ease-in-out infinite}
  .feq i:nth-child(2){background:var(--orange);animation-delay:.22s}
  .feq i:nth-child(3){background:var(--blue);animation-delay:.44s}
  .feq.off i{animation-play-state:paused;height:4px}

  /* ============ 空态 ============ */
  .fempty{padding:20px 18px 22px;text-align:center}
  .fempty .ic{margin-bottom:8px;display:flex;justify-content:center;color:var(--ink-3)}
  .fempty .ic svg{width:26px;height:26px}
  .fempty b{
    display:block;font-family:var(--serif);font-size:14px;font-weight:900;
    color:var(--ink);margin-bottom:4px;
  }
  .fempty em{
    display:block;font-style:normal;font-size:11px;font-weight:700;
    color:var(--ink-3);line-height:1.7;
  }

  /* ============ 同步状态条：细印刷标签 ============ */
  .fstate{
    width:100%;display:flex;align-items:center;gap:8px;
    margin:0;padding:7px 10px;
    border:var(--edge2) solid var(--ink);background:var(--paper-2);
    font-size:10.5px;font-weight:800;color:var(--ink-2);letter-spacing:.2px;
  }
  .fstate .dot{flex:none;width:7px;height:7px;background:var(--ink);display:block}
  .fstate.ok{background:rgba(27,63,216,.10);color:var(--blue-d)}
  .fstate.ok .dot{background:var(--blue)}

  /* ============ 最近播放：目录样式 ============ */
  .rv-sec{margin:24px 0 0}
  .sechd{display:flex;align-items:flex-end;gap:12px;margin-top:9px}
  .sechd .ic{
    flex:none;width:30px;height:30px;border:var(--edge2) solid var(--ink);
    background:var(--yellow);color:var(--ink);
    display:flex;align-items:center;justify-content:center;
  }
  .sechd b{
    font-family:var(--serif);font-size:19px;font-weight:900;
    color:var(--ink);line-height:1.2;letter-spacing:-.2px;
  }
  .sechd em{font-style:normal;font-size:10.5px;font-weight:700;color:var(--ink-3)}
  .sechd .clr{
    margin-left:auto;flex:none;height:30px;padding:0 9px;
    border:var(--edge2) solid var(--ink);background:var(--paper);color:var(--ink-2);
    font-family:var(--sans);font-size:10.5px;font-weight:900;cursor:pointer;
    white-space:nowrap;
    display:flex;align-items:center;justify-content:center;
    transition:transform .12s,background .15s,color .15s;
  }
  .sechd .clr:active{transform:translate(1px,1px);background:var(--ink);color:var(--paper)}
</style>

<!-- 收藏头卡：印刷标签 -->
<div class="fv-head riso-ht" id="fCard">
  <div class="fv-kickrow">
    <span class="rm-kick plain">COLLECTION</span>
    <span class="fv-sync"><i class="dot"></i><span id="fSync">已同步</span></span>
  </div>
  <div class="fv-numrow">
    <b id="fCount">0</b>
    <em>首 · 仅存本机</em>
  </div>
  <div class="fv-acts">
    <button class="rm-btn ink" id="fPlayAll" disabled>
      <svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
      播放全部
    </button>
    <button class="rm-btn ghost" id="fShuffle">
      <svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><path d="M4 7h3l9 10h4M4 17h3l2.3-2.6M16 7h4M20 7l-2.3-2.3M20 7l-2.3 2.3M20 17l-2.3 2.3M20 17l-2.3-2.3" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" fill="none"/></svg>
      随机
    </button>
  </div>
</div>

<!-- 收藏索引目录 -->
<div id="fList" class="rm-list"></div>

<div class="fstate" id="fState"><span class="dot"></span><span>本地收藏</span></div>

<!-- 最近播放 -->
<div class="rv-sec" id="rCard" style="display:none">
  <div class="rm-kick">RECENTLY · 最近播放</div>
  <div class="sechd">
    <span class="ic">
      <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="2" fill="none"/><path d="M12 7.5v5l3.4 2" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    </span>
    <b>播放足迹</b>
    <em id="rCount"></em>
    <button class="clr" id="rClear" title="清空">清空</button>
  </div>
  <div id="rList" class="rm-list" style="margin-top:11px"></div>
</div>

<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var M = window.M, PL = window.PL, P = PL.P;

  function heartSVG(filled, size){
    var s = size || 14;
    return '<svg viewBox="0 0 24 24" width="' + s + '" height="' + s + '"><path d="M12 21s-7.5-4.7-9.3-9C1.4 8.6 3.4 5 6.9 5c2 0 3.4 1.1 4.1 2.1C11.7 6.1 13.1 5 15.1 5c3.5 0 5.5 3.6 4.2 7-1.8 4.3-9.3 9-9.3 9z" fill="' + (filled ? 'currentColor' : 'none') + '" stroke="currentColor" stroke-width="1.8"/></svg>';
  }
  function eqHTML(){
    var playing = P.audio && !P.audio.paused && !P.audio.ended;
    return '<span class="feq' + (playing ? '' : ' off') + '"><i></i><i></i><i></i></span>';
  }

  /* ---------- 收藏 ---------- */
  function renderFav(){
    var fav = PL.getFav() || [];
    var list = $('fList');
    if (!list) return;

    $('fCount').textContent = fav.length;
    $('fPlayAll').disabled = !fav.length;

    if (!fav.length) {
      list.innerHTML =
        '<div class="fempty">' +
          '<span class="ic">' +
            '<svg viewBox="0 0 24 24" width="34" height="34" style="color:#7A7161"><path d="M12 20.4s-6.8-4.2-8.5-8.1C2.1 8.7 4 5.5 7.1 5.5c1.8 0 3.1 1 3.8 1.9.7-.9 2-1.9 3.8-1.9 3.1 0 5 3.2 3.6 6.8-1.7 3.9-8.5 8.1-8.5 8.1z" stroke="currentColor" stroke-width="1.8" fill="none"/></svg>' +
          '</span>' +
          '<b>还没有收藏</b>' +
          '<em>听到喜欢的歌，点一下收藏<br>下次就能在这里找到~</em>' +
        '</div>';
      return;
    }

    list.innerHTML = fav.map(function(t, i){
      var isNow = P.cur && String(t.id) === String(P.cur.id);
      return '<div class="frow' + (isNow ? ' now' : '') + '" data-i="' + i + '">' +
        '<span class="no">' + (i + 1) + '</span>' +
        '<div class="fcv c' + (i % 6 + 1) + '"><span>' + M.esc((t.name || '♪').trim().charAt(0) || '♪') + '</span>' +
          '<img data-cv="' + i + '" alt=""></div>' +
        '<div class="ftx">' +
          '<span class="fname">' + M.esc(t.name || '未知歌曲') + '</span>' +
          '<em class="fart">' + M.esc(t.artist || '未知歌手') + '</em>' +
        '</div>' +
        '<div class="fbtns">' +
          (isNow ? eqHTML() :
            '<button class="fplay" data-play="' + i + '" title="播放">' +
              '<svg viewBox="0 0 24 24" width="12" height="12"><path d="M8 5v14l11-7z" fill="currentColor"/></svg></button>') +
          '<button class="funfav" data-unfav="' + i + '" title="取消收藏">' + heartSVG(true, 14) + '</button>' +
        '</div>' +
        '</div>';
    }).join('');

    loadCovers(fav);
  }

  function loadCovers(fav){
    Array.prototype.forEach.call($('fList').querySelectorAll('img[data-cv]'), function(img){
      var t = fav[parseInt(img.dataset.cv, 10)];
      if (!t) return;
      M.fetchPic(t, 120).then(function(u){
        if (!u) return;
        img.onload = function(){ img.classList.add('ld'); var sp = img.parentNode.querySelector('span'); if (sp) sp.textContent = ''; };
        img.onerror = function(){};
        img.src = u;
      }).catch(function(){});
    });
  }

  $('fList').addEventListener('click', function(e){
    var unf = e.target.closest('[data-unfav]');
    if (unf) {
      e.stopPropagation();
      var t = PL.getFav()[parseInt(unf.dataset.unfav, 10)];
      if (t) PL.toggleFav(t);
      return;
    }
    var pl = e.target.closest('[data-play]');
    if (pl) {
      e.stopPropagation();
      var t2 = PL.getFav()[parseInt(pl.dataset.play, 10)];
      if (t2) PL.playTrack(t2);
      return;
    }
    var row = e.target.closest('.frow');
    if (row && row.dataset.i != null) {
      var t3 = PL.getFav()[parseInt(row.dataset.i, 10)];
      if (!t3) return;
      if (P.cur && String(t3.id) === String(P.cur.id)) { PL.toggle(); return; }
      PL.playTrack(t3);
    }
  });

  $('fPlayAll').addEventListener('click', function(){
    var fav = PL.getFav();
    if (!fav.length) { window.toast('还没有收藏的歌'); return; }
    PL.setQueue(fav.slice(), 0);
    PL.setMode('order');
    PL.play(0, true);
    window.toast('播放 ' + fav.length + ' 首');
  });

  $('fShuffle').addEventListener('click', function(){
    var fav = PL.getFav();
    if (!fav.length) { window.toast('还没有收藏的歌'); return; }
    var arr = fav.slice();
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    PL.setQueue(arr, 0);
    PL.setMode('shuffle');
    PL.play(0, true);
    window.toast('随机播放 ' + arr.length + ' 首');
  });

  /* ---------- 同步状态 ---------- */
  function renderState(){
    var box = $('fState');
    if (!box) return;
    var u = '', p = '';
    try { u = localStorage.getItem('blindbox_user') || ''; p = localStorage.getItem('blindbox_pass') || ''; } catch(e){}
    if (!u || !p) {
      box.className = 'fstate';
      box.innerHTML = '<span class="dot"></span><span>仅存本机</span>';
      $('fSync').textContent = '本地';
    } else {
      box.className = 'fstate ok';
      box.innerHTML = '<span class="dot"></span><span>已登录 · 云端同步已开启</span>';
      $('fSync').textContent = '已同步';
    }
  }

  /* ---------- 最近播放 ---------- */
  function renderRecent(){
    var list = PL.getRecent() || [];
    var card = $('rCard');
    if (!card) return;
    if (!list.length) { card.style.display = 'none'; return; }
    card.style.display = '';
    $('rCount').textContent = list.length + ' 首';
    var items = list.slice(0, 12);

    $('rList').innerHTML = items.map(function(t, i){
      var isNow = P.cur && String(t.id) === String(P.cur.id);
      return '<div class="frow' + (isNow ? ' now' : '') + '" data-ri="' + i + '">' +
        '<span class="no">' + (i + 1) + '</span>' +
        '<div class="fcv c' + (i % 6 + 1) + '"><span>' + M.esc((t.name || '♪').trim().charAt(0) || '♪') + '</span>' +
          '<img data-rv="' + i + '" alt=""></div>' +
        '<div class="ftx">' +
          '<span class="fname">' + M.esc(t.name || '未知歌曲') + '</span>' +
          '<em class="fart">' + M.esc(t.artist || '未知歌手') + '</em>' +
        '</div>' +
        '<div class="fbtns">' +
          (isNow ? eqHTML() :
            '<button class="fplay" data-rplay="' + i + '" title="播放">' +
              '<svg viewBox="0 0 24 24" width="12" height="12"><path d="M8 5v14l11-7z" fill="currentColor"/></svg></button>') +
        '</div>' +
        '</div>';
    }).join('');

    Array.prototype.forEach.call($('rList').querySelectorAll('img[data-rv]'), function(img){
      var t = items[parseInt(img.dataset.rv, 10)];
      if (!t) return;
      M.fetchPic(t, 100).then(function(u){
        if (!u) return;
        img.onload = function(){ img.classList.add('ld'); var sp = img.parentNode.querySelector('span'); if (sp) sp.textContent = ''; };
        img.onerror = function(){};
        img.src = u;
      }).catch(function(){});
    });
  }

  $('rList').addEventListener('click', function(e){
    var pl = e.target.closest('[data-rplay]');
    if (pl) {
      e.stopPropagation();
      var t0 = PL.getRecent()[parseInt(pl.dataset.rplay, 10)];
      if (t0) PL.playTrack(t0);
      return;
    }
    var row = e.target.closest('[data-ri]');
    if (!row) return;
    var t = PL.getRecent()[parseInt(row.dataset.ri, 10)];
    if (!t) return;
    if (P.cur && String(t.id) === String(P.cur.id)) { PL.toggle(); return; }
    PL.playTrack(t);
  });

  $('rClear').addEventListener('click', function(){
    try { localStorage.setItem('momusic_recent_v1', '[]'); } catch(e){}
    renderRecent();
    window.toast('最近播放已清空');
  });

  /* ---------- 事件 ---------- */
  window.VON('fav', renderFav);
  window.VON('track', function(){ renderFav(); renderRecent(); });
  window.VON('state', function(){ renderFav(); renderRecent(); });
  window.VON('play', renderFav);
  window.VON('pause', renderFav);
  window.VON('recent', renderRecent);

  window.mmOnShow = function(){
    renderFav();
    renderRecent();
    renderState();
  };

  /* ---------- 首屏 ---------- */
  renderFav();
  renderRecent();
  renderState();
  PL.loadFavorites().then(function(){
    if (window.__view !== 'love') return;
    renderFav();
    renderState();
  });
})();
</script>
</body>
</html>
