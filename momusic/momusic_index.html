<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2EBDC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>烩菜听歌每天好心情~</title>
<link rel="stylesheet" href="theme.css?v=43">
<!-- 库先于正文加载：任何视图脚本注入执行时，MUSIC / PLAYER 已就绪 -->
<script src="core.js?v=43"></script>
<script src="player.js?v=43"></script>
<style>
  html,body{height:100%}
  body{
    display:flex;flex-direction:column;
    overflow:hidden;
    background:var(--paper);
    background-attachment:fixed;
  }

  /* ===== 顶栏：报刊报头 ===== */
  .sh-head{
    flex:none;position:relative;z-index:10;
    padding:calc(10px + env(safe-area-inset-top,0px)) clamp(11px,3vw,22px) 0;
  }
  .sh-head-in{width:min(100%,760px);margin:0 auto;display:flex;align-items:center;gap:10px}
  .sh-title{flex:1;min-width:0;padding-top:2px}
  .sh-title b{
    display:block;font-family:var(--serif);font-size:20px;font-weight:900;letter-spacing:-.3px;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25;
  }
  .sh-title i{
    display:block;font-style:normal;font-family:var(--disp);font-size:8.5px;font-weight:400;
    color:var(--ink-3);letter-spacing:2.6px;margin-top:3px;
  }
  /* 刊期号：贴在标题下方的小字，不跟音质挤在一行 */
  .sh-issue{
    flex:none;text-align:right;font-family:var(--disp);font-size:9px;letter-spacing:1.6px;
    color:var(--ink-3);line-height:1.55;padding-top:4px;
  }
  .sh-issue b{display:block;font-family:var(--serif);font-size:13px;letter-spacing:0;color:var(--ink)}
  #qBadge{
    flex:none;height:30px;padding:0 11px;border:var(--edge2) solid var(--ink);cursor:pointer;
    font-family:var(--disp);font-size:9.5px;font-weight:400;letter-spacing:1.6px;color:var(--ink);
    background:var(--paper);box-shadow:var(--sh-xs);
    display:flex;align-items:center;gap:5px;
    transition:transform .14s,box-shadow .14s;
    margin-top:3px;
  }
  #qBadge:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
  #qBadge s{width:5px;height:5px;border-radius:50%;background:var(--blue);text-decoration:none;display:block}
  #qBadge.loss s{background:var(--orange)}
  /* 报头下方双线 */
  .sh-rule{height:3px;background:var(--ink);margin-top:9px;position:relative;width:min(100%,760px);margin-left:auto;margin-right:auto}
  .sh-rule::after{content:"";position:absolute;left:0;right:0;top:6px;height:1.5px;background:var(--ink);opacity:.45}

  /* ===== 歌词页：整页压暗（唱片内页） =====
     歌词页是墨黑底，报头和纸纹也要跟着压暗，否则顶部会留一条米白带。 */
  body.lyric-dark{background:#14110D}
  body.lyric-dark .sh-head{background:transparent}
  body.lyric-dark .sh-title b{color:var(--paper)}
  body.lyric-dark .sh-title i{color:rgba(242,235,220,.5)}
  body.lyric-dark .sh-issue{color:rgba(242,235,220,.5)}
  body.lyric-dark .sh-issue b{color:var(--paper)}
  body.lyric-dark .sh-rule{background:var(--paper)}
  body.lyric-dark .sh-rule::after{background:rgba(242,235,220,.35)}
  body.lyric-dark .mm-icon-btn{background:transparent;border-color:rgba(242,235,220,.5);color:var(--paper);box-shadow:none}
  body.lyric-dark #qBadge{background:transparent;border-color:rgba(242,235,220,.5);color:var(--paper);box-shadow:none}
  body.lyric-dark .mm-icon-btn:active{box-shadow:none}
  body.lyric-dark #qBadge:active{box-shadow:none}
  /* 套印偏移在深底上要用 screen 叠，multiply 会把橙色压没 */
  body.lyric-dark .sh-title b.riso-print::after{color:var(--orange);mix-blend-mode:screen}
  /* 纸纹在墨黑底上用 screen，避免压死页面 */
  body.lyric-dark::after{mix-blend-mode:screen;opacity:.09}

  /* ===== 正文区：Pjax 只换这里，audio 在壳里永不销毁 ===== */
  .sh-stage{flex:1;min-height:0;position:relative;z-index:1;width:100%}
  #viewHost{
    position:absolute;inset:0;
    overflow-y:auto;overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    display:block;
    /* 底部留出播放条的高度（播放条 76px + 16px 底距 + 14px 内距） */
    padding:0 clamp(10px,3vw,22px) 112px;
  }

  /* ===== 撕纸转场 =====
     新页从上方压下来，旧页被撕开翻落。
     两层叠放，互不干扰；动画结束后旧层被移除。 */
  .paper-layer{
    width:min(100%,760px);margin-left:auto;margin-right:auto;
    position:relative;
    will-change:transform,opacity;
  }
  /* 新页层：底部留出播放条的高度（播放条 ~76px + 底距 16px + 安全区） */
  #paperNew{padding-bottom:96px}
  #paperOld{
    position:absolute;left:0;right:0;top:0;
    width:auto;
    z-index:1;
    padding:0 clamp(10px,3vw,22px);
    background:var(--paper);
    overflow:hidden;
  }
  #paperNew{ z-index:2; }
  @keyframes tearIn{
    0%  {opacity:0;transform:translateY(-22px) rotate(-.7deg) scale(.985);}
    55% {opacity:1;}
    100%{opacity:1;transform:translateY(0) rotate(0) scale(1);}
  }
  @keyframes tearOut{
    0%  {opacity:1;transform:translateY(0) rotate(0);}
    35% {opacity:1;transform:translateY(-6px) rotate(-1.1deg);}
    100%{opacity:0;transform:translateY(34px) rotate(3.4deg);}
  }
  /* 撕开瞬间：纸张边缘的一道亮缝 */
  #paperOld::after{
    content:"";position:absolute;left:-6px;right:-6px;top:-2px;height:2px;
    background:linear-gradient(90deg,transparent,var(--paper) 18%,var(--paper) 82%,transparent);
    opacity:0;
  }
  #paperOld.tearing::after{animation:tearSeam .34s ease-out both}
  @keyframes tearSeam{
    0%{opacity:0;transform:scaleX(.2)}
    30%{opacity:.9;transform:scaleX(1)}
    100%{opacity:0}
  }

  #viewHost > *{width:min(100%,760px);margin-left:auto;margin-right:auto}
  #viewHost > * + *{margin-top:9px}

  /* 预渲染骨架：视图未就绪时先顶住画面 */
  .sh-skel{
    position:absolute;inset:0;z-index:2;
    padding:0 clamp(10px,3vw,22px);
    display:flex;flex-direction:column;gap:9px;
    pointer-events:none;transition:opacity .3s;
  }
  .sh-skel.off{opacity:0;pointer-events:none}
  .sh-skel .bar{border:var(--edge) solid var(--ink);border-radius:0;background:var(--paper-2);height:54px;box-shadow:var(--sh-sm);flex:none}
  .sh-skel .card{border:var(--edge) solid var(--ink);border-radius:0;background:var(--paper-2);height:196px;box-shadow:var(--sh-sm);flex:none}
  .sh-skel .row{height:52px;flex:none}
  .sh-skel > *{position:relative;overflow:hidden}
  .sh-skel > *::after{
    content:"";position:absolute;inset:0;transform:translateX(-100%);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.82),transparent);
    animation:mmShine 1.5s infinite;
  }
  @keyframes mmShine{to{transform:translateX(100%)}}

  /* ===== 底部播放条：全站唯一一条（印刷标签风格） ===== */
  .sh-player{
    flex:none;position:relative;z-index:20;
    padding:0 clamp(9px,2.6vw,20px) calc(16px + env(safe-area-inset-bottom,0px));
    transition:transform .3s cubic-bezier(.3,.9,.3,1),opacity .3s;
  }
  /* 歌词页隐藏播放条（那个页面自带一整套控件） */
  .sh-player.hide{display:none}

  .sh-player-in{
    width:min(100%,760px);margin:0 auto;
    border:var(--edge) solid var(--ink);
    background:var(--paper);
    box-shadow:var(--sh-md);
    overflow:hidden;
    position:relative;
  }
  .sh-pbar{height:7px;background:var(--paper-2);border-bottom:var(--edge2) solid var(--ink);position:relative;cursor:pointer;touch-action:none}
  .sh-pbar i{
    position:absolute;left:0;top:0;bottom:0;width:0;
    background:var(--orange);
  }
  .sh-pbar u{
    position:absolute;top:50%;left:0;transform:translate(-50%,-50%);
    width:12px;height:12px;background:var(--ink);border:2px solid var(--paper);
    box-sizing:border-box;display:none;
  }
  .sh-pbar:hover u{display:block}
  .sh-prow{display:flex;align-items:center;gap:10px;padding:11px 12px 12px 11px}

  /* 整条点击区：除右侧控件以外都能进歌词页 */
  .sh-hit{position:absolute;left:0;top:0;bottom:0;right:118px;z-index:2;cursor:pointer}

  /* 唱片（圆 —— 圆形的内容用圆） */
  .sh-cover{
    flex:none;width:46px;height:46px;border-radius:50%;position:relative;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    color:var(--paper);font-family:var(--serif);font-size:17px;font-weight:900;
    background:
      repeating-radial-gradient(circle at 50% 50%,rgba(242,235,220,.14) 0 1px,transparent 1px 4px),
      var(--ink);
    border:var(--edge2) solid var(--ink);
  }
  .sh-cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
  .sh-cover img.ld{opacity:1}
  .sh-cover::after{
    content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:10px;height:10px;border-radius:50%;background:var(--orange);
  }
  .sh-meta{flex:1;min-width:0}
  .sh-meta b{
    display:block;font-family:var(--serif);font-size:14px;font-weight:900;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3;
  }
  .sh-meta em{
    display:block;font-style:normal;font-size:10.5px;font-weight:700;color:var(--ink-2);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;
  }
  .sh-pbtns{flex:none;display:flex;align-items:center;gap:8px;padding-right:2px;position:relative;z-index:3}
  /* 收起状态的播放/暂停：方形印刷按钮 */
  #shToggle{
    flex:none;width:34px;height:34px;border:var(--edge2) solid var(--ink);background:var(--yellow);cursor:pointer;
    color:var(--ink);display:flex;align-items:center;justify-content:center;
    transition:transform .12s,background .15s;
  }
  #shToggle:active{transform:translate(1px,1px);background:var(--orange);color:var(--paper)}
  .sh-mini{
    width:30px;height:30px;border:var(--edge2) solid var(--ink);cursor:pointer;background:var(--paper);
    color:var(--ink-2);display:flex;align-items:center;justify-content:center;
    transition:transform .14s,color .2s;
  }
  .sh-mini:active{transform:translate(1px,1px)}
  .sh-mini.on{color:var(--orange)}

  /* ===== Toast ===== */
  .sh-toast{
    position:fixed;left:50%;top:calc(74px + env(safe-area-inset-top,0px));
    transform:translateX(-50%) translateY(-10px) scale(.96);
    z-index:60;pointer-events:none;max-width:82vw;
    padding:10px 18px;
    border:var(--edge2) solid var(--ink);background:var(--paper);color:var(--ink);
    font-size:12.5px;font-weight:800;letter-spacing:.2px;
    box-shadow:var(--sh-sm);
    opacity:0;transition:opacity .24s,transform .24s cubic-bezier(.3,.9,.3,1.2);
  }
  .sh-toast.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}

  /* ===== 播放列表抽屉 ===== */
  .sh-queue-mask{
    position:fixed;inset:0;z-index:38;
    background:rgba(20,17,13,.42);
    opacity:0;pointer-events:none;transition:opacity .25s;
  }
  .sh-queue-mask.show{opacity:1;pointer-events:auto}

  .sh-queue{
    position:fixed;left:50%;bottom:0;z-index:40;
    transform:translateX(-50%) translateY(102%);
    width:min(100vw - 12px,760px);
    max-height:70vh;
    display:flex;flex-direction:column;
    background:var(--paper);
    border:var(--edge) solid var(--ink);border-bottom:none;
    box-shadow:0 -10px 0 rgba(20,17,13,.10), 0 -18px 34px rgba(20,17,13,.22);
    padding:9px 10px calc(22px + env(safe-area-inset-bottom,0px));
    transition:transform .32s cubic-bezier(.3,.9,.3,1);
  }
  .sh-queue.show{transform:translateX(-50%) translateY(0)}

  .sh-qhandle{width:34px;height:4px;background:var(--ink);margin:0 auto 9px;flex:none}

  .sh-queue-hd{display:flex;align-items:center;gap:8px;padding:0 3px 9px;flex:none}
  .sh-queue-hd .qi{
    flex:none;width:26px;height:26px;border:var(--edge2) solid var(--ink);
    display:flex;align-items:center;justify-content:center;
    background:var(--blue);color:var(--paper);
  }
  .sh-queue-hd b{font-family:var(--serif);font-size:15px;font-weight:900;color:var(--ink)}
  .sh-queue-hd em{font-style:normal;font-size:10.5px;font-weight:700;color:var(--ink-3)}
  #shQueueClear{
    margin-left:auto;height:26px;padding:0 9px;border:var(--edge2) solid var(--ink);cursor:pointer;
    background:var(--paper);color:var(--ink);font-family:var(--disp);font-size:9.5px;letter-spacing:1.4px;
  }
  #shQueueClose{
    width:28px;height:28px;border:var(--edge2) solid var(--ink);cursor:pointer;
    background:var(--paper);color:var(--ink);
    display:flex;align-items:center;justify-content:center;
  }
  .sh-queue-list{flex:1;overflow-y:auto;min-height:0}

  /* 队列行：点整行播放 / ▶ 播放 / 🗑 删除 */
  .sh-qrow{
    position:relative;
    display:flex;align-items:center;gap:9px;
    padding:8px 3px;
    cursor:pointer;transition:background .15s;
  }
  .sh-qrow + .sh-qrow::before{
    content:"";position:absolute;left:3px;right:3px;top:0;height:1.5px;background:var(--ink);opacity:.5;
  }
  .sh-qrow:active{background:var(--paper-2)}
  .sh-qrow.now{background:var(--paper-2)}
  .sh-qrow.now::before{display:none}
  .sh-qrow.now .sh-qname{color:var(--orange)}
  .sh-qrow .sh-qcv{
    flex:none;width:36px;height:36px;border:var(--edge2) solid var(--ink);position:relative;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    color:var(--paper);font-family:var(--serif);font-size:14px;font-weight:900;
    background:var(--orange);
  }
  .sh-qrow .sh-qcv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
  .sh-qrow .sh-qcv img.ld{opacity:1}
  .sh-qrow .sh-qtx{flex:1;min-width:0}
  .sh-qrow .sh-qname{
    display:block;font-family:var(--serif);font-size:13px;font-weight:900;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3;
  }
  .sh-qrow .sh-qart{
    display:block;font-style:normal;font-size:10px;font-weight:700;color:var(--ink-3);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;
  }
  .sh-qrow .sh-qbtns{flex:none;display:flex;align-items:center;gap:5px}
  .sh-qrow .sh-qeq{
    display:flex;align-items:flex-end;gap:2px;height:13px;padding-right:2px;
  }
  .sh-qrow .sh-qeq i{width:2.5px;border-radius:2px;background:var(--ink);animation:shEq 1s ease-in-out infinite}
  .sh-qrow .sh-qeq i:nth-child(2){background:var(--orange);animation-delay:.22s}
  .sh-qrow .sh-qeq i:nth-child(3){background:var(--blue);animation-delay:.44s}
  .sh-qrow .sh-qeq.off i{animation-play-state:paused;height:4px}
  @keyframes shEq{0%,100%{height:4px}50%{height:13px}}

  .sh-qplay{
    width:30px;height:30px;border:var(--edge2) solid var(--ink);cursor:pointer;color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    background:var(--yellow);
  }
  .sh-qplay:active{background:var(--orange);color:var(--paper)}
  .sh-qdel{
    width:30px;height:30px;border:var(--edge2) solid var(--ink);cursor:pointer;
    background:var(--paper);color:var(--ink-3);
    display:flex;align-items:center;justify-content:center;
  }
  .sh-qempty{padding:42px 16px;text-align:center;font-size:12.5px;font-weight:700;color:var(--ink-3);line-height:1.95}
</style>
</head>
<body>

<!-- ===== 顶栏：报刊报头 ===== -->
<header class="sh-head">
  <div class="sh-head-in">
    <button class="mm-icon-btn" id="shBack" title="返回">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>
    </button>
    <div class="sh-title">
      <b class="riso-print" data-t="烩菜听歌"><span>烩菜听歌</span></b>
      <i>HUICAICHUNTING · RADIO</i>
    </div>
    <span class="sh-issue"><b id="shIssueNo">NO.248</b>丰稔季</span>
    <button id="qBadge" title="切换音质"><s></s><span id="qBadgeText">320K</span></button>
  </div>
  <div class="sh-rule"></div>
</header>

<!-- ===== 正文区（Pjax 局部刷新） ===== -->
<div class="sh-stage">
  <div class="sh-skel" id="shSkel">
    <div class="bar"></div>
    <div class="card"></div>
    <div class="card"></div>
  </div>
  <div id="viewHost"></div>
</div>

<!-- ===== 底部播放条（全站唯一，歌词页隐藏） ===== -->
<div class="sh-player" id="shPlayer">
  <div class="sh-player-in">
    <i class="sh-hit" id="shHit"></i>
    <div class="sh-pbar" id="shBar"><i id="shBarFill"></i><u id="shBarKnob"></u></div>
    <div class="sh-prow">
      <div class="sh-cover"><span id="shCoverChar">♪</span><img id="shCoverImg" alt=""></div>
      <div class="sh-meta">
        <b id="shName">还没有播放</b>
        <em id="shArtist">搜一首歌，点一下就播 ♪</em>
      </div>
      <div class="sh-pbtns">
        <button class="sh-mini" id="shMode" title="播放模式">
          <svg viewBox="0 0 24 24" width="15" height="15"><path d="M4 7h3l9 10h4M4 17h3l2.3-2.6M16 7h4M20 7l-2.3-2.3M20 7l-2.3 2.3M20 17l-2.3 2.3M20 17l-2.3-2.3" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
        </button>
        <button class="sh-mini" id="shPrev" title="上一首">
          <svg viewBox="0 0 24 24" width="15" height="15"><path d="M7 6h2.4v12H7zM20 6v12l-9.5-6z" fill="currentColor"/></svg>
        </button>
        <button id="shToggle" title="播放/暂停"></button>
        <button class="sh-mini" id="shNext" title="下一首">
          <svg viewBox="0 0 24 24" width="15" height="15"><path d="M14.6 6H17v12h-2.4zM4 6v12l9.5-6z" fill="currentColor"/></svg>
        </button>
        <button class="sh-mini" id="shQueue" title="播放列表">
          <svg viewBox="0 0 24 24" width="15" height="15"><path d="M4 7h11M4 12h11M4 17h7" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M18 13.5v5.2a1.7 1.7 0 1 0 1.7 1.7V13h2" stroke="currentColor" stroke-width="1.9" fill="none" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- ===== 播放列表抽屉 ===== -->
<div class="sh-queue-mask" id="shQueueMask"></div>
<div class="sh-queue" id="shQueuePanel">
  <div class="sh-qhandle"></div>
  <div class="sh-queue-hd">
    <span class="qi">
      <svg viewBox="0 0 24 24" width="14" height="14"><path d="M4 7h11M4 12h11M4 17h7" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
    </span>
    <b>播放列表</b>
    <em id="shQueueCount"></em>
    <button id="shQueueClear">清空</button>
    <button id="shQueueClose" title="关闭">
      <svg viewBox="0 0 24 24" width="13" height="13"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" fill="none"/></svg>
    </button>
  </div>
  <div class="sh-queue-list" id="shQueueList"></div>
</div>

<div class="sh-toast" id="shToast"></div>

<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };

  // 数据层 / 播放器挂到 window，视图脚本直接用 window.M / window.PL
  window.M  = window.MUSIC;
  window.PL = window.PLAYER;

  /* ---------- Toast ---------- */

  /* ---------- 视图专用工具（切页自动清理，避免监听器越积越多） ---------- */
  window.VON = function(ev, fn){
    viewListeners.push([ev, fn]);
    window.PL.on(ev, fn);
    return fn;
  };
  var timerSeq = 0;
  window.VTIMER = function(fn, ms, repeat){
    var id = 'vt' + (++timerSeq);
    viewTimers[id] = repeat ? setInterval(fn, ms) : setTimeout(fn, ms);

  };
  window.VCLEAR = function(id){
    if (!id) return;
    try { clearTimeout(viewTimers[id]); clearInterval(viewTimers[id]); } catch(e){}
    delete viewTimers[id];

  function cleanupView(){
    viewListeners.forEach(function(p){ try { window.PL.off(p[0], p[1]); } catch(e){} });
    viewListeners.length = 0;
    Object.keys(viewTimers).forEach(function(id){ window.VCLEAR(id); });
    if (viewStyleEl) { try { viewStyleEl.remove(); } catch(e){} viewStyleEl = null; }

  /* ---------- 把子页 body 样式改写为 #viewHost 作用域 ---------- */
  function scopeCSS(txt){
    return txt
      // body{...} → #viewHost{...}
      .replace(/(^|[}\s;])body\s*\{/g, '$1#viewHost{')
      // 这些在外壳里会冲突，直接去掉
      .replace(/min-height\s*:[^;}]*(;|\})/g, '$1')
      .replace(/(^|[}\s;])html\s*\{[^}]*\}/g, '$1')
      .replace(/background\s*:\s*transparent\s*(;|\})/g, '$1');
  }

  /* ==========================================================
     撕纸转场
     旧页像一张纸被撕下来（撕开 + 翻落 + 淡出），
     新页从上方压下来（落下 + 阴影收紧）。
     用两个叠放的层实现，不用动画库。
     ========================================================== */
  var tearAnim = 0;
  function tearTransition(oldEl, newEl, done){
    // 新页入场：从上方落下 + 轻微旋转归位
    // 旧页退场：撕开（上下错开）→ 翻落
    // 顺序很关键：先给新页设动画 → 强制重排让它跑起来 → 再动旧页
    newEl.style.transformOrigin = '50% 0%';
    newEl.style.animation = 'tearIn .42s cubic-bezier(.2,.85,.3,1) both';
    void newEl.offsetWidth;              // 强制重排，让新页动画先落地
    oldEl.style.transformOrigin = '50% 0%';
    oldEl.classList.add('tearing');
    oldEl.style.animation = 'tearOut .34s cubic-bezier(.55,0,.75,.3) both';
    oldEl.style.pointerEvents = 'none';

    setTimeout(function(){
      try { oldEl.remove(); } catch(e){}
      newEl.style.animation = '';
      newEl.style.transformOrigin = '';
      done && done();
    }, 440);
  }

  /* ---------- Pjax：拉子页 → 只替换正文 ---------- */
  async function loadView(src, key){
    skel.classList.remove('off');

    try {
      var res = await fetch(src + (src.indexOf('?') >= 0 ? '&' : '?') + 't=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var txt = await res.text();
      var doc = new DOMParser().parseFromString(txt, 'text/html');

      // 1) 样式 → 作用域化后注入
      var styles = '';
      doc.querySelectorAll('style').forEach(function(s){ styles += s.textContent + '\n'; });
      cleanupView();
      if (styles.trim()) {
        viewStyleEl = document.createElement('style');
        viewStyleEl.setAttribute('data-view', key || '');
        viewStyleEl.textContent = scopeCSS(styles);
        document.head.appendChild(viewStyleEl);
      }

      // 2) 正文 DOM（跳过 script，稍后按序注入执行）
      //    旧内容先搬进「纸屑层」，新内容放进「新页层」，然后演撕纸动画
      //
      //    关键：内容一直装在 #paperNew 这层里。切换时把 #paperNew 的**子节点**
      //    搬进新的 #paperOld，然后把旧 #paperNew 整个移除 ——
      //    否则 DOM 里会同时存在两个 #paperNew，下一次切换就会搬到空层，
      //    页面内容会丢。
      var oldPaper = document.createElement('div');
      oldPaper.id = 'paperOld';
      oldPaper.className = 'paper-layer';

      var prevLayer = host.querySelector('#paperNew');
      var movers = [];
      if (prevLayer) {
        // 正常情况：旧内容在 #paperNew 里
        Array.prototype.forEach.call(prevLayer.childNodes, function(n){ movers.push(n); });
        movers.forEach(function(el){ oldPaper.appendChild(el); });
        try { prevLayer.parentNode.removeChild(prevLayer); } catch(e){}
      } else {
        // 兜底：直接搬 host 的子节点（排除包装层本身）
        Array.prototype.forEach.call(host.children, function(el){
          if (el.id === 'paperOld' || el.id === 'paperNew') return;
          movers.push(el);
        });
        movers.forEach(function(el){ oldPaper.appendChild(el); });
      }
      var hadOld = movers.length > 0;

      var newPaper = document.createElement('div');
      newPaper.id = 'paperNew';
      newPaper.className = 'paper-layer';
      Array.prototype.forEach.call(doc.body.children, function(el){
        if (el.tagName === 'SCRIPT' || el.tagName === 'LINK') return;
        newPaper.appendChild(document.importNode(el, true));
      });

      // 清理可能残留的旧纸屑层
      Array.prototype.forEach.call(host.querySelectorAll('#paperOld'), function(el){
        try { el.parentNode.removeChild(el); } catch(e){}
      });

      host.appendChild(oldPaper);
      host.appendChild(newPaper);

      // 3) 标记当前视图，供延迟回调判断自己是否已被替换
      window.__view = key;
      curKey = key;

      // 4) 按原顺序同步执行子页脚本（同一 JS 上下文，无新引擎开销）
      var scripts = doc.body.querySelectorAll('script');
      Array.prototype.forEach.call(scripts, function(old){
        var s = document.createElement('script');
        if (old.src) { s.src = old.src; host.appendChild(s); return; }
        s.textContent = old.textContent;
        document.body.appendChild(s);
        s.remove();
      });

      // 5) 子页声明 mmOnShow 时，手动补一次首屏渲染
      if (typeof window.mmOnShow === 'function') {
        try { window.mmOnShow(); } catch(e){}
      }

      // 6) 演撕纸转场
      if (oldPaper.childNodes.length) {
        tearTransition(oldPaper, newPaper);
      } else {
        try { oldPaper.remove(); } catch(e){}
        newPaper.style.animation = 'tearIn .3s cubic-bezier(.2,.85,.3,1) both';
        setTimeout(function(){ newPaper.style.animation = ''; }, 320);
      }
    } catch (e) {
      host.innerHTML = '<div style="padding:60px 20px;text-align:center;font-size:13px;font-weight:700;color:#7A7161;line-height:2">页面加载失败<br>下拉刷新试试</div>';
      toast('页面加载失败');
    }

    skel.classList.add('off');
    loading = false;
  }

  /* ---------- 视图切换 ---------- */
  var TABS = [

    // 歌词页隐藏底部播放条；其它页显示

  function goView(src, key){
    if (loading) return;

    syncShell(key);

  /* ---------- 返回：任何子页都退回找歌（留在壳里），找歌页再按一次才退出 ---------- */
  function disarmExit(){
    exitArmed = false;
    clearTimeout(exitTimer);
  }
  function tryExit(){
    if (!exitArmed) {
      exitArmed = true;
      toast('再按一次退出烩菜听歌~');
      clearTimeout(exitTimer);
      exitTimer = setTimeout(disarmExit, 2200);
      return;
    }
    disarmExit();
    // 再按一次 = 离开音乐模块，回到主站首页 main.html。
    // 注意：APK 内也不再直接退出 App（不再调 exitApp），统一跳回 main.html，
    // 这样车机上按返回是「退回主站」而不是「App 被关掉」。
    try { location.replace('../main.html'); }
    catch (e) { location.href = '../main.html'; }
  }

  /* 统一的「返回上一层」：非找歌页 → 回找歌页；已在找歌页 → 提示再按一次 */
  /* 关键：APK 原生返回键派发 androidback 后等 1.2 秒，
     若这期间页面没认领、URL 也没变化，原生层会 webView.goBack()，
     直接退回 main.html —— 这就是「按一下返回就回主页」的根因。
     音乐页是单页面（Pjax，URL 永不变），所以必须主动认领：
       · APK 内：AndroidBridge.markBackHandled()（v3.4 新增）
       · 网页版：改一下 URL hash，让「URL 有变化」的判定通过 */
  var backSeq = 0;
  function ackBack(){
    var done = false;
    try {
      if (typeof AndroidBridge !== 'undefined' && AndroidBridge && AndroidBridge.markBackHandled) {
        AndroidBridge.markBackHandled();
        done = true;
      }
    } catch (e) {}
    if (!done) {
      try {
        backSeq++;
        history.replaceState(history.state, '', location.pathname + location.search + '#mmb' + backSeq);
      } catch (e) {}
    }
  }

  function goBack(){
    if (loading) { ackBack(); return true; }
    ackBack();
    if (curKey === 'search') { tryExit(); return true; }
    goView(viewSrc('search'), 'search');
    return true;
  }
  window.mmGoBack = goBack;

  $('shBack').addEventListener('click', function(){
    goBack();
  });

  /* APK 系统返回键：先交给页面处理（外壳在壳内回退，不会直接退回 main） */
  window.addEventListener('androidback', function(){
    goBack();
  });

  /* ---------- 播放列表抽屉 ---------- */
  function renderQueue(){
    var list = $('shQueueList');
    if (!list) return;
    var q = P.queue || [];
    $('shQueueCount').textContent = q.length ? q.length + ' 首' : '';

    if (!q.length) {
      list.innerHTML = '<div class="sh-qempty">列表还是空的<br>搜一首歌就开始吧 ♪</div>';
      return;
    }
    var playing = P.audio && !P.audio.paused && !P.audio.ended;
    list.innerHTML = q.map(function(t, i){
      var isNow = P.cur && String(t.id) === String(P.cur.id);
      return '<div class="sh-qrow' + (isNow ? ' now' : '') + '" data-qi="' + i + '">' +
        '<div class="sh-qcv c' + (i % 6 + 1) + '"><span>' + M.esc((t.name || '♪').trim().charAt(0) || '♪') + '</span>' +
          '<img data-qcv="' + i + '" alt=""></div>' +
        '<div class="sh-qtx">' +
          '<span class="sh-qname">' + M.esc(t.name || '未知歌曲') + '</span>' +
          '<em class="sh-qart">' + M.esc(t.artist || '未知歌手') + '</em>' +
        '</div>' +
        '<div class="sh-qbtns">' +
          (isNow ? '<span class="sh-qeq' + (playing ? '' : ' off') + '"><i></i><i></i><i></i></span>' : '') +
          '<button class="sh-qplay" data-qplay="' + i + '" title="播放">' +
            '<svg viewBox="0 0 24 24" width="12" height="12"><path d="M8 5v14l11-7z" fill="currentColor"/></svg></button>' +
          '<button class="sh-qdel" data-qdel="' + i + '" title="从列表移除">' +
            '<svg viewBox="0 0 24 24" width="13" height="13"><path d="M4.5 7h15M9.5 7V4.6h5V7M6.6 7l.9 12.4h9l.9-12.4" stroke="currentColor" stroke-width="1.9" fill="none" stroke-linecap="round"/><path d="M10 10.8v5.6M14 10.8v5.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg></button>' +
        '</div>' +
        '</div>';
    }).join('');

    // 懒加载封面
    Array.prototype.forEach.call(list.querySelectorAll('img[data-qcv]'), function(img){
      var t = q[parseInt(img.dataset.qcv, 10)];
      if (!t) return;
      M.fetchPic(t, 120).then(function(u){
        if (!u) return;
        img.onload = function(){ img.classList.add('ld'); };
        img.onerror = function(){};
        img.src = u;
      });
    });
  }

  function openQueue(){
    $('shQueuePanel').classList.add('show');
    $('shQueueMask').classList.add('show');
    $('shQueue').classList.add('on');
    renderQueue();

  window.mmOpenQueue = openQueue;
  function closeQueue(){
    $('shQueuePanel').classList.remove('show');
    $('shQueueMask').classList.remove('show');
    $('shQueue').classList.remove('on');

  $('shQueue').addEventListener('click', function(e){

  /* 清空列表 */
  $('shQueueClear').addEventListener('click', function(){
    if (!P.queue.length) { toast('列表已经是空的'); return; }
    P.queue = [];
    P.qi = 0;
    P.cur = null;
    // 停下音频并清掉 src，否则播放条还会显示上一首
    try {
      if (P.audio) {
        P.audio.pause();
        P.audio.removeAttribute('src');
        try { P.audio.load(); } catch(e){}
      }
    } catch(e){}
    window.PL.persistQueue();
    window.PL.emit('queue');
    window.PL.emit('track', null);
    renderQueue();
    toast('列表已清空');
  });

  $('shQueueList').addEventListener('click', function(e){
    // 删除
    var del = e.target.closest('[data-qdel]');
    if (del) {
      e.stopPropagation();
      removeFromQueue(parseInt(del.dataset.qdel, 10));
      return;
    }
    // 单独点 ▶ 播放
    var pl = e.target.closest('[data-qplay]');
    if (pl) {
      e.stopPropagation();
      playQueueAt(parseInt(pl.dataset.qplay, 10));
      return;
    }
    // 点整行
    var row = e.target.closest('[data-qi]');
    if (!row) return;
    var i = parseInt(row.dataset.qi, 10);
    var t = P.queue[i];
    if (!t) return;
    if (P.cur && String(t.id) === String(P.cur.id)) { window.PL.toggle(); return; }
    playQueueAt(i);
  });

  function playQueueAt(i){
    var t = P.queue[i];
    if (!t) return;
    if (P.cur && String(t.id) === String(P.cur.id)) { window.PL.toggle(); return; }
    P.qi = i;
    P.cur = t;
    window.PL.persistQueue();
    window.PL.play(0, true);
    renderQueue();
  }

  function removeFromQueue(i){
    if (i < 0 || i >= P.queue.length) return;
    var wasCur = P.cur && String(P.queue[i].id) === String(P.cur.id);
    var name = P.queue[i].name || '这首歌';
    P.queue.splice(i, 1);

    if (!P.queue.length) {
      P.qi = 0;
      P.cur = null;
      try { if (P.audio) { P.audio.pause(); P.audio.removeAttribute('src'); } } catch(e){}
      window.PL.persistQueue();
      window.PL.emit('queue');
      window.PL.emit('track', null);
      renderQueue();
      toast('已移除「' + name + '」');
      return;
    }
    if (i < P.qi) P.qi--;
    else if (i === P.qi) P.qi = Math.min(P.qi, P.queue.length - 1);
    if (wasCur) {
      // 当前这首被移除：指向补齐后同位置的歌，但不自动播放（避免突兀）
      P.qi = Math.min(i, P.queue.length - 1);
      P.cur = P.queue[P.qi];
      try { if (P.audio) { P.audio.pause(); P.audio.removeAttribute('src'); try { P.audio.load(); } catch(e){} } } catch(e){}
    }
    window.PL.persistQueue();
    window.PL.emit('queue');
    if (wasCur) window.PL.emit('track', P.cur);
    renderQueue();
    toast('已移除「' + name + '」');
  }

  /* 播放条控件 */

  // 进度条拖动
  var bar = $('shBar');
  function ratio(e){
    var r = bar.getBoundingClientRect();
    return Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
  }
  function barBlocked(){ return !(P.audio && isFinite(P.audio.duration) && P.audio.duration > 0); }
  bar.addEventListener('pointerdown', function(e){
    e.stopPropagation();
    if (barBlocked()) return;
    dragging = true;
    try { bar.setPointerCapture(e.pointerId); } catch(err){}
    renderBar(ratio(e) * P.audio.duration, P.audio.duration);
  });
  bar.addEventListener('pointermove', function(e){
    if (!dragging || !P.audio) return;
    renderBar(ratio(e) * P.audio.duration, P.audio.duration);
  });
  function endDrag(e){
    if (!dragging) return;
    e.stopPropagation();
    dragging = false;
    if (P.audio && isFinite(P.audio.duration)) window.PL.seek(ratio(e) * P.audio.duration);
  }
  bar.addEventListener('pointerup', endDrag);
  bar.addEventListener('pointercancel', function(){ dragging = false; });
  // 拖动期间别让点击冒泡进歌词页
  bar.addEventListener('click', function(e){ e.stopPropagation(); });

  /* ---------- 外壳事件（不随视图销毁） ---------- */
  window.PL.on('track', function(){ renderInfo(); renderBtn(); renderQueue(); });
  window.PL.on('state', function(){ renderBtn(); renderQueue(); renderMode(); });
  window.PL.on('play',  function(){ renderBtn(); renderQueue(); });
  window.PL.on('pause', function(){ renderBtn(); renderQueue(); });
  window.PL.on('busy',  renderBtn);
  window.PL.on('queue', renderQueue);
  window.PL.on('time',  function(c, d){ if (!dragging) renderBar(c, d); });
  window.PL.on('mode-state', function(){ renderQuality(); renderMode(); });
  window.PL.on('toast', toast);
  window.PL.on('quality', renderQuality);

  /* ---------- 启动 ---------- */
  /* 刊期号：按「丰稔季」第 N 天算，每天一刊 */
  (function initIssue(){
    var el = $('shIssueNo');
    if (!el) return;
    try {
      var d = new Date();
      var start = new Date(d.getFullYear(), 0, 1);
      var day = Math.floor((d - start) / 86400000);
      el.textContent = 'NO.' + (200 + day);
    } catch (e) { el.textContent = 'NO.248'; }
  })();

  renderQuality();
  renderMode();
  renderBtn();
  renderInfo();
  if (P.cur) renderBar(
    (function(){ try { var st = JSON.parse(localStorage.getItem('momusic_state_v1') || 'null'); return st && isFinite(st.pos) ? st.pos : 0; } catch(e){ return 0; } })(),
    (function(){ try { var st = JSON.parse(localStorage.getItem('momusic_state_v1') || 'null'); return st && isFinite(st.dur) ? st.dur : 0; } catch(e){ return 0; } })()
  );
  window.PL.ensureAudio();
  window.PL.loadFavorites();

  syncShell('search');
  goView('momusic_search.html', 'search');
})();
</script>
</body>
</html>
