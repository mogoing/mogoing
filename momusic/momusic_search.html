<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>找歌</title>
<style>
/* ==========================================================
   烩菜听歌 · 找歌页 ——「Risograph 印刷厂」
   · 方内容用方角，圆内容用圆（唱片 / 歌手标签 / 中心孔）
   · 投影一律实心硬偏移，不用模糊
   · 专色只有 墨黑 / 橙 / 蓝 / 黄，其余靠网点和叠印
   · 本页在 Pjax 里跑，外壳会把页面里的 body 选择器
     改写成 #viewHost，所以这里不依赖 body 选择器
   ========================================================== */

@keyframes spinNF{to{transform:rotate(360deg)}}
@keyframes mmPop{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}

/* ============ 搜索条：印刷标签 ============ */
.s-card{width:100%}
.s-box{
  display:flex;align-items:stretch;height:48px;
  border:var(--edge) solid var(--ink);background:var(--paper);
  box-shadow:var(--sh-sm);
}
.s-box .sic{
  flex:none;display:flex;align-items:center;padding:0 0 0 13px;
  color:var(--ink-2);pointer-events:none;
}
#q{
  flex:1;min-width:0;align-self:stretch;
  border:none;outline:none;background:none;
  font-family:var(--sans);font-size:13.5px;font-weight:700;color:var(--ink);
  padding:0 10px;-webkit-appearance:none;appearance:none;
}
#q::placeholder{color:var(--ink-3);font-weight:600}
#q::-webkit-search-cancel-button,#q::-webkit-search-decoration{-webkit-appearance:none;display:none}
#qClear{
  flex:none;width:38px;border:none;border-left:var(--edge) solid var(--ink);
  background:var(--paper-2);color:var(--ink-2);cursor:pointer;
  display:none;align-items:center;justify-content:center;
}
#qClear.on{display:flex}
#qClear:active{background:var(--paper-3)}
/* 「搜」方块：JS 只改里面的 span 文字，两态都稳 */
#qGo{
  flex:none;width:56px;border:none;border-left:var(--edge) solid var(--ink);
  background:var(--blue);color:var(--paper);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
#qGo span{
  font-family:var(--serif);font-size:14px;font-weight:900;letter-spacing:1px;
  color:var(--paper);
}
#qGo:active{background:var(--ink)}
#qGo:disabled{opacity:.55;pointer-events:none}

/* 搜索建议：与搜索条同宽的索引条 */
#hint{
  margin-top:9px;display:none;flex-direction:column;
  border:var(--edge) solid var(--ink);background:var(--paper);box-shadow:var(--sh-sm);
}
#hint.on{display:flex}
.hint{
  display:flex;align-items:center;width:100%;height:42px;padding:0 12px;
  border:none;cursor:pointer;font-family:inherit;text-align:left;background:var(--paper);
}
.hint + .hint{border-top:var(--edge2) solid var(--ink)}
.hint:active{background:var(--paper-2)}
.hint .hs{
  flex:1;min-width:0;font-family:var(--serif);font-size:13px;font-weight:900;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.hint .ha{
  flex:none;max-width:46%;font-size:10.5px;font-weight:700;color:var(--ink-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* ============ 检索中 ============ */
.s-loading{
  width:100%;margin-top:14px;display:none;align-items:center;justify-content:center;gap:10px;
  padding:22px;border:var(--edge) solid var(--ink);background:var(--paper);box-shadow:var(--sh-sm);
  font-size:12.5px;font-weight:700;color:var(--ink-2);
}
.s-loading.on{display:flex}
.spinner{
  width:16px;height:16px;flex:none;border-radius:50%;
  border:2.5px solid var(--ink);border-top-color:var(--orange);
  animation:spinNF .8s linear infinite;
}

/* ============ 头条海报（搜索结果） ============ */
.hero{
  position:relative;width:100%;margin-top:14px;
  border:var(--edge) solid var(--ink);background:var(--paper);
  box-shadow:var(--sh-md);overflow:hidden;
}
.hero.mm-pop{animation:mmPop .42s cubic-bezier(.2,.9,.3,1.08) both}
/* 半调网点：只铺在图区，不盖住下面的按钮 */
.hero-art::after{
  content:"";position:absolute;inset:0;z-index:5;pointer-events:none;
  background-image:radial-gradient(rgba(20,17,13,.45) 38%,transparent 40%);
  background-size:5px 5px;mix-blend-mode:multiply;opacity:.34;
}

/* 上半：蓝纸 + 唱片 */
.hero-art{
  position:relative;height:162px;display:flex;align-items:center;justify-content:center;
  background:var(--blue);border-bottom:var(--edge) solid var(--ink);
}
.hero-cv{
  position:relative;z-index:6;width:124px;height:124px;border-radius:50%;
  border:var(--edge) solid var(--ink);overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  background:
    repeating-radial-gradient(circle at 50% 50%,rgba(242,235,220,.16) 0 1px,transparent 1px 4px),
    var(--ink);
  box-shadow:4px 4px 0 rgba(20,17,13,.45);
}
/* 唱片中心的橙色标签 */
.hero-cv::before{
  content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:52px;height:52px;border-radius:50%;z-index:2;
  background:var(--orange);border:var(--edge2) solid var(--ink);
}
.hero-cv span{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;
  font-family:var(--serif);font-size:20px;font-weight:900;color:var(--ink);
}
.hero-cv img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transition:opacity .45s;z-index:3;
}
.hero-cv img.ld{opacity:1}
/* 中心孔 */
.hero-cv i{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:10px;height:10px;border-radius:50%;z-index:5;
  background:var(--paper);border:var(--edge2) solid var(--ink);
}

/* 下半：橙块 + 标题 + 播放 */
.hero-body{position:relative;z-index:2;padding:14px 15px 16px;background:var(--orange)}
.hero-meta b{
  display:block;font-family:var(--serif);font-size:25px;font-weight:900;
  letter-spacing:-.6px;line-height:1.2;color:var(--ink);
}
.hero-meta em{
  display:inline;font-style:normal;font-family:var(--serif);
  font-size:12.5px;font-weight:700;color:rgba(20,17,13,.72);
}
.hero-meta .alb{display:inline;font-size:12.5px;font-weight:700;color:rgba(20,17,13,.72)}
.hero-meta .alb:not(:empty)::before{content:" · "}

/* 来源旗标 */
.src{
  display:inline-flex;align-items:center;gap:5px;margin-bottom:9px;
  height:20px;padding:0 8px;border:var(--edge2) solid var(--ink);
  background:var(--ink);color:var(--paper);
  font-family:var(--disp);font-size:9px;letter-spacing:1.6px;
}
.src s{width:5px;height:5px;text-decoration:none;display:block;background:var(--paper)}
.src.ne s{background:var(--orange)}
.src.qq s{background:var(--blue)}
.src.kg s{background:var(--yellow)}
.src.bi s{background:var(--paper)}

.hero-btns{display:flex;align-items:center;gap:9px;margin-top:13px}
/* 主播放键：墨黑实心 —— 全屏唯一的高对比动作 */
.hplay{
  flex:1;height:40px;border:var(--edge) solid var(--ink);
  background:var(--ink);color:var(--paper);cursor:pointer;
  font-family:var(--serif);font-size:14px;font-weight:900;letter-spacing:1px;
  display:flex;align-items:center;justify-content:center;gap:7px;
  box-shadow:3px 3px 0 var(--paper);
}
.hplay:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--paper)}
.hq,.hfav{
  flex:none;width:40px;height:40px;border:var(--edge) solid var(--ink);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--disp);font-size:10px;letter-spacing:.4px;color:var(--ink);
  background:var(--paper);
}
.hq:active,.hfav:active{transform:translate(2px,2px)}
.hfav{background:var(--yellow);color:var(--ink)}
.hfav.on{background:var(--ink);color:var(--orange)}

/* 更多版本 */
.more-btn{
  width:100%;margin-top:12px;height:34px;
  border:var(--edge2) solid var(--ink);background:var(--paper);cursor:pointer;
  font-family:var(--disp);font-size:10px;letter-spacing:1.4px;color:var(--ink);
  display:flex;align-items:center;justify-content:center;
}
.more-btn:active{background:var(--paper-2)}
.alts{
  display:none;flex-direction:column;margin-top:10px;
  border:var(--edge2) solid var(--ink);background:var(--paper);
}
.alts.on{display:flex}
.alts .mm-row{padding:8px 10px;gap:10px}
.alts .mm-row + .mm-row::before{left:10px;right:10px;opacity:.35}
.alts .mm-cover{
  width:38px;height:38px;border-radius:0;border:var(--edge2) solid var(--ink);
  font-family:var(--serif);font-size:14px;font-weight:900;
}
.alts .mm-txt b{font-family:var(--serif);font-size:12.5px;font-weight:900;color:var(--ink)}
.alts .mm-txt em{font-style:normal;font-size:10px;font-weight:700;color:var(--ink-3)}
.mm-row-btns{flex:none;display:flex;align-items:center;gap:6px}
.mm-round{
  border:var(--edge2) solid var(--ink);background:var(--yellow);color:var(--ink);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.mm-round.coral{background:var(--orange);color:var(--paper)}
.mm-round:active{background:var(--orange);color:var(--paper)}

/* ============ 首页区块 ============ */
#homeBlocks{display:flow-root;margin-top:22px}
#homeBlocks .rm-sec{margin:24px 0 14px}
#homeBlocks #pick{margin-top:0}
.rm-sec-row>div:first-child{flex:1;min-width:0;position:relative}
/* kick 的延长线只到标题块为止，不要横穿右侧按钮 */
.rm-sec-row .rm-kick{padding-right:0;max-width:100%}
.rm-sec-row .rm-kick::after{flex:0 1 auto;max-width:46px}
.rm-btn.sm{height:32px;font-size:11.5px;padding:0 12px}
.rm-btn.sq.sm{width:32px;padding:0}
.rm-btn:disabled{opacity:.5;pointer-events:none}
.rm-sec-row .rt{align-self:flex-end;flex:none}
.rm-sec-row .rt em{
  font-style:normal;font-family:var(--disp);font-size:9px;
  letter-spacing:1.4px;color:var(--ink-3);
}
#pickRefresh.spin svg{animation:spinNF .8s linear infinite}

/* ---- 随便听听：唱片封套 ---- */
#pickRails{display:flex;flex-direction:column;gap:12px}
#pickRails .rail{
  display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;
  -webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(90deg,#000 0 88%,transparent 99%);
  mask-image:linear-gradient(90deg,#000 0 88%,transparent 99%);
}
#pickRails .rail::-webkit-scrollbar{display:none}
#pickRails .hc{
  flex:none;width:138px;position:relative;
  display:flex;flex-direction:column;
  border:var(--edge) solid var(--ink);background:var(--paper);
  box-shadow:var(--sh-sm);overflow:hidden;cursor:pointer;
  scroll-snap-align:start;
}
#pickRails .hc:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
#pickRails .hcv{
  position:relative;height:112px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  border-bottom:var(--edge) solid var(--ink);
}
/* 封套上的黑胶唱片（封面图来了会盖住） */
#pickRails .hcv::before{
  content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:64%;padding-bottom:64%;border-radius:50%;
  border:var(--edge2) solid var(--ink);
  background:
    radial-gradient(circle at 50% 50%,var(--orange) 0 19%,transparent 19.5%),
    repeating-radial-gradient(circle at 50% 50%,rgba(242,235,220,.22) 0 1px,transparent 1px 4px),
    var(--ink);
}
/* 网点 */
#pickRails .hcv::after{
  content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background-image:radial-gradient(rgba(20,17,13,.45) 38%,transparent 40%);
  background-size:4px 4px;mix-blend-mode:multiply;opacity:.38;
}
#pickRails .hcv span{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;
  font-family:var(--serif);font-size:15px;font-weight:900;color:var(--ink);
}
#pickRails .hcv img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transition:opacity .4s;z-index:3;
}
#pickRails .hcv img.ld{opacity:1}
#pickRails .hcn{padding:8px 9px 11px}
#pickRails .hcn b{
  display:block;font-family:var(--serif);font-size:13px;font-weight:900;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3;
}
#pickRails .hcn em{
  display:block;font-style:normal;font-size:10px;font-weight:700;color:var(--ink-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;padding-right:30px;
}
#pickRails .hcplay{
  position:absolute;right:7px;bottom:9px;z-index:4;
  width:26px;height:26px;border:var(--edge2) solid var(--ink);
  background:var(--orange);color:var(--paper);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
#pickRails .hcplay:active{background:var(--ink)}

/* ---- 猜你喜欢：唱片标签（4 列网格） ---- */
#artistRails .rail{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:16px 2px;justify-items:center;
}
.ac{
  position:relative;width:100%;max-width:78px;
  display:flex;flex-direction:column;align-items:center;gap:7px;
  cursor:pointer;
}
.aclbl{
  position:relative;width:58px;height:58px;border-radius:50%;
  border:var(--edge) solid var(--ink);
  display:flex;align-items:flex-start;justify-content:center;padding-top:7px;
  box-shadow:var(--sh-xs);
}
/* 虚线内圈 */
.aclbl::before{
  content:"";position:absolute;inset:5px;border-radius:50%;
  border:1.5px dashed rgba(20,17,13,.45);
}
/* 中心孔 */
.aclbl::after{
  content:"";position:absolute;left:50%;bottom:9px;transform:translateX(-50%);
  width:8px;height:8px;border-radius:50%;z-index:2;
  background:var(--paper);border:1.5px solid var(--ink);
}
.acn{
  position:relative;z-index:1;
  font-family:var(--serif);font-size:16px;line-height:1;font-weight:900;
}
.acfull{
  font-family:var(--serif);font-size:11.5px;font-weight:900;color:var(--ink);
  max-width:100%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.acplay{
  position:absolute;right:-6px;bottom:-6px;z-index:3;
  width:24px;height:24px;border-radius:50%;border:var(--edge2) solid var(--ink);
  background:var(--yellow);color:var(--ink);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.acplay:active{background:var(--orange);color:var(--paper)}
.acplay.spin svg{animation:spinNF .8s linear infinite}
.ac1 .aclbl{background:var(--orange)}
.ac2 .aclbl{background:var(--yellow)}
.ac3 .aclbl{background:var(--blue)}
.ac4 .aclbl{background:var(--paper-3)}
.ac1 .acn,.ac3 .acn{color:var(--paper)}
.ac2 .acn,.ac4 .acn{color:var(--ink)}

/* ---- 我的收藏：黄色便利贴 ---- */
.favrow{
  width:100%;display:flex;align-items:center;gap:13px;
  padding:14px 16px;margin-top:26px;
  border:var(--edge) solid var(--ink);background:var(--yellow);
  box-shadow:var(--sh-md);cursor:pointer;font-family:inherit;text-align:left;
}
.favrow:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.favrow .fi{
  flex:none;width:40px;height:40px;border:var(--edge) solid var(--ink);
  background:var(--paper);color:var(--orange);
  display:flex;align-items:center;justify-content:center;
}
.favrow .ftx{flex:1;min-width:0}
.favrow b{
  display:block;font-family:var(--serif);font-size:16px;font-weight:900;
  letter-spacing:.4px;color:var(--ink);
}
.favrow em{
  display:block;font-style:normal;font-size:10.5px;font-weight:700;
  color:var(--ink-2);margin-top:2px;
}
.favrow .fa{flex:none;color:var(--ink);display:flex}

/* ---- 最近播放：索引列表 ---- */
#recentCard{margin-top:26px}
#recentCard .rhead{padding:12px 12px 11px;border-bottom:var(--edge2) solid var(--ink)}
#recentCard h2{
  font-family:var(--serif);font-size:17px;font-weight:900;
  letter-spacing:-.2px;line-height:1.25;color:var(--ink);
}
#recentRails{padding:0 12px 4px;counter-reset:rno}
#recentRails .rail{display:block}
#recentRails .hc{
  display:flex;align-items:center;gap:10px;padding:9px 0;width:auto;
  border:none;background:none;box-shadow:none;cursor:pointer;
  border-top:1.5px solid var(--ink);
}
#recentRails .rail:first-child .hc:first-child{border-top:none}
#recentRails .hc::before{
  content:counter(rno);counter-increment:rno;
  flex:none;width:20px;text-align:center;
  font-family:var(--serif);font-size:14px;font-weight:900;color:var(--ink-3);
  font-variant-numeric:tabular-nums;
}
#recentRails .hcv{
  position:relative;flex:none;width:38px;height:38px;overflow:hidden;
  border:var(--edge2) solid var(--ink);
  display:flex;align-items:center;justify-content:center;
}
#recentRails .hcv span{font-family:var(--serif);font-size:14px;font-weight:900}
#recentRails .hcn{flex:1;min-width:0}
#recentRails .hcn b{
  display:block;font-family:var(--serif);font-size:13px;font-weight:900;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3;
}
#recentRails .hcn em{
  display:block;font-style:normal;font-size:10px;font-weight:700;color:var(--ink-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;
}

/* ============ 4 色封面轮转（方块内容 → 方角） ============ */
.c1{background:var(--orange);color:var(--paper)}
.c2{background:var(--blue);color:var(--paper)}
.c3{background:var(--yellow);color:var(--ink)}
.c4{background:var(--paper-3);color:var(--ink)}
.c5{background:var(--orange);color:var(--paper)}
.c6{background:var(--blue);color:var(--paper)}

/* 轨道空态 */
.rail-empty{
  width:100%;padding:20px 8px;text-align:center;
  font-size:11.5px;font-weight:700;color:var(--ink-3);
}
</style>
</head>
<body>

<!-- ===== 搜索 ===== -->
<div class="s-card" id="sCard">
  <div class="s-box">
    <span class="sic">
      <svg viewBox="0 0 24 24" width="17" height="17"><circle cx="11" cy="11" r="6.6" stroke="currentColor" stroke-width="2.2" fill="none"/><path d="M15.8 15.8L20.5 20.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>
    </span>
    <input id="q" type="search" placeholder="搜索歌名 / 歌手" enterkeyhint="search" autocomplete="off">
    <button id="qClear" title="清空">
      <svg viewBox="0 0 24 24" width="11" height="11"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" fill="none"/></svg>
    </button>
    <button id="qGo"><span>搜</span></button>
  </div>
  <div id="hint"></div>
</div>

<div class="s-loading" id="sLoading"><span class="spinner"></span><span>正在为你找原唱…</span></div>

<!-- ===== 头条海报（搜索结果） ===== -->
<div class="hero" id="hero" style="display:none">
  <div class="hero-art">
    <div class="hero-cv" id="hCv"><span id="hChar">♪</span><img id="hImg" alt=""><i></i></div>
  </div>
  <div class="hero-body">
    <div class="hero-meta">
      <span class="src" id="hSrc" style="display:none"><s></s><span id="hSrcText"></span></span>
      <b id="hName">——</b>
      <em id="hArtist"></em>
      <span class="alb" id="hAlbum"></span>
    </div>
    <div class="hero-btns">
      <button class="hplay" id="hPlay">
        <svg viewBox="0 0 24 24" width="15" height="15"><path d="M8.6 5.2v13.6L19 12z" fill="currentColor"/></svg>
        <span>播放</span>
      </button>
      <button class="hq" id="hQ"><span id="hQText">320K</span></button>
      <button class="hfav" id="hFav"></button>
    </div>
  </div>
  <button class="more-btn" id="hMore" style="display:none">更多版本</button>
  <div class="alts" id="hAlts"></div>
</div>

<!-- ===== 没搜到时的首页区块 ===== -->
<div id="homeBlocks">

  <!-- 随便听听：唱片封套横排 -->
  <div class="rm-sec" id="pick">
    <div class="rm-sec-row">

<script>
(function(){
  'use strict';

  var M = window.M, PL = window.PL, P = PL.P;

  var busy = false;

  }

  /* 把曲目数组切成 3 排 × 3 个的轨道 */

    if (!items || !items.length) {
      host.innerHTML = '<div class="rail-empty">这里还空着</div>';
      return;
    }
    var html = '';
    for (var r = 0; r < RAIL_ROWS; r++) {
      var rowItems = items.slice(r * RAIL_PER, (r + 1) * RAIL_PER);
      if (!rowItems.length) break;
      html += '<div class="rail">' + rowItems.map(function(it){
        return picker(it, r);
      }).join('') + '</div>';
    }
    host.innerHTML = html || '<div class="rail-empty">这里还空着</div>';
  }

  /* ---------- 搜索提示词 ---------- */

    '晴天':'周杰伦','稻香':'周杰伦','七里香':'周杰伦','告白气球':'周杰伦','青花瓷':'周杰伦',
    '夜曲':'周杰伦','简单爱':'周杰伦','半岛铁盒':'周杰伦','花海':'周杰伦','搁浅':'周杰伦',
    '一路向北':'周杰伦','枫':'周杰伦','我是如此相信':'周杰伦',

  function findHints(kw){
    var k = String(kw || '').trim();
    if (!k) return [];
    var songPart = M.plain(k.split(/\s+/)[0]);
    if (!songPart) return [];
    var out = [];
    for (var song in HINTS){
      var ps = M.plain(song);
      if (ps === songPart) out.unshift({ song: song, artist: HINTS[song], exact: true });
      else if (ps.indexOf(songPart) >= 0) out.push({ song: song, artist: HINTS[song], exact: false });
    }
    var seen = {}, res = [];
    out.forEach(function(h){ if (seen[h.song]) return; seen[h.song] = 1; res.push(h); });
    return res.slice(0, 4);
  }
  function renderHint(kw){
    var box = $('hint');
    if (hero) { box.classList.remove('on'); box.innerHTML = ''; return; }
    var hs = findHints(kw);
    if (!hs.length) { box.classList.remove('on'); box.innerHTML = ''; return; }
    box.innerHTML = hs.map(function(h){
      return '<button class="hint" data-song="' + M.esc(h.song) + '" data-artist="' + M.esc(h.artist) + '">' +
        '<span class="hs">' + M.esc(h.song) + '</span>' +
        '<span class="ha">' + M.esc(h.artist) + '</span>' +
      '</button>';
    }).join('');
    box.classList.add('on');
  }
  $('hint').addEventListener('click', function(e){
    var c = e.target.closest('.hint');
    if (!c) return;
    var s = c.dataset.song, a = c.dataset.artist;
    $('q').value = s + ' ' + a;
    $('hint').classList.remove('on');
    doSearch(s + ' ' + a);
  });

  /* 只改搜索按钮里的文字，保留放大镜图标 */
  function setGoText(txt){
    var b = $('qGo');
    if (!b) return;
    var sp = b.querySelector('span');
    if (sp) sp.textContent = txt;
    else b.textContent = txt;
  }

  /* 来源名 */
  var SOURCE_NAME = {
    netease: '网易云音乐',
    qq: 'QQ音乐',
    kugou: '酷狗音乐',
    bilibili: 'B站音源'
  };
  var SOURCE_CLS = {
    netease: 'ne', qq: 'qq', kugou: 'kg', bilibili: 'bi'
  };

  /* ---------- 搜索 ---------- */
  async function doSearch(kw){
    kw = String(kw || '').trim();
    if (!kw) { window.toast('输入歌名或歌手再搜吧'); return; }
    if (busy) return;

    // 光有歌名没歌手时，自动补上最可信的歌手
    var parts = kw.split(/\s+/);
    if (parts.length === 1 && !/[a-zA-Z]/.test(kw)) {
      busy = true;
      setGoText('找…');
      $('hint').classList.remove('on');
      var sug = [];
      try { sug = await M.suggestArtists(kw) || []; } catch (e) { sug = []; }
      busy = false;
      if (sug.length) {
        kw = kw + ' ' + sug[0].name;
      } else {
        var lh = findHints(kw);
        if (lh.length) kw = lh[0].song + ' ' + lh[0].artist;
      }
      $('q').value = kw;
    }

    if (busy) return;
    busy = true;

    $('q').value = kw;
    $('qGo').disabled = true;
    setGoText('找…');
    $('hero').style.display = 'none';
    // 取消待触发的建议框定时器，否则 240ms 后建议会重新弹出
    if (hintTimer) { window.VCLEAR(hintTimer); hintTimer = null; }
    $('hint').classList.remove('on');
    $('hint').innerHTML = '';
    $('sLoading').classList.add('on');

    var myView = window.__view;

    try {
      var r = await M.findBest(kw);
      if (window.__view !== myView) return;
      try {
        if (r.hero && r.hero.source !== 'bilibili' && window.MUSIC_BI_ERR) {
          console.warn('[bili] fallback failed:', window.MUSIC_BI_ERR);
          window.toast('B站兜底未接通：' + window.MUSIC_BI_ERR);
        }
      } catch (e) {}
      if (!r.hero) {
        $('sLoading').classList.remove('on');
        busy = false;
        $('qGo').disabled = false;
        setGoText('搜索');
        window.toast('没找到「' + kw + '」的原唱，换个关键词试试');
        return;
      }
      hero = r.hero; alts = r.alts || [];
      $('homeBlocks').style.display = 'none';
      renderHero();
      $('sLoading').classList.remove('on');

      P.queue = [hero];
      P.qi = 0;
      P.cur = hero;
      PL.persistQueue();
      PL.emit('queue');
      PL.emit('track', P.cur);

      // 同歌手其它歌补进队列（供抽屉使用）
      var artist = (hero.artist || '').split('/')[0];
      if (artist) {
        M.searchArtistMore(artist).then(function(more){
          if (window.__view !== myView) return;
          var seen = {};
          P.queue.forEach(function(t){ seen[M.trackKey(t)] = 1; });
          more.forEach(function(t){
            var k2 = M.trackKey(t);
            if (seen[k2]) return;
            seen[k2] = 1;
            P.queue.push(t);
          });
          PL.persistQueue();
          PL.emit('queue');
        }).catch(function(){});
      }
    } catch (e) {
      if (window.__view !== myView) return;
      $('sLoading').classList.remove('on');
      window.toast('搜索失败了，稍后再试');
    }
    busy = false;
    $('qGo').disabled = false;
    setGoText('搜索');
  }

  /* ---------- 结果卡渲染 ---------- */
  function renderHero(){
    var card = $('hero');
    if (!hero) { card.style.display = 'none'; return; }
    card.style.display = '';
    card.classList.remove('mm-pop');
    void card.offsetWidth;
    card.classList.add('mm-pop');

    $('hName').textContent = hero.name || '未知歌曲';
    $('hArtist').textContent = hero.artist || '未知歌手';
    $('hAlbum').textContent = hero.album || '';

    // 来源标签（取代原来的「原唱」绿标）
    var src = $('hSrc');
    var srcName = SOURCE_NAME[hero.source] || '';
    if (srcName) {
      src.style.display = '';
      src.className = 'src ' + (SOURCE_CLS[hero.source] || '');
      $('hSrcText').textContent = '来源 · ' + srcName;
    } else {
      src.style.display = 'none';
    }

    var img = $('hImg');
    img.classList.remove('ld');
    $('hChar').textContent = (hero.name || '♪').trim().charAt(0) || '♪';
    M.fetchPic(hero, 300).then(function(u){
      if (!u) return;
      img.onload = function(){ img.classList.add('ld'); $('hChar').textContent = ''; };
      img.onerror = function(){};
      img.src = u;
    });

    renderFavBtn();
    renderQBtn();

    if (alts.length) {
      $('hMore').style.display = '';
      $('hAlts').classList.remove('on');
      $('hMore').textContent = '更多版本（' + alts.length + '）';
      $('hAlts').innerHTML = alts.map(function(x, i){
        return '<div class="mm-row" data-alt="' + i + '">' +
          '<div class="mm-cover c' + (i % 6 + 1) + '"><span>' + M.esc((x.name || '♪').charAt(0)) + '</span></div>' +
          '<div class="mm-txt"><b>' + M.esc(x.name) + '</b><em>' + M.esc(x.artist) +
            (x.album ? ' · ' + M.esc(x.album) : '') + '</em></div>' +
          '<div class="mm-row-btns">' +
            '<button class="mm-round coral" style="width:30px;height:30px" data-altplay="' + i + '">' +
              '<svg viewBox="0 0 24 24" width="13" height="13"><path d="M8 5v14l11-7z" fill="currentColor"/></svg></button>' +
            '</div></div>';
      }).join('');
    } else {
      $('hMore').style.display = 'none';
    }
  }
  function renderFavBtn(){
    if (!hero) return;
    var b = $('hFav');
    if (!b) return;
    var on = PL.isFav(hero);
    b.classList.toggle('on', on);
    b.innerHTML = heartSVG(on, 15);
    b.title = on ? '取消收藏' : '收藏';
  }
  function renderQBtn(){
    var b = $('hQText');
    if (!b) return;
    b.textContent = P.quality === 'loss' ? '无损' : '320K';
  }

  /* ---------- 结果卡按钮 ---------- */
  $('hPlay').addEventListener('click', function(){
    if (!hero) return;
    var exists = P.queue.some(function(x){ return String(x.id) === String(hero.id); });
    if (!exists) P.queue.unshift(hero);
    P.qi = P.queue.findIndex(function(x){ return String(x.id) === String(hero.id); });
    if (P.qi < 0) P.qi = 0;
    P.cur = hero;
    PL.persistQueue();
    PL.play(0, true);
    $('hint').classList.remove('on');
  });
  $('hQ').addEventListener('click', function(){ PL.toggleQuality(); });
  $('hFav').addEventListener('click', async function(){
    if (!hero) return;
    await PL.toggleFav(hero);
    renderFavBtn();
  });
  $('hMore').addEventListener('click', function(){
    var on = $('hAlts').classList.toggle('on');
    $('hMore').textContent = on ? '收起' : ('更多版本（' + alts.length + '）');
  });
  $('hAlts').addEventListener('click', function(e){
    var pl = e.target.closest('[data-altplay]');
    if (pl) {
      var t = alts[parseInt(pl.dataset.altplay, 10)];
      if (t) PL.playTrack(t);
      return;
    }
    var row = e.target.closest('.mm-row');
    if (row && row.dataset.alt != null) {
      var t2 = alts[parseInt(row.dataset.alt, 10)];
      if (t2) PL.playTrack(t2);
    }
  });

  /* ---------- 输入 ---------- */
  $('qGo').addEventListener('click', function(){ doSearch($('q').value); });
  $('q').addEventListener('keydown', function(e){
    if (e.key === 'Enter') { e.preventDefault(); doSearch($('q').value); }
  });
  $('q').addEventListener('input', function(){
    $('qClear').classList.toggle('on', !!$('q').value);
    window.VCLEAR(hintTimer);
    hintTimer = window.VTIMER(function(){ renderHint($('q').value); }, 240);
  });

  $('qClear').addEventListener('click', function(){
    $('q').value = '';
    $('qClear').classList.remove('on');
    $('hint').classList.remove('on');
    $('hero').style.display = 'none';
    hero = null;
    $('homeBlocks').style.display = '';
    $('q').focus();
  });

  /* ---------- 随便听听 ---------- */
  /* 歌池扩充到 48 首，配合「本批不重复」的抽取逻辑，
     保证连点刷新也不会出现「留几个一模一样的」或「两轮后又重复」 */
  var PICKS = [
    '成都 赵雷','孤勇者 陈奕迅','起风了 买辣椒也用券','平凡之路 朴树',
    '演员 薛之谦','海阔天空 Beyond','小幸运 田馥甄','十年 陈奕迅',

    '丑八怪 薛之谦','认真的雪 薛之谦','一半 薛之谦','动物世界 薛之谦',
    '曹操 林俊杰','小酒窝 林俊杰','修炼爱情 林俊杰','可惜没如果 林俊杰',
    '泡沫 邓紫棋','句号 邓紫棋','来自天堂的魔鬼 邓紫棋','多远都要在一起 邓紫棋',
    '南方姑娘 赵雷','生如夏花 朴树','光辉岁月 Beyond','真的爱你 Beyond',
    '匆匆那年 王菲','传奇 王菲','浮夸 陈奕迅','爱情转移 陈奕迅',
    '李白 李荣浩','年少有为 李荣浩','宁夏 梁静茹','暖暖 梁静茹'
  ];

  /* 本批已抽过的关键词：只增不减，抽不到新歌时才整体重置 */
  var pickUsed = [];
  var pickTracks = {};    // 关键词 -> 已解析好的曲目（供单首播放复用）

  function shuffleArr(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function nextPicks(){
    var need = RAIL_PER * RAIL_ROWS;
    var fresh = PICKS.filter(function(k){ return pickUsed.indexOf(k) < 0; });
    if (fresh.length < need) {
      // 池子用完了：重置，但把「上一批」排到最后，避免刚刷完就重复
      var lastBatch = picks.slice();
      pickUsed = [];
      fresh = PICKS.filter(function(k){ return lastBatch.indexOf(k) < 0; });
      if (fresh.length < need) fresh = PICKS.slice();
    }
    var out = shuffleArr(fresh).slice(0, need);
    pickUsed = pickUsed.concat(out);
    return out;
  }

  function renderPicks(){
    var box = $('pickRails');
    if (!box) return;
    var seq = ++pickSeq;
    picks = nextPicks();

    // 先用关键词占位，立刻有内容，不等网络
    buildRails(box, picks.map(function(kw, i){
      var parts = kw.split(/\s+/);
      return { kw: kw, name: parts[0], artist: parts.slice(1).join(' '), i: i };
    }), function(it){
      return '<div class="hc" data-kw="' + M.esc(it.kw) + '">' +
        '<div class="hcv c' + (it.i % 6 + 1) + '"><span>' + M.esc(it.name.charAt(0)) + '</span></div>' +
        '<div class="hcn"><b>' + M.esc(it.name) + '</b><em>' + M.esc(it.artist) + '</em></div>' +
        '<button class="hcplay" data-pickplay="' + M.esc(it.kw) + '" title="播放这首">' +
          '<svg viewBox="0 0 24 24" width="11" height="11"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>' +
        '</button></div>';
    });

    // 异步补封面
    picks.forEach(function(kw, i){
      var parts = kw.split(/\s+/);
      var song = parts[0], artist = parts.slice(1).join(' ');
      M.searchGD(song + ' ' + artist, 1, 6).then(function(arr){
        if (seq !== pickSeq) return;
        var hit = (arr || []).filter(function(t){
          return M.plain(t.name).indexOf(M.plain(song)) >= 0 &&
                 (artist ? M.plain(t.artist).indexOf(M.plain(artist)) >= 0 : true) &&
                 !M.isCover(t);
        })[0];
        if (!hit) return;
        var cell = box.querySelectorAll('.hcv')[i];
        if (!cell) return;
        M.fetchPic(hit, 120).then(function(u){
          if (!u || seq !== pickSeq) return;
          var img = document.createElement('img');
          img.onload = function(){ img.classList.add('ld'); var sp = cell.querySelector('span'); if (sp) sp.textContent = ''; };
          img.onerror = function(){ img.remove(); };
          cell.appendChild(img);
          img.src = u;
        });
      }).catch(function(){});
    });
  }

  /* 把这一批全部解析成曲目，组成播放队列（已解析的复用缓存） */
  async function buildPickQueue(myView){
    var out = [];
    for (var i = 0; i < picks.length; i++) {
      var kw = picks[i];
      if (window.__view !== myView) return out;
      var t = pickTracks[kw];
      if (!t) {
        try {
          var r = await M.findBest(kw);
          if (r && r.hero) { t = r.hero; pickTracks[kw] = t; }
        } catch (e) {}
      }
      if (t) out.push(t);
    }
    return out;
  }

  /* 点单首的播放键：只播这一首，播完继续队列里的下一首 */
  async function playPickSingle(kw, btn){
    if (!kw) return;
    var myView = window.__view;
    if (btn) btn.style.opacity = '.55';

    var t = pickTracks[kw];
    if (!t) {
      window.toast('正在解析…');
      try {
        var r = await M.findBest(kw);
        if (r && r.hero) { t = r.hero; pickTracks[kw] = t; }
      } catch (e) {}
    }
    if (window.__view !== myView) return;
    if (!t) { window.toast('这首暂时解析不到，换一首试试'); return; }

    // 先用这一首起播（不等整批解析完，点了就有反馈）
    var idx = P.queue.findIndex(function(x){ return String(x.id) === String(t.id); });
    if (idx < 0) {
      P.queue.unshift(Object.assign({}, t));
      idx = 0;
    }
    P.qi = idx;
    P.cur = P.queue[idx];
    PL.persistQueue();
    PL.play(0, true);

    // 后台把整批补齐进队列，这样这首播完能顺下去
    var batch = await buildPickQueue(myView);
    if (window.__view !== myView || !batch.length) return;
    // 当前这首放到最前，其余按本批顺序跟在后面
    var ordered = [];
    var seen = {};
    if (t) { ordered.push(t); seen[M.trackKey(t)] = 1; }
    batch.forEach(function(x){
      var k = M.trackKey(x);
      if (seen[k]) return;
      seen[k] = 1;
      ordered.push(x);
    });
    var curIdx = ordered.findIndex(function(x){ return String(x.id) === String(t.id); });
    PL.setQueue(ordered, curIdx < 0 ? 0 : curIdx);
    PL.play(0, true);
    if (btn) btn.style.opacity = '';
  }

  /* 随便听听播放全部：把这一批按顺序播起来 */
  $('pickPlayAll').addEventListener('click', async function(){
    if (busy) return;
    var list = picks && picks.length ? picks.slice() : [];
    if (!list.length) { window.toast('还没有推荐，先换一批'); return; }

    var b = $('pickPlayAll');
    b.disabled = true;
    var myView = window.__view;
    window.toast('正在准备 ' + list.length + ' 首…');

    var resolved = [];
    var pool = list.slice();
    async function worker(){
      while (pool.length) {
        var kw = pool.shift();
        try {
          var r = await M.findBest(kw);
          if (r && r.hero) resolved.push(r.hero);
        } catch (e) {}
      }
    }
    await Promise.all([worker(), worker(), worker()]);
    if (window.__view !== myView) { b.disabled = false; return; }
    if (!resolved.length) { b.disabled = false; window.toast('这批都没解析到，换一批试试'); return; }

    var order = list.map(function(kw){ return M.plain(kw); });
    resolved.sort(function(x, y){
      var kx = M.plain((x.name || '') + (x.artist || ''));
      var ky = M.plain((y.name || '') + (y.artist || ''));
      var ix = order.findIndex(function(o){ return o.indexOf(kx) >= 0 || kx.indexOf(o) >= 0; });
      var iy = order.findIndex(function(o){ return o.indexOf(ky) >= 0 || ky.indexOf(o) >= 0; });
      return (ix < 0 ? 99 : ix) - (iy < 0 ? 99 : iy);
    });

    PL.setQueue(resolved, 0);
    PL.setMode('order');
    PL.play(0, true);
    b.disabled = false;
    window.toast('顺序播放 ' + resolved.length + ' 首');
  });

  function renderArtists(){

  /* 解析某位歌手的整份歌单：全部走 findBest（旧的可播放路径） */
  async function loadArtistTracks(name, myView){
    var out = [], seen = {};
    var songs = ARTIST_SONGS[name] || [];

    function push(t){
      if (!t) return;
      var k = M.trackKey(t);
      if (seen[k]) return;
      seen[k] = 1;
      out.push(t);
    }

    // 并发 3 路解析，快很多
    var pool = songs.slice();
    async function worker(){
      while (pool.length) {
        if (window.__view !== myView) return;
        var s = pool.shift();
        if (!s) continue;
        try {
          var r = await M.findBest(s[0] + ' ' + s[1]);
          if (r && r.hero) push(r.hero);
        } catch (e) {}
      }
    }
    await Promise.all([worker(), worker(), worker()]);
    return out;
  }

  /* 点歌手后面的 ▶：随机播放这位歌手的歌 */
  async function playArtist(name, btn){
    if (!name) return;
    var myView = window.__view;
    if (btn) btn.classList.add('spin');
    window.toast('正在准备 ' + name + ' …');

    var list = await loadArtistTracks(name, myView);
    if (window.__view !== myView) { if (btn) btn.classList.remove('spin'); return; }
    if (!list.length) {
      if (btn) btn.classList.remove('spin');
      window.toast('没找到 ' + name + ' 的歌');
      return;
    }

    // 整批随机打乱后顺序播放 —— 效果就是「随机」，但不会和 shuffle 模式的
    // ended 逻辑打架（shuffle 模式会重置 P.qi，导致刚起播就被打乱）
    var arr = shuffleArr(list);
    PL.setQueue(arr, 0);
    PL.setMode('order');
    PL.play(0, true);
    if (btn) btn.classList.remove('spin');
    window.toast('播放 ' + name + ' · ' + arr.length + ' 首');
  }
