<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>找歌</title>
</head>
<body>

<style>
  #viewHost > * + *{margin-top:9px}

  /* ===== 搜索卡 ===== */
  .s-card{width:100%;border-radius:18px;background:#fff;box-shadow:0 3px 14px rgba(90,70,150,.08);padding:11px}
  .s-box{display:flex;align-items:center;gap:7px;height:40px;padding:0 4px 0 11px;border-radius:12px;background:#F5F2FB}
  .s-box .sic{flex:none;color:#8E86AC;display:flex;align-items:center;pointer-events:none}
  #q{
    flex:1;min-width:0;height:40px;border:none;outline:none;background:transparent;
    font-family:inherit;font-size:13px;font-weight:700;color:var(--ink);
    -webkit-appearance:none;appearance:none;
  }
  #q::placeholder{color:#B0A8C8;font-weight:600}
  #q::-webkit-search-cancel-button,#q::-webkit-search-decoration{-webkit-appearance:none;display:none}
  #qClear{
    flex:none;width:22px;height:22px;border:none;border-radius:7px;cursor:pointer;
    background:rgba(139,92,246,.1);color:#9A92B4;
    display:none;align-items:center;justify-content:center;
  }
  #qClear.on{display:flex}
  #qGo{
    flex:none;height:32px;padding:0 12px;border:none;border-radius:9px;cursor:pointer;
    font-family:inherit;font-size:12px;font-weight:900;letter-spacing:.8px;color:#fff;
    display:flex;align-items:center;gap:4px;
    background:linear-gradient(135deg,#FF7A6E,#FF4D6A);
    box-shadow:0 4px 10px rgba(255,94,108,.26);
    transition:transform .16s,opacity .2s;
  }
  #qGo svg{display:block;opacity:.95}
  #qGo:active{transform:scale(.95)}
  #qGo:disabled{opacity:.55;pointer-events:none}

  /* 搜索建议：与搜索框同宽同高，只有歌名 + 歌手 */
  #hint{margin-top:8px;display:none;flex-direction:column}
  #hint.on{display:flex}
  .hint{
    display:flex;align-items:center;width:100%;height:40px;padding:0 11px;
    border:none;border-radius:12px;cursor:pointer;font-family:inherit;text-align:left;
    background:#FAF9FE;box-shadow:inset 0 0 0 1px rgba(120,100,180,.06);
    transition:transform .14s,background .2s;
  }
  .hint + .hint{margin-top:6px}
  .hint:active{transform:scale(.985);background:#F5F3FB}
  .hint .hs{
    flex:1;min-width:0;font-size:13px;font-weight:800;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .hint .ha{
    flex:none;max-width:46%;font-size:10.5px;font-weight:600;color:var(--muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }

  /* ===== 区块头 ===== */
  .sechd{display:flex;align-items:center;gap:6px;padding:0 1px 8px}
  .sechd .ic{flex:none;width:24px;height:24px;border-radius:8px;display:flex;align-items:center;justify-content:center}
  .sechd b{font-size:14.5px;font-weight:900;color:var(--ink);letter-spacing:.2px}
  .sechd em{font-style:normal;font-size:9.5px;font-weight:700;color:var(--muted)}
  .sechd .pa{
    margin-left:auto;flex:none;height:26px;padding:0 9px;border:none;border-radius:8px;cursor:pointer;
    font-family:inherit;font-size:10.5px;font-weight:900;color:#fff;
    display:flex;align-items:center;gap:3px;
    background:linear-gradient(135deg,#FF7A6E,#FF4D6A);
    box-shadow:0 3px 8px rgba(255,94,108,.24);
    transition:transform .16s,opacity .2s;
  }
  .sechd .pa:active{transform:scale(.94)}
  .sechd .pa:disabled{opacity:.5;pointer-events:none}
  .sechd .rf{
    flex:none;width:26px;height:26px;border:none;border-radius:50%;cursor:pointer;margin-left:4px;
    background:#F5F2FB;color:#8B82A8;
    display:flex;align-items:center;justify-content:center;
    transition:transform .3s,color .2s;
  }
  .sechd .rf:active{transform:rotate(180deg);color:var(--grape)}
  .sechd .rf.spin svg{animation:spinNF .8s linear infinite}
  @keyframes spinNF{to{transform:rotate(360deg)}}

  /* ===== 横排轨道：可视区露出 2.5 个，可左右滑 ===== */
  .rail{
    display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;
    -webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;
    scrollbar-width:none;
  }
  .rail::-webkit-scrollbar{display:none}
  .rail + .rail{margin-top:6px}
  .hc{
    flex:none;width:176px;display:flex;align-items:center;gap:7px;
    padding:6px 6px 6px 7px;border-radius:13px;background:#FBFAFE;
    box-shadow:inset 0 0 0 1px rgba(120,100,180,.05);
    scroll-snap-align:start;cursor:pointer;
    transition:transform .15s;
  }
  .hc:active{transform:scale(.97)}
  .hc .hcv{
    flex:none;width:40px;height:40px;border-radius:11px;position:relative;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:900;
  }
  .hc .hcv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
  .hc .hcv img.ld{opacity:1}
  .hc .hcn{flex:1;min-width:0}
  .hc .hcn b{
    display:block;font-size:12px;font-weight:800;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.28;
  }
  .hc .hcn em{
    display:block;font-style:normal;font-size:9.5px;font-weight:600;color:var(--muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;
  }
  /* 每首歌右侧的播放按钮 */
  .hc .hcplay{
    flex:none;width:24px;height:24px;border:none;border-radius:50%;cursor:pointer;
    display:flex;align-items:center;justify-content:center;color:#fff;
    background:linear-gradient(135deg,#FF7A6E,#FF4D6A);
    box-shadow:0 2px 6px rgba(255,94,108,.24);
    transition:transform .16s;
  }
  .hc .hcplay:active{transform:scale(.84)}

  /* ===== 歌手卡（猜你喜欢） ===== */
  .ac{
    flex:none;display:flex;align-items:center;gap:8px;
    padding:7px 7px 7px 12px;border-radius:14px;background:#FBFAFE;
    box-shadow:inset 0 0 0 1px rgba(120,100,180,.05);
    scroll-snap-align:start;cursor:pointer;
    transition:transform .15s;
  }
  .ac:active{transform:scale(.97)}
  .ac .acn{
    font-size:13px;font-weight:900;color:var(--ink);
    white-space:nowrap;letter-spacing:.2px;
  }
  .ac .acplay{
    flex:none;width:26px;height:26px;border:none;border-radius:50%;cursor:pointer;
    display:flex;align-items:center;justify-content:center;color:#fff;
    background:linear-gradient(135deg,#A78BFA,#7C4DF6);
    box-shadow:0 2px 7px rgba(124,77,246,.26);
    transition:transform .16s;
  }
  .ac .acplay:active{transform:scale(.84)}
  .ac .acplay.spin svg{animation:hcSpin .8s linear infinite}
  @keyframes hcSpin{to{transform:rotate(360deg)}}

  .c1{background:linear-gradient(150deg,#FF9A8B,#FFC7A8);color:#fff}
  .c2{background:linear-gradient(150deg,#8FE3D8,#CFF6EF);color:#14786E}
  .c3{background:linear-gradient(150deg,#C7B2FA,#EEDFFF);color:#fff}
  .c4{background:linear-gradient(150deg,#FFD98A,#FFF0CC);color:#96660E}
  .c5{background:linear-gradient(150deg,#FFB6D9,#FFE0F0);color:#A83572}
  .c6{background:linear-gradient(150deg,#A8DCF6,#DDF1FE);color:#176C99}

  /* 轨道空态 */
  .rail-empty{
    width:100%;padding:18px 8px;text-align:center;
    font-size:11.5px;font-weight:700;color:var(--muted);
  }

  /* ===== 我的收藏入口 ===== */
  .favrow{
    width:100%;display:flex;align-items:center;gap:9px;
    padding:11px 12px;border:none;border-radius:17px;cursor:pointer;font-family:inherit;text-align:left;
    background:linear-gradient(135deg,#FF7A6E 0%,#F4517B 48%,#8B5CF6 100%);
    box-shadow:0 8px 20px rgba(200,80,140,.22);
    transition:transform .16s;
  }
  .favrow:active{transform:scale(.978)}
  .favrow .fi{
    flex:none;width:28px;height:28px;border-radius:9px;background:rgba(255,255,255,.22);
    display:flex;align-items:center;justify-content:center;color:#fff;
  }
  .favrow .ftx{flex:1;min-width:0}
  .favrow b{display:block;font-size:13px;font-weight:900;color:#fff;letter-spacing:.3px}
  .favrow em{display:block;font-style:normal;font-size:10px;font-weight:700;color:rgba(255,255,255,.80);margin-top:1px}
  .favrow .fa{flex:none;color:rgba(255,255,255,.72);display:flex}

  /* ===== 搜索加载 ===== */
  .s-loading{
    width:100%;display:none;align-items:center;justify-content:center;gap:9px;
    padding:22px;border-radius:18px;background:#fff;box-shadow:0 3px 14px rgba(90,70,150,.08);
    font-size:12.5px;font-weight:700;color:var(--muted);
  }
  .s-loading.on{display:flex}
  .spinner{
    width:17px;height:17px;border-radius:50%;flex:none;
    border:2.5px solid rgba(139,92,246,.2);border-top-color:var(--grape);
    animation:spinNF .8s linear infinite;
  }

  /* ===== 原唱结果卡 ===== */
  .hero{
    width:100%;border-radius:18px;background:#fff;
    box-shadow:0 4px 18px rgba(90,70,150,.10);padding:12px;overflow:hidden;
  }
  .hero.mm-pop{animation:mmPop .42s cubic-bezier(.2,.9,.3,1.12) both}
  .hero-top{display:flex;align-items:center;gap:11px}
  .hero-cv{
    flex:none;width:56px;height:56px;border-radius:16px;position:relative;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:21px;font-weight:900;
    background:linear-gradient(150deg,#C7B2FA,#FFB7D8);
    box-shadow:0 6px 14px rgba(139,92,246,.20);
  }
  .hero-cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .45s}
  .hero-cv img.ld{opacity:1}
  .hero-meta{flex:1;min-width:0}
  .hero-meta b{
    display:block;font-size:17px;font-weight:900;color:var(--ink);line-height:1.28;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .hero-meta em{
    display:block;font-style:normal;font-size:11.5px;font-weight:700;color:#8E86AC;margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .hero-meta .alb{
    display:block;font-size:10px;font-weight:600;color:var(--muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;
  }
  /* 来源标签（取代原来的绿色「原唱」） */
  .src{
    display:inline-flex;align-items:center;gap:4px;margin-top:5px;height:18px;padding:0 7px;border-radius:6px;
    background:#F5F3FA;font-size:9px;font-weight:900;letter-spacing:.3px;color:#8B82A8;
  }
  .src s{width:4.5px;height:4.5px;border-radius:50%;text-decoration:none;display:block}
  .src.ne s{background:#D93B3B}
  .src.qq s{background:#18A05A}
  .src.kg s{background:#2F81D9}
  .src.bi s{background:#F4517A}

  .hero-btns{display:flex;align-items:center;gap:7px;margin-top:11px}
  .hplay{
    flex:1;height:38px;border:none;border-radius:12px;cursor:pointer;color:#fff;
    font-family:inherit;font-size:13px;font-weight:900;letter-spacing:.3px;
    display:flex;align-items:center;justify-content:center;gap:5px;
    background:linear-gradient(135deg,#FF7A6E,#FF4D6A);
    box-shadow:0 5px 13px rgba(255,94,108,.26);
    transition:transform .16s;
  }
  .hplay:active{transform:scale(.95)}
  .hq,.hfav{
    flex:none;height:38px;padding:0 11px;border:none;border-radius:12px;cursor:pointer;
    font-family:inherit;font-size:11px;font-weight:900;color:#6E6590;
    background:#F5F2FB;display:flex;align-items:center;gap:4px;
    transition:transform .16s,color .2s;
  }
  .hq:active,.hfav:active{transform:scale(.94)}
  .hfav.on{color:var(--coral);background:#FFF0F4}

  .more-btn{
    width:100%;margin-top:10px;height:32px;
    border:none;border-radius:10px;cursor:pointer;font-family:inherit;
    font-size:11.5px;font-weight:800;color:var(--muted);
    background:#F5F2FB;transition:transform .15s,color .2s;
  }
  .more-btn:active{transform:scale(.97);color:var(--grape)}
  .alts{display:none;flex-direction:column;margin-top:9px}
  .alts.on{display:flex}
</style>

<!-- ===== 搜索 ===== -->
<div class="s-card" id="sCard">
  <div class="s-box">
    <span class="sic">
      <svg viewBox="0 0 24 24" width="15" height="15"><circle cx="11" cy="11" r="6.4" stroke="currentColor" stroke-width="2.1" fill="none"/><path d="M16 16l4.4 4.4" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" fill="none"/></svg>
    </span>
    <input id="q" type="search" placeholder="搜索歌名 / 歌手" enterkeyhint="search" autocomplete="off">
    <button id="qClear" title="清空">
      <svg viewBox="0 0 24 24" width="11" height="11"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" fill="none"/></svg>
    </button>
    <button id="qGo">
      <svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><circle cx="11" cy="11" r="6.4" stroke="currentColor" stroke-width="2.1" fill="none"/><path d="M16 16l4.4 4.4" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" fill="none"/></svg>
      <span>搜索</span>
    </button>
  </div>
  <div id="hint"></div>
</div>

<div class="s-loading" id="sLoading"><span class="spinner"></span><span>正在为你找原唱…</span></div>

<!-- ===== 原唱结果（只有一张卡） ===== -->
<div class="hero" id="hero" style="display:none">
  <div class="hero-top">
    <div class="hero-cv" id="hCv"><span id="hChar">♪</span><img id="hImg" alt=""></div>
    <div class="hero-meta">
      <b id="hName">——</b>
      <em id="hArtist"></em>
      <span class="alb" id="hAlbum"></span>
      <span class="src" id="hSrc" style="display:none"><s></s><span id="hSrcText"></span></span>
    </div>
  </div>
  <div class="hero-btns">
    <button class="hplay" id="hPlay">
      <svg viewBox="0 0 24 24" width="15" height="15"><path d="M8.6 5.2v13.6L19 12z" fill="currentColor"/></svg>
      <span>播放</span>
    </button>
    <button class="hq" id="hQ"><span id="hQText">320K</span></button>
    <button class="hfav" id="hFav"></button>
  </div>
  <button class="more-btn" id="hMore" style="display:none">更多版本</button>
  <div class="alts" id="hAlts"></div>
</div>

<!-- ===== 没搜到时的首页区块 ===== -->
<div id="homeBlocks">

  <!-- 随便听听：3 横排，可左右滑 -->
  <div class="mm-card" id="pick">
    <div class="sechd">
      <span class="ic" style="background:linear-gradient(145deg,#FF8A80,#FF5E6C);color:#fff;box-shadow:0 3px 8px rgba(255,94,108,.22)">
        <svg viewBox="0 0 24 24" width="12" height="12"><path d="M9 18V6.5l9-2v10" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="6.6" cy="18.4" r="2.4" fill="currentColor"/><circle cx="15.6" cy="16.9" r="2.4" fill="currentColor"/></svg>
      </span>
      <b>随便听听</b>
      <em id="pickHint"></em>
      <button class="pa" id="pickPlayAll">
        <svg viewBox="0 0 24 24" width="11" height="11"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>播放全部
      </button>
      <button class="rf" id="pickRefresh" title="换一批">
        <svg viewBox="0 0 24 24" width="13" height="13"><path d="M20 11a8 8 0 1 0-2.6 6.3" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M20 4.5v6.5h-6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div id="pickRails"></div>
  </div>

  <!-- 猜你喜欢：固定歌手，每个歌手后面带播放按钮，点了随机播这个歌手的歌 -->
  <div class="mm-card" id="rec">
    <div class="sechd">
      <span class="ic" style="background:linear-gradient(145deg,#A78BFA,#7C4DF6);color:#fff;box-shadow:0 3px 8px rgba(124,77,246,.22)">
        <svg viewBox="0 0 24 24" width="12" height="12"><path d="M12 3.5l2.3 5.3 5.7.5-4.3 3.8 1.3 5.6-5-3-5 3 1.3-5.6-4.3-3.8 5.7-.5z" fill="currentColor"/></svg>
      </span>
      <b>猜你喜欢</b>
      <em id="recHint"></em>
    </div>
    <div id="artistRails"></div>
  </div>

  <!-- 我的收藏入口 -->
  <button class="favrow" id="favEntry">
    <span class="fi">
      <svg viewBox="0 0 24 24" width="14" height="14"><path d="M12 20.4s-6.8-4.2-8.5-8.1C2.1 8.7 4 5.5 7.1 5.5c1.8 0 3.1 1 3.8 1.9.7-.9 2-1.9 3.8-1.9 3.1 0 5 3.2 3.6 6.8-1.7 3.9-8.5 8.1-8.5 8.1z" fill="currentColor" stroke="currentColor" stroke-width="1.6"/></svg>
    </span>
    <div class="ftx">
      <b>我的收藏</b>
      <em id="favEntrySub">你收藏的歌都在这里~</em>
    </div>
    <span class="fa">
      <svg viewBox="0 0 24 24" width="14" height="14"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>
    </span>
  </button>

  <!-- 最近播放 -->
  <div class="mm-card" id="recentCard" style="display:none"></div>

</div>

<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var M = window.M, PL = window.PL, P = PL.P;

  var hero = null, alts = [];
  var busy = false;
  var hintTimer = null;
  var picks = [];        // 随便听听当前这一批（关键词）
  var pickSeq = 0;

  var RAIL_PER = 3;      // 每排 3 个
  var RAIL_ROWS = 2;     // 随便听听：2 排

  function heartSVG(filled, size){
    var s = size || 14;
    return '<svg viewBox="0 0 24 24" width="' + s + '" height="' + s + '"><path d="M12 21s-7.5-4.7-9.3-9C1.4 8.6 3.4 5 6.9 5c2 0 3.4 1.1 4.1 2.1C11.7 6.1 13.1 5 15.1 5c3.5 0 5.5 3.6 4.2 7-1.8 4.3-9.3 9-9.3 9z" fill="' + (filled ? 'currentColor' : 'none') + '" stroke="currentColor" stroke-width="1.8"/></svg>';
  }

  /* 把曲目数组切成 3 排 × 3 个的轨道 */
  function buildRails(host, items, picker){
    if (!items || !items.length) {
      host.innerHTML = '<div class="rail-empty">这里还空着</div>';
      return;
    }
    var html = '';
    for (var r = 0; r < RAIL_ROWS; r++) {
      var rowItems = items.slice(r * RAIL_PER, (r + 1) * RAIL_PER);
      if (!rowItems.length) break;
      html += '<div class="rail">' + rowItems.map(function(it){
        return picker(it, r);
      }).join('') + '</div>';
    }
    host.innerHTML = html || '<div class="rail-empty">这里还空着</div>';
  }

  /* ---------- 搜索提示词 ---------- */
  var HINTS = {
    '晴天':'周杰伦','稻香':'周杰伦','七里香':'周杰伦','告白气球':'周杰伦','青花瓷':'周杰伦',
    '夜曲':'周杰伦','简单爱':'周杰伦','半岛铁盒':'周杰伦','花海':'周杰伦','搁浅':'周杰伦',
    '一路向北':'周杰伦','枫':'周杰伦','我是如此相信':'周杰伦',
    '演员':'薛之谦','丑八怪':'薛之谦','认真的雪':'薛之谦','起风了':'买辣椒也用券',
    '成都':'赵雷','南方姑娘':'赵雷','平凡之路':'朴树','生如夏花':'朴树',
    '海阔天空':'Beyond','光辉岁月':'Beyond','真的爱你':'Beyond',
    '红豆':'王菲','匆匆那年':'王菲','传奇':'王菲',
    '十年':'陈奕迅','浮夸':'陈奕迅','爱情转移':'陈奕迅','孤勇者':'陈奕迅','孤独患者':'陈奕迅',

  function findHints(kw){
    var k = String(kw || '').trim();
    if (!k) return [];
    var songPart = M.plain(k.split(/\s+/)[0]);
    if (!songPart) return [];
    var out = [];
    for (var song in HINTS){
      var ps = M.plain(song);
      if (ps === songPart) out.unshift({ song: song, artist: HINTS[song], exact: true });
      else if (ps.indexOf(songPart) >= 0) out.push({ song: song, artist: HINTS[song], exact: false });
    }
    var seen = {}, res = [];
    out.forEach(function(h){ if (seen[h.song]) return; seen[h.song] = 1; res.push(h); });
    return res.slice(0, 4);
  }
  function renderHint(kw){
    var box = $('hint');
    if (hero) { box.classList.remove('on'); box.innerHTML = ''; return; }
    var hs = findHints(kw);
    if (!hs.length) { box.classList.remove('on'); box.innerHTML = ''; return; }
    box.innerHTML = hs.map(function(h){
      return '<button class="hint" data-song="' + M.esc(h.song) + '" data-artist="' + M.esc(h.artist) + '">' +
        '<span class="hs">' + M.esc(h.song) + '</span>' +

  /* ---------- 搜索 ---------- */
  async function doSearch(kw){
    kw = String(kw || '').trim();
    if (!kw) { window.toast('输入歌名或歌手再搜吧'); return; }
    if (busy) return;

    // 光有歌名没歌手时，自动补上最可信的歌手
    var parts = kw.split(/\s+/);
    if (parts.length === 1 && !/[a-zA-Z]/.test(kw)) {
      busy = true;
      setGoText('找…');
      $('hint').classList.remove('on');
      var sug = [];
      try { sug = await M.suggestArtists(kw) || []; } catch (e) { sug = []; }
      busy = false;
      if (sug.length) {
        kw = kw + ' ' + sug[0].name;
      } else {
        var lh = findHints(kw);
        if (lh.length) kw = lh[0].song + ' ' + lh[0].artist;
      }
      $('q').value = kw;
    }

    if (busy) return;
    busy = true;

    $('q').value = kw;
    $('qGo').disabled = true;
    setGoText('找…');
    $('hero').style.display = 'none';
    $('hint').classList.remove('on');
    $('sLoading').classList.add('on');

    var myView = window.__view;

    try {
      var r = await M.findBest(kw);
      if (window.__view !== myView) return;
      try {
        if (r.hero && r.hero.source !== 'bilibili' && window.MUSIC_BI_ERR) {
          console.warn('[bili] fallback failed:', window.MUSIC_BI_ERR);
          window.toast('B站兜底未接通：' + window.MUSIC_BI_ERR);
        }
      } catch (e) {}
      if (!r.hero) {
        $('sLoading').classList.remove('on');
        busy = false;
        $('qGo').disabled = false;
        setGoText('搜索');
        window.toast('没找到「' + kw + '」的原唱，换个关键词试试');
        return;
      }
      hero = r.hero; alts = r.alts || [];
      $('homeBlocks').style.display = 'none';
      renderHero();
      $('sLoading').classList.remove('on');

      P.queue = [hero];
      P.qi = 0;
      P.cur = hero;
      PL.persistQueue();
      PL.emit('queue');
      PL.emit('track', P.cur);

      // 同歌手其它歌补进队列（供抽屉使用）
      var artist = (hero.artist || '').split('/')[0];
      if (artist) {
        M.searchArtistMore(artist).then(function(more){
          if (window.__view !== myView) return;
          var seen = {};
          P.queue.forEach(function(t){ seen[M.trackKey(t)] = 1; });
          more.forEach(function(t){
            var k2 = M.trackKey(t);
            if (seen[k2]) return;
            seen[k2] = 1;
            P.queue.push(t);
          });
          PL.persistQueue();
          PL.emit('queue');
        }).catch(function(){});
      }
    } catch (e) {
      if (window.__view !== myView) return;
      $('sLoading').classList.remove('on');
      window.toast('搜索失败了，稍后再试');
    }
    busy = false;
    $('qGo').disabled = false;
    setGoText('搜索');
  }

  /* 本批已抽过的关键词：只增不减，抽不到新歌时才整体重置 */
  var pickUsed = [];
  var pickTracks = {};    // 关键词 -> 已解析好的曲目（供单首播放复用）

  function shuffleArr(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function nextPicks(){
    var need = RAIL_PER * RAIL_ROWS;
    var fresh = PICKS.filter(function(k){ return pickUsed.indexOf(k) < 0; });
    if (fresh.length < need) {
      // 池子用完了：重置，但把「上一批」排到最后，避免刚刷完就重复
      var lastBatch = picks.slice();
      pickUsed = [];
      fresh = PICKS.filter(function(k){ return lastBatch.indexOf(k) < 0; });
      if (fresh.length < need) fresh = PICKS.slice();
    }
    var out = shuffleArr(fresh).slice(0, need);
    pickUsed = pickUsed.concat(out);
    return out;
  }

  function renderPicks(){
    var box = $('pickRails');
    if (!box) return;
    var seq = ++pickSeq;
    picks = nextPicks();

    // 先用关键词占位，立刻有内容，不等网络
    buildRails(box, picks.map(function(kw, i){
      var parts = kw.split(/\s+/);
      return { kw: kw, name: parts[0], artist: parts.slice(1).join(' '), i: i };
    }), function(it){
      return '<div class="hc" data-kw="' + M.esc(it.kw) + '">' +
        '<div class="hcv c' + (it.i % 6 + 1) + '"><span>' + M.esc(it.name.charAt(0)) + '</span></div>' +

          '<svg viewBox="0 0 24 24" width="11" height="11"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>' +
        '</button></div>';
    });

    // 异步补封面
    picks.forEach(function(kw, i){
      var parts = kw.split(/\s+/);
      var song = parts[0], artist = parts.slice(1).join(' ');
      M.searchGD(song + ' ' + artist, 1, 6).then(function(arr){
        if (seq !== pickSeq) return;
        var hit = (arr || []).filter(function(t){
          return M.plain(t.name).indexOf(M.plain(song)) >= 0 &&
                 (artist ? M.plain(t.artist).indexOf(M.plain(artist)) >= 0 : true) &&
                 !M.isCover(t);
        })[0];
        if (!hit) return;
        var cell = box.querySelectorAll('.hcv')[i];

        M.fetchPic(hit, 120).then(function(u){

          var img = document.createElement('img');

          img.onerror = function(){ img.remove(); };
          cell.appendChild(img);
          img.src = u;
        });
      }).catch(function(){});
    });
  }

  /* 把这一批全部解析成曲目，组成播放队列（已解析的复用缓存） */
  async function buildPickQueue(myView){
    var out = [];
    for (var i = 0; i < picks.length; i++) {
      var kw = picks[i];
      if (window.__view !== myView) return out;
      var t = pickTracks[kw];
      if (!t) {
        try {
          var r = await M.findBest(kw);
          if (r && r.hero) { t = r.hero; pickTracks[kw] = t; }
        } catch (e) {}
      }
      if (t) out.push(t);
    }
    return out;
  }

  /* 点单首的播放键：只播这一首，播完继续队列里的下一首 */
  async function playPickSingle(kw, btn){
    if (!kw) return;
    var myView = window.__view;
    if (btn) btn.style.opacity = '.55';

    var t = pickTracks[kw];
    if (!t) {
      window.toast('正在解析…');
      try {
        var r = await M.findBest(kw);
        if (r && r.hero) { t = r.hero; pickTracks[kw] = t; }
      } catch (e) {}
    }
    if (window.__view !== myView) return;
    if (!t) { window.toast('这首暂时解析不到，换一首试试'); return; }

    // 先用这一首起播（不等整批解析完，点了就有反馈）
    var idx = P.queue.findIndex(function(x){ return String(x.id) === String(t.id); });
    if (idx < 0) {
      P.queue.unshift(Object.assign({}, t));
      idx = 0;
    }
    P.qi = idx;
    P.cur = P.queue[idx];
    PL.persistQueue();
    PL.play(0, true);

    // 后台把整批补齐进队列，这样这首播完能顺下去
    var batch = await buildPickQueue(myView);
    if (window.__view !== myView || !batch.length) return;
    // 当前这首放到最前，其余按本批顺序跟在后面
    var ordered = [];
    var seen = {};
    if (t) { ordered.push(t); seen[M.trackKey(t)] = 1; }
    batch.forEach(function(x){
      var k = M.trackKey(x);
      if (seen[k]) return;
      seen[k] = 1;
      ordered.push(x);
    });
    var curIdx = ordered.findIndex(function(x){ return String(x.id) === String(t.id); });
    PL.setQueue(ordered, curIdx < 0 ? 0 : curIdx);
    PL.play(0, true);
    if (btn) btn.style.opacity = '';
  }

  /* 随便听听播放全部：把这一批按顺序播起来 */
  $('pickPlayAll').addEventListener('click', async function(){
    if (busy) return;
    var list = picks && picks.length ? picks.slice() : [];
    if (!list.length) { window.toast('还没有推荐，先换一批'); return; }

    var b = $('pickPlayAll');
    b.disabled = true;
    var myView = window.__view;
    window.toast('正在准备 ' + list.length + ' 首…');

    var resolved = [];
    var pool = list.slice();
    async function worker(){
      while (pool.length) {
        var kw = pool.shift();
        try {
          var r = await M.findBest(kw);
          if (r && r.hero) resolved.push(r.hero);
        } catch (e) {}
      }
    }
    await Promise.all([worker(), worker(), worker()]);
    if (window.__view !== myView) { b.disabled = false; return; }
    if (!resolved.length) { b.disabled = false; window.toast('这批都没解析到，换一批试试'); return; }

    var order = list.map(function(kw){ return M.plain(kw); });
    resolved.sort(function(x, y){
      var kx = M.plain((x.name || '') + (x.artist || ''));
      var ky = M.plain((y.name || '') + (y.artist || ''));
      var ix = order.findIndex(function(o){ return o.indexOf(kx) >= 0 || kx.indexOf(o) >= 0; });
      var iy = order.findIndex(function(o){ return o.indexOf(ky) >= 0 || ky.indexOf(o) >= 0; });
      return (ix < 0 ? 99 : ix) - (iy < 0 ? 99 : iy);
    });

    PL.setQueue(resolved, 0);
    PL.setMode('order');
    PL.play(0, true);
    b.disabled = false;

  function renderArtists(){
    var box = $('artistRails');
    if (!box) return;
    $('recHint').textContent = '';

    var html = '';

      var row = ARTISTS.slice(r * RAIL_PER, (r + 1) * RAIL_PER);
      if (!row.length) break;
      html += '<div class="rail">' + row.map(function(name){
        return '<div class="ac" data-artist="' + M.esc(name) + '">' +
          '<span class="acn">' + M.esc(name) + '</span>' +
          '<button class="acplay" data-artistplay="' + M.esc(name) + '" title="随机播放' + M.esc(name) + '">' +

          '</button></div>';
      }).join('') + '</div>';
    }
    box.innerHTML = html;
  }

  /* 解析某位歌手的整份歌单：全部走 findBest（旧的可播放路径） */
  async function loadArtistTracks(name, myView){
    var out = [], seen = {};
    var songs = ARTIST_SONGS[name] || [];

    function push(t){
      if (!t) return;
      var k = M.trackKey(t);
      if (seen[k]) return;
      seen[k] = 1;
      out.push(t);
    }

    // 并发 3 路解析，快很多
    var pool = songs.slice();
    async function worker(){
      while (pool.length) {
        if (window.__view !== myView) return;
        var s = pool.shift();
        if (!s) continue;
        try {
          var r = await M.findBest(s[0] + ' ' + s[1]);
          if (r && r.hero) push(r.hero);
        } catch (e) {}
      }
    }
    await Promise.all([worker(), worker(), worker()]);
    return out;
  }

  /* 点歌手后面的 ▶：随机播放这位歌手的歌 */
  async function playArtist(name, btn){
    if (!name) return;
    var myView = window.__view;
    if (btn) btn.classList.add('spin');
    window.toast('正在准备 ' + name + ' …');

    var list = await loadArtistTracks(name, myView);
    if (window.__view !== myView) { if (btn) btn.classList.remove('spin'); return; }
    if (!list.length) {
      if (btn) btn.classList.remove('spin');
      window.toast('没找到 ' + name + ' 的歌');
      return;
    }

    // 整批随机打乱后顺序播放 —— 效果就是「随机」，但不会和 shuffle 模式的
    // ended 逻辑打架（shuffle 模式会重置 P.qi，导致刚起播就被打乱）
    var arr = shuffleArr(list);
    PL.setQueue(arr, 0);
    PL.setMode('order');
    PL.play(0, true);
    if (btn) btn.classList.remove('spin');
    window.toast('播放 ' + name + ' · ' + arr.length + ' 首');
  }

    if (!list.length) {
      card.style.display = 'none';
      card.innerHTML = '';
      return;
    }
    card.style.display = '';
    card.innerHTML =
      '<div class="sechd">' +
        '<span class="ic" style="background:linear-gradient(145deg,#D7F2FF,#C9E9FF);box-shadow:0 3px 8px rgba(91,167,230,.20);color:#3A86C8">' +

        '<button class="pa" id="recentPlayAll"><svg viewBox="0 0 24 24" width="11" height="11"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>播放全部</button>' +
      '</div>' +
      '<div id="recentRails"></div>';

    var items = list.slice(0, RAIL_PER * 2);   // 2 排够用
    buildRails(rbox, items.map(function(t, i){ return { t: t, i: i }; }), function(it){
      var t = it.t;
      return '<div class="hc" data-recent="' + it.i + '">' +
        '<div class="hcv c' + (it.i % 6 + 1) + '"><span>' + M.esc((t.name || '♪').trim().charAt(0) || '♪') + '</span></div>' +

    });
    items.forEach(function(t, i){
      if (!t) return;
      M.fetchPic(t, 120).then(function(u){
        if (!u) return;
        var cell = rbox.querySelectorAll('.hcv')[i];
        if (!cell) return;
        var img = document.createElement('img');
        img.onload = function(){ img.classList.add('ld'); var sp = cell.querySelector('span'); if (sp) sp.textContent = ''; };
        img.onerror = function(){ img.remove(); };
        cell.appendChild(img);
        img.src = u;
      }).catch(function(){});
    });
  }
  /* 用事件委托，因为最近播放卡的头是每次重建的 */
  $('recentCard').addEventListener('click', function(e){
    if (e.target.closest('#recentPlayAll')) {
      var list0 = PL.getRecent() || [];

      PL.setQueue(list0.slice(), 0);
      PL.setMode('order');
      PL.play(0, true);
      return;
    }
    var c = e.target.closest('[data-recent]');
    if (!c) return;
    var list = PL.getRecent() || [];
    var t = list[parseInt(c.dataset.recent, 10)];
    if (!t) return;
    PL.playTrack(t);
  });
