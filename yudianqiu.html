<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>玉簟秋</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#0a0e17;overflow:hidden;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#e8ecf4}
#top{position:fixed;top:0;left:0;right:0;height:52px;z-index:100;display:flex;align-items:center;gap:10px;padding:0 10px;background:rgba(10,14,23,.92);backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,.08)}
#top .btn{height:34px;border:0;border-radius:17px;padding:0 16px;background:linear-gradient(135deg,#2b6df0,#1e4fd8);color:#fff;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.25);transition:transform .15s,filter .15s}
#top .btn:active{transform:translateY(1px) scale(.96)}
#top .t{flex:1;text-align:center;font-size:16px;font-weight:800;letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stage{position:fixed;top:52px;left:0;right:0;bottom:0;display:flex;flex-direction:column}
#playerWrap{position:relative;width:100%;background:#000;display:flex;align-items:center;justify-content:center;touch-action:none;aspect-ratio:16/9;max-height:calc(100vh - 220px)}
video{width:100%;height:100%;object-fit:contain;background:#000}
#brightMask{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:3}
#gestureTip{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%);background:rgba(0,0,0,.62);border-radius:26px;padding:10px 20px;font-size:17px;font-weight:700;color:#fff;z-index:8;display:none;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .25s;letter-spacing:1px;min-width:96px}
#gestureTip.show{display:flex;opacity:1}
#bigPlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;cursor:pointer;background:rgba(0,0,0,.25);transition:opacity .3s;z-index:5}
#bigPlay.hide{opacity:0;pointer-events:none}
#bigPlay .tri{width:0;height:0;border-left:34px solid #fff;border-top:22px solid transparent;border-bottom:22px solid transparent;margin-left:8px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
#loadTip{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#9fb2d4;font-size:13px;letter-spacing:2px;z-index:4;display:none}
#loadTip.show{display:block}
#ctrl{position:absolute;left:0;right:0;bottom:0;z-index:6;padding:10px 12px 8px;background:linear-gradient(transparent,rgba(0,0,0,.78));opacity:0;transition:opacity .3s}
#ctrl.forced{opacity:0!important;pointer-events:none}
#playerWrap:hover #ctrl,#ctrl.lock{opacity:1}
#bar{height:18px;display:flex;align-items:center;cursor:pointer}
#barTrack{flex:1;height:4px;background:rgba(255,255,255,.22);border-radius:2px;position:relative;transition:height .2s}
#bar:hover #barTrack{height:6px}
#barFill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#3b82f6,#60a5fa);border-radius:2px}
#barDot{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:#fff;transform:translate(-50%,-50%) scale(0);transition:transform .2s;box-shadow:0 0 6px rgba(59,130,246,.8)}
#bar:hover #barDot{transform:translate(-50%,-50%) scale(1)}
.row{display:flex;align-items:center;gap:10px;margin-top:6px}
#playBtn{width:40px;height:40px;border:0;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}
#playBtn:active{background:rgba(255,255,255,.28)}
#time{font-size:12px;color:#c3cfe4;font-variant-numeric:tabular-nums}
#spd{display:flex;gap:6px}
.spdBtn{height:30px;border:0;border-radius:15px;padding:0 11px;background:rgba(255,255,255,.1);color:#dfe6f5;font-size:12px;cursor:pointer;transition:all .2s}
.spdBtn.on{background:#2b6df0;color:#fff;box-shadow:0 0 10px rgba(43,109,240,.5)}
.spdBtn:active{transform:scale(.92)}
#fullBtn{margin-left:auto;width:40px;height:40px;border:0;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:16px;cursor:pointer;transition:background .2s}
#hideCtrlBtn{width:40px;height:40px;border:0;border-radius:50%;background:rgba(255,255,255,.08);color:#9fb2d4;font-size:18px;line-height:1;cursor:pointer;transition:all .2s;margin-left:4px}
#fullBtn:active,#hideCtrlBtn:active{background:rgba(255,255,255,.28)}
#eps{flex:1;min-height:0;background:#0d1322;border-top:1px solid rgba(255,255,255,.06);padding:10px 12px;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-content:start;overflow-y:auto;scrollbar-width:thin}
#eps::-webkit-scrollbar{width:5px}
#eps::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:3px}
.epBtn{height:34px;border:0;border-radius:17px;background:rgba(255,255,255,.07);color:#c3cfe4;font-size:12px;cursor:pointer;white-space:nowrap;transition:all .2s;border:1px solid transparent}
.epBtn.on{background:#2b6df0;color:#fff;border-color:#5a8ff5;box-shadow:0 0 10px rgba(43,109,240,.35)}
.epBtn:active{transform:scale(.94)}
.epBtn.done{background:rgba(46,160,67,.15);color:#6fca85}
#ecoBtn{height:32px;border:0;border-radius:16px;padding:0 16px;background:rgba(255,255,255,.1);color:#dfe6f5;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;white-space:nowrap}
#ecoBtn.on{background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff;box-shadow:0 0 10px rgba(139,92,246,.5)}
#ecoBtn:active{transform:scale(.94)}
#ecoMode{font-size:12px;color:#7c8db0}
#slowTip{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:120;display:none;align-items:center;gap:10px;padding:9px 16px;border-radius:12px;background:rgba(20,16,40,.92);border:1px solid rgba(139,92,246,.4);backdrop-filter:blur(8px);box-shadow:0 6px 24px rgba(0,0,0,.4);font-size:13px;color:#e8e6ff;white-space:nowrap}
#slowTip.show{display:flex;animation:tipIn .3s cubic-bezier(.2,.9,.3,1.2)}
@keyframes tipIn{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
#slowTip .s1{color:#c4b5fd}
#slowTip .go{border:0;border-radius:9px;padding:5px 12px;background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s}
#slowTip .go:active{transform:scale(.92)}
#slowTip .x{border:0;background:transparent;color:#7d7aa8;font-size:14px;cursor:pointer;padding:2px}
#toolRow{position:relative;z-index:30;display:flex;align-items:center;gap:10px;padding:8px 12px;margin-top:8px;background:#0d1322;border-top:1px solid rgba(255,255,255,.06);border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.35)}
#spd125{height:32px;border:0;border-radius:16px;padding:0 16px;background:rgba(255,255,255,.1);color:#dfe6f5;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;white-space:nowrap}
#spd125.on{background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff;box-shadow:0 0 10px rgba(139,92,246,.5)}
#spd125:active{transform:scale(.94)}
#spdTip{font-size:12px;color:#7c8db0}
@media (min-width:900px){#eps{justify-content:center;grid-template-columns:repeat(5,minmax(0,140px))}}
</style></head><body>
<div id="top"><button class="btn" id="btnBack">← 返回</button><div class="t">玉簟秋</div><button class="btn" id="btnHome">⌂ 主页</button></div>
<div id="stage">
  <div id="playerWrap">
    <video id="v" playsinline webkit-playsinline></video>
    <div id="brightMask"></div>
    <div id="gestureTip"></div>
    <div id="bigPlay"><div class="tri"></div></div>
    <div id="loadTip">加载中…</div>
    <div id="ctrl">
      <div id="bar"><div id="barTrack"><div id="barFill"></div><div id="barDot"></div></div></div>
      <div class="row">
        <button id="playBtn">▶</button>
        <div id="time">00:00 / 00:00</div>
        
        <button id="fullBtn">⛶</button><button id="hideCtrlBtn">▾</button>
      </div>
    </div>
  </div>
  <div id="toolRow"><button id="spd125">1.25x</button><span id="spdTip"></span></div>
  <div id="eps"></div>
</div>
<script src="hls.min.js"></script>

<script>
var EPS=[
  {n:1,u:"https://vip.ffzy-plays.com/20261012/59396_64e03924/index.m3u8"},
  {n:2,u:"https://vip.ffzy-plays.com/20261012/59397_a5ae86de/index.m3u8"},
  {n:3,u:"https://vip.ffzy-plays.com/20261012/59398_6d1bf817/index.m3u8"},
  {n:4,u:"https://vip.ffzy-plays.com/20261012/59399_3d77a08e/index.m3u8"},
  {n:5,u:"https://vip.ffzy-plays.com/20261013/59437_3b3dc4a2/index.m3u8"},
  {n:6,u:"https://vip.ffzy-plays.com/20261013/59438_10180387/index.m3u8"},
  {n:7,u:"https://vip.ffzy-plays.com/20261014/59478_9b7cd1a6/index.m3u8"},
  {n:8,u:"https://vip.ffzy-plays.com/20261014/59479_ff5f5e2c/index.m3u8"},
  {n:9,u:"https://vip.ffzy-plays.com/20261015/59514_6e95716e/index.m3u8"},
  {n:10,u:"https://vip.ffzy-plays.com/20261015/59515_aa9d5941/index.m3u8"},
  {n:11,u:"https://vip.ffzy-plays.com/20261016/59555_ac18fa71/index.m3u8"},
  {n:12,u:"https://vip.ffzy-plays.com/20261016/59556_dd953ec3/index.m3u8"},
  {n:13,u:"https://super.ffzy-online6.com/20261017/43492_f070d862/index.m3u8"},
  {n:14,u:"https://svip.feifei-play.com/20261018/46441_f915b080/index.m3u8"},
  {n:15,u:"https://svip.feifei-play.com/20261019/46488_c263e540/index.m3u8"},
  {n:16,u:"https://svip.feifei-play.com/20261020/46532_a05f9cec/index.m3u8"},
  {n:17,u:"https://svip.feifei-play.com/20261020/46533_5aa280f5/index.m3u8"},
  {n:18,u:"https://svip.feifei-play.com/20261021/46578_493d3fb2/index.m3u8"},
  {n:19,u:"https://svip.feifei-play.com/20261021/46579_519d4bda/index.m3u8"},
  {n:20,u:"https://svip.feifei-play.com/20261022/46606_2b6da609/index.m3u8"},
  {n:21,u:"https://svip.feifei-play.com/20261022/46607_167b07d7/index.m3u8"},
  {n:22,u:"https://svip.feifei-play.com/20261023/46650_46a9b6b8/index.m3u8"},
  {n:23,u:"https://svip.feifei-play.com/20261024/46698_d291ad2a/index.m3u8"},
  {n:24,u:"https://svip.feifei-play.com/20261025/46755_8b1364fb/index.m3u8"},
  {n:25,u:"https://svip.feifei-play.com/20261026/46786_9e1b394b/index.m3u8"},
  {n:26,u:"https://svip.feifei-play.com/20261026/46787_e4a43d1e/index.m3u8"}
];
var PROXY='';
var v=document.getElementById('v'),hls=null,cur=1,played=[1];
var epsBox=document.getElementById('eps'),loadTip=document.getElementById('loadTip');
var bar=document.getElementById('bar'),barFill=document.getElementById('barFill'),barDot=document.getElementById('barDot');
var timeEl=document.getElementById('time'),playBtn=document.getElementById('playBtn');
var ctrl=document.getElementById('ctrl'),hideTimer=null;
function hideCtrlSoon(){
  if(hideTimer)clearTimeout(hideTimer);
  if(v.paused)return;
  hideTimer=setTimeout(function(){ctrl.classList.remove('lock');},3500);
}
function showCtrl(){
  ctrl.classList.add('lock');
  hideCtrlSoon();
}
var wakeLock=null;
function requestWake(){
  if(!('wakeLock' in navigator))return;
  try{
    navigator.wakeLock.request('screen').then(function(wl){wakeLock=wl;}).catch(function(){});
  }catch(e){}
}
function releaseWake(){
  if(wakeLock){try{wakeLock.release().catch(function(){});}catch(e){}
    wakeLock=null;}
}
document.addEventListener('visibilitychange',function(){
  if(document.hidden){releaseWake();}
  else if(!v.paused){requestWake();}
});
var brightMask=document.getElementById('brightMask'),gestureTip=document.getElementById('gestureTip');
var brightness=0,tipTimer=null,justGestured=false,gPlayer=document.getElementById('playerWrap');
function showTip(text){
  gestureTip.textContent=text;
  gestureTip.classList.add('show');
  if(tipTimer)clearTimeout(tipTimer);
  tipTimer=setTimeout(function(){gestureTip.classList.remove('show');},900);
}
gPlayer.addEventListener('pointerdown',function(e){
  if(e.target.closest('#ctrl')||e.target===bigPlay)return;
  var r=gPlayer.getBoundingClientRect();
  gesture={mode:((e.clientX-r.left)/r.width<0.5?'bright':'vol'),startY:e.clientY,startVal:null,moved:false};
});
gPlayer.addEventListener('pointermove',function(e){
  if(!gesture)return;
  var dy=e.clientY-gesture.startY;
  if(Math.abs(dy)<14&&!gesture.moved)return;
  if(e.cancelable)e.preventDefault();
  gesture.moved=true;
  var p=Math.max(-1,Math.min(1,dy/180));
  if(gesture.mode==='bright'){
    if(gesture.startVal===null)gesture.startVal=brightness;
    brightness=Math.max(0,Math.min(0.7,gesture.startVal+p*0.7));
    brightMask.style.opacity=brightness;
    showTip('亮度 '+Math.round((1-brightness)*100)+'%');
  }else{
    if(gesture.startVal===null)gesture.startVal=v.muted?0:v.volume;
    var vol=Math.max(0,Math.min(1,gesture.startVal-p));
    v.volume=vol;v.muted=false;
    showTip('音量 '+Math.round(vol*100)+'%');
  }
});
gPlayer.addEventListener('pointerup',function(){
  if(gesture&&gesture.moved){justGestured=true;setTimeout(function(){justGestured=false;},200);}
  gesture=null;
});
gPlayer.addEventListener('pointercancel',function(){gesture=null;});
EPS.forEach(function(ep){
  var b=document.createElement('button');
  b.className='epBtn'+(ep.n===cur?' on':'');
  b.textContent=''+ep.n;
  b.onclick=function(){switchEp(ep.n);};
  epsBox.appendChild(b);
});
// 视频比例自适应：画布只占视频大小
v.addEventListener('loadedmetadata',function(){
  var vw=v.videoWidth,vh=v.videoHeight;
  if(vw&&vh){
    var wrap=document.getElementById('playerWrap');
    var maxH=window.innerHeight-240;
    var h=Math.min(wrap.clientWidth*vh/vw,maxH);
    wrap.style.height=h+'px';
  }
});
window.addEventListener('resize',function(){
  var vw=v.videoWidth,vh=v.videoHeight;
  if(vw&&vh){
    var wrap=document.getElementById('playerWrap');
    var maxH=window.innerHeight-240;
    var h=Math.min(wrap.clientWidth*vh/vw,maxH);
    wrap.style.height=h+'px';
  }
});
function setEpUI(){
  var bs=epsBox.querySelectorAll('.epBtn');
  for(var i=0;i<bs.length;i++){
    var ep=EPS[i];
    bs[i].className='epBtn'+(ep.n===cur?' on':'')+(played.indexOf(ep.n)>-1&&ep.n!==cur?' done':'');
  }
}
function switchEp(n){
  if(n===cur&&v.src)return;
  cur=n;
  if(played.indexOf(n)<0)played.push(n);
  var ep=EPS[n-1];
  if(hls){hls.destroy();hls=null;}
  if(window.Hls&&Hls.isSupported()){
    hls=new Hls({maxBufferLength:180,maxBufferSize:120*1000*1000,maxMaxBufferLength:600,backBufferLength:60,enableWorker:true,fragLoadingMaxRetry:8,fragLoadingTimeOut:20000,fragLoadingRetryDelay:500,manifestLoadingMaxRetry:5,manifestLoadingTimeOut:15000,levelLoadingMaxRetry:8,levelLoadingTimeOut:20000,startLevel:-1});
    hls.loadSource(ep.u);
    hls.attachMedia(v);
    hls.on(Hls.Events.ERROR,function(e,d){
      if(d.fatal){loadTip.textContent='加载失败，点击重试';loadTip.classList.add('show');lastFail='hls';}
    });
  }else if(v.canPlayType('application/vnd.apple.mpegurl')){
    v.src=ep.u;
  }
  loadTip.textContent='加载中…';loadTip.classList.add('show');
  setEpUI();
  v.play().catch(function(){});
}
switchEp(1);
v.addEventListener('loadeddata',function(){loadTip.classList.remove('show');});
v.addEventListener('waiting',function(){loadTip.classList.add('show');});
v.addEventListener('playing',function(){loadTip.classList.remove('show');});
playBtn.addEventListener('click',function(){
  if(v.paused){v.play();}else{v.pause();}
});
v.addEventListener('play',function(){playBtn.textContent='⏸';bigPlay.classList.add('hide');hideCtrlSoon();requestWake();});
v.addEventListener('pause',function(){playBtn.textContent='▶';bigPlay.classList.remove('hide');ctrl.classList.remove('forced');showCtrl();releaseWake();});
bigPlay.addEventListener('click',function(){v.play();});
function fmt(s){s=Math.max(0,s|0);var m=Math.floor(s/60),ss=s%60;return (m<10?'0':'')+m+':'+(ss<10?'0':'')+ss;}
v.addEventListener('timeupdate',function(){
  if(v.duration){var p=v.currentTime/v.duration;barFill.style.width=(p*100)+'%';barDot.style.left=(p*100)+'%';}
  timeEl.textContent=fmt(v.currentTime)+' / '+fmt(v.duration);
});
bar.addEventListener('click',function(e){
  var r=bar.getBoundingClientRect(),p=(e.clientX-r.left)/r.width;
  if(v.duration){v.currentTime=p*v.duration;}
});
var spd125=document.getElementById('spd125'),spdTip=document.getElementById('spdTip'),spdOn=false;
  spd125.addEventListener('click',function(){
    spdOn=!spdOn;
    v.playbackRate=spdOn?1.25:1;
    spd125.classList.toggle('on',spdOn);
    spdTip.textContent=spdOn?'已开启':'默认速度';
  });
var fullBtn=document.getElementById('fullBtn');
fullBtn.addEventListener('click',function(){
  var el=v.parentElement;
  if(document.fullscreenElement){document.exitFullscreen();}
  else if(el.requestFullscreen){el.requestFullscreen();}
  else if(el.webkitRequestFullscreen){el.webkitRequestFullscreen();}
});
var playerWrap=document.getElementById('playerWrap');
playerWrap.addEventListener('click',function(e){
  if(justGestured)return;
  if(e.target.closest('#ctrl')||e.target===bigPlay)return;
  ctrl.classList.remove('forced');
  if(ctrl.classList.contains('lock')){ctrl.classList.remove('lock');if(hideTimer)clearTimeout(hideTimer);}
  else{showCtrl();}
});
document.getElementById('hideCtrlBtn').addEventListener('click',function(){
  ctrl.classList.remove('lock');
  ctrl.classList.add('forced');
  if(hideTimer)clearTimeout(hideTimer);
});
document.getElementById('btnBack').addEventListener('click',function(){if(history.length>1){history.back();}else{location.href='look.html';}});
document.getElementById('btnHome').addEventListener('click',function(){location.href='main.html';});
loadTip.addEventListener('click',function(){loadTip.classList.remove('show');switchEp(cur,true);});
document.addEventListener('keydown',function(e){
  if(e.code==='Space'){e.preventDefault();v.paused?v.play():v.pause();}
  if(e.code==='ArrowLeft')v.currentTime-=5;
  if(e.code==='ArrowRight')v.currentTime+=5;
  if(e.code==='KeyF')fullBtn.click();
});
</script><script defer src="https://cdn.jsdelivr.net/npm/webm-muxer@2.0.0/build/webm-muxer.min.js"></script>
<script defer src="eco.js"></script>
</body></html>
