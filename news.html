<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<!-- 禁止双击放大：iOS Safari 从 iOS 10 起忽略 user-scalable=no，真正生效的是 touch-action:manipulation（上下滚动、双指缩放照常可用） -->
<style>html,body{touch-action:manipulation;-webkit-text-size-adjust:100%}</style>
<title>活动中心 · 莫古游戏</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23FF6B6B'/%3E%3Cstop offset='1' stop-color='%23FFD93D'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='45' font-size='38' font-weight='800' text-anchor='middle' fill='%23fff'%3E%3F%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --coral:#FF6B6B; --sunny:#FFD93D; --mint:#4ECDC4; --grape:#9B5DE5; --pink:#FF9DE2;
    --ink:#4A3F5C; --muted:#9A8FB5;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
    background:linear-gradient(160deg,#FFF6E9,#FFE8D6);
    color:var(--ink);min-height:100vh;padding:16px 14px 48px;
  }
  .blob{position:fixed;border-radius:50%;filter:blur(50px);opacity:.5;z-index:0;animation:float 12s ease-in-out infinite;pointer-events:none}
  .b1{width:36vmax;height:36vmax;background:var(--pink);top:-10vmax;left:-8vmax}
  .b2{width:28vmax;height:28vmax;background:var(--mint);bottom:-8vmax;right:-6vmax;animation-delay:-4s}
  .b3{width:20vmax;height:20vmax;background:var(--sunny);top:40vh;left:-6vmax;opacity:.3;animation-delay:-8s}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(2.5vmax)}}
  .wrap{position:relative;z-index:1;max-width:900px;margin:0 auto}

  /* ===== 顶栏 ===== */
  .toprow{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:rgba(255,255,255,.88);backdrop-filter:blur(14px);
    border-radius:18px;padding:12px 14px;margin-bottom:14px;
    box-shadow:0 10px 30px rgba(155,93,229,.13);flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:10px}
  .logo{
    width:40px;height:40px;border-radius:12px;flex:none;
    background:linear-gradient(135deg,var(--coral),var(--sunny));
    display:flex;align-items:center;justify-content:center;
    font-size:18px;font-weight:800;color:#fff;box-shadow:0 6px 14px rgba(255,107,107,.4);
  }
  .brand h1{font-size:17px;letter-spacing:1px}
  .brand small{display:block;font-size:11px;color:var(--muted);font-weight:400;letter-spacing:0}
  .btn{
    border:none;border-radius:11px;padding:9px 16px;cursor:pointer;
    font-size:13px;font-weight:700;color:#fff;flex:none;
    background:linear-gradient(135deg,var(--coral),var(--grape));
    box-shadow:0 5px 14px rgba(255,107,107,.3);
    transition:transform .15s,filter .15s;
  }
  .btn:hover{transform:translateY(-2px);filter:brightness(1.06)}
  .btn:active{transform:translateY(0) scale(.97)}
  .btn.ghost{background:linear-gradient(135deg,var(--mint),#2EB5A9);box-shadow:0 5px 14px rgba(78,205,196,.3)}

  /* ===== 左右布局 ===== */
  .shell{display:flex;gap:14px;align-items:flex-start}
  /* 左侧活动列表（下滑栏） */
  .sidelist{
    flex:none;width:210px;
    background:rgba(255,255,255,.9);backdrop-filter:blur(14px);
    border-radius:18px;padding:10px;box-shadow:0 10px 30px rgba(155,93,229,.11);
    max-height:calc(100vh - 130px);overflow-y:auto;
    display:flex;flex-direction:column;gap:8px;
  }
  .side-item{
    border:none;cursor:pointer;text-align:left;
    background:#FBF6FF;border-radius:13px;padding:12px 12px;
    border:2px solid transparent;transition:.2s;flex:none;
    display:flex;align-items:center;gap:9px;
  }
  .side-item .si-emo{font-size:22px}
  .side-item b{display:block;font-size:13px;color:var(--ink)}
  .side-item small{font-size:11px;color:var(--muted)}
  .side-item:hover{border-color:#F0E0FA}
  .side-item.on{
    background:linear-gradient(135deg,var(--coral),var(--grape));
    border-color:transparent;
  }
  .side-item.on b,.side-item.on small{color:#fff}
  /* 右侧活动内容 */
  .content{
    flex:1;min-width:0;
    background:rgba(255,255,255,.9);backdrop-filter:blur(14px);
    border-radius:18px;padding:18px 16px;box-shadow:0 10px 30px rgba(155,93,229,.11);
  }
  .act{display:none;animation:fade .35s ease}
  .act.show{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* 活动1：丰稔季 */
  .harvest-head{
    display:flex;align-items:center;justify-content:center;gap:10px;
    margin-bottom:12px;flex-wrap:wrap;
  }
  .harvest-head img{width:64px;height:64px;object-fit:cover;border-radius:14px;box-shadow:0 6px 14px rgba(155,93,229,.18)}
  .harvest-title{
    font-size:19px;font-weight:800;text-align:center;
    background:linear-gradient(135deg,var(--coral),var(--sunny));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .harvest-sub{text-align:center;font-size:13px;color:var(--muted);margin-bottom:14px}
  .harvest-box{
    position:relative;
    background:linear-gradient(160deg,#FFF8E8,#FFF0F6);
    border:2px solid #FBE3A9;border-radius:18px;
    padding:20px 16px 54px;min-height:150px;
    display:flex;align-items:center;justify-content:center;gap:14px;
  }
  .harvest-box img.side{width:96px;height:96px;object-fit:cover;border-radius:14px;box-shadow:0 6px 14px rgba(155,93,229,.15);flex:none}
  .harvest-txt{
    flex:1;min-width:0;text-align:center;
    font-size:14px;line-height:1.9;color:#6B5B3E;
  }
  .harvest-txt b{display:block;font-size:15px;color:#B8860B;margin-bottom:4px}
  .cap{
    position:absolute;right:14px;bottom:14px;
    border:none;border-radius:999px;padding:9px 20px;cursor:pointer;
    font-size:13px;font-weight:800;color:#fff;
    background:linear-gradient(135deg,var(--coral),var(--sunny));
    box-shadow:0 6px 14px rgba(255,107,107,.35);
    transition:transform .15s,filter .15s;
  }
  .cap:hover{transform:translateY(-2px);filter:brightness(1.06)}
  .cap:active{transform:scale(.95)}

  /* 活动2：签到 */
  .sign-card{text-align:center;padding:12px 6px}
  .sign-title{font-size:19px;font-weight:800;margin-bottom:4px;
    background:linear-gradient(135deg,var(--grape),var(--pink));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .sign-sub{font-size:13px;color:var(--muted);margin-bottom:14px}
  .streak-row{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
  .day{
    width:52px;padding:8px 0;border-radius:13px;text-align:center;
    background:linear-gradient(135deg,var(--sunny),#FFE08A);
    border:2px solid var(--sunny);
  }
  .day b{display:block;font-size:13px;color:#8B6A0B}
  .day small{font-size:10px;color:#A8862B}
  .day.on{background:#E9E4EF;border-color:#D9D2E2}
  .day.on b,.day.on small{color:var(--muted)}
  .day.today{box-shadow:0 0 0 3px rgba(255,107,107,.25);border-color:var(--coral)}
  .sign-btn{
    border:none;border-radius:999px;padding:13px 40px;cursor:pointer;
    font-size:15px;font-weight:800;color:#fff;
    background:linear-gradient(135deg,var(--coral),var(--grape));
    box-shadow:0 8px 20px rgba(155,93,229,.3);
    transition:transform .15s,filter .15s;
  }
  .sign-btn:hover{transform:translateY(-2px);filter:brightness(1.06)}
  .sign-btn:active{transform:scale(.96)}
  .sign-btn.done{background:linear-gradient(135deg,#C9C2D8,#B5ADC7);box-shadow:none;cursor:default}
  .sign-note{font-size:12px;color:var(--muted);margin-top:12px}

  .msg{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
    background:rgba(74,63,92,.92);color:#fff;padding:10px 20px;border-radius:999px;
    font-size:13px;opacity:0;transition:.3s;z-index:9;pointer-events:none;white-space:nowrap}
  .msg.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:640px){
    .shell{flex-direction:column}
    .sidelist{width:100%;flex-direction:row;overflow-x:auto;max-height:none;padding:10px}
    .side-item{min-width:150px;flex:1}
    .harvest-box img.side{width:64px;height:64px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<!-- 热更新：内容版本变化自动带参重载，绕过缓存（无需重装 APK） -->
<script>
(function(){
  var VER_URL = 'https://mogoing.github.io/mogoing/version.json';
  if (!window.fetch) return;
  fetch(VER_URL, {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(j){
    var ver = String((j && j.v) || 0);
    try {
      var old = localStorage.getItem('mogoing_ver');
      if (old !== ver) {
        localStorage.setItem('mogoing_ver', ver);
        var p = location.pathname;
        var q = location.search || '';
        var sep = q.indexOf('?') >= 0 ? '&' : '?';
        location.replace(p + q + sep + 'v=' + ver);
      }
    } catch(e){}
  }).catch(function(){});
})();
</script>
</head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="wrap">
    <div class="toprow">
      <div class="brand">
        <div class="logo">🎉</div>
        <h1>活动中心<small id="who"></small></h1>
      </div>
      <button class="btn ghost" onclick="goHome()">回主页</button>
    </div>

    <div class="shell">
      <!-- 左侧活动列表 -->
      <div class="sidelist" id="sidelist"></div>
      <!-- 右侧活动内容 -->
      <div class="content" id="content"></div>
    </div>
  </div>
  <div class="msg" id="msg"></div>

<script>
  const API = 'https://api.mogoing.xyz';
  const $ = id => document.getElementById(id);
  const user = localStorage.getItem('blindbox_user');
  const pass = localStorage.getItem('blindbox_pass') || '';
  if (!user) location.replace('index.html');
  $('who').textContent = ' · ' + user;

  function toast(t){
    const m = $('msg'); m.textContent = t; m.classList.add('show');
    clearTimeout(m._t); m._t = setTimeout(() => m.classList.remove('show'), 2000);
  }
  function goHome(){ location.href = 'main.html'; }
  function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  // 页面等级最低：replace 掉历史，任何页面返回都不会回到本页
  if (history.replaceState) history.replaceState(null, '', location.href);

  // ===== 活动定义 =====
  const ACTS = [
    { id:'harvest', emo:'🌾', name:'丰稔季', tag:'进行中',
      render: () => `
        <div class="harvest-head">
          <img src="assets/harvest.jpg" alt="丰收">
          <div><div class="harvest-title">丰稔季来啦！</div>
          <div class="harvest-sub">快去农场种植吧！</div></div>
          <img src="assets/harvest.jpg" alt="丰收">
        </div>
        <div class="harvest-box">
          <img class="side" src="assets/harvest.jpg" alt="硕果累累">
          <div class="harvest-txt">
            <b>硕果累累 · 丰收正当时</b>
            当前季节为「丰稔季」，农场的每一块田地<br>
            都浸润着丰收的喜悦。<br>
            播种、浇水、收获，把果实装满你的背篓，<br>
            卖个好价钱，为农场攒下更多金币吧！<br>
            <span style="font-size:12px;color:#B8860B">活动长期有效 · 奖励即刻到账</span>
          </div>
          <img class="side" src="assets/harvest.jpg" alt="硕果累累">
          <button class="cap" onclick="goFarm()">🌾 我的农场</button>
        </div>`
    },
    { id:'sign', emo:'🎁', name:'签到送金币', tag:'每日',
      render: () => renderSign() }
  ];

  let curAct = 'harvest';
  function renderList(){
    $('sidelist').innerHTML = ACTS.map(a => `
      <button class="side-item ${a.id===curAct?'on':''}" onclick="switchAct('${a.id}')">
        <span class="si-emo">${a.emo}</span>
        <span><b>${a.name}</b><small>${a.tag}</small></span>
      </button>`).join('');
  }
  function switchAct(id){
    curAct = id; renderList();
    const act = ACTS.find(a => a.id === id);
    $('content').innerHTML = `<div class="act show">${act.render()}</div>`;
    const el = document.querySelector('.act.show');
    if (el) { el.classList.remove('show'); void el.offsetWidth; el.classList.add('show'); }
    if (id === 'sign') initSign();
  }
  function renderContent(){
    const act = ACTS.find(a => a.id === curAct);
    $('content').innerHTML = `<div class="act show">${act.render()}</div>`;
    if (curAct === 'sign') initSign();
  }
  function goFarm(){ location.href = 'bean.html'; }

  // ===== 签到送金币 =====
  // 规则：每天登录送 1 币；连续第 7 天「周日好礼」双倍给 2 币；与个人账户打通
  let signState = { done:false, streak:0, todayGift:0, bonusToday:false, weekly:[], backendDown:false };
  function fmtDate(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
  // 真实星期：周一=1 … 周六=6，周日=7
  function todayIdx(){ const d = new Date().getDay(); return d === 0 ? 7 : d; }
  const isTodaySunday = () => todayIdx() === 7;

  async function loadSign(){
    signState.bonusToday = isTodaySunday();
    signState.todayGift = signState.bonusToday ? 2 : 1;
    try {
      const r = await fetch(`${API}/api/save?username=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}&game=signin`);
      const d = await r.json();
      if (!d.ok && d.error === '未登录') { authExpired(); return; }
      const s = d.save || {};
      const today = fmtDate(new Date());
      const yesterday = fmtDate(new Date(Date.now() - 864e5));
      signState.weekly = Array.isArray(s.weekly) ? s.weekly.slice() : [];
      if (s.lastDate === today) {
        signState.done = true;
        signState.streak = s.streak || 1;
        if (!signState.weekly.includes(todayIdx())) signState.weekly.push(todayIdx());
      } else {
        signState.streak = (s.lastDate === yesterday) ? ((s.streak || 0) + 1) : 1;
        signState.done = false;
      }
      signState.backendDown = false;
    } catch(e){
      // 后端不可用：直接不让领取（按钮禁用），不做任何本地兜底
      signState.backendDown = true;
      signState.done = false;
    }
  }

  function renderSign(){
    const ti = todayIdx();
    const wks = ['周一','周二','周三','周四','周五','周六','周日'];
    const days = [1,2,3,4,5,6,7].map(n => {
      const claimed = signState.weekly.indexOf(n) !== -1;
      let cls = 'day';
      if (claimed) cls += ' on';
      if (n === ti) cls += ' today';
      let small;
      if (n === 7) small = '周日好礼';
      else if (n === ti && !claimed) small = '今天';
      else if (claimed) small = '已领';
      else small = '+1币';
      return `<div class="${cls}"><b>${wks[n-1]}</b><small>${small}</small></div>`;
    }).join('');
    const disabled = signState.done || signState.backendDown;
    const btnTxt = signState.backendDown
      ? '⚠️ 网络不可用，暂不能签到'
      : (signState.done
          ? (signState.bonusToday ? '✅ 今日已签（周日好礼 +2币）' : '✅ 今日已签 +1币')
          : (signState.bonusToday ? '🎁 今日签到大奖 +2币' : '✋ 签到领金币 +1币'));
    return `
      <div class="sign-card">
        <div class="sign-title">签到送金币</div>
        <div class="sign-sub">每天登录送 <b style="color:var(--coral)">1 金币</b> · 每周日「周日好礼」双倍 <b style="color:var(--sunny)">2 金币</b></div>
        <div class="streak-row">${days}</div>
        <button class="sign-btn ${disabled?'done':''}" id="signBtn" ${disabled?'disabled':''} onclick="doSign()">${btnTxt}</button>
        <div class="sign-note" id="signNote">${signState.backendDown ? '无法连接服务器，请检查网络后重试' : (signState.done ? `已连续签到 ${signState.streak} 天` : (signState.streak>0 ? `已连续签到 ${signState.streak} 天` : '签到金币实时到账个人账户'))}</div>
      </div>`;
  }

  // ===== 登录状态失效：清当前登录态（保留上次登录记忆），回登录页重新登录 =====
  function authExpired(){
    try {
      localStorage.removeItem('blindbox_user');
      localStorage.removeItem('blindbox_pass');
      localStorage.removeItem('blindbox_manager');
      localStorage.removeItem('blindbox_coins');
      localStorage.removeItem('blindbox_offline');
    } catch(e){}
    toast('⚠️ 登录状态失效，请重新登录');
    setTimeout(() => location.replace('index.html'), 1200);
  }

  async function doSign(){
    if (signState.done) return;
    if (signState.backendDown) return toast('⚠️ 网络不可用，无法签到，请稍后再试');
    const btn = $('signBtn'); if (btn) btn.disabled = true;
    try {
      // 领取金币
      const r1 = await fetch(`${API}/api/gain`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ username:user, password:pass, amount: signState.todayGift })
      });
      const d1 = await r1.json();
      if (!d1.ok) {
        if (d1.error === '未登录') { authExpired(); return; }
        throw new Error(d1.error || '领取失败');
      }
      // 记录签到状态（含本周已签集合 weekly）
      const ti = todayIdx();
      const weekly = signState.weekly.slice();
      if (weekly.indexOf(ti) === -1) weekly.push(ti);
      let syncOk = true;
      try {
        const r2 = await fetch(`${API}/api/save`, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ username:user, password:pass, game:'signin', data:{ lastDate: fmtDate(new Date()), streak: signState.streak, weekly: weekly } })
        });
        const d2 = await r2.json();
        syncOk = !!(d2 && d2.ok);
      } catch(e2){ syncOk = false; }
      signState.done = true;
      signState.weekly = weekly;
      toast(signState.bonusToday
        ? `🎁 周日好礼！到账 ${signState.todayGift} 金币，余额 ${d1.balance}`
        : `✅ 签到成功！到账 1 金币，余额 ${d1.balance}${syncOk ? '' : '（状态同步延迟）'}`);
      renderContent();
    } catch(e){
      toast('签到失败：' + e.message);
      const b2 = $('signBtn'); if (b2) b2.disabled = false;
    }
  }

  async function initSign(){
    await loadSign();
    // 重绘签到区（保留当前活动容器）
    const act = ACTS.find(a => a.id === 'sign');
    const box = document.querySelector('#content .act');
    if (box) box.innerHTML = act.render();
  }

  renderList();
  renderContent();
</script>
</body>
</html>
