<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>教资刷题 · 每日一题</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="教资刷题">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/edu.css">
</head>
<body>
<div class="blob blob-a"></div><div class="blob blob-b"></div>

<header class="topbar">
  <a class="back" href="../main.html" title="返回主菜单" aria-label="返回主菜单"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px"><path d="M19 12H5" stroke="var(--ink)"/><path d="M11 18l-6-6 6-6" stroke="var(--ink)"/></svg></a>
  <div class="tb-title">
    <span class="em">🎓</span>
    <div><h1>教资刷题</h1><small id="subline">小学教师资格证 · 笔试 + 面试</small></div>
  </div>
  <button class="theme-btn" title="切换深浅色">🌙</button>
</header>

<div class="wrap narrow">
  <!-- 倒计时 + 打卡 + 星标/错题胶囊 -->
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px">
    <span class="pill sun" id="cd">📅 考试倒计时</span>
    <span class="pill mintp" id="streak">🔥 连续打卡 0 天</span>
    <a class="mini-link" href="list.html#star">⭐ 星标 <b id="starN">0</b></a>
    <a class="mini-link" href="list.html#wrong">📕 错题本 <b id="wrongN">0</b></a>
  </div>

  <!-- 三大卡片 -->
  <div class="big3">
    <button class="big-card zzt" id="cardZuo">
      <span class="be">✏️</span>
      <span class="bt">做题</span>
      <span class="bd">分科目章节练<br>做到哪了接着刷</span>
    </button>
    <button class="big-card kaos" id="cardKao">
      <span class="be">🏆</span>
      <span class="bt">考试</span>
      <span class="bd">整卷模考 · 120分钟<br>交卷才出分</span>
    </button>
    <button class="big-card zil" id="cardZi">
      <span class="be">📚</span>
      <span class="bt">资料</span>
      <span class="bd">讲义 · 视频<br>全部题目搜索</span>
    </button>
  </div>

  <!-- 每日一题 -->
  <section class="daily" id="dailySec">
    <div class="daily-card">
      <div class="daily-head">
        <span class="dt">🎯 每日一题</span>
        <span class="dd" id="dailyDate"></span>
        <span class="streak flame" id="streakDots" title="最近 7 天"></span>
      </div>
      <div id="dailyBody"><p class="muted" style="font-weight:700">加载中…</p></div>
    </div>
  </section>
</div>

<div class="toast"></div>
<div class="syncbar"></div>

<script src="js/common.js"></script>
<script src="data/index.js"></script>
<script>
EDU.initTheme();
var idx = window.EDU_INDEX || [];

document.getElementById('cardZuo').addEventListener('click', function(){ location.href = 'zuoti.html'; });
document.getElementById('cardKao').addEventListener('click', function(){ location.href = 'kaoshi.html'; });
document.getElementById('cardZi').addEventListener('click', function(){ location.href = 'ziliao.html'; });

/* 倒计时 */
(function(){
  var d = EDU.examCountdown();
  var el = document.getElementById('cd');
  if (d === null) el.textContent = '📅 下轮笔试时间待官方公布';
  else if (d === 0) el.textContent = '📅 今天笔试！稳住，我们能赢';
  else el.textContent = '📅 距笔试还有 ' + d + ' 天';
})();

/* 打卡 + 星标/错题计数 */
function renderStreak(){
  var s = EDU.streak();
  document.getElementById('streak').textContent = '🔥 连续打卡 ' + s + ' 天';
  var dots = '';
  for (var i = 6; i >= 0; i--){
    var d = new Date(); d.setDate(d.getDate() - i);
    var key = d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
    dots += '<i class="' + (EDU.P.daily[key] ? 'on' : '') + '"></i>';
  }
  document.getElementById('streakDots').innerHTML = dots;
  var sn = 0, wn = 0;
  idx.forEach(function(m){
    var st = EDU.P.banks[m.id];
    if (!st) return;
    sn += (st.star || []).length;
    wn += (st.wrong || []).length;
  });
  document.getElementById('starN').textContent = sn;
  document.getElementById('wrongN').textContent = wn;
}

/* 每日一题 */
function dateKey(){
  var d = new Date();
  return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
}
function renderDaily(){
  var body = document.getElementById('dailyBody');
  document.getElementById('dailyDate').textContent = '今天 · ' + dateKey();
  var pick = EDU.dailyPick(idx);
  if (!pick){ body.innerHTML = '<p class="muted">题库为空</p>'; return; }
  EDU.loadBank(pick.bank).then(function(data){
    var q = data.q.filter(function(x){ return x.n === pick.n; })[0];
    if (!q){ body.innerHTML = '<p class="muted">今日题目加载失败</p>'; return; }
    var rec = EDU.dailyToday();
    var el = document.createElement('div');
    el.innerHTML = '<div class="daily-body"></div><div class="qopts"></div><div class="qsol" style="display:none"></div>';
    el.querySelector('.daily-body').textContent = q.stem;
    var opts = el.querySelector('.qopts');
    var sol = el.querySelector('.qsol');
    q.opts.forEach(function(o){
      var b = document.createElement('button');
      b.className = 'opt';
      b.innerHTML = '<b>' + o[0] + '</b><span>' + o[1] + '</span>';
      b.addEventListener('click', function(){
        if (EDU.dailyToday()) return;
        var right = o[0] === q.ans;
        opts.querySelectorAll('.opt').forEach(function(x, i){
          x.disabled = true;
          if (q.opts[i][0] === q.ans) x.classList.add('right');
          else if (x === b && !right) x.classList.add('wrong');
        });
        sol.style.display = '';
        sol.innerHTML = '<div class="st">' + (right ? '答对了，漂亮 🎉' : '答错了，看解析 👇') +
          '<span class="verdict ' + (right ? 'ok">正确答案 ' : 'ng">正确答案 ') + q.ans + '</span></div>' +
          '<div>' + (q.sol || '') + '</div>';
        EDU.dailyRecord(pick.dateKey, pick.bank, pick.n, o[0], right);
        renderStreak();
        EDU.toast(right ? '今日打卡完成 🔥' : '已打卡，记得看看解析');
      });
      opts.appendChild(b);
    });
    if (rec){
      opts.querySelectorAll('.opt').forEach(function(x, i){
        x.disabled = true;
        if (q.opts[i][0] === q.ans) x.classList.add('right');
        else if (q.opts[i][0] === rec.ans) x.classList.add('wrong');
      });
      sol.style.display = '';
      sol.innerHTML = '<div class="st">今天已打卡 <span class="verdict ' + (rec.ok ? 'ok">答对' : 'ng">答错') +
        '</span><span class="verdict ' + 'ok">正确答案 ' + q.ans + '</span></div>' +
        '<div>' + (q.sol || '') + '</div>';
    }
    body.innerHTML = '';
    body.appendChild(el);
  }).catch(function(){
    body.innerHTML = '<p class="muted">今日题目加载失败，请刷新重试</p>';
  });
}

/* 启动 */
EDU.loadProgress().then(function(synced){
  if (!synced){
    var u = EDU.user();
    if (!u.ok) EDU.toast('未登录主站账号，进度不会保存', 3000);
  }
  renderStreak();
  renderDaily();
});

/* PWA 注册 */
if ('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
</body>
</html>
