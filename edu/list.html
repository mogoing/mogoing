<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<!-- 禁止双击放大：iOS Safari 从 iOS 10 起忽略 user-scalable=no，真正生效的是 touch-action:manipulation（上下滚动、双指缩放照常可用） -->
<style>html,body{touch-action:manipulation;-webkit-text-size-adjust:100%}</style>
<title>题库列表 · 教资刷题</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/edu.css">
</head>
<body>
<div class="blob blob-a"></div><div class="blob blob-b"></div>

<header class="topbar">
  <a class="back" href="index.html" title="返回模块首页" aria-label="返回模块首页"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5" stroke="var(--ink)"/><path d="M11 18l-6-6 6-6" stroke="var(--ink)"/></svg></a>
  <div class="tb-title">
    <span class="em">📚</span>
    <div><h1 id="h1">题库列表</h1><small id="subline">选择一个题库开始</small></div>
  </div>
  <button class="theme-btn" title="切换深浅色">🌙</button>
</header>

<div class="wrap narrow" id="main"></div>

<!-- 编辑模式底部遮罩层 -->
<div class="editbar" id="editbar">
  <button class="chip" id="selectAll">全选</button>
  <button class="chip danger" id="doDelete">移出</button>
  <button class="chip" id="cancelEdit">取消</button>
</div>

<!-- 二级确认弹窗（屏幕中间）：文字在按钮下方 -->
<div class="modal" id="modal">
  <div class="modal-card">
    <h3>确定移出错题本？</h3>
    <div class="modal-actions">
      <div class="ma-item">
        <button class="btn ng" id="modalYes">移出</button>
        <small>我会做下回肯定不会错啦！</small>
      </div>
      <div class="ma-item">
        <button class="btn ghost" id="modalNo">取消</button>
        <small>先留着，想再看看~</small>
      </div>
    </div>
  </div>
</div>

<div class="toast"></div>
<div class="syncbar"></div>

<script src="js/common.js"></script>
<script src="data/index.js"></script>
<script>
EDU.initTheme();
var idx = window.EDU_INDEX || [];
var HASH = location.hash.replace('#','');

var wrongSort = 'time';   // time 按时间 | count 按错误次数
var editMode = false;
var selected = {};        // "bankId:n" -> {id, n}
var expanded = {};        // "bankId:n" -> true 展开状态
var CUR_ROWS = [];        // 当前错题行

function go(url){ location.href = url; }
function setHead(t, s){
  document.getElementById('h1').textContent = t;
  document.getElementById('subline').textContent = s;
}
function p2(x){ return ('0' + x).slice(-2); }
function fmtDate(ts){
  if (!ts) return '较早';
  var d = new Date(ts), now = new Date();
  var sameYear = d.getFullYear() === now.getFullYear();
  return (sameYear ? '' : d.getFullYear() + '-') + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes());
}
function preview(q){
  var s = String((q && q.stem) || '').replace(/\s+/g, ' ').trim();
  return s.length > 48 ? s.slice(0, 48) + '…' : s;
}

/* ===== 默认视图：按科目分组列出题库 ===== */
function renderBanks(){
  setHead('题库列表', '点题库进刷题 · 带答案浏览请进「资料」');
  var box = document.getElementById('main');
  box.innerHTML = '';
  var subs = [];
  idx.forEach(function(m){ if (subs.indexOf(m.sub) < 0) subs.push(m.sub); });
  var subMeta = { zhsz:'综合素质 · 科目一', jyjs:'教育教学知识与能力 · 科目二', mock:'整卷模考', ms:'面试' };
  subs.forEach(function(s){
    var h = document.createElement('div');
    h.className = 'frame-h'; h.style.marginTop = '18px';
    h.innerHTML = '<span class="ft">' + (subMeta[s] || s) + '</span>';
    box.appendChild(h);
    idx.filter(function(m){ return m.sub === s; }).forEach(function(m){
      var p = EDU.bankProgress(m.id, m.count);
      var st = EDU.bankState(m.id);
      var item = document.createElement('div');
      item.className = 'bank-item';
      var kindName = {single:'单选', short:'简答', material:'材料', writing:'写作', design:'教学设计', interview:'问答', mixed:'整卷'}[m.kind] || '';
      item.innerHTML =
        '<span class="be" style="background:linear-gradient(135deg,rgba(155,93,229,.15),rgba(255,157,226,.2))">' +
          ({single:'✏️',short:'📝',material:'📄',writing:'🖋️',design:'📐',interview:'🎤',mixed:'🏆'}[m.kind] || '📘') + '</span>' +
        '<div class="bi"><div class="bt">' + m.title + '</div>' +
        '<div class="bd">' + kindName + ' · ' + m.count + '题 · 建议用时' + m.suggestMin + '分钟 · 已做 ' + p[0] + ' 题' +
          (st.star.length ? ' · ⭐' + st.star.length : '') +
          (m.kind === 'single' && st.wrong.length ? ' · 错题' + st.wrong.length : '') + '</div>' +
        '<div class="bp"><i style="width:' + p[1] + '%"></i></div></div>' +
        '<span class="bgo">' + (p[0] ? '继续' : '开始') + '</span>';
      item.addEventListener('click', function(){ go('quiz.html?bank=' + encodeURIComponent(m.id)); });
      box.appendChild(item);
    });
  });
}

/* ===== 星标清单：两行 + 三角展开 ===== */
function renderStar(){
  setHead('⭐ 星标清单', '点 ⭐ 取消收藏 · 点三角展开完整题目');
  var box = document.getElementById('main');
  box.innerHTML = '<div class="filterbar" id="fbar"></div><div id="qlist"></div>';
  var fbar = document.getElementById('fbar'), qlist = document.getElementById('qlist');
  var banksWithStar = idx.filter(function(m){ return EDU.bankState(m.id).star.length; });
  if (!banksWithStar.length){ qlist.innerHTML = '<div class="empty">还没有星标任何题目。做题时点 ⭐ 收藏，汇总页里也能收藏。</div>'; return; }
  banksWithStar.forEach(function(m, i){
    var c = document.createElement('button');
    c.className = 'chip' + (i === 0 ? ' on' : '');
    c.textContent = m.title + ' ' + EDU.bankState(m.id).star.length;
    c.addEventListener('click', function(){
      fbar.querySelectorAll('.chip').forEach(function(x){ x.classList.remove('on'); });
      c.classList.add('on');
      showBank(m);
    });
    fbar.appendChild(c);
  });
  function showBank(m){
    qlist.innerHTML = '<p class="muted" style="font-weight:700;padding:10px 4px">加载中…</p>';
    EDU.loadBank(m.id).then(function(data){
      qlist.innerHTML = '';
      var stars = EDU.bankState(m.id).star.slice();
      stars.forEach(function(n){
        var q = data.q.filter(function(x){ return x.n === n; })[0];
        if (q) qlist.appendChild(buildStarCard(m, q));
      });
      if (!qlist.children.length) qlist.innerHTML = '<div class="empty">该题库暂无星标</div>';
    });
  }
  showBank(banksWithStar[0]);
}

/* ===== 错题本 ===== */
function collectWrong(){
  var rows = [];
  idx.forEach(function(m){
    var st = EDU.bankState(m.id);
    st.wrong.forEach(function(n){
      var info = EDU.wrongInfo(m.id, n);
      rows.push({ bank: m, n: n, c: info.c, t: info.t });
    });
  });
  rows.sort(function(a, b){
    if (wrongSort === 'count') return (b.c - a.c) || (b.t - a.t) || (a.bank.title < b.bank.title ? -1 : 1) || (a.n - b.n);
    return (b.t - a.t) || (b.c - a.c) || (a.bank.title < b.bank.title ? -1 : 1) || (a.n - b.n);
  });
  return rows;
}

function renderWrong(){
  setHead('📕 错题本', wrongSort === 'time' ? '按时间倒序 · 点三角展开题目' : '按做错次数排序 · 点三角展开题目');
  var box = document.getElementById('main');
  box.innerHTML =
    '<div class="toolbar">' +
      '<button class="chip' + (wrongSort === 'time' ? ' on' : '') + '" data-s="time">🕒 按时间</button>' +
      '<button class="chip' + (wrongSort === 'count' ? ' on' : '') + '" data-s="count">🔥 按次数</button>' +
      '<button class="btn ghost sm" id="editBtn" style="margin-left:auto">' + (editMode ? '✕ 退出编辑' : '✎ 编辑') + '</button>' +
    '</div>' +
    '<div id="qlist"></div>';
  var qlist = document.getElementById('qlist');
  document.querySelectorAll('.toolbar .chip').forEach(function(b){
    b.addEventListener('click', function(){ wrongSort = b.getAttribute('data-s'); renderWrong(); });
  });
  document.getElementById('editBtn').addEventListener('click', function(){
    editMode = !editMode; selected = {}; renderWrong();
  });

  var rows = collectWrong();
  CUR_ROWS = rows;
  if (!rows.length){
    qlist.innerHTML = '<div class="empty">错题本是空的。去刷题，答错的单选会自动进来。</div>';
    document.getElementById('editbar').classList.remove('show');
    return;
  }

  var ids = [];
  rows.forEach(function(r){ if (ids.indexOf(r.bank.id) < 0) ids.push(r.bank.id); });
  qlist.innerHTML = '<p class="muted" style="font-weight:700;padding:10px 4px">加载中…</p>';
  Promise.all(ids.map(function(id){ return EDU.loadBank(id); })).then(function(datas){
    var map = {};
    ids.forEach(function(id, i){ map[id] = datas[i]; });
    qlist.innerHTML = '';
    var lastBank = null;
    rows.forEach(function(r){
      if (r.bank.id !== lastBank){
        lastBank = r.bank.id;
        var cnt = rows.filter(function(x){ return x.bank.id === r.bank.id; }).length;
        qlist.insertAdjacentHTML('beforeend',
          '<div class="frame-h" style="margin-top:16px"><span class="ft">' + r.bank.title + '</span><span class="fd">' + cnt + ' 题</span></div>');
      }
      var q = map[r.bank.id].q.filter(function(x){ return x.n === r.n; })[0];
      if (q) qlist.appendChild(buildWrongCard(r, q));
    });
    updateEditbar();
  });
  document.getElementById('editbar').classList.toggle('show', editMode);
  updateEditbar();
}

function updateEditbar(){
  var bar = document.getElementById('editbar');
  if (!bar) return;
  var total = CUR_ROWS.length;
  var selN = Object.keys(selected).length;
  var allSel = total > 0 && selN === total;
  var sa = document.getElementById('selectAll');
  if (sa) sa.textContent = allSel ? '取消全选' : '全选';
  bar.classList.toggle('show', editMode && total > 0);
}

/* 折叠卡片：第一行题号+信息，第二行题干预览，点三角展开完整题目 */
function accCard(opts){
  var el = document.createElement('div');
  el.className = 'acc' + (opts.open ? ' open' : '') + (opts.cls ? ' ' + opts.cls : '');
  var head =
    '<div class="acc-head">' +
      '<button class="acc-tri" aria-label="展开">▶</button>' +
      opts.meta +
    '</div>';
  var body = '<div class="acc-preview">' + (opts.preview || '') + '</div>' +
    '<div class="acc-body">' + (opts.body || '') + '</div>';
  el.innerHTML = head + body;
  el.querySelector('.acc-tri').addEventListener('click', function(e){
    e.stopPropagation();
    el.classList.toggle('open');
    if (opts.key) expanded[opts.key] = el.classList.contains('open');
  });
  return el;
}

function buildWrongCard(r, q){
  var m = r.bank;
  var key = m.id + ':' + r.n;
  var doneMap = (EDU.P.banks[m.id] && EDU.P.banks[m.id].done) || {};
  var mastered = doneMap[q.n] === 'right';
  var el = accCard({
    key: key,
    open: !!expanded[key],
    cls: (editMode ? 'edit' : '') + (selected[key] ? ' sel' : ''),
    meta:
      '<span class="qno">第 ' + q.n + ' 题</span>' +
      '<span class="qtag wrongtag">错 ' + r.c + ' 次</span>' +
      (mastered ? '<span class="qtag oktag">已答对</span>' : '<span class="qtag">待攻克</span>') +
      '<span class="qtag">' + fmtDate(r.t) + '</span>' +
      (editMode ? '<span class="seldot' + (selected[key] ? ' on' : '') + '"></span>'
                : '<button class="qstar' + (EDU.isStar(m.id, q.n) ? ' on' : '') + '" title="星标">⭐</button>'),
    preview: preview(q),
    body: questionBody(q, true)
  });
  fillBody(el, q);
  var sb = el.querySelector('.qstar');
  if (sb) sb.addEventListener('click', function(e){
    e.stopPropagation();
    var on = EDU.toggleStar(m.id, q.n);
    sb.classList.toggle('on', on);
    EDU.toast(on ? '已收藏 ⭐' : '已取消收藏');
  });
  if (editMode){
    el.addEventListener('click', function(){
      if (selected[key]) delete selected[key]; else selected[key] = { id: m.id, n: q.n };
      el.classList.toggle('sel', !!selected[key]);
      var dot = el.querySelector('.seldot');
      if (dot) dot.classList.toggle('on', !!selected[key]);
      updateEditbar();
    });
  }
  return el;
}

function buildStarCard(m, q){
  var key = 'star:' + m.id + ':' + q.n;
  var el = accCard({
    key: key,
    open: !!expanded[key],
    meta:
      '<span class="qno">第 ' + q.n + ' 题</span>' +
      '<span class="qtag">' + m.title + '</span>' +
      '<button class="qstar on" title="星标">⭐</button>',
    preview: preview(q),
    body: questionBody(q, true)
  });
  fillBody(el, q);
  var sb = el.querySelector('.qstar');
  sb.addEventListener('click', function(e){
    e.stopPropagation();
    var on = EDU.toggleStar(m.id, q.n);
    sb.classList.toggle('on', on);
    EDU.toast(on ? '已收藏 ⭐' : '已取消收藏');
    if (!on){
      el.style.transition = 'opacity .25s';
      el.style.opacity = '0';
      setTimeout(function(){ el.remove(); }, 250);
    }
  });
  return el;
}

/* 题目正文模板（展开后显示）：题干 + 选项 + 答案 + 解析 */
function questionBody(q, withAnswer){
  var html = '<div class="acc-stem"></div>';
  if (q.opts && q.opts.length){
    html += '<div class="qopts">' + q.opts.map(function(o){
      var mark = withAnswer && q.ans && o[0] === q.ans ? ' right' : '';
      return '<div class="opt' + mark + '"><b>' + o[0] + '</b><span>' + (o[1] || '') + '</span></div>';
    }).join('') + '</div>';
  }
  if (withAnswer && q.ans) html += '<div class="qsol"><div class="st"><span class="verdict ok">答案 ' + q.ans + '</span></div></div>';
  if (withAnswer && q.sol) html += '<div class="qsol"><div class="st">解析</div><div class="sc"></div></div>';
  if (withAnswer && q.tip) html += '<div class="qsol tipbox"><div class="st">' + '💡 提示' + '</div><div class="sc2"></div></div>';
  return html;
}
function fillBody(el, q){
  var stem = el.querySelector('.acc-stem');
  if (stem) stem.textContent = (q.stem || '') + (q.ask ? '\n\n' + q.ask : '') + (q.task ? '\n\n【任务要求】\n' + q.task : '');
  var scs = el.querySelectorAll('.acc-body .sc');
  if (q.sol && scs[0]) scs[0].textContent = q.sol;
  var sc2 = el.querySelectorAll('.acc-body .sc2');
  if (q.tip && sc2[0]) sc2[0].textContent = q.tip;
}

/* ===== 编辑删除 ===== */
document.getElementById('selectAll').addEventListener('click', function(){
  var total = CUR_ROWS.length;
  var allSel = total > 0 && Object.keys(selected).length === total;
  selected = {};
  if (!allSel){
    CUR_ROWS.forEach(function(r){ selected[r.bank.id + ':' + r.n] = { id: r.bank.id, n: r.n }; });
  } else {
    selected = {};
  }
  renderWrong();
});
document.getElementById('doDelete').addEventListener('click', function(){
  if (!Object.keys(selected).length){ EDU.toast('先点题目选几道再删'); return; }
  document.getElementById('modal').classList.add('show');
});
document.getElementById('cancelEdit').addEventListener('click', function(){
  editMode = false; selected = {};
  document.getElementById('editbar').classList.remove('show');
  renderWrong();
});
document.getElementById('modalNo').addEventListener('click', function(){
  document.getElementById('modal').classList.remove('show');
});
document.getElementById('modal').addEventListener('click', function(e){
  if (e.target === this) this.classList.remove('show');
});
document.getElementById('modalYes').addEventListener('click', function(){
  var keys = Object.keys(selected);
  keys.forEach(function(k){ var v = selected[k]; EDU.removeWrong(v.id, v.n); });
  document.getElementById('modal').classList.remove('show');
  EDU.toast('已移出 ' + keys.length + ' 道错题');
  selected = {};
  renderWrong();
});

/* ===== 路由 ===== */
if (!HASH){ location.replace('zuoti.html'); }
EDU.loadProgress().then(function(synced){
  if (!synced) EDU.toast('未登录主站账号，进度不会保存', 3200);
  if (!HASH) return;
  if (HASH === 'star') renderStar();
  else if (HASH === 'wrong') renderWrong();
  else renderBanks();
});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
</body>
</html>
