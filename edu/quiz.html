<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<!-- 禁止双击放大：iOS Safari 从 iOS 10 起忽略 user-scalable=no，真正生效的是 touch-action:manipulation（上下滚动、双指缩放照常可用） -->
<style>html,body{touch-action:manipulation;-webkit-text-size-adjust:100%}</style>
<title>刷题 · 教资刷题</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/edu.css">
</head>
<body>
<div class="blob blob-a"></div><div class="blob blob-b"></div>

<!-- 顶栏：只有计时 / 进度 / 交卷（没有返回键，必须交卷才能离开） -->
<div class="exam-top" id="examTop">
  <span class="timer" id="timer">⏱ --:--</span>
  <span class="qtag pos-tag" id="posTag">-</span>
  <span style="flex:1"></span>
  <button class="btn ghost sm" id="sheetBtn">▦ 答题卡</button>
  <button class="btn sm" id="submitBtn">交卷</button>
</div>

<div class="narrow" style="margin-bottom:14px">
  <div class="pbar" title="刷题进度"><i id="pbarFill"></i></div>
  <div class="pstat"><span id="pstatText">准备中…</span></div>
</div>

<div class="narrow" id="stage">
  <div class="qcard"><p class="muted" style="font-weight:700;text-align:center">加载中…</p></div>
</div>

<!-- 答题卡抽屉（仅整卷考试用） -->
<div class="mask" id="mask">
  <div class="sheet">
    <h3>▦ 答题卡 <button id="sheetClose">✕</button></h3>
    <div class="ansgrid" id="ansgrid"></div>
    <div class="leg">
      <span><i style="background:linear-gradient(135deg,var(--mint),#2FBFB5)"></i>已作答</span>
      <span><i style="background:var(--card2);border:1px solid var(--line)"></i>未作答</span>
      <span><i style="outline:2px solid var(--grape);outline-offset:1px"></i>当前题</span>
    </div>
    <p class="muted" style="font-size:12px;font-weight:700;margin-top:10px">做题不固定数量：想做几题做几题，全做完再交卷也行。</p>
  </div>
</div>

<div class="toast"></div>
<div class="syncbar"></div>

<script src="js/common.js"></script>
<script src="data/index.js"></script>
<script>
EDU.initTheme();
var idx = window.EDU_INDEX || [];
var QS = new URLSearchParams(location.search);

/* ===== 会话状态 ===== */
var items = [];        // [{bankId, bankMeta, q, _ans, _right}]
var meta = null;       // 当前题库元数据
var wrongMode = QS.get('wrong') === '1';
var MODE = 'practice'; // practice（刷题：随机 + 错题循环）| exam（整卷模考）
var cur = 0;
var answers = {};      // exam 模式：idx -> 选项字母
var texts = {};        // 主观题作答
var started = Date.now();
var remainSec = 0;
var timerId = null;
var submitted = false;
var practiceTotal = 0, practiceSolved = 0, practiceWrong = 0;
var solvedSet = {};

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function shuffle(a){
  for (var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* ===== 装配题目 ===== */
function assemble(){
  if (wrongMode){
    var ids = (QS.get('banks') || '').split(',').filter(Boolean);
    var jobs = ids.map(function(id){ return EDU.loadBank(id); });
    return Promise.all(jobs).then(function(datas){
      items = [];
      ids.forEach(function(id, i){
        var m = idx.filter(function(x){ return x.id === id; })[0];
        var wrongs = EDU.bankState(id).wrong.slice().sort(function(a,b){ return a-b; });
        wrongs.forEach(function(n){
          var q = datas[i].q.filter(function(x){ return x.n === n; })[0];
          if (q && q.opts && q.opts.length) items.push({ bankId:id, bankMeta:m, q:q });
        });
      });
      if (!items.length) throw new Error('empty');
      shuffle(items);
      practiceTotal = items.length;
      return null;
    });
  }
  var bankId = QS.get('bank');
  meta = idx.filter(function(m){ return m.id === bankId; })[0];
  if (!meta) return Promise.reject(new Error('no bank'));
  return EDU.loadBank(bankId).then(function(data){
    items = data.q.map(function(q){ return { bankId:bankId, bankMeta:meta, q:q }; });
    if (meta.kind === 'mixed'){
      MODE = 'exam';
      return data;
    }
    /* 刷题模式：随机顺序；已经做对的客观题不再出现（错题还会再来） */
    MODE = 'practice';
    var st = EDU.bankState(bankId);
    items = items.filter(function(it){
      var q = it.q;
      if (st.done[q.n] === 'right') return false;              // 做对的客观题不再出现
      if (!(q.opts && q.opts.length) && st.done[q.n]) return false; // 主观题做过就不再出现
      return true;
    });
    shuffle(items);
    practiceTotal = items.length;
    return data;
  });
}

/* ===== 计时 ===== */
function fmt(s){
  var h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return (h ? h + ':' + ('0'+m).slice(-2) : m) + ':' + ('0'+x).slice(-2);
}
function renderTimer(){
  var t = document.getElementById('timer');
  if (MODE === 'exam'){ t.textContent = '⏱ ' + fmt(Math.max(0, remainSec)); t.classList.toggle('warn', remainSec <= 300); }
  else t.textContent = '⏱ ' + fmt(Math.floor((Date.now() - started) / 1000));
}
function startTimer(min){
  if (MODE !== 'exam'){ renderTimer(); timerId = setInterval(renderTimer, 1000); return; }
  if (!remainSec) remainSec = Math.max(60, Math.round(min * 60));
  renderTimer();
  timerId = setInterval(function(){
    remainSec--;
    renderTimer();
    if (remainSec <= 0){ clearInterval(timerId); EDU.toast('时间到，自动交卷'); doSubmit(true); }
    if (!wrongMode && meta && remainSec % 20 === 0) persistDraft();
  }, 1000);
}
function persistDraft(){
  if (submitted || MODE !== 'exam' || !meta) return;
  EDU.saveDraft(meta.id, { answers: answers, texts: texts, cur: cur, remainSec: remainSec, ts: Date.now() });
}
function tryRestore(){
  if (MODE !== 'exam' || wrongMode || !meta) return;
  var st = EDU.P.banks && EDU.P.banks[meta.id] && EDU.P.banks[meta.id].draft;
  if (st && st.answers && Object.keys(st.answers).length){
    if (confirm('发现上次未交卷的作答（' + Object.keys(st.answers).length + ' 题已作答），继续上次吗？\n「取消」将清空草稿重新开始。')){
      answers = st.answers || {};
      texts = st.texts || {};
      if (typeof st.cur === 'number') cur = Math.min(st.cur, items.length - 1);
      if (st.remainSec) remainSec = st.remainSec;
      return;
    }
    EDU.clearDraft(meta.id);
  }
}

/* ===== 进度条 ===== */
function updateProgress(){
  var fill = document.getElementById('pbarFill');
  var txt = document.getElementById('pstatText');
  if (!fill || !txt) return;
  if (MODE === 'exam'){
    var answered = 0;
    items.forEach(function(_, i){ if (answers[i] !== undefined || (texts[i] || '').trim()) answered++; });
    fill.style.width = (items.length ? (answered / items.length * 100) : 0) + '%';
    txt.textContent = '已答 ' + answered + ' / ' + items.length + ' 题';
  } else {
    var pct = practiceTotal ? practiceSolved / practiceTotal * 100 : 0;
    fill.style.width = Math.min(100, pct).toFixed(1) + '%';
    txt.textContent = '已掌握 ' + practiceSolved + ' / ' + practiceTotal + ' 题' +
      (practiceWrong ? ' · 答错 ' + practiceWrong + ' 次' : '');
  }
}

/* ===== 渲染当前题 ===== */
function render(){
  if (!items.length) return showPracticeDone();
  if (cur < 0) cur = 0;
  if (cur >= items.length) cur = items.length - 1;
  var it = items[cur], q = it.q, m = it.bankMeta;
  var kindName = {single:'单选', short:'简答', material:'材料', writing:'写作', design:'教学设计', interview:'问答'}[q.type || m.kind] || '';
  document.getElementById('posTag').textContent = MODE === 'exam'
    ? ('第 ' + (cur + 1) + ' / ' + items.length + ' 题')
    : ('剩余 ' + items.length + ' 题');
  var el = document.createElement('div');
  el.className = 'qcard';
  var html =
    '<div class="qmeta">' +
      '<span class="qno">' + (MODE === 'exam' ? ((cur + 1) + ' / ' + items.length) : ('剩 ' + items.length + ' 题')) + '</span>' +
      (kindName ? '<span class="qtag">' + kindName + (m.kind === 'mixed' && q.score ? ' · ' + q.score + '分' : '') + '</span>' : '') +
      '<span class="qtag">' + m.title + '</span>' +
      '<button class="qstar' + (EDU.isStar(it.bankId, q.n) ? ' on' : '') + '" title="星标">⭐</button>' +
    '</div>';
  if (q.material || (m.kind === 'material' && q.stem && q.stem.length > 80)) html += '<div class="qmaterial"></div>';
  html += '<div class="qstem"></div>';
  if (q.opts && q.opts.length){
    html += '<div class="qopts">' + q.opts.map(function(o){
      return '<button class="opt" data-k="' + o[0] + '"><b>' + o[0] + '</b><span>' + esc(o[1]) + '</span></button>';
    }).join('') + '</div>';
  } else {
    html += '<textarea class="qtext" placeholder="在这里作答（不评分，交卷后对照参考答案自查）"></textarea>';
  }
  html += '<div class="qsol" id="solBox" style="display:none"></div>';
  html += '<div class="exam-nav" id="navBox">' +
    (MODE === 'exam'
      ? '<button class="nav-btn" id="prevBtn">← 上一题</button><button class="nav-btn" id="nextBtn">下一题 →</button>'
      : '<button class="nav-btn primary" id="nextBtn">下一题 →</button>') +
  '</div>';
  el.innerHTML = html;
  var st = document.getElementById('stage');
  st.innerHTML = '';
  st.appendChild(el);

  if (q.material) el.querySelector('.qmaterial').textContent = q.material;
  var stemText = q.stem || '';
  if (q.ask) stemText += '\n\n' + q.ask;
  if (q.task) stemText += '\n\n【任务要求】\n' + q.task;
  el.querySelector('.qstem').textContent = stemText;

  el.querySelector('.qstar').addEventListener('click', function(){
    var on = EDU.toggleStar(it.bankId, q.n);
    this.classList.toggle('on', on);
    EDU.toast(on ? '已收藏 ⭐' : '已取消收藏');
  });

  /* --- 选项 --- */
  var optBtns = el.querySelectorAll('.opt');
  if (q.opts && q.opts.length){
    if (MODE === 'exam'){
      var sel = answers[cur];
      optBtns.forEach(function(b){
        if (b.getAttribute('data-k') === sel) b.classList.add('sel');
        b.addEventListener('click', function(){
          answers[cur] = b.getAttribute('data-k');
          optBtns.forEach(function(x){ x.classList.remove('sel'); });
          b.classList.add('sel');
          persistDraft(); updateProgress();
          setTimeout(function(){ if (cur < items.length - 1) { cur++; render(); } }, 220);
        });
      });
    } else {
      /* 刷题：点一下立刻判对错 */
      if (it._ans){
        optBtns.forEach(function(b){
          var k = b.getAttribute('data-k');
          if (k === q.ans) b.classList.add('right');
          else if (k === it._ans) b.classList.add('wrong');
          b.disabled = true;
        });
        showSol(el, q, it);
      } else {
        optBtns.forEach(function(b){
          b.addEventListener('click', function(){
            if (it._ans) return;
            pickOption(it, q, b.getAttribute('data-k'));
          });
        });
      }
    }
  } else {
    var ta = el.querySelector('.qtext');
    if (MODE === 'exam'){
      ta.value = texts[cur] || '';
      ta.addEventListener('input', function(){ texts[cur] = ta.value; persistDraft(); });
    } else {
      ta.value = it._text || '';
      ta.addEventListener('input', function(){ it._text = ta.value; });
    }
  }

  /* --- 导航 --- */
  var prev = el.querySelector('#prevBtn');
  if (prev) prev.addEventListener('click', function(){ cur--; render(); });
  var next = el.querySelector('#nextBtn');
  if (next) next.addEventListener('click', function(){
    if (MODE === 'exam'){ cur++; render(); return; }
    if (it.q.opts && it.q.opts.length && !it._ans){ EDU.toast('先选一个答案再下一题吧～'); return; }
    advance();
  });

  if (MODE === 'exam') renderSheet();
  updateProgress();
}

/* 刷题：判定 */
function pickOption(it, q, letter){
  it._ans = letter;
  it._right = letter === q.ans;
  if (it._right){
    var skey = it.bankId + ':' + q.n;   // 跨题库重做时题号可能重复，用库+题号做 key
    if (!solvedSet[skey]){ solvedSet[skey] = true; practiceSolved++; }
    EDU.markDone(it.bankId, q.n, 'right');   // 即时落库（后端）
    setTimeout(function(){
      if (items[cur] === it && it._right && !submitted) advance();
    }, 1100);
  } else {
    practiceWrong++;
    EDU.markDone(it.bankId, q.n, 'wrong');   // 做错：后端记次数 + 时间，题目继续循环
  }
  render();
}

function showSol(el, q, it){
  var box = el.querySelector('#solBox');
  if (!box) return;
  box.style.display = '';
  var verdict = it._right
    ? '<span class="verdict ok">答对啦 🎉</span>'
    : '<span class="verdict ng">答错了</span>';
  box.innerHTML = '<div class="st">' + verdict +
    '<span class="verdict ok">正确答案 ' + q.ans + '</span>' +
    (it._right ? '' : '<span class="muted" style="font-weight:700;font-size:12px">已记入错题本，稍后还会再出现</span>') +
  '</div><div class="sctext"></div>';
  box.querySelector('.sctext').textContent = q.sol || '暂无解析。';
}

/* 刷题：下一题（答对移出队列；答错留在队列里，整队重新打乱，保持全随机） */
function advance(){
  if (!items.length) return showPracticeDone();
  var it = items[cur];
  if (it.q.opts && it.q.opts.length){
    if (it._right){
      items.splice(cur, 1);              // 答对 → 本次刷题不再出现
    } else {
      it._ans = null; it._right = false; // 答错 → 留在队列里，等会儿洗牌后再遇到
    }
  } else {
    // 主观题：写过就算做过，不再重复出现
    items.splice(cur, 1);
    if ((it._text || '').trim()) EDU.markDone(it.bankId, it.q.n, 'done');
  }
  if (!items.length) return showPracticeDone();
  shuffle(items);                        // 每答一题都把剩余题重新打乱（全随机，不是简单挪到队尾）
  cur = 0;
  render();
}

function showPracticeDone(){
  submitted = true;
  clearInterval(timerId);
  EDU.saveProgress(true);
  var st = document.getElementById('stage');
  document.getElementById('examTop').style.display = 'none';
  var el = document.createElement('div');
  el.className = 'qcard report';
  var secs = Math.floor((Date.now() - started) / 1000);
  el.innerHTML =
    '<div class="pill mintp" style="margin-bottom:10px">🎉 这一轮刷完啦</div>' +
    '<div class="score" style="font-size:42px">' + practiceSolved + ' / ' + practiceTotal + '</div>' +
    '<div class="sub">本轮掌握题数 · 用时 ' + fmt(secs) + '</div>' +
    '<div class="rrow">' +
      '<div class="rstat"><b style="color:var(--ok)">' + practiceSolved + '</b><span>答对</span></div>' +
      '<div class="rstat"><b style="color:var(--ng)">' + practiceWrong + '</b><span>答错次数</span></div>' +
    '</div>' +
    '<div class="rrow">' +
      '<button class="btn mint" id="againBtn">↻ 再刷一轮</button>' +
      '<button class="btn ghost" id="homeBtn">返回列表</button>' +
    '</div>' +
    '<p class="muted" style="font-size:12.5px;font-weight:700">答对的题已从队列移除，下次不会再出现；答错的题已进入错题本。</p>';
  st.innerHTML = '';
  st.appendChild(el);
  el.querySelector('#againBtn').addEventListener('click', function(){ location.reload(); });
  el.querySelector('#homeBtn').addEventListener('click', function(){ location.href = 'list.html'; });
  document.getElementById('pbarFill').style.width = '100%';
  document.getElementById('pstatText').textContent = '本轮完成 · 用时 ' + fmt(secs);
  window.scrollTo({ top: 0 });
}

/* ===== 答题卡 ===== */
function renderSheet(){
  var g = document.getElementById('ansgrid');
  if (!g) return;
  g.innerHTML = '';
  items.forEach(function(it, i){
    var answered = answers[i] !== undefined || (texts[i] || '').trim();
    var c = document.createElement('button');
    c.className = 'acell' + (answered ? ' done' : '') + (i === cur ? ' cur' : '');
    c.textContent = i + 1;
    c.addEventListener('click', function(){
      cur = i; render();
      document.getElementById('mask').classList.remove('show');
      window.scrollTo({ top: 0 });
    });
    g.appendChild(c);
  });
}

/* ===== 交卷（考试模式） ===== */
function collectSingleStat(){
  var answered = 0, right = 0, wrong = 0, blank = 0, subjDone = 0, subjTotal = 0, score = 0, scoreTotal = 0;
  items.forEach(function(it, i){
    var q = it.q;
    if (q.opts && q.opts.length){
      if (q.score) scoreTotal += q.score;
      if (answers[i] === undefined){ blank++; }
      else {
        answered++;
        if (answers[i] === q.ans){ right++; if (q.score) score += q.score; }
        else wrong++;
      }
    } else {
      subjTotal++;
      if ((texts[i] || '').trim()) subjDone++;
    }
  });
  return { answered:answered, right:right, wrong:wrong, blank:blank, subjDone:subjDone, subjTotal:subjTotal, score:score, scoreTotal:scoreTotal };
}
function doSubmit(auto){
  if (submitted) return;
  var stat = collectSingleStat();
  if (!auto){
    var msg = '确认交卷吗？\n\n单选已答 ' + stat.answered + ' 题，未答 ' + stat.blank + ' 题';
    if (stat.subjTotal) msg += '\n主观题已写 ' + stat.subjDone + '/' + stat.subjTotal + ' 题';
    if (!confirm(msg)) return;
  }
  submitted = true;
  clearInterval(timerId);
  items.forEach(function(it, i){
    var q = it.q;
    if (q.opts && q.opts.length){
      if (answers[i] === undefined) return;
      EDU.markDone(it.bankId, q.n, answers[i] === q.ans ? 'right' : 'wrong', true);
    } else {
      if ((texts[i] || '').trim()) EDU.markDone(it.bankId, q.n, 'done', true);
    }
  });
  EDU.saveProgress(true);   // 批量记完只提交一次
  if (meta && meta.kind === 'mixed'){
    if (!EDU.P.mockHist) EDU.P.mockHist = [];
    EDU.P.mockHist.push({ id: meta.id, score: stat.score, date: new Date().toISOString().slice(0, 10) });
    var mh = EDU.P.mockHist;
    while (mh.length > 60) mh.shift();
    EDU.saveProgress(true);
  }
  if (meta) EDU.clearDraft(meta.id);
  showReport(stat, auto);
}

function showReport(stat, auto){
  var st = document.getElementById('stage');
  document.getElementById('examTop').style.display = 'none';
  var el = document.createElement('div');
  el.className = 'qcard report';
  var singles = items.filter(function(x){ return x.q.opts && x.q.opts.length; }).length;
  var isMock = meta && meta.kind === 'mixed';
  var scoreLine = '';
  if (isMock && stat.scoreTotal){
    scoreLine = '<div class="score">' + stat.score + '</div><div class="sub">预估得分 / ' + stat.scoreTotal + ' 分（主观题按参考要点自查给分）</div>';
  } else if (singles){
    scoreLine = '<div class="score">' + stat.right + ' / ' + singles + '</div><div class="sub">单选答对题数</div>';
  } else {
    scoreLine = '<div class="score">' + stat.subjDone + ' / ' + stat.subjTotal + '</div><div class="sub">已作答主观题</div>';
  }
  var extra = '';
  if (stat.subjTotal) extra += '<div class="rstat"><b>' + stat.subjDone + '/' + stat.subjTotal + '</b><span>主观题已写</span></div>';
  var wrongIds = [];
  items.forEach(function(it, i){
    if (it.q.opts && it.q.opts.length && answers[i] !== undefined && answers[i] !== it.q.ans) wrongIds.push(i);
  });
  el.innerHTML =
    '<div class="pill sun" style="margin-bottom:8px">' + (auto ? '⏰ 时间到自动交卷' : '✅ 交卷成功') + '</div>' +
    scoreLine +
    '<div class="rrow">' +
      '<div class="rstat"><b>' + stat.answered + '</b><span>已答单选</span></div>' +
      '<div class="rstat"><b style="color:var(--ok)">' + stat.right + '</b><span>答对</span></div>' +
      '<div class="rstat"><b style="color:var(--ng)">' + stat.wrong + '</b><span>答错</span></div>' +
      '<div class="rstat"><b>' + stat.blank + '</b><span>未答</span></div>' +
      extra +
    '</div>' +
    '<div class="rrow">' +
      '<button class="btn ghost" id="againBtn">↻ 再来一次</button>' +
      '<button class="btn" id="homeBtn">返回列表</button>' +
    '</div>' +
    '<hr style="border:none;border-top:1px dashed var(--line);margin:18px 0">' +
    '<p style="font-weight:800;margin-bottom:4px">📖 逐题对答案</p>' +
    '<p class="muted" style="font-size:12.5px;font-weight:700">标绿的是正确答案；主观题对照参考要点自查，只有交卷后才显示答案。</p>';
  st.innerHTML = '';
  st.appendChild(el);
  el.querySelector('#againBtn').addEventListener('click', function(){ location.reload(); });
  el.querySelector('#homeBtn').addEventListener('click', function(){ location.href = 'list.html'; });

  var isExam = meta && meta.kind === 'mixed';
  var reviewList = [];
  items.forEach(function(it, i){
    var answered = answers[i] !== undefined || (texts[i] || '').trim();
    if (isExam || answered) reviewList.push(i);
  });
  if (!reviewList.length) reviewList = items.map(function(_, i){ return i; }).slice(0, 1);
  reviewList.forEach(function(i){ st.appendChild(reviewCard(items[i], i)); });
  if (reviewList.length < items.length){
    var note = document.createElement('p');
    note.className = 'muted';
    note.style.cssText = 'font-size:12px;font-weight:700;text-align:center;margin-top:12px';
    note.textContent = '（只展示你做过的 ' + reviewList.length + ' 题解析）';
    st.appendChild(note);
  }
  window.scrollTo({ top: 0 });
}

function reviewCard(it, i){
  var q = it.q, m = it.bankMeta;
  var myAns = answers[i];
  var myTxt = texts[i] || '';
  var el = document.createElement('div');
  el.className = 'qcard';
  el.style.marginTop = '16px';
  var kindName = {single:'单选', short:'简答', material:'材料', writing:'写作', design:'教学设计', interview:'问答'}[q.type || m.kind] || '';
  var html = '<div class="qmeta"><span class="qno">第 ' + (i+1) + ' 题</span>' +
    (kindName ? '<span class="qtag">' + kindName + '</span>' : '') +
    '<button class="qstar' + (EDU.isStar(it.bankId, q.n) ? ' on' : '') + '">⭐</button></div>';
  if (q.material) html += '<div class="qmaterial"></div>';
  html += '<div class="qstem"></div>';
  if (q.opts && q.opts.length){
    html += '<div class="qopts">' + q.opts.map(function(o){
      var cls = '';
      if (o[0] === q.ans) cls = ' right';
      else if (o[0] === myAns) cls = ' wrong';
      return '<div class="opt' + cls + '"><b>' + o[0] + '</b><span>' + esc(o[1]) + '</span></div>';
    }).join('') + '</div>';
    if (myAns === undefined) html += '<p class="muted" style="font-size:12.5px;font-weight:700;margin-top:8px">此题未作答</p>';
  } else {
    if (myTxt) html += '<div class="qmaterial" style="border-style:solid"><b>我的作答</b>\n' + esc(myTxt) + '</div>';
    else html += '<p class="muted" style="font-size:12.5px;font-weight:700;margin-top:8px">此题未作答</p>';
  }
  if (q.opts && q.opts.length){
    html += '<div class="qsol"><div class="st"><span class="verdict ' + (myAns === q.ans ? 'ok">答对' : 'ng">答错') + '</span>' +
      '<span class="verdict ok">正确答案 ' + q.ans + '</span></div>' +
      (q.sol ? '<div></div>' : '') + '</div>';
  } else {
    html += '<div class="qsol"><div class="st">📋 参考答案' + (m.kind === 'mixed' && q.score ? '（' + q.score + ' 分）' : '') + '</div><div></div></div>';
  }
  if (q.tip) html += '<div class="qsol" style="background:rgba(155,93,229,.08);border-color:rgba(155,93,229,.3)"><div class="st">' +
    (q.opts && q.opts.length ? '' : (m.kind === 'interview' ? '💡 答题思路' : '💡 要点提示')) + '</div><div></div></div>';
  el.innerHTML = html;
  if (q.material) el.querySelector('.qmaterial').textContent = q.material;
  var stemText = q.stem || '';
  if (q.ask) stemText += '\n\n' + q.ask;
  if (q.task) stemText += '\n\n【任务要求】\n' + q.task;
  el.querySelector('.qstem').textContent = stemText;
  var solDivs = el.querySelectorAll('.qsol > div:last-child');
  if (solDivs.length){
    if (q.opts && q.opts.length){
      if (q.sol) solDivs[0].textContent = q.sol;
    } else {
      solDivs[0].textContent = q.sol || '本题无参考答案，可对照讲义自查。';
    }
    if (q.tip) solDivs[solDivs.length - 1].textContent = q.tip;
  }
  el.querySelector('.qstar').addEventListener('click', function(){
    var on = EDU.toggleStar(it.bankId, q.n);
    this.classList.toggle('on', on);
    EDU.toast(on ? '已收藏 ⭐' : '已取消收藏');
  });
  return el;
}

/* ===== 交互 ===== */
document.getElementById('submitBtn').addEventListener('click', function(){
  if (MODE === 'exam') doSubmit(false);
  else {
    if (!confirm('确定交卷吗？\n\n交卷后会显示本轮刷题结果。')) return;
    EDU.saveProgress(true);
    showPracticeDone();
  }
});
document.getElementById('sheetBtn').addEventListener('click', function(){
  renderSheet();
  document.getElementById('mask').classList.add('show');
});
document.getElementById('sheetClose').addEventListener('click', function(){
  document.getElementById('mask').classList.remove('show');
});
document.getElementById('mask').addEventListener('click', function(e){
  if (e.target === this) this.classList.remove('show');
});
/* 没有返回键：交卷前离开只保存草稿（考试）/进度（刷题） */
window.addEventListener('beforeunload', function(e){
  if (submitted) return;
  if (MODE === 'exam'){ persistDraft(); var s = collectSingleStat(); if (s.answered + s.subjDone > 0){ e.preventDefault(); e.returnValue = ''; } }
  else EDU.saveProgress(true);
});

/* 键盘：1-4 / A-D 选择，←→ 翻题，S 星标 */
document.addEventListener('keydown', function(e){
  if (submitted || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
  var it = items[cur];
  if (!it) return;
  if (e.key === 'ArrowLeft' && MODE === 'exam'){ cur--; render(); return; }
  if (e.key === 'ArrowRight'){
    if (MODE === 'exam'){ cur++; render(); return; }
    var itq = items[cur];
    if (itq && itq.q.opts && itq.q.opts.length && !itq._ans){ EDU.toast('先选一个答案再下一题吧～'); return; }
    advance(); return;
  }
  if (e.key.toUpperCase() === 'S'){ EDU.toggleStar(it.bankId, it.q.n); render(); return; }
  if (it.q.opts && it.q.opts.length){
    var order = ['A','B','C','D'];
    var k = e.key.toUpperCase();
    var letter = order.indexOf(k) >= 0 ? k : (parseInt(e.key, 10) >= 1 && parseInt(e.key, 10) <= 4 ? order[parseInt(e.key, 10) - 1] : null);
    if (!letter) return;
    var btn = document.querySelector('.opt[data-k="' + letter + '"]');
    if (btn) btn.click();
  }
});

/* ===== 启动 ===== */
EDU.loadProgress().then(function(synced){
  if (!synced) EDU.toast('未登录主站账号，进度不会保存', 3200);
  assemble().then(function(){
    if (MODE === 'exam'){
      tryRestore();
      startTimer(meta.suggestMin);
    } else {
      startTimer();
      document.getElementById('sheetBtn').style.display = 'none';
      if (!items.length){
        document.getElementById('stage').innerHTML =
          '<div class="qcard report"><div class="pill mintp" style="margin-bottom:10px">✅ 这个题库已经全部答对</div>' +
          '<p class="sub" style="margin-top:8px">没有需要再刷的题了，换个题库练练吧。</p>' +
          '<p style="margin-top:16px"><a class="btn ghost" href="list.html" style="text-decoration:none;display:inline-block">返回列表</a></p></div>';
        document.getElementById('examTop').style.display = 'none';
        return;
      }
    }
    render();
    updateProgress();
  }).catch(function(e){
    document.getElementById('stage').innerHTML =
      '<div class="qcard"><p style="font-weight:800">题库加载失败</p>' +
      '<p class="muted" style="font-weight:600;font-size:13px;margin-top:6px">' + (e.message === 'empty' ? '错题本是空的，先去刷题/考试攒错题吧。' : '请返回列表重新进入。') + '</p>' +
      '<p style="margin-top:14px"><a class="btn ghost" href="list.html" style="text-decoration:none;display:inline-block">返回列表</a></p></div>';
    document.getElementById('examTop').style.display = 'none';
  });
});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
