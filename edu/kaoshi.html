<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>考试 · 教资刷题</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/edu.css">
</head>
<body>
<div class="blob blob-a"></div><div class="blob blob-b"></div>

<header class="topbar">
  <a class="back" href="index.html" title="返回模块首页" aria-label="返回模块首页"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px"><path d="M19 12H5" stroke="var(--ink)"/><path d="M11 18l-6-6 6-6" stroke="var(--ink)"/></svg></a>
  <div class="tb-title">
    <span class="em">🏆</span>
    <div><h1>考试</h1><small>整卷模考 · 120 分钟 · 交卷才出分</small></div>
  </div>
  <button class="theme-btn" title="切换深浅色">🌙</button>
</header>

<div class="wrap narrow" id="main"></div>

<div class="toast"></div>
<div class="syncbar"></div>

<script src="js/common.js"></script>
<script src="data/index.js"></script>
<script>
EDU.initTheme();
var idx = window.EDU_INDEX || [];

/* ===== 整卷模考清单：后期加卷子直接往这个数组加一行 ===== */
var EXAMS = [
  { id:'mock-18-01-综合素质模拟卷A-含答案解析', name:'综合素质 · 模拟卷 A', total:150, min:120 },
  { id:'mock-19-02-综合素质模拟卷B-含答案解析', name:'综合素质 · 模拟卷 B', total:150, min:120 },
  { id:'mock-20-03-教育教学模拟卷A-含答案解析', name:'教育教学 · 模拟卷 A', total:150, min:120 },
  { id:'mock-21-04-教育教学模拟卷B-含答案解析', name:'教育教学 · 模拟卷 B', total:150, min:120 },
];
// 自动补充：index 里还有 mock 库但上面没列的，自动挂进来（防止手滑漏加）
idx.forEach(function(m){
  if (m.sub === 'mock' && !EXAMS.some(function(e){ return e.id === m.id; })){
    EXAMS.push({ id:m.id, name:m.title.replace('含答案解析','').replace(/-$/,''), total:150, min:120 });
  }
});

function bestScore(id){
  var h = (EDU.P.mockHist || []).filter(function(x){ return x.id === id && x.score != null; });
  if (!h.length) return null;
  return h.reduce(function(a, b){ return (b.score > a.score) ? b : a; });
}
function renderExams(){
  var box = document.getElementById('main');
  box.innerHTML = '';
  EXAMS.forEach(function(e){
    var done = (EDU.P.mockHist || []).filter(function(x){ return x.id === e.id; }).length;
    var best = bestScore(e.id);
    var item = document.createElement('div');
    item.className = 'bank-item';
    item.innerHTML =
      '<span class="be" style="background:linear-gradient(135deg,rgba(255,217,61,.25),rgba(255,159,107,.25))">🏆</span>' +
      '<div class="bi"><div class="bt">' + e.name + '</div>' +
      '<div class="bd">' + e.total + ' 分 · ' + e.min + ' 分钟' +
        (done ? ' · 已考 ' + done + ' 次' : '') +
        (best ? ' · 最高 ' + best.score + ' 分' : '') + '</div></div>' +
      '<span class="bgo">' + (done ? '再考' : '开考') + '</span>';
    item.addEventListener('click', function(){
      location.href = 'quiz.html?bank=' + encodeURIComponent(e.id);
    });
    box.appendChild(item);
  });
}

EDU.loadProgress().then(renderExams);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
</body>
</html>
